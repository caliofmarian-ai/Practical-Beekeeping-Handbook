<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 49.1 — One-Way Honey-Room Workflow</title><desc id="desc">One-way honey-room workflow with field-exposed receiving separated from increasingly protected product handling.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 49.1 — One-Way Honey-Room Workflow</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Move product from field-exposed receiving toward protected bulk storage while preventing dirty equipment, waste</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">and foot traffic from crossing exposed honey unnecessarily.</text>
<rect x="65" y="175" width="285" height="235" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="83" y="208" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">1. Receiving / field-exposed zone</text><text x="83" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Supers enter here; remove</text><text x="83" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">obvious dirt/pests before</text><text x="83" y="277" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">clean processing.</text><line x1="350" y1="293" x2="385" y2="293" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="390" y="175" width="285" height="235" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="408" y="208" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">2. Frame inspection</text><text x="408" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Reject or segregate unsuitable</text><text x="408" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">comb before uncapping.</text><line x1="675" y1="293" x2="710" y2="293" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="715" y="175" width="285" height="235" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="733" y="208" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">3. Uncapping</text><text x="733" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Food-contact tools and</text><text x="733" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">surfaces kept clean and dry.</text><line x1="1000" y1="293" x2="1035" y2="293" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="1040" y="175" width="285" height="235" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="1058" y="208" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">4. Extraction</text><text x="1058" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Guarded equipment; control</text><text x="1058" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">splashes and foreign material.</text><rect x="65" y="490" width="285" height="235" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="83" y="523" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">5. Coarse straining</text><text x="83" y="552" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Remove wax/debris without</text><text x="83" y="572" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">unnecessary alteration.</text><line x1="350" y1="608" x2="385" y2="608" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="390" y="490" width="285" height="235" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="408" y="523" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">6. Settling</text><text x="408" y="552" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Covered tank allows foam/fine</text><text x="408" y="572" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">wax to rise and denser</text><text x="408" y="592" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">material to settle.</text><line x1="675" y1="608" x2="710" y2="608" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="715" y="490" width="285" height="235" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="733" y="523" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">7. Protected bulk storage</text><text x="733" y="552" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Closed identified vessel with</text><text x="733" y="572" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">traceability preserved.</text><line x1="80" y1="755" x2="1320" y2="755" stroke="#C62828" stroke-width="3" stroke-dasharray="12 8"/><text x="700" y="785" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#C62828" text-anchor="middle">WASTE / FIELD-DIRTY FLOW KEPT SEPARATE FROM EXPOSED PRODUCT</text><line x1="220" y1="820" x2="1180" y2="820" stroke="#2E7D32" stroke-width="3" marker-end="url(#ag)"/><text x="700" y="855" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2E7D32" text-anchor="middle">personnel / product movement progresses toward cleaner protected handling</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Room design must fit the operation and local food-hygiene requirements; the principle is controlled flow and cleanable, dry food-contact</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">handling.</text>
</svg>