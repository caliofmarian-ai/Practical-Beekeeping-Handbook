<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 52.3 — Colony Preparation Timeline</title><desc id="desc">Pre-flow comb-honey preparation from queen performance through super placement.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 52.3 — Colony Preparation Timeline</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Comb honey is won or lost before the crop: population preparation, health control and swarm management must</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">precede the main nectar flow.</text>
<line x1="110" y1="520" x2="1290" y2="520" stroke="#1565C0" stroke-width="5" marker-end="url(#ab)"/><circle cx="110" cy="520" r="14" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/><line x1="110" y1="500" x2="110" y2="350" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/><rect x="55" y="180" width="190" height="155" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="73" y="213" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">1. Queen performance</text><text x="73" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Resolve queen problems</text><text x="73" y="262" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">before crop</text><text x="73" y="282" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">preparation.</text><circle cx="346" cy="520" r="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><line x1="346" y1="540" x2="346" y2="590" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/><rect x="251" y="590" width="190" height="155" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="269" y="623" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">2. Brood build-up</text><text x="269" y="652" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Build the worker</text><text x="269" y="672" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">population before the</text><text x="269" y="692" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">expected flow.</text><circle cx="582" cy="520" r="14" fill="#FFEBEE" stroke="#C62828" stroke-width="3"/><line x1="582" y1="500" x2="582" y2="350" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/><rect x="487" y="180" width="190" height="155" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="505" y="213" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">3. Varroa / health control</text><text x="505" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Monitor and control</text><text x="505" y="262" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">damaging pressure</text><text x="505" y="282" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">before saleable supers</text><text x="505" y="302" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">are exposed.</text><circle cx="818" cy="520" r="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><line x1="818" y1="540" x2="818" y2="590" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/><rect x="723" y="590" width="190" height="155" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="741" y="623" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">4. Swarm preparation</text><text x="741" y="652" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Create usable space and</text><text x="741" y="672" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">manage swarm risk</text><text x="741" y="692" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">before commitment</text><text x="741" y="712" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">advances.</text><circle cx="1054" cy="520" r="14" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><line x1="1054" y1="500" x2="1054" y2="350" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/><rect x="959" y="180" width="190" height="155" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="977" y="213" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">5. Flow onset</text><text x="977" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Confirm nectar intake</text><text x="977" y="262" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">is accelerating and</text><text x="977" y="282" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">local bloom evidence</text><text x="977" y="302" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">supports the crop.</text><circle cx="1290" cy="520" r="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><line x1="1290" y1="540" x2="1290" y2="590" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/><rect x="1160" y="590" width="190" height="155" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="1178" y="623" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2E7D32" text-anchor="start"><tspan x="1178" dy="0">6. Comb-honey super</tspan><tspan x="1178" dy="16.8">placement</tspan></text><text x="1178" y="652" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Add fresh broodless</text><text x="1178" y="672" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#1F2933" text-anchor="start">comb/sections when the</text><text x="1178" y="692" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">colony can draw and</text><text x="1178" y="712" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">fill them rapidly.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Use local phenology rather than a fixed month. Treatment/harvest restrictions must be resolved before comb intended for sale is exposed.</text>
</svg>