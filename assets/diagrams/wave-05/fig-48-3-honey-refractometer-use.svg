<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 48.3 — Honey Refractometer Use</title><desc id="desc">Six-step refractometer workflow from instrument check to cleaning.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 48.3 — Honey Refractometer Use</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">A refractometer estimates moisture from refractive properties; correct sampling and instrument control matter as</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">much as the displayed number.</text>
<rect x="70" y="170" width="390" height="270" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">1. Calibration / check</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Verify the instrument using its</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">validated procedure and reference</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">material.</text><rect x="205" y="320" width="120" height="65" rx="7" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/><text x="265" y="360" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#6A1B9A" text-anchor="middle">CHECK</text><rect x="500" y="170" width="390" height="270" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">2. Clean + dry prism</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Water left on the prism can bias the</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">result.</text><rect x="630" y="315" width="130" height="80" rx="8" fill="#FFFFFF" stroke="#37474F" stroke-width="3"/><path d="M 695 335.5 Q 680.7 355 695 373.2 Q 709.3 355 695 335.5 Z" fill="#64B5F6" stroke="#8D6E63" stroke-width="1.5"/><rect x="930" y="170" width="390" height="270" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="948" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">3. Representative sample</text><text x="948" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use a sample that represents the frame</text><text x="948" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">or lot being judged.</text><rect x="1075" y="315" width="100" height="110" rx="14" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.5"/><rect x="1083" y="299" width="84" height="20" rx="3" fill="#B0BEC5" stroke="#37474F" stroke-width="2"/><rect x="1089" y="367" width="72" height="42" rx="4" fill="#FFFFFF" stroke="#757575" stroke-width="1.2"/><text x="1125" y="393" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#8D6E63" text-anchor="middle">SAMPLE</text><rect x="70" y="500" width="390" height="270" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">4. Equilibrate + read</text><text x="88" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Allow the instrument/sample to reach the</text><text x="88" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">conditions required by the method.</text><rect x="200" y="645" width="130" height="82" rx="8" fill="#F5F5F5" stroke="#37474F" stroke-width="3"/><rect x="220" y="660" width="90" height="28" rx="4" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/><text x="265" y="681" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1565C0" text-anchor="middle">READ</text><rect x="500" y="500" width="390" height="270" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="518" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">5. Record result</text><text x="518" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Record lot/sample identity, instrument</text><text x="518" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and result.</text><rect x="635" y="642" width="120" height="105" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/><line x1="650" y1="675" x2="740" y2="675" stroke="#1565C0" stroke-width="1.5"/><line x1="650" y1="702" x2="730" y2="702" stroke="#1565C0" stroke-width="1.5"/><rect x="930" y="500" width="390" height="270" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="948" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">6. Clean between samples</text><text x="948" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Prevent carry-over and protect the</text><text x="948" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">optical surface.</text><rect x="1060" y="645" width="130" height="80" rx="8" fill="#FFFFFF" stroke="#37474F" stroke-width="3"/><path d="M 1125 665.5 Q 1110.7 685 1125 703.2 Q 1139.3 685 1125 665.5 Z" fill="#1565C0" stroke="#8D6E63" stroke-width="1.5"/><rect x="475" y="820" width="450" height="70" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="493" y="853" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Optical or digital</text><text x="493" y="882" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Follow the validated instructions for the instrument</text><text x="493" y="902" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">in use; ATC does not remove all method limitations.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Do not treat one drop or one unverified instrument reading as proof that an entire lot meets a legal or commercial specification.</text>
</svg>