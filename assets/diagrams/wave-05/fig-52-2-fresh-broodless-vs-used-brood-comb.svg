<title id="title">Figure 52.2 — Fresh Broodless Comb Versus Used Brood Comb</title><desc id="desc">Cell cutaways comparing fresh broodless wax with brood-used comb containing cocoon layers.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 52.2 — Fresh Broodless Comb Versus Used Brood Comb</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Brood history changes comb even after brood has emerged. Comb honey intended for sale should be produced in</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">fresh broodless comb appropriate to the market's rules.</text>
<rect x="70" y="170" width="600" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Fresh broodless comb</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">New tender wax with clean cell walls and no brood cocoon</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">history; appropriate starting material for saleable</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">comb-honey production.</text><rect x="150" y="430" width="440" height="250" rx="8" fill="url(#hex)" stroke="#D4A017" stroke-width="3"/><circle cx="200" cy="480" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="200" cy="540" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="200" cy="600" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="258" cy="480" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="258" cy="540" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="258" cy="600" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="316" cy="480" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="316" cy="540" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="316" cy="600" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="374" cy="480" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="374" cy="540" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="374" cy="600" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="432" cy="480" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="432" cy="540" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="432" cy="600" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="490" cy="480" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="490" cy="540" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="490" cy="600" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="548" cy="480" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="548" cy="540" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="548" cy="600" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><rect x="730" y="170" width="600" height="610" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="748" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Used brood comb</text><text x="748" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Brood use leaves cocoon layers and accumulated cell-wall</text><text x="748" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">material after adults emerge. It is structurally and</text><text x="748" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">compositionally different from fresh comb.</text><rect x="810" y="430" width="440" height="250" rx="8" fill="#D7B58A" stroke="#8D6E63" stroke-width="3"/><circle cx="860" cy="480" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="860" cy="480" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="860" cy="540" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="860" cy="540" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="860" cy="600" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="860" cy="600" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="918" cy="480" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="918" cy="480" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="918" cy="540" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="918" cy="540" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="918" cy="600" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="918" cy="600" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="976" cy="480" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="976" cy="480" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="976" cy="540" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="976" cy="540" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="976" cy="600" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="976" cy="600" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="1034" cy="480" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="1034" cy="480" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="1034" cy="540" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="1034" cy="540" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="1034" cy="600" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="1034" cy="600" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="1092" cy="480" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="1092" cy="480" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="1092" cy="540" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="1092" cy="540" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="1092" cy="600" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="1092" cy="600" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="1150" cy="480" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="1150" cy="480" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="1150" cy="540" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="1150" cy="540" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="1150" cy="600" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="1150" cy="600" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="1208" cy="480" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="1208" cy="480" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="1208" cy="540" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="1208" cy="540" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><circle cx="1208" cy="600" r="21" fill="#B78657" stroke="#8D6E63" stroke-width="2"/><circle cx="1208" cy="600" r="12" fill="#E4C49F" stroke="#A66F43" stroke-width="1.5"/><text x="370" y="730" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2E7D32" text-anchor="middle">fresh wax</text><text x="1030" y="730" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#EF6C00" text-anchor="middle">cocoon-lined brood history</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">This comparison explains product suitability; it does not imply that every dark brood comb is acutely contaminated or unsafe for all hive uses.</text>
</svg>