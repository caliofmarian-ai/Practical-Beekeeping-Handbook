<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 50.2 — Settling Tank Separation</title><desc id="desc">Covered settling-tank cutaway showing floating material, clear honey and denser sediment.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 50.2 — Settling Tank Separation</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Settling separates materials by buoyancy/density without making every particle disappear. Sampling and outlet</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">height should not preferentially collect a separated layer unintentionally.</text>
<rect x="300" y="170" width="800" height="650" rx="22" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="4"/><rect x="350" y="145" width="700" height="35" rx="5" fill="#B0BEC5" stroke="#37474F" stroke-width="3"/><rect x="350" y="310" width="700" height="420" rx="8" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2"/><rect x="350" y="280" width="700" height="45" rx="5" fill="#F3E0B7" stroke="#8D6E63" stroke-width="1.5"/><text x="700" y="308" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#8D6E63" text-anchor="middle">floating foam + fine wax</text><text x="700" y="520" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#D4A017" text-anchor="middle">clear honey zone</text><rect x="350" y="700" width="700" height="30" rx="4" fill="#F5F5F5" stroke="#757575" stroke-width="1.5"/><text x="700" y="722" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#757575" text-anchor="middle">denser sediment / settled particles</text><circle cx="1035" cy="480" r="12" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/><line x1="1047" y1="480" x2="1190" y2="480" stroke="#6A1B9A" stroke-width="2" marker-end="url(#ab)"/><text x="1205" y="485" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#6A1B9A" text-anchor="start">sample point</text><rect x="650" y="730" width="100" height="35" rx="4" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2"/><line x1="750" y1="748" x2="1185" y2="748" stroke="#8D6E63" stroke-width="3" marker-end="url(#ab)"/><text x="1200" y="754" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#8D6E63" text-anchor="start">outlet above settled layer</text><rect x="70" y="300" width="190" height="230" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="88" y="333" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Covered vessel</text><text x="88" y="362" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Protect from dust,</text><text x="88" y="382" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">insects, odours and</text><text x="88" y="402" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">moisture while</text><text x="88" y="422" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">allowing controlled</text><text x="88" y="442" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">settling.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Settling time depends on viscosity, temperature, particle size and tank geometry. Do not add unnecessary heat solely to force a fixed schedule.</text>
</svg>