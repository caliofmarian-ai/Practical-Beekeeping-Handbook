<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-master-family="HONEY_QUALITY_FAMILY" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 48.1 — Harvest Readiness Decision Flow</title><desc id="desc">Harvest readiness workflow integrating maturity, moisture, treatment status, brood, stores and logistics.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 48.1 — Harvest Readiness Decision Flow</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Harvest readiness is a multi-factor decision. A capped appearance alone does not quantify moisture or establish</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">legal/quality compliance.</text>
<rect x="215" y="160" width="970" height="82" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="233" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">1. Crop maturity</text><text x="233" y="222" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use capping and colony context as evidence, not as the only test.</text><line x1="700" y1="242" x2="700" y2="263" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="215" y="266" width="970" height="82" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="233" y="299" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">2. Representative moisture</text><text x="233" y="328" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Measure a representative sample when moisture matters.</text><line x1="700" y1="348" x2="700" y2="369" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="215" y="372" width="970" height="82" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="233" y="405" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">3. Treatment / residue status</text><text x="233" y="434" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Check product labels, withdrawal/harvest restrictions and records.</text><line x1="700" y1="454" x2="700" y2="475" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="215" y="478" width="970" height="82" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="233" y="511" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">4. Brood check</text><text x="233" y="540" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Exclude brood comb from the ordinary food-honey harvest stream.</text><line x1="700" y1="560" x2="700" y2="581" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="215" y="584" width="970" height="82" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="233" y="617" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">5. Colony-store check</text><text x="233" y="646" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Leave the colony with suitable reserves for its context.</text><line x1="700" y1="666" x2="700" y2="687" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="215" y="690" width="970" height="82" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="233" y="723" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">6. Weather + logistics</text><text x="233" y="752" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Protect product from rain, smoke, dust, fuel, pests and robbing.</text><line x1="700" y1="772" x2="700" y2="793" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="215" y="796" width="970" height="82" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="233" y="829" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">7. Harvest, delay or segregate</text><text x="233" y="858" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Only proceed with product that meets the applicable specification.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Legal composition limits and treatment restrictions differ by jurisdiction and product. Use current competent-authority and label requirements.</text>
</svg>