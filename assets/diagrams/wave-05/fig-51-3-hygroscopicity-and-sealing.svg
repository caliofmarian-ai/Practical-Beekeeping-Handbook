<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 51.3 — Hygroscopicity and Sealing</title><desc id="desc">Open versus sealed honey container under humid-air exposure.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 51.3 — Hygroscopicity and Sealing</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Honey exchanges water with surrounding air. Good sealing limits moisture exchange and helps preserve the</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">intended product specification.</text>
<rect x="70" y="170" width="590" height="610" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Open container in humid air</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Exposed honey can exchange water with surrounding air.</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Under humid conditions, surface moisture can increase and</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">create a less stable product zone.</text><rect x="275" y="430" width="170" height="210" rx="14" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.5"/><rect x="283" y="414" width="154" height="20" rx="3" fill="#B0BEC5" stroke="#37474F" stroke-width="2"/><rect x="289" y="482" width="142" height="42" rx="4" fill="#FFFFFF" stroke="#757575" stroke-width="1.2"/><text x="360" y="508" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#8D6E63" text-anchor="middle">OPEN</text><line x1="250" y1="350" x2="310" y2="420" stroke="#64B5F6" stroke-width="3" marker-end="url(#ab)"/><line x1="470" y1="350" x2="410" y2="420" stroke="#64B5F6" stroke-width="3" marker-end="url(#ab)"/><path d="M 360 336 Q 342.4 360 360 382.4 Q 377.6 360 360 336 Z" fill="#64B5F6" stroke="#8D6E63" stroke-width="1.5"/><rect x="740" y="170" width="590" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="758" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Sound sealed container</text><text x="758" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">A clean, compatible closure reduces moisture exchange,</text><text x="758" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">protects from odours/pests and preserves the defined</text><text x="758" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">storage environment.</text><rect x="950" y="430" width="170" height="210" rx="14" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.5"/><rect x="958" y="414" width="154" height="20" rx="3" fill="#B0BEC5" stroke="#37474F" stroke-width="2"/><rect x="964" y="482" width="142" height="42" rx="4" fill="#FFFFFF" stroke="#757575" stroke-width="1.2"/><text x="1035" y="508" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#8D6E63" text-anchor="middle">SEALED</text><path d="M 1142.4 480 L 1156 494.4 L 1182.4 464" fill="none" stroke="#2E7D32" stroke-width="5"/><line x1="850" y1="350" x2="930" y2="410" stroke="#64B5F6" stroke-width="3" stroke-dasharray="8 6"/><line x1="906.9" y1="381.9" x2="923.1" y2="398.1" stroke="#C62828" stroke-width="5"/><line x1="923.1" y1="381.9" x2="906.9" y2="398.1" stroke="#C62828" stroke-width="5"/><rect x="465" y="810" width="470" height="72" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="483" y="843" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Hygroscopic ≠ always absorbing</text><text x="483" y="872" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Honey can gain or lose water depending on surrounding</text><text x="483" y="892" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">humidity and product conditions.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Packaging must be food-suitable and compatible with the intended storage period. Condensation, damaged closures and repeated opening can change</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">exposure.</text>
</svg>