<title id="title">Figure 49.4 — Tangential Versus Radial Extraction</title><desc id="desc">Top-view comparison of tangential and radial honey extractors.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 49.4 — Tangential Versus Radial Extraction</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Extractor geometry changes frame orientation and how honey leaves comb. Both systems require balanced loads and</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">speed appropriate to comb strength.</text>
<rect x="70" y="165" width="600" height="610" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Tangential</text><text x="88" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Frames sit with broad comb faces roughly toward the</text><text x="88" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">extractor wall. One side is commonly extracted, then</text><text x="88" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">frames turn or a reversible basket changes orientation.</text><circle cx="370" cy="520" r="190" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="5"/><circle cx="370" cy="520" r="45" fill="#F5F5F5" stroke="#37474F" stroke-width="3"/><line x1="440" y1="520" x2="530" y2="520" stroke="#8D6E63" stroke-width="8"/><line x1="530" y1="520" x2="530" y2="545" stroke="#D4A017" stroke-width="4" marker-end="url(#ab)"/><line x1="405" y1="580.6217782649107" x2="450" y2="658.5640646055101" stroke="#8D6E63" stroke-width="8"/><line x1="450" y1="658.5640646055101" x2="428.34936490538905" y2="671.0640646055101" stroke="#D4A017" stroke-width="4" marker-end="url(#ab)"/><line x1="335" y1="580.6217782649107" x2="290" y2="658.5640646055102" stroke="#8D6E63" stroke-width="8"/><line x1="290" y1="658.5640646055102" x2="268.34936490538905" y2="646.0640646055102" stroke="#D4A017" stroke-width="4" marker-end="url(#ab)"/><line x1="300" y1="520" x2="210" y2="520" stroke="#8D6E63" stroke-width="8"/><line x1="210" y1="520" x2="210" y2="495" stroke="#D4A017" stroke-width="4" marker-end="url(#ab)"/><line x1="335" y1="459.3782217350893" x2="289.99999999999994" y2="381.4359353944899" stroke="#8D6E63" stroke-width="8"/><line x1="289.99999999999994" y1="381.4359353944899" x2="311.6506350946109" y2="368.9359353944899" stroke="#D4A017" stroke-width="4" marker-end="url(#ab)"/><line x1="405" y1="459.3782217350893" x2="450" y2="381.43593539448983" stroke="#8D6E63" stroke-width="8"/><line x1="450" y1="381.43593539448983" x2="471.65063509461095" y2="393.93593539448983" stroke="#D4A017" stroke-width="4" marker-end="url(#ab)"/><rect x="730" y="165" width="600" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="748" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Radial</text><text x="748" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Frames are arranged like spokes. Cell orientation and</text><text x="748" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">centrifugal force allow honey to leave both sides during</text><text x="748" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">spinning in suitable comb.</text><circle cx="1030" cy="520" r="190" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="5"/><circle cx="1030" cy="520" r="45" fill="#F5F5F5" stroke="#37474F" stroke-width="3"/><line x1="1085" y1="520" x2="1195" y2="520" stroke="#8D6E63" stroke-width="7"/><line x1="1195" y1="520" x2="1215" y2="520" stroke="#D4A017" stroke-width="3" marker-end="url(#ab)"/><line x1="1074.495934690622" y1="552.3281888760861" x2="1163.4878040718663" y2="616.9845666282581" stroke="#8D6E63" stroke-width="7"/><line x1="1163.4878040718663" y1="616.9845666282581" x2="1179.6681439593654" y2="628.7402716741076" stroke="#D4A017" stroke-width="3" marker-end="url(#ab)"/><line x1="1046.995934690622" y1="572.3081083962335" x2="1080.9878040718663" y2="676.9243251887003" stroke="#8D6E63" stroke-width="7"/><line x1="1080.9878040718663" y1="676.9243251887003" x2="1087.1681439593654" y2="695.9454555146034" stroke="#D4A017" stroke-width="3" marker-end="url(#ab)"/><line x1="1013.0040653093779" y1="572.3081083962335" x2="979.0121959281337" y2="676.9243251887003" stroke="#8D6E63" stroke-width="7"/><line x1="979.0121959281337" y1="676.9243251887003" x2="972.8318560406348" y2="695.9454555146034" stroke="#D4A017" stroke-width="3" marker-end="url(#ab)"/><line x1="985.5040653093779" y1="552.3281888760861" x2="896.5121959281337" y2="616.9845666282581" stroke="#8D6E63" stroke-width="7"/><line x1="896.5121959281337" y1="616.9845666282581" x2="880.3318560406348" y2="628.7402716741076" stroke="#D4A017" stroke-width="3" marker-end="url(#ab)"/><line x1="975" y1="520" x2="865" y2="520" stroke="#8D6E63" stroke-width="7"/><line x1="865" y1="520" x2="845" y2="520" stroke="#D4A017" stroke-width="3" marker-end="url(#ab)"/><line x1="985.5040653093779" y1="487.671811123914" x2="896.5121959281337" y2="423.01543337174195" stroke="#8D6E63" stroke-width="7"/><line x1="896.5121959281337" y1="423.01543337174195" x2="880.3318560406348" y2="411.25972832589247" stroke="#D4A017" stroke-width="3" marker-end="url(#ab)"/><line x1="1013.0040653093779" y1="467.6918916037666" x2="979.0121959281337" y2="363.0756748112997" stroke="#8D6E63" stroke-width="7"/><line x1="979.0121959281337" y1="363.0756748112997" x2="972.8318560406348" y2="344.0545444853966" stroke="#D4A017" stroke-width="3" marker-end="url(#ab)"/><line x1="1046.995934690622" y1="467.6918916037665" x2="1080.9878040718663" y2="363.0756748112997" stroke="#8D6E63" stroke-width="7"/><line x1="1080.9878040718663" y1="363.0756748112997" x2="1087.1681439593654" y2="344.0545444853966" stroke="#D4A017" stroke-width="3" marker-end="url(#ab)"/><line x1="1074.495934690622" y1="487.671811123914" x2="1163.4878040718663" y2="423.0154333717419" stroke="#8D6E63" stroke-width="7"/><line x1="1163.4878040718663" y1="423.0154333717419" x2="1179.6681439593654" y2="411.2597283258924" stroke="#D4A017" stroke-width="3" marker-end="url(#ab)"/><rect x="430" y="800" width="540" height="85" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="448" y="833" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Fragile comb</text><text x="448" y="862" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use staged speed, balance the machine and stop for</text><text x="448" y="882" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">abnormal vibration. Extractor design and comb strength</text><text x="448" y="902" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">determine technique.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Machine instructions and guarding take priority over generic diagrams. Never reach into a moving extractor.</text>
</svg>