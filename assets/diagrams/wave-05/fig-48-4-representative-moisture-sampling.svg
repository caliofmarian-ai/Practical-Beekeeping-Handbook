<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 48.4 — Representative Moisture Sampling</title><desc id="desc">Super sampling diagram contrasting one-cell sampling with multiple planned sample positions.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 48.4 — Representative Moisture Sampling</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Representative sampling reduces the chance that one unusually wet or dry cell determines the decision for an</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">entire lot.</text>
<rect x="55" y="170" width="340" height="590" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="73" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Do not sample one convenient cell</text><text x="73" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Moisture can vary among frames,</text><text x="73" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">positions and recently filled</text><text x="73" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">versus more mature comb. One drop</text><text x="73" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">may misrepresent the lot.</text><rect x="145" y="385" width="160" height="230" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="4"/><rect x="160" y="400" width="130" height="200" rx="3" fill="url(#hex)" stroke="#8D6E63" stroke-width="1.5"/><circle cx="230" cy="455" r="13" fill="#FFEBEE" stroke="#C62828" stroke-width="3"/><line x1="230" y1="468" x2="230" y2="550" stroke="#C62828" stroke-width="2" marker-end="url(#ar)"/><rect x="430" y="170" width="915" height="110" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="448" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Representative sampling pattern</text><text x="448" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Select planned points across central and outer frames and across capped/uncapped areas</text><text x="448" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">relevant to the lot; combine or keep separate according to the sampling plan.</text><rect x="470" y="345" width="130" height="260" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="4"/><rect x="485" y="360" width="100" height="230" rx="3" fill="url(#hex)" stroke="#8D6E63" stroke-width="1.5"/><circle cx="505" cy="410" r="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.2"/><circle cx="565" cy="470" r="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.2"/><circle cx="525" cy="550" r="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.2"/><rect x="635" y="345" width="130" height="260" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="4"/><rect x="650" y="360" width="100" height="230" rx="3" fill="url(#hex)" stroke="#8D6E63" stroke-width="1.5"/><circle cx="670" cy="410" r="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.2"/><circle cx="730" cy="470" r="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.2"/><circle cx="690" cy="550" r="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.2"/><rect x="800" y="345" width="130" height="260" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="4"/><rect x="815" y="360" width="100" height="230" rx="3" fill="url(#hex)" stroke="#8D6E63" stroke-width="1.5"/><circle cx="835" cy="410" r="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.2"/><circle cx="895" cy="470" r="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.2"/><circle cx="855" cy="550" r="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.2"/><rect x="965" y="345" width="130" height="260" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="4"/><rect x="980" y="360" width="100" height="230" rx="3" fill="url(#hex)" stroke="#8D6E63" stroke-width="1.5"/><circle cx="1000" cy="410" r="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.2"/><circle cx="1060" cy="470" r="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.2"/><circle cx="1020" cy="550" r="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.2"/><rect x="1130" y="345" width="130" height="260" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="4"/><rect x="1145" y="360" width="100" height="230" rx="3" fill="url(#hex)" stroke="#8D6E63" stroke-width="1.5"/><circle cx="1165" cy="410" r="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.2"/><circle cx="1225" cy="470" r="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.2"/><circle cx="1185" cy="550" r="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.2"/><text x="875" y="660" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2E7D32" text-anchor="middle">multiple planned sample points</text><rect x="520" y="730" width="710" height="100" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="538" y="763" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Lot decision</text><text x="538" y="792" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Document how samples were selected, whether they were pooled, and which</text><text x="538" y="812" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">product/lot the result represents.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">The exact sampling plan should match lot size, variability, regulatory/commercial requirements and the consequence of a wrong decision.</text>
</svg>