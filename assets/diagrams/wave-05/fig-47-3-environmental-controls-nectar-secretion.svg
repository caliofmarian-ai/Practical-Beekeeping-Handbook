<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 47.3 — Environmental Controls on Nectar Secretion</title><desc id="desc">Environmental and biological controls converging on nectar quantity and concentration.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 47.3 — Environmental Controls on Nectar Secretion</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Nectar secretion is dynamic. Flowering alone does not prove that a crop is secreting enough nectar for a</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">colony-level surplus.</text>
<ellipse cx="700" cy="465" rx="22.5" ry="37.5" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.4"/><ellipse cx="733.2869780703304" cy="489.18440519687687" rx="22.5" ry="37.5" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.4"/><ellipse cx="720.5724838302366" cy="528.3155948031232" rx="22.5" ry="37.5" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.4"/><ellipse cx="679.4275161697634" cy="528.3155948031232" rx="22.5" ry="37.5" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.4"/><ellipse cx="666.7130219296696" cy="489.18440519687687" rx="22.5" ry="37.5" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.4"/><circle cx="700" cy="500" r="17.5" fill="#FFF8E1" stroke="#D4A017" stroke-width="1.4"/><line x1="700" y1="535" x2="700" y2="600" stroke="#2E7D32" stroke-width="4"/><text x="700" y="625" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#8D6E63" text-anchor="middle">NECTAR AVAILABLE</text><text x="700" y="652" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#52606D" text-anchor="middle">quantity + concentration</text><rect x="70" y="165" width="380" height="130" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Soil moisture</text><text x="88" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Plant water status influences secretion.</text><line x1="450" y1="230" x2="615" y2="475" stroke="#1565C0" stroke-width="2.7" marker-end="url(#ab)"/><rect x="70" y="340" width="380" height="130" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="88" y="373" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Temperature</text><text x="88" y="402" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Species have different response ranges.</text><line x1="450" y1="405" x2="615" y2="500" stroke="#EF6C00" stroke-width="2.7" marker-end="url(#ab)"/><rect x="70" y="515" width="380" height="130" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="548" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Humidity</text><text x="88" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Changes nectar concentration and</text><text x="88" y="597" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">evaporation.</text><line x1="450" y1="580" x2="615" y2="525" stroke="#1565C0" stroke-width="2.7" marker-end="url(#ab)"/><rect x="70" y="690" width="380" height="130" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="723" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Rain</text><text x="88" y="752" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Can alter secretion, dilute or wash</text><text x="88" y="772" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">nectar.</text><line x1="450" y1="755" x2="615" y2="550" stroke="#1565C0" stroke-width="2.7" marker-end="url(#ab)"/><rect x="950" y="165" width="380" height="130" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="968" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Wind</text><text x="968" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Can reduce foraging and alter flower</text><text x="968" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">microclimate.</text><line x1="950" y1="230" x2="785" y2="475" stroke="#EF6C00" stroke-width="2.7" marker-end="url(#ab)"/><rect x="950" y="340" width="380" height="130" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="968" y="373" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Flower age</text><text x="968" y="402" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Secretion changes through flower</text><text x="968" y="422" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">development.</text><line x1="950" y1="405" x2="785" y2="500" stroke="#6A1B9A" stroke-width="2.7" marker-end="url(#ab)"/><rect x="950" y="515" width="380" height="130" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="968" y="548" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Cultivar / species</text><text x="968" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Genetics and floral structure change</text><text x="968" y="597" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">output.</text><line x1="950" y1="580" x2="785" y2="525" stroke="#6A1B9A" stroke-width="2.7" marker-end="url(#ab)"/><rect x="520" y="735" width="360" height="105" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="538" y="768" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Colony intake is a second step</text><text x="538" y="797" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Flowering does not guarantee a</text><text x="538" y="817" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">profitable nectar flow; bee flight,</text><text x="538" y="837" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">colony strength and competing forage</text><text x="538" y="857" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">also matter.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">These controls interact and differ by plant species, cultivar, soil and weather; no single temperature or humidity threshold is universal.</text>
</svg>