<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 49.13 — Extraction Safety Hazards</title><desc id="desc">Six extraction-room hazard panels with control cues.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 49.13 — Extraction Safety Hazards</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Honey extraction combines rotating machinery, blades, electricity, water, heat and slippery food residues;</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">controls must protect both people and product.</text>
<rect x="70" y="170" width="400" height="285" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Rotating extractor</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Guard/interlock where provided; stop and</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">isolate before reaching inside.</text><circle cx="390" cy="375" r="42" fill="#FFEBEE" stroke="#C62828" stroke-width="3"/><line x1="375.6" y1="360.6" x2="404.4" y2="389.4" stroke="#C62828" stroke-width="5"/><line x1="404.4" y1="360.6" x2="375.6" y2="389.4" stroke="#C62828" stroke-width="5"/><rect x="500" y="170" width="400" height="285" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Electrical + wash water</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use suitable electrical protection, dry</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">controls and safe cleaning procedure.</text><circle cx="820" cy="375" r="42" fill="#FFEBEE" stroke="#C62828" stroke-width="3"/><line x1="805.6" y1="360.6" x2="834.4" y2="389.4" stroke="#C62828" stroke-width="5"/><line x1="834.4" y1="360.6" x2="805.6" y2="389.4" stroke="#C62828" stroke-width="5"/><rect x="930" y="170" width="400" height="285" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="948" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Knives / uncapping tools</text><text x="948" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Stable cutting direction, guarded storage</text><text x="948" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and appropriate hand protection.</text><circle cx="1250" cy="375" r="42" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="1250" y="382" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#EF6C00" text-anchor="middle">!</text><rect x="70" y="500" width="400" height="285" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="88" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Hot surfaces</text><text x="88" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Control wax melters/heaters and prevent</text><text x="88" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">contact burns or overheated honey.</text><circle cx="390" cy="705" r="42" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="390" y="712" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#EF6C00" text-anchor="middle">!</text><rect x="500" y="500" width="400" height="285" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="518" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Wet / sticky floor</text><text x="518" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Prompt spill control, non-slip footing and</text><text x="518" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">clear walkways.</text><circle cx="820" cy="705" r="42" fill="#FFEBEE" stroke="#C62828" stroke-width="3"/><line x1="805.6" y1="690.6" x2="834.4" y2="719.4" stroke="#C62828" stroke-width="5"/><line x1="834.4" y1="690.6" x2="805.6" y2="719.4" stroke="#C62828" stroke-width="5"/><rect x="930" y="500" width="400" height="285" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="948" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Lubricants / maintenance</text><text x="948" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use only food-suitable materials where</text><text x="948" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">incidental food contact is possible and</text><text x="948" y="602" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">prevent contamination.</text><circle cx="1250" cy="705" r="42" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/><text x="1250" y="712" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#6A1B9A" text-anchor="middle">!</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Follow equipment manufacturer instructions and workplace/food-safety requirements. This plate identifies hazards; it is not a machine-specific</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">lockout procedure.</text>
</svg>