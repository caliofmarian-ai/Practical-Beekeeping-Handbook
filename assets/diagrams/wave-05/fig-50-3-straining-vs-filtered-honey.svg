<title id="title">Figure 50.3 — Straining Versus Legal “Filtered Honey”</title><desc id="desc">Comparison between coarse debris-removal straining and fine filtration that significantly removes pollen.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 50.3 — Straining Versus Legal “Filtered Honey”</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Ordinary beekeeping terminology and legal product definitions are not always identical. The legal label depends</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">on the jurisdiction.</text>
<rect x="70" y="170" width="580" height="600" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Ordinary coarse straining</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Mesh/screens remove wax fragments and other physical</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">debris while retaining most natural pollen and fine</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">constituents. This is ordinary processing in many</text><text x="88" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">beekeeping operations.</text><rect x="170" y="420" width="380" height="22" rx="2" fill="#B0BEC5" stroke="#37474F" stroke-width="2"/><circle cx="205" cy="375" r="6" fill="#8D6E63" stroke="#37474F" stroke-width="1"/><circle cx="237" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="269" cy="375" r="6" fill="#8D6E63" stroke="#37474F" stroke-width="1"/><circle cx="301" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="333" cy="375" r="6" fill="#8D6E63" stroke="#37474F" stroke-width="1"/><circle cx="365" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="397" cy="375" r="6" fill="#8D6E63" stroke="#37474F" stroke-width="1"/><circle cx="429" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="461" cy="375" r="6" fill="#8D6E63" stroke="#37474F" stroke-width="1"/><circle cx="493" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><path d="M 250 493.5 Q 237.9 510 250 525.4 Q 262.1 510 250 493.5 Z" fill="#D4A017" stroke="#8D6E63" stroke-width="1.5"/><path d="M 305 493.5 Q 292.9 510 305 525.4 Q 317.1 510 305 493.5 Z" fill="#D4A017" stroke="#8D6E63" stroke-width="1.5"/><path d="M 360 493.5 Q 347.9 510 360 525.4 Q 372.1 510 360 493.5 Z" fill="#D4A017" stroke="#8D6E63" stroke-width="1.5"/><path d="M 415 493.5 Q 402.9 510 415 525.4 Q 427.1 510 415 493.5 Z" fill="#D4A017" stroke="#8D6E63" stroke-width="1.5"/><path d="M 470 493.5 Q 457.9 510 470 525.4 Q 482.1 510 470 493.5 Z" fill="#D4A017" stroke="#8D6E63" stroke-width="1.5"/><text x="360" y="610" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2E7D32" text-anchor="middle">coarse debris removed</text><rect x="750" y="170" width="580" height="600" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="768" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Fine filtration causing significant pollen removal</text><text x="768" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Some legal frameworks use a specific 'filtered honey'</text><text x="768" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">designation when filtration removes pollen to a</text><text x="768" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">significant extent. Exact definitions/labelling are</text><text x="768" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">jurisdiction-specific.</text><rect x="850" y="420" width="380" height="28" rx="2" fill="#B0BEC5" stroke="#37474F" stroke-width="2"/><circle cx="875" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="903" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="931" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="959" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="987" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="1015" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="1043" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="1071" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="1099" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="1127" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="1155" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><circle cx="1183" cy="375" r="6" fill="#D98C10" stroke="#37474F" stroke-width="1"/><path d="M 930 493.5 Q 917.9 510 930 525.4 Q 942.1 510 930 493.5 Z" fill="#D4A017" stroke="#8D6E63" stroke-width="1.5"/><path d="M 985 493.5 Q 972.9 510 985 525.4 Q 997.1 510 985 493.5 Z" fill="#D4A017" stroke="#8D6E63" stroke-width="1.5"/><path d="M 1040 493.5 Q 1027.9 510 1040 525.4 Q 1052.1 510 1040 493.5 Z" fill="#D4A017" stroke="#8D6E63" stroke-width="1.5"/><path d="M 1095 493.5 Q 1082.9 510 1095 525.4 Q 1107.1 510 1095 493.5 Z" fill="#D4A017" stroke="#8D6E63" stroke-width="1.5"/><path d="M 1150 493.5 Q 1137.9 510 1150 525.4 Q 1162.1 510 1150 493.5 Z" fill="#D4A017" stroke="#8D6E63" stroke-width="1.5"/><text x="1040" y="610" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#EF6C00" text-anchor="middle">significant pollen removal possible</text><rect x="430" y="805" width="540" height="75" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="448" y="838" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Legal boundary</text><text x="448" y="867" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Check the current law and product-name rules in the market</text><text x="448" y="887" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">where the honey is sold.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Codex and current EU rules provide examples of defined 'filtered honey' concepts, but the artwork does not apply that wording universally.</text>
</svg>