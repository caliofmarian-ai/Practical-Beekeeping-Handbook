e="14" font-weight="500" fill="#1F2933" text-anchor="start">concern</text><rect x="630" y="320" width="130" height="105" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="2.2"/><circle cx="660" cy="370" r="8" fill="#8D6E63" stroke="#8D6E63" stroke-width="1"/><circle cx="688" cy="370" r="8" fill="#8D6E63" stroke="#8D6E63" stroke-width="1"/><circle cx="716" cy="370" r="8" fill="#8D6E63" stroke="#8D6E63" stroke-width="1"/><circle cx="744" cy="370" r="8" fill="#8D6E63" stroke="#8D6E63" stroke-width="1"/><rect x="835" y="165" width="240" height="300" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="853" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Pollen cells</text><text x="853" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">May reduce premium</text><text x="853" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">appearance; grade by</text><text x="853" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">market specification</text><rect x="890" y="320" width="130" height="105" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="2.2"/><circle cx="915" cy="370" r="8" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="940" cy="370" r="8" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="965" cy="370" r="8" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="990" cy="370" r="8" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="1015" cy="370" r="8" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><rect x="1095" y="165" width="240" height="300" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="1113" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Brood evidence</text><text x="1113" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Exclude from saleable</text><text x="1113" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">comb-honey stream</text><rect x="1150" y="320" width="130" height="105" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="2.2"/><circle cx="1215" cy="370" r="20" fill="#B98755" stroke="#C62828" stroke-width="3"/><rect x="55" y="500" width="240" height="300" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="73" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Leakage</text><text x="73" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Package/product</text><text x="73" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">integrity problem</text><rect x="110" y="655" width="130" height="105" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="2.2"/><path d="M 175 703.5 Q 162.9 720 175 735.4 Q 187.1 720 175 703.5 Z" fill="#D4A017" stroke="#8D6E63" stroke-width="1.5"/><rect x="315" y="500" width="240" height="300" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="333" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Crushed cappings</text><text x="333" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Handling / presentation</text><text x="333" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">damage</text><rect x="370" y="655" width="130" height="105" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="2.2"/><path d="M 385