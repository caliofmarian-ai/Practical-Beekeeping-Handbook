" cy="710" r="8" fill="#F1E0A5" stroke="#757575" stroke-width="1"/><circle cx="932" cy="710" r="8" fill="#F1E0A5" stroke="#757575" stroke-width="1"/><circle cx="954" cy="710" r="8" fill="#F1E0A5" stroke="#757575" stroke-width="1"/><circle cx="976" cy="710" r="8" fill="#F1E0A5" stroke="#757575" stroke-width="1"/><circle cx="998" cy="710" r="8" fill="#F1E0A5" stroke="#757575" stroke-width="1"/><circle cx="1020" cy="710" r="8" fill="#F1E0A5" stroke="#757575" stroke-width="1"/><rect x="1095" y="500" width="240" height="300" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="1113" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Heat-softened comb</text><text x="1113" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Structural damage risk;</text><text x="1113" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">protect wax from</text><text x="1113" y="602" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">excessive heat</text><rect x="1150" y="655" width="130" height="105" rx="6" fill="#F6D79D" stroke="#8D6E63" stroke-width="2.2"/><path d="M 1160 685 Q 1215 745 1275 700" fill="none" stroke="#C62828" stroke-width="5"/>
