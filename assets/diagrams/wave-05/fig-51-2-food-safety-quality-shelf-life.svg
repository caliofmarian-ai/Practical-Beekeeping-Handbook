<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 51.2 — Food Safety, Quality, and Shelf Life</title><desc id="desc">Three overlapping concepts showing food safety, quality and specification-based shelf life.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 51.2 — Food Safety, Quality, and Shelf Life</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Honey can remain microbiologically stable while quality attributes change; shelf life therefore belongs to a</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">defined product specification and storage condition.</text>
<circle cx="540" cy="500" r="220" fill="#FFEBEE" stroke="#C62828" stroke-width="4"/><circle cx="860" cy="500" r="220" fill="#E3F2FD" stroke="#1565C0" stroke-width="4"/><circle cx="700" cy="675" r="220" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><text x="465" y="390" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#C62828" text-anchor="middle">FOOD SAFETY</text><text x="435" y="425" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle">Hazards and controls that</text><text x="435" y="445" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle">determine whether food is</text><text x="435" y="465" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle">safe for intended</text><text x="435" y="485" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle">consumption.</text><text x="935" y="390" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#1565C0" text-anchor="middle">QUALITY</text><text x="965" y="425" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle">Moisture, flavour, aroma,</text><text x="965" y="445" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle">colour, texture,</text><text x="965" y="465" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle">crystallisation and product</text><text x="965" y="485" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle">specification.</text><text x="700" y="720" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#2E7D32" text-anchor="middle">SHELF LIFE</text><text x="700" y="755" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle">Time during which the packaged product remains</text><text x="700" y="775" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle">within its defined safety and quality</text><text x="700" y="795" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle">specification under stated storage conditions.</text><text x="700" y="535" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#6A1B9A" text-anchor="middle">related</text><text x="700" y="560" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#6A1B9A" text-anchor="middle">but not interchangeable</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">There is no single universal shelf life for every honey, package and market. Validate claims against the product, packaging and applicable rules.</text>
</svg>