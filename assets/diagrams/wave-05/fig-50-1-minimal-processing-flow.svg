<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 50.1 — Minimal-Processing Flow</title><desc id="desc">Minimal-processing workflow from extracted lot to identified storage or packing vessel.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 50.1 — Minimal-Processing Flow</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Minimal processing means the least justified intervention needed to meet safety, quality, identity and legal</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">requirements — not the absence of control.</text>
<line x1="110" y1="500" x2="1290" y2="500" stroke="#1565C0" stroke-width="5" marker-end="url(#ab)"/><circle cx="110" cy="500" r="13" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><line x1="110" y1="480" x2="110" y2="350" stroke="#757575" stroke-width="2" stroke-dasharray="5 4"/><rect x="55" y="180" width="150" height="150" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="73" y="213" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">1. Extracted lot</text><text x="73" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Maintain lot</text><text x="73" y="262" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">identity.</text><circle cx="306.66666666666663" cy="500" r="13" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/><line x1="306.66666666666663" y1="520" x2="306.66666666666663" y2="585" stroke="#757575" stroke-width="2" stroke-dasharray="5 4"/><rect x="231.66666666666663" y="585" width="150" height="150" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="249.66666666666663" y="618" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">2. Quality check</text><text x="249.66666666666663" y="647" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Moisture,</text><text x="249.66666666666663" y="667" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">sensory/visual</text><text x="249.66666666666663" y="687" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">review and</text><text x="249.66666666666663" y="707" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">relevant</text><text x="249.66666666666663" y="727" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">specification</text><text x="249.66666666666663" y="747" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">checks.</text><circle cx="503.3333333333333" cy="500" r="13" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><line x1="503.3333333333333" y1="480" x2="503.3333333333333" y2="350" stroke="#757575" stroke-width="2" stroke-dasharray="5 4"/><rect x="428.3333333333333" y="180" width="150" height="150" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="446.3333333333333" y="213" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">3. Settling</text><text x="446.3333333333333" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Allow gentle</text><text x="446.3333333333333" y="262" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">physical</text><text x="446.3333333333333" y="282" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">separation.</text><circle cx="700" cy="500" r="13" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><line x1="700" y1="520" x2="700" y2="585" stroke="#757575" stroke-width="2" stroke-dasharray="5 4"/><rect x="625" y="585" width="150" height="150" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="643" y="618" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">4. Appropriate straining</text><text x="643" y="647" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Remove physical</text><text x="643" y="667" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">debris without</text><text x="643" y="687" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">unnecessary</text><text x="643" y="707" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">constituent</text><text x="643" y="727" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">removal.</text><circle cx="896.6666666666666" cy="500" r="13" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><line x1="896.6666666666666" y1="480" x2="896.6666666666666" y2="350" stroke="#757575" stroke-width="2" stroke-dasharray="5 4"/><rect x="821.6666666666666" y="180" width="150" height="150" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="839.6666666666666" y="213" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">5. Controlled warming if needed</text><text x="839.6666666666666" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use the minimum</text><text x="839.6666666666666" y="262" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">justified</text><text x="839.6666666666666" y="282" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">time/temperature</text><text x="839.6666666666666" y="302" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">for flow or</text><text x="839.6666666666666" y="322" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">liquefaction.</text><circle cx="1093.3333333333333" cy="500" r="13" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/><line x1="1093.3333333333333" y1="520" x2="1093.3333333333333" y2="585" stroke="#757575" stroke-width="2" stroke-dasharray="5 4"/><rect x="1018.3333333333333" y="585" width="150" height="150" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="1036.3333333333333" y="618" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">6. Documented blending if intended</text><text x="1036.3333333333333" y="647" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Blend only within</text><text x="1036.3333333333333" y="667" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">the product</text><text x="1036.3333333333333" y="687" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">specification and</text><text x="1036.3333333333333" y="707" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">traceability plan.</text><circle cx="1290" cy="500" r="13" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><line x1="1290" y1="480" x2="1290" y2="350" stroke="#757575" stroke-width="2" stroke-dasharray="5 4"/><rect x="1190" y="180" width="150" height="150" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="1208" y="213" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">7. Identified vessel</text><text x="1208" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Protect, close and</text><text x="1208" y="262" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">label bulk/packing</text><text x="1208" y="282" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">vessel.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Avoid unnecessary heat and unnecessary removal of natural constituents. Record any blending or processing that changes lot identity or</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">specification.</text>
</svg>