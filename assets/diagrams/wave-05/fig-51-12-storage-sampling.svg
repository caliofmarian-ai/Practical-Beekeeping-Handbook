<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 51.12 — Storage Sampling</title><desc id="desc">Tank and drum sampling examples showing representative-sampling and container-identity considerations.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 51.12 — Storage Sampling</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Storage sampling should represent the question being asked: one convenient surface sample can misrepresent a</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">stratified or heterogeneous bulk lot.</text>
<rect x="55" y="165" width="390" height="650" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="73" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Tank sampling</text><text x="73" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">If a tank can stratify or separate, a</text><text x="73" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">top-only sample may not represent the</text><text x="73" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">bulk. Follow a defined mixing/sampling</text><text x="73" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">plan and document sample location.</text><rect x="130" y="380" width="240" height="310" rx="18" fill="#FFFDF4" stroke="#B0BEC5" stroke-width="4"/><rect x="150" y="358" width="200" height="26" rx="5" fill="#B0BEC5" stroke="#37474F" stroke-width="2"/><rect x="150" y="520" width="200" height="145" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="1.5"/><rect x="150" y="500" width="200" height="20" rx="3" fill="#F3E0B7" stroke="#8D6E63" stroke-width="1"/><rect x="150" y="665" width="200" height="10" rx="2" fill="#F5F5F5" stroke="#757575" stroke-width="1"/><circle cx="250" cy="445" r="12" fill="#FFEBEE" stroke="#C62828" stroke-width="2.5"/><text x="250" y="480" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#C62828" text-anchor="middle">top-only sample</text><line x1="336.9" y1="436.9" x2="353.1" y2="453.1" stroke="#C62828" stroke-width="5"/><line x1="353.1" y1="436.9" x2="336.9" y2="453.1" stroke="#C62828" stroke-width="5"/><rect x="505" y="165" width="390" height="650" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="523" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Drum / container sampling</text><text x="523" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Keep container identity separate. Use</text><text x="523" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">clean sample tools and record which</text><text x="523" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">container and sampling point produced</text><text x="523" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">the sample.</text><rect x="630" y="390" width="140" height="260" rx="18" fill="#F5F5F5" stroke="#37474F" stroke-width="3"/><line x1="640" y1="435" x2="760" y2="435" stroke="#37474F" stroke-width="2"/><line x1="640" y1="605" x2="760" y2="605" stroke="#37474F" stroke-width="2"/><circle cx="700" cy="505" r="12" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/><text x="700" y="700" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle">Container ID: DR-07</text><rect x="955" y="165" width="390" height="650" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="973" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Homogenisation considerations</text><text x="973" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Mix only when the sampling objective</text><text x="973" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and product condition justify it.</text><text x="973" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Crystallisation or phase separation</text><text x="973" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">may require a validated sampling</text><text x="973" y="307" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">approach rather than blind stirring.</text><rect x="1060" y="425" width="180" height="240" rx="12" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><line x1="1080" y1="500" x2="1220" y2="500" stroke="#EF6C00" stroke-width="3" stroke-dasharray="8 6"/><text x="1150" y="485" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#EF6C00" text-anchor="middle">separated layer</text><text x="1150" y="600" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8D6E63" text-anchor="middle">bulk</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Use a documented sampling plan appropriate to product state, lot size and required tests. Keep sample identity and storage/transport conditions</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">traceable.</text>
</svg>