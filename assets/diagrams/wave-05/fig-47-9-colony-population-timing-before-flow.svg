<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 47.9 — Colony Population Timing Before a Flow</title><desc id="desc">Timeline linking queen laying, worker development, in-hive maturation, foraging and peak bloom.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 47.9 — Colony Population Timing Before a Flow</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">A colony needs its workforce before the crop peaks. Population cannot be created instantly after bloom begins.</text>
<line x1="120" y1="500" x2="1280" y2="500" stroke="#1565C0" stroke-width="5" marker-end="url(#ab)"/><circle cx="120" cy="500" r="15" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/><line x1="120" y1="480" x2="120" y2="355" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/><rect x="55" y="185" width="270" height="150" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="73" y="218" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Queen egg laying</text><text x="73" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Workforce preparation begins</text><text x="73" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">before the expected crop.</text><circle cx="410" cy="500" r="15" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><line x1="410" y1="520" x2="410" y2="585" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/><rect x="275" y="585" width="270" height="150" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="293" y="618" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Brood development</text><text x="293" y="647" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Egg → larva → pupa; worker</text><text x="293" y="667" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">development takes about three</text><text x="293" y="687" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">weeks.</text><circle cx="700" cy="500" r="15" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><line x1="700" y1="480" x2="700" y2="355" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/><rect x="565" y="185" width="270" height="150" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="583" y="218" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Young workers</text><text x="583" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">New adults first perform</text><text x="583" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">in-hive tasks.</text><circle cx="990" cy="500" r="15" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><line x1="990" y1="520" x2="990" y2="585" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/><rect x="855" y="585" width="270" height="150" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="873" y="618" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Forager recruitment</text><text x="873" y="647" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Foraging population rises</text><text x="873" y="667" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">later than brood production.</text><circle cx="1280" cy="500" r="15" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><line x1="1280" y1="480" x2="1280" y2="355" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/><rect x="1120" y="185" width="270" height="150" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="1138" y="218" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Peak bloom</text><text x="1138" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">The prepared workforce can</text><text x="1138" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">exploit the strongest part of</text><text x="1138" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">the flow.</text><path d="M 120 840 C 360 820 500 720 650 650 C 820 570 1000 600 1280 390" fill="none" stroke="#2E7D32" stroke-width="5"/><text x="120" y="875" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2E7D32" text-anchor="start">conceptual usable workforce rising towards the crop</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Worker development and age-related task transition vary with colony conditions; the graphic shows planning logic, not an exact universal</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">schedule.</text>
</svg>