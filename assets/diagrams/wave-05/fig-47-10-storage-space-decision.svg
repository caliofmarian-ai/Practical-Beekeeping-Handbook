<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 47.10 — Storage-Space Decision</title><desc id="desc">Strong-flow colony compared under insufficient and appropriate drawn-comb storage capacity.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 47.10 — Storage-Space Decision</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Storage decisions are about usable comb at the right time, not simply adding an empty box.</text>
<rect x="65" y="160" width="590" height="110" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="83" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Insufficient usable storage</text><text x="83" y="222" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Strong intake meets limited drawn storage. Nectar begins</text><text x="83" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">occupying brood-area cells and congestion/swarm pressure</text><text x="83" y="262" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">can rise.</text><rect x="235" y="330" width="245" height="290" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="227" y="314" width="261" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="255" y1="348" x2="255" y2="592" stroke="#8D6E63" stroke-width="1"/><line x1="323.3333333333333" y1="348" x2="323.3333333333333" y2="592" stroke="#8D6E63" stroke-width="1"/><line x1="391.66666666666663" y1="348" x2="391.66666666666663" y2="592" stroke="#8D6E63" stroke-width="1"/><line x1="460" y1="348" x2="460" y2="592" stroke="#8D6E63" stroke-width="1"/><rect x="318.3" y="608" width="78.4" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><rect x="285" y="382" width="145" height="170" rx="4" fill="#F3C85B" stroke="#8D6E63" stroke-width="2.2"/><text x="357" y="475" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#C62828" text-anchor="middle">BACKFILL</text><line x1="357" y1="565" x2="357" y2="650" stroke="#EF6C00" stroke-width="3" marker-end="url(#ao)"/><text x="357" y="690" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#EF6C00" text-anchor="middle">less usable laying / storage space</text><rect x="745" y="160" width="590" height="110" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="763" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Appropriate drawn-super capacity</text><text x="763" y="222" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Usable drawn comb is available before the strong flow;</text><text x="763" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">intake can be stored above without forcing unnecessary</text><text x="763" y="262" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">brood-nest backfilling.</text><rect x="915" y="420" width="245" height="200" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="907" y="404" width="261" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="935" y1="438" x2="935" y2="592" stroke="#8D6E63" stroke-width="1"/><line x1="1003.3333333333334" y1="438" x2="1003.3333333333334" y2="592" stroke="#8D6E63" stroke-width="1"/><line x1="1071.6666666666667" y1="438" x2="1071.6666666666667" y2="592" stroke="#8D6E63" stroke-width="1"/><line x1="1140" y1="438" x2="1140" y2="592" stroke="#8D6E63" stroke-width="1"/><rect x="998.3" y="608" width="78.4" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><rect x="915" y="305" width="245" height="100" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="907" y="289" width="261" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="935" y1="323" x2="935" y2="377" stroke="#8D6E63" stroke-width="1"/><line x1="1003.3333333333334" y1="323" x2="1003.3333333333334" y2="377" stroke="#8D6E63" stroke-width="1"/><line x1="1071.6666666666667" y1="323" x2="1071.6666666666667" y2="377" stroke="#8D6E63" stroke-width="1"/><line x1="1140" y1="323" x2="1140" y2="377" stroke="#8D6E63" stroke-width="1"/><rect x="998.3" y="393" width="78.4" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><text x="1038" y="350" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2E7D32" text-anchor="middle">drawn super</text><line x1="1038" y1="382" x2="1038" y2="418" stroke="#2E7D32" stroke-width="3" marker-end="url(#ag)"/><rect x="490" y="760" width="420" height="90" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="508" y="793" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Decision</text><text x="508" y="822" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Judge usable comb, intake rate, colony strength</text><text x="508" y="842" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and swarm context — not empty box volume alone.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Undrawn foundation may not function as immediate storage at the same rate as drawn comb. Match supering decisions to colony strength and the</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">actual flow.</text>
</svg>