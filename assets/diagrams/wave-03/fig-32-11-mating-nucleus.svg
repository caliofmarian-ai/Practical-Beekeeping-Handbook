<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 32.11 — Mating Nucleus</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">A mating nucleus must be compact but biologically complete enough to regulate brood, defend itself and support a</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">developing queen.</text>
