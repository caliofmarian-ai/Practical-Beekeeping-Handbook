0000001" y1="380.8" x2="839.4000000000001" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="843.6" y1="380.8" x2="843.6" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><rect x="930" y="170" width="400" height="290" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="948" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Food + pollen</text><text x="948" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Accessible stores sized to the small</text><text x="948" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">population.</text><circle cx="1212" cy="385" r="23" fill="#F3C85B" stroke="#8D6E63" stroke-width="2"/><circle cx="1268" cy="385" r="23" fill="#D98C10" stroke="#8D6E63" stroke-width="2"/><rect x="70" y="495" width="400" height="290" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Usable empty comb</text><text x="88" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Space for queen laying after successful</text><text x="88" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">mating.</text><rect x="322" y="652" width="116" height="116" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="3"/><rect x="500" y="495" width="400" height="290" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="518" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Queen cell / queen</text><text x="518" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Protected introduction point and clear</text><text x="518" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">status record.</text><path d="M 796.25 655 Q 790.75 674.25 799 696.25 Q 804.5 716.6 810 730.9 Q 815.5 716.6 821 696.25 Q 829.25 674.25 823.75 655 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><rect x="930" y="495" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="948" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Reduced entrance</text><text x="948" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">A defensible entrance helps a small unit</text><text x="948" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">manage robbing pressure.</text><rect x="1185" y="660" width="110" height="105" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="1177" y="644" width="126" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="1205" y1="678" x2="1205" y2="737" stroke="#8D6E63" stroke-width="1"/><line x1="1228.3333333333333" y1="678" x2="1228.3333333333333" y2="737" stroke="#8D6E63" stroke-width="1"/><line x1="1251.6666666666667" y1="678" x2="1251.6666666666667" y2="737" stroke="#8D6E63" stroke-width="1"/><line x1="1275" y1="678" x2="1275" y2="737" stroke="#8D6E63" stroke-width="1"/><rect x="1222.4" y="753" width="35.2" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Population, food and entrance size depend on local conditions; confirm emergence and mating success before expansion.</text></svg>