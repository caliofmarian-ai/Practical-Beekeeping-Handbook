="700" fill="#2E7D32" text-anchor="start">Finish feeding</text><text x="645.5" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Avoid unsuitable</text><text x="645.5" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">late liquid</text><text x="645.5" y="277" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">feeding.</text><circle cx="845.625" cy="455" r="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><line x1="845.625" y1="475" x2="845.625" y2="555" stroke="#757575" stroke-width="2" stroke-dasharray="5 4"/><rect x="775.625" y="555" width="140" height="125" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="793.625" y="588" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Winter setup</text><text x="793.625" y="617" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Configure space</text><text x="793.625" y="637" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and moisture</text><text x="793.625" y="657" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">control.</text><circle cx="993.75" cy="455" r="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><line x1="993.75" y1="435" x2="993.75" y2="325" stroke="#757575" stroke-width="2" stroke-dasharray="5 4"/><rect x="923.75" y="175" width="140" height="125" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="941.75" y="208" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Monitor</text><text x="941.75" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use</text><text x="941.75" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">low-disturbance</text><text x="941.75" y="277" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">winter checks.</text><circle cx="1141.875" cy="455" r="12" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><line x1="1141.875" y1="475" x2="1141.875" y2="555" stroke="#757575" stroke-width="2" stroke-dasharray="5 4"/><rect x="1071.875" y="555" width="140" height="125" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="1089.875" y="588" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Emergency check</text><text x="1089.875" y="617" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Place solid feed</text><text x="1089.875" y="637" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">within cluster</text><text x="1089.875" y="657" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">reach if needed.</text><circle cx="1290" cy="455" r="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><line x1="1290" y1="435" x2="1290" y2="325" stroke="#757575" stroke-width="2" stroke-dasharray="5 4"/><rect x="1200" y="175" width="140" height="125" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="1218" y="208" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Spring transition</text><text x="1218" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Return to</text><text x="1218" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">ordinary</text><text x="1218" y="277" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">assessment.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Use locally validated reserve targets rather than a universal hive weight.</text></svg>