<title id="title">Figure 31.2 — Queen Failure Versus Other Problems</title><desc id="desc">Differential causes of poor brood performance.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 31.2 — Queen Failure Versus Other Problems</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Poor brood performance has multiple causes; do not attribute every irregular pattern to the queen.</text>
<rect x="70" y="170" width="400" height="290" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Possible queen problem</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Age/history, declining laying or confirmed</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">absence may justify review.</text><path d="M 384.2 382.06 C 393.44 370.72,406.88 373.24,400.58 383.74 Z" fill="#D9EEF7" stroke="#5D4037" stroke-width="1"/><circle cx="374.96" cy="385" r="4.62" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="387.56" cy="385" rx="7.56" ry="5.88" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="410.24" cy="385" rx="18.06" ry="5.46" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><line x1="401.84000000000003" y1="380.8" x2="401.84000000000003" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="406.04" y1="380.8" x2="406.04" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="410.24" y1="380.8" x2="410.24" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="414.44" y1="380.8" x2="414.44" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="418.64" y1="380.8" x2="418.64" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><rect x="500" y="170" width="400" height="290" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Varroa / virus pressure</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Mite pressure can damage brood and adults;</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">measure rather than guess.</text><rect x="765" y="327" width="90" height="110" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/><line x1="782" y1="355" x2="838" y2="355" stroke="#1565C0" stroke-width="2"/><line x1="782" y1="380" x2="830" y2="380" stroke="#1565C0" stroke-width="2"/><line x1="782" y1="405" x2="838" y2="405" stroke="#1565C0" stroke-width="2"/><rect x="930" y="170" width="400" height="290" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="948" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Chilled brood</text><text x="948" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Temperature exposure can create brood loss</text><text x="948" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">unrelated to queen genetics.</text><rect x="1182" y="327" width="116" height="116" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="3"/><rect x="70" y="495" width="400" height="290" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="88" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Food-bound nest</text><text x="88" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Stored food can physically reduce laying</text><text x="88" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">space.</text><circle cx="352" cy="710" r="23" fill="#F3C85B" stroke="#8D6E63" stroke-width="2"/><circle cx="408" cy="710" r="23" fill="#D98C10" stroke="#8D6E63" stroke-width="2"/><rect x="500" y="495" width="400" height="290" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="518" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Disease differential</text><text x="518" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Abnormal brood may require diagnostic or</text><text x="518" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">competent-authority pathways.</text><rect x="765" y="652" width="90" height="110" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/><line x1="782" y1="680" x2="838" y2="680" stroke="#1565C0" stroke-width="2"/><line x1="782" y1="705" x2="830" y2="705" stroke="#1565C0" stroke-width="2"/><line x1="782" y1="730" x2="838" y2="730" stroke="#1565C0" stroke-width="2"/><rect x="930" y="495" width="400" height="290" rx="16" fill="#F5F5F5" stroke="#757575" stroke-width="2.3"/><text x="948" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#757575" text-anchor="start">Damaged / poor comb</text><text x="948" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Comb condition can limit usable laying</text><text x="948" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">area and distort apparent pattern.</text><rect x="1182" y="652" width="116" height="116" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="3"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Requeening follows differential assessment. Brood appearance alone does not establish queen failure or disease.</text></svg>