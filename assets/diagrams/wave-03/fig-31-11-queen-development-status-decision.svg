<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 31.11 — Queen Development and Status Decision</title><desc id="desc">Queen-status decision sequence.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 31.11 — Queen Development and Status Decision</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Resolve actual queen status before adding another queen or destroying queen cells.</text>
<rect x="230" y="155" width="940" height="82" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="248" y="188" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">1. Evidence of laying queen?</text><text x="248" y="217" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use eggs, young brood, pattern and queen history together.</text><line x1="700" y1="237" x2="700" y2="257" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="261" width="940" height="82" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="248" y="294" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">2. Virgin queen possible?</text><text x="248" y="323" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Account for recent emergence, mating weather and colony history.</text><line x1="700" y1="343" x2="700" y2="363" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="367" width="940" height="82" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="248" y="400" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">3. Queen cell present?</text><text x="248" y="429" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Decide whether it should be protected, replaced or controlled within the management</text><text x="248" y="449" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">plan.</text><line x1="700" y1="449" x2="700" y2="469" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="473" width="940" height="82" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="248" y="506" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">4. Apparently queenless?</text><text x="248" y="535" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Consider how long the colony may have lacked queen pheromone and open brood.</text><line x1="700" y1="555" x2="700" y2="575" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="579" width="940" height="82" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="248" y="612" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">5. Laying workers possible?</text><text x="248" y="641" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Multiple eggs and abnormal placement are supporting clues, not one-sign certainty.</text><line x1="700" y1="661" x2="700" y2="681" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="685" width="940" height="82" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="248" y="718" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">6. Choose and verify action</text><text x="248" y="747" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Act only after status is sufficiently resolved, then confirm outcome.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Queen development and mating are weather- and context-sensitive; the plate avoids rigid universal day counts.</text></svg>