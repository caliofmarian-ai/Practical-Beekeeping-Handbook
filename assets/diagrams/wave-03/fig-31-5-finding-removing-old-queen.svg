<rect x="70" y="170" width="400" height="290" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Inspect methodically</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Keep brood frames over the open hive and</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">identify the queen by form and behaviour.</text><path d="M 384.2 382.06 C 393.44 370.72,406.88 373.24,400.58 383.74 Z" fill="#D9EEF7" stroke="#5D4037" stroke-width="1"/><circle cx="374.96" cy="385" r="4.62" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="387.56" cy="385" rx="7.56" ry="5.88" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="410.24" cy="385" rx="18.06" ry="5.46" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><line x1="401.84000000000003" y1="380.8" x2="401.84000000000003" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="406.04" y1="380.8" x2="406.04" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="410.24" y1="380.8" x2="410.24" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="414.44" y1="380.8" x2="414.44" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="418.64" y1="380.8" x2="418.64" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><rect x="500" y="170" width="400" height="290" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Secure the queen</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Once identity is certain, use a suitable</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">controlled holding/removal method.</text><path d="M 814.2 382.06 C 823.44 370.72,836.88 373.24,830.58 383.74 Z" fill="#D9EEF7" stroke="#5D4037" stroke-width="1"/><circle cx="804.96" cy="385" r="4.62" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="817.56" cy="385" rx="7.56" ry="5.88" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="840.24" cy="385" rx="18.06" ry="5.46" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><line x1="831.84" y1="380.8" x2="831.84" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="836.04" y1="380.8" x2="836.04" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="840.24" y1="380.8" x2="840.24" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="844.44" y1="380.8" x2="844.44" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="848.64" y1="380.8" x2="848.64" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><rect x="930" y="170" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="948" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Preserve a backup option</text><text x="948" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">A small backup nucleus can protect</text><text x="948" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">valuable genetics or provide a recovery</text><text x="948" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">route.</text><rect x="1185" y="335" width="110" height="105" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="1177" y="319" width="126" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="1205" y1="353" x2="1205" y2="412" stroke="#8D6E63" stroke-width="1"/><line x1="1228.3333333333333" y1="353" x2="1228.3333333333333" y2="412" stroke="#8D6E63" stroke-width="1"/><line x1="1251.6666666666667" y1="353" x2="1251.6666666666667" y2="412" stroke="#8D6E63" stroke-width="1"/><line x1="1275" y1="353" x2="1275" y2="412" stroke="#8D6E63" stroke-width="1"/><rect x="1222.4" y="428" width="35.2" height="8" rx="2" fill="#fff" stroke="#1F2933" stroke-width="1"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Minimise disturbance and follow an introduction method appropriate to queen source, colony condition and season.</text></svg>