ht="95" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="768" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Hold / investigate</text><text x="768" y="222" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Weak coverage, abnormal brood, unresolved queen status,</text><text x="768" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">disease suspicion or unacceptable mite pressure.</text><rect x="775" y="295" width="505" height="445" rx="7" fill="url(#hex)" stroke="#8D6E63" stroke-width="3.5"/><circle cx="817" cy="340" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/><circle cx="1097.6666666666667" cy="340" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/><circle cx="1027.5" cy="428.75" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/><circle cx="957.3333333333334" cy="517.5" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/><circle cx="1238" cy="517.5" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/><circle cx="887.1666666666666" cy="606.25" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/><circle cx="1097.6666666666667" cy="606.25" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/><circle cx="1167.8333333333333" cy="606.25" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/><circle cx="1238" cy="606.25" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/><circle cx="817" cy="695" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/><circle cx="1097.6666666666667" cy="695" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/><text x="1027.5" y="785" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#EF6C00" text-anchor="middle">do not transfer problems</text><rect x="455" y="825" width="490" height="65" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="473" y="858" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Shared reference</text><text x="473" y="887" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Healthy brood geometry and palette follow the existing</text><text x="473" y="907" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">HEALTHY_BROOD_REFERENCE master.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">A brood pattern or photograph alone cannot certify colony health. Investigate before transferring suspect material.</text></svg>