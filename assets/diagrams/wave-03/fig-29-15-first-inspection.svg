</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 29.15 — First Inspection</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Confirm establishment without turning one early inspection into excessive disturbance.</text>
<rect x="70" y="170" width="400" height="290" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Comb</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Straight usable comb; identify cross-comb</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">or damage.</text><rect x="322" y="327" width="116" height="116" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="3"/><rect x="500" y="170" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Eggs</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Fresh eggs support evidence of recent</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">laying.</text><rect x="752" y="327" width="116" height="116" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="3"/><rect x="930" y="170" width="400" height="290" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="948" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Queen status</text><text x="948" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use multiple signs; finding the queen is</text><text x="948" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">not always required.</text><path d="M 1244.2 382.06 C 1253.44 370.72,1266.88 373.24,1260.58 383.74 Z" fill="#D9EEF7" stroke="#5D4037" stroke-width="1"/><circle cx="1234.96" cy="385" r="4.62" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="1247.56" cy="385" rx="7.56" ry="5.88" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="1270.24" cy="385" rx="18.06" ry="5.46" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><line x1="1261.84" y1="380.8" x2="1261.84" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="1266.04" y1="380.8" x2="1266.04" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="1270.24" y1="380.8" x2="1270.24" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="1274.44" y1="380.8" x2="1274.44" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="1278.64" y1="380.8" x2="1278.64" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><rect x="70" y="495" width="400" height="290" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="88" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Stores</text><text x="88" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Check accessible carbohydrate and pollen</text><text x="88" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">reserves.</text><circle cx="352" cy="710" r="23" fill="#F3C85B" stroke="#8D6E63" stroke-width="2"/><circle cx="408" cy="710" r="23" fill="#D98C10" stroke="#8D6E63" stroke-width="2"/><rect x="500" y="495" width="400" height="290" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="518" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Feeder</text><text x="518" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Remove or adjust when no longer required;</text><text x="518" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">prevent leakage.</text><path d="M 810 655 Q 774 702 810 745 Q 846 702 810 655 Z" fill="#64B5F6" stroke="#1565C0" stroke-width="2"/><rect x="930" y="495" width="400" height="290" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="948" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Varroa</text><text x="948" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use an appropriate monitoring method, not</text><text x="948" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">visual guesswork alone.</text><rect x="1195" y="652" width="90" height="110" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/><line x1="1212" y1="680" x2="1268" y2="680" stroke="#1565C0" stroke-width="2"/><line x1="1212" y1="705" x2="1260" y2="705" stroke="#1565C0" stroke-width="2"/><line x1="1212" y1="730" x2="1268" y2="730" stroke="#1565C0" stroke-width="2"/><rect x="70" y="820" width="400" height="290" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="853" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Strength</text><text x="88" y="882" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Assess adult-bee coverage and brood</text><text x="88" y="902" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">relative to space.</text><path d="M 384.2 1032.06 C 393.44 1020.72,406.88 1023.24,400.58 1033.74 Z" fill="#D9EEF7" stroke="#5D4037" stroke-width="1"/><circle cx="374.96" cy="1035" r="4.62" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="387.56" cy="1035" rx="7.56" ry="5.88" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="405.2" cy="1035" rx="12.6" ry="5.46" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><line x1="396.8" y1="1030.8" x2="396.8" y2="1039.2" stroke="#5D4037" stroke-width="1.2"/><line x1="401" y1="1030.8" x2="401" y2="1039.2" stroke="#5D4037" stroke-width="1.2"/><line x1="405.2" y1="1030.8" x2="405.2" y2="1039.2" stroke="#5D4037" stroke-width="1.2"/><line x1="409.4" y1="1030.8" x2="409.4" y2="1039.2" stroke="#5D4037" stroke-width="1.2"/><line x1="413.59999999999997" y1="1030.8" x2="413.59999999999997" y2="1039.2" stroke="#5D4037" stroke-width="1.2"/><rect x="500" y="820" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="518" y="853" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Follow-up</text><text x="518" y="882" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Record findings and schedule only the next</text><text x="518" y="902" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">necessary action.</text><rect x="765" y="977" width="90" height="110" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/><line x1="782" y1="1005" x2="838" y2="1005" stroke="#1565C0" stroke-width="2"/><line x1="782" y1="1030" x2="830" y2="1030" stroke="#1565C0" stroke-width="2"/><line x1="782" y1="1055" x2="838" y2="1055" stroke="#1565C0" stroke-width="2"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Interpret multiple observations together; a single visual sign is not a complete diagnosis.</text></svg>