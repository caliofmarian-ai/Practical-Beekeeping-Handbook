<title id="title">Figure 30.1 — Resources Required for a Split</title><desc id="desc">Biological resources required to establish a viable split.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 30.1 — Resources Required for a Split</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">A split is a new colony unit, not merely a box of bees; it needs balanced biological resources.</text>
<rect x="70" y="170" width="400" height="290" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Adult bees</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Enough workers to cover brood and defend</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">the reduced unit.</text><path d="M 384.2 382.06 C 393.44 370.72,406.88 373.24,400.58 383.74 Z" fill="#D9EEF7" stroke="#5D4037" stroke-width="1"/><circle cx="374.96" cy="385" r="4.62" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="387.56" cy="385" rx="7.56" ry="5.88" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="405.2" cy="385" rx="12.6" ry="5.46" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><line x1="396.8" y1="380.8" x2="396.8" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="401" y1="380.8" x2="401" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="405.2" y1="380.8" x2="405.2" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="409.4" y1="380.8" x2="409.4" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="413.59999999999997" y1="380.8" x2="413.59999999999997" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><rect x="500" y="170" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Nurse bees</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Young workers are essential around open</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">brood and queen-rearing material.</text><path d="M 814.2 382.06 C 823.44 370.72,836.88 373.24,830.58 383.74 Z" fill="#D9EEF7" stroke="#5D4037" stroke-width="1"/><circle cx="804.96" cy="385" r="4.62" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="817.56" cy="385" rx="7.56" ry="5.88" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="835.2" cy="385" rx="12.6" ry="5.46" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><line x1="826.8000000000001" y1="380.8" x2="826.8000000000001" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="831" y1="380.8" x2="831" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="835.2" y1="380.8" x2="835.2" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="839.4000000000001" y1="380.8" x2="839.4000000000001" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="843.6" y1="380.8" x2="843.6" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><rect x="930" y="170" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="948" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Open + sealed brood</text><text x="948" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Balance immediate brood care with</text><text x="948" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">near-term worker emergence.</text><rect x="1182" y="327" width="116" height="116" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="3"/><rect x="70" y="495" width="400" height="290" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="88" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Food + pollen</text><text x="88" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Provide accessible stores without crowding</text><text x="88" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">the brood area.</text><circle cx="352" cy="710" r="23" fill="#F3C85B" stroke="#8D6E63" stroke-width="2"/><circle cx="408" cy="710" r="23" fill="#D98C10" stroke="#8D6E63" stroke-width="2"/><rect x="500" y="495" width="400" height="290" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="518" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Usable comb</text><text x="518" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Include suitable comb or space for</text><text x="518" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">controlled expansion.</text><rect x="752" y="652" width="116" height="116" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="3"/><rect x="930" y="495" width="400" height="290" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="948" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Queen plan</text><text x="948" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use a mated queen, protected queen cell or</text><text x="948" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">deliberate queenless-rearing plan.</text><path d="M 1226.25 655 Q 1220.75 674.25 1229 696.25 Q 1234.5 716.6 1240 730.9 Q 1245.5 716.6 1251 696.25 Q 1259.25 674.25 1253.75 655 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Quantities depend on season, climate, donor strength and the queen plan. Do not strip the donor below a viable population.</text></svg>