<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 26.1 — Natural and Supplemental Nutrition</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Natural forage is the nutritional foundation; supplemental feed is a temporary management tool for a defined</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">need.</text>
<rect x="590" y="390" width="220" height="230" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="582" y="374" width="236" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="610" y1="408" x2="610" y2="592" stroke="#8D6E63" stroke-width="1"/><line x1="670" y1="408" x2="670" y2="592" stroke="#8D6E63" stroke-width="1"/><line x1="730" y1="408" x2="730" y2="592" stroke="#8D6E63" stroke-width="1"/><line x1="790" y1="408" x2="790" y2="592" stroke="#8D6E63" stroke-width="1"/><rect x="664.8" y="608" width="70.4" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><path d="M 656.5 520.45 C 670.8 502.9,691.6 506.8,681.85 523.05 Z" fill="#D9EEF7" stroke="#5D4037" stroke-width="1"/><circle cx="642.2" cy="525" r="7.15" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="661.7" cy="525" rx="11.700000000000001" ry="9.1" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="689" cy="525" rx="19.5" ry="8.450000000000001" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><line x1="676" y1="518.5" x2="676" y2="531.5" stroke="#5D4037" stroke-width="1.2"/><line x1="682.5" y1="518.5" x2="682.5" y2="531.5" stroke="#5D4037" stroke-width="1.2"/><line x1="689" y1="518.5" x2="689" y2="531.5" stroke="#5D4037" stroke-width="1.2"/><line x1="695.5" y1="518.5" x2="695.5" y2="531.5" stroke="#5D4037" stroke-width="1.2"/><line x1="702" y1="518.5" x2="702" y2="531.5" stroke="#5D4037" stroke-width="1.2"/><rect x="65" y="180" width="395" height="180" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="83" y="213" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Nectar / honey</text><text x="83" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Natural carbohydrate energy and stored</text><text x="83" y="262" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">reserves.</text><line x1="460" y1="270" x2="590" y2="505" stroke="#8D6E63" stroke-width="3" marker-end="url(#ab)"/><rect x="940" y="180" width="395" height="180" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="958" y="213" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Water</text><text x="958" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Dilution, brood-food preparation and</text><text x="958" y="262" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">evaporative cooling.</text><line x1="940" y1="270" x2="810" y2="505" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="65" y="620" width="395" height="180" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="83" y="653" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Pollen / bee bread</text><text x="83" y="682" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Natural protein, lipid, vitamin and</text><text x="83" y="702" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">mineral source.</text><line x1="460" y1="710" x2="590" y2="505" stroke="#2E7D32" stroke-width="3" marker-end="url(#ab)"/><rect x="940" y="620" width="395" height="180" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="958" y="653" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Supplemental feed</text><text x="958" y="682" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Syrup or protein feed only when colony</text><text x="958" y="702" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">need and conditions justify it.</text><line x1="940" y1="710" x2="810" y2="505" stroke="#EF6C00" stroke-width="3" marker-end="url(#ab)"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Feeding should not mask poor forage, queen failure, disease, parasite pressure or unsuitable apiary conditions.</text></svg>