<title id="title">Figure 26.1 — Natural and Supplemental Nutrition</title><desc id="desc">Natural forage and temporary supplemental nutrition inputs shown around a managed colony.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
