<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 29.10 — Installing the Swarm</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Different installation methods share the same goals: transfer the queen and workers safely into a prepared hive.</text>
<rect x="70" y="170" width="400" height="290" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Shaking installation</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Create central frame space, transfer</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">gently and replace frames without crushing</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">bees.</text><rect x="325" y="335" width="110" height="105" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="317" y="319" width="126" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="345" y1="353" x2="345" y2="412" stroke="#8D6E63" stroke-width="1"/><line x1="368.3333333333333" y1="353" x2="368.3333333333333" y2="412" stroke="#8D6E63" stroke-width="1"/><line x1="391.6666666666667" y1="353" x2="391.6666666666667" y2="412" stroke="#8D6E63" stroke-width="1"/><line x1="415" y1="353" x2="415" y2="412" stroke="#8D6E63" stroke-width="1"/><rect x="362.4" y="428" width="35.2" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><rect x="500" y="170" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Marching installation</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Allow bees to enter a prepared hive via an</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">entrance/ramp while watching orientation</text><text x="518" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">behaviour.</text><rect x="755" y="335" width="110" height="105" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="747" y="319" width="126" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="775" y1="353" x2="775" y2="412" stroke="#8D6E63" stroke-width="1"/><line x1="798.3333333333334" y1="353" x2="798.3333333333334" y2="412" stroke="#8D6E63" stroke-width="1"/><line x1="821.6666666666666" y1="353" x2="821.6666666666666" y2="412" stroke="#8D6E63" stroke-width="1"/><line x1="845" y1="353" x2="845" y2="412" stroke="#8D6E63" stroke-width="1"/><rect x="792.4" y="428" width="35.2" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><rect x="930" y="170" width="400" height="290" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="948" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Queen-cage installation</text><text x="948" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">When a caged queen is involved, secure</text><text x="948" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">access and follow the appropriate release</text><text x="948" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">protocol.</text><path d="M 1226.25 330 Q 1220.75 349.25 1229 371.25 Q 1234.5 391.6 1240 405.9 Q 1245.5 391.6 1251 371.25 Q 1259.25 349.25 1253.75 330 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Choose the method according to swarm condition, queen status, weather and equipment; avoid crushing, overheating and escape.</text></svg>