<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 32.3 — Breeder-Colony Selection</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Select on documented performance across time, not appearance on one inspection.</text>
<rect x="70" y="170" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Repeated health</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Consistently healthy brood and manageable</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">parasite/disease history.</text><rect x="322" y="327" width="116" height="116" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="3"/><rect x="500" y="170" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Temperament</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Select for behaviour appropriate to the</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">operation and public setting.</text><path d="M 814.2 382.06 C 823.44 370.72,836.88 373.24,830.58 383.74 Z" fill="#D9EEF7" stroke="#5D4037" stroke-width="1"/><circle cx="804.96" cy="385" r="4.62" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="817.56" cy="385" rx="7.56" ry="5.88" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><ellipse cx="835.2" cy="385" rx="12.6" ry="5.46" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/><line x1="826.8000000000001" y1="380.8" x2="826.8000000000001" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="831" y1="380.8" x2="831" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="835.2" y1="380.8" x2="835.2" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="839.4000000000001" y1="380.8" x2="839.4000000000001" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><line x1="843.6" y1="380.8" x2="843.6" y2="389.2" stroke="#5D4037" stroke-width="1.2"/><rect x="930" y="170" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="948" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Winter survival</text><text x="948" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use multi-season records rather than one</text><text x="948" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">mild winter.</text><rect x="1195" y="327" width="90" height="110" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/><line x1="1212" y1="355" x2="1268" y2="355" stroke="#1565C0" stroke-width="2"/><line x1="1212" y1="380" x2="1260" y2="380" stroke="#1565C0" stroke-width="2"/><line x1="1212" y1="405" x2="1268" y2="405" stroke="#1565C0" stroke-width="2"/><rect x="70" y="495" width="400" height="290" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Productive fit</text><text x="88" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Select productivity that suits the local</text><text x="88" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">environment and management goal.</text><rect x="335" y="652" width="90" height="110" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/><line x1="352" y1="680" x2="408" y2="680" stroke="#1565C0" stroke-width="2"/><line x1="352" y1="705" x2="400" y2="705" stroke="#1565C0" stroke-width="2"/><line x1="352" y1="730" x2="408" y2="730" stroke="#1565C0" stroke-width="2"/><rect x="500" y="495" width="400" height="290" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="518" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Swarm tendency</text><text x="518" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Avoid preserving an excessive swarm</text><text x="518" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">tendency when that conflicts with the</text><text x="518" y="597" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">breeding objective.</text><path d="M 796.25 655 Q 790.75 674.25 799 696.25 Q 804.5 716.6 810 730.9 Q 815.5 716.6 821 696.25 Q 829.25 674.25 823.75 655 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><rect x="930" y="495" width="400" height="290" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="948" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Reject unresolved problems</text><text x="948" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Do not breed from colonies with</text><text x="948" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">unexplained disease, chronic queen failure</text><text x="948" y="597" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">or weak records.</text><rect x="1182" y="652" width="116" height="116" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="3"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Breeding goals vary by region and operation. Keep health screening, Varroa control and traceable records.</text></svg>