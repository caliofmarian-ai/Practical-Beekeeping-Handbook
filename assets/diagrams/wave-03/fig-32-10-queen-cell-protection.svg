<title id="title">Figure 32.10 — Queen-Cell Protection</title><desc id="desc">Correct and damaging queen-cell handling compared.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 32.10 — Queen-Cell Protection</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Developing queen cells are living brood; keep handling gentle, stable and appropriate to developmental stage.</text>
<rect x="70" y="170" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Correct: upright handling</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Maintain normal orientation and avoid</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">abrupt movement.</text><path d="M 366.25 330 Q 360.75 349.25 369 371.25 Q 374.5 391.6 380 405.9 Q 385.5 391.6 391 371.25 Q 399.25 349.25 393.75 330 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><rect x="500" y="170" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Correct: protected transport</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use suitable insulation and a stable</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">holder for the journey and cell stage.</text><path d="M 796.25 330 Q 790.75 349.25 799 371.25 Q 804.5 391.6 810 405.9 Q 815.5 391.6 821 371.25 Q 829.25 349.25 823.75 330 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><rect x="930" y="170" width="400" height="290" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="948" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Avoid inversion / shaking</text><text x="948" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Mechanical shock and inappropriate</text><text x="948" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">orientation can damage the developing</text><text x="948" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">queen.</text><path d="M 1226.25 330 Q 1220.75 349.25 1229 371.25 Q 1234.5 391.6 1240 405.9 Q 1245.5 391.6 1251 371.25 Q 1259.25 349.25 1253.75 330 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><rect x="70" y="495" width="400" height="290" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="88" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Avoid direct sun / overheating</text><text x="88" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Protect cells from temperature extremes</text><text x="88" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and desiccation.</text><path d="M 366.25 655 Q 360.75 674.25 369 696.25 Q 374.5 716.6 380 730.9 Q 385.5 716.6 391 696.25 Q 399.25 674.25 393.75 655 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Exact transport temperature, duration and manipulation windows depend on validated queen-rearing practice and cell age.</text></svg>