<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 27.12 — Winter Feeding Decision Chart</title><desc id="desc">Winter feeding and starvation-prevention decision sequence.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 27.12 — Winter Feeding Decision Chart</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Emergency feeding begins with colony viability and food accessibility, not simply with adding sugar.</text>
<rect x="230" y="155" width="940" height="65" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="248" y="188" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">1. Alive and viable?</text><text x="248" y="217" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Confirm the colony can realistically benefit from intervention.</text><line x1="700" y1="220" x2="700" y2="240" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="244" width="940" height="65" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="248" y="277" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">2. Stores sufficient?</text><text x="248" y="306" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Estimate reserves using low-disturbance methods.</text><line x1="700" y1="309" x2="700" y2="329" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="333" width="940" height="65" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="248" y="366" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">3. Stores accessible?</text><text x="248" y="395" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Food can exist in the hive yet remain outside cluster reach.</text><line x1="700" y1="398" x2="700" y2="418" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="422" width="940" height="65" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="248" y="455" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">4. If adequate, monitor</text><text x="248" y="484" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Do not feed automatically when reserves are sufficient and reachable.</text><line x1="700" y1="487" x2="700" y2="507" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="511" width="940" height="65" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="248" y="544" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">5. Can liquid feed be processed?</text><text x="248" y="573" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Weather and colony condition determine whether liquid feeding is suitable.</text><line x1="700" y1="576" x2="700" y2="596" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="600" width="940" height="65" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="248" y="633" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">6. Use solid emergency feed if needed</text><text x="248" y="662" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Place an appropriate solid feed close to cluster reach.</text><line x1="700" y1="665" x2="700" y2="685" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="689" width="940" height="65" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="248" y="722" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">7. Check other failures</text><text x="248" y="751" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Queen loss, disease, Varroa or moisture are not corrected by sugar alone.</text><line x1="700" y1="754" x2="700" y2="774" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="778" width="940" height="65" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="248" y="811" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">8. Recheck minimally</text><text x="248" y="840" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Confirm feed position and consumption without repeated dismantling.</text><line x1="700" y1="843" x2="700" y2="863" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="867" width="940" height="65" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="248" y="900" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">9. Return to spring management</text><text x="248" y="929" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Transition when conditions permit.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">The chart deliberately avoids a universal hive-weight, temperature or calendar threshold.</text></svg>