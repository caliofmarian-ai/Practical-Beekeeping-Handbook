<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 26.7 — Feeding Decision Flow</title><desc id="desc">Purpose-specific feeding decision sequence.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 26.7 — Feeding Decision Flow</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Feed only for a defined purpose after checking colony viability, health, harvest separation and feeder safety.</text>
<rect x="230" y="155" width="940" height="65" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="248" y="188" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">1. Define the need</text><text x="248" y="217" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">If there is no clear objective, do not feed automatically.</text><line x1="700" y1="220" x2="700" y2="240" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="244" width="940" height="65" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="248" y="277" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">2. Check colony status</text><text x="248" y="306" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Confirm queen status, viability and signs needing diagnosis.</text><line x1="700" y1="309" x2="700" y2="329" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="333" width="940" height="65" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="248" y="366" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">3. Identify feed need</text><text x="248" y="395" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Carbohydrate, protein or another management correction?</text><line x1="700" y1="398" x2="700" y2="418" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="422" width="940" height="65" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="248" y="455" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">4. Protect saleable honey</text><text x="248" y="484" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Harvestable supers must be absent and records clear.</text><line x1="700" y1="487" x2="700" y2="507" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="511" width="940" height="65" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="248" y="544" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">5. Choose feeder</text><text x="248" y="573" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use a defensible feeder with low leakage/drowning risk.</text><line x1="700" y1="576" x2="700" y2="596" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="600" width="940" height="65" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="248" y="633" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">6. Match feed to purpose</text><text x="248" y="662" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Form, concentration and quantity depend on need and conditions.</text><line x1="700" y1="665" x2="700" y2="685" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="689" width="940" height="65" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="248" y="722" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">7. Monitor response</text><text x="248" y="751" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Watch uptake, robbing, fermentation and brood restriction.</text><line x1="700" y1="754" x2="700" y2="774" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="778" width="940" height="65" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="248" y="811" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">8. Reassess objective</text><text x="248" y="840" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Continue only while the defined purpose remains valid.</text><line x1="700" y1="843" x2="700" y2="863" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="230" y="867" width="940" height="65" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="248" y="900" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">9. Stop and record</text><text x="248" y="929" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Remove feeder and close the feeding record.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">No universal quantity or calendar rule is shown: feeding is purpose-, colony- and condition-specific.</text></svg>