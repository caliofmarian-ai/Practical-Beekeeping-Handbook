<title id="title">Figure 28.5 — Queen-Cell Types</title><desc id="desc">Swarm, supersedure and emergency queen-cell contexts compared.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 28.5 — Queen-Cell Types</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Queen-cell position is a clue, not a diagnosis. Interpret number, age, queen status, brood and colony history</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">together.</text>
<rect x="90" y="170" width="390" height="180" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="108" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Swarm-cell context</text><text x="108" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Often numerous and commonly near lower</text><text x="108" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">margins, but position alone is not</text><text x="108" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">diagnostic.</text><path d="M 185 405 Q 179 426 188 450 Q 194 472.2 200 487.8 Q 206 472.2 212 450 Q 221 426 215 405 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><path d="M 240 425 Q 234 446 243 470 Q 249 492.2 255 507.8 Q 261 492.2 267 470 Q 276 446 270 425 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><path d="M 295 405 Q 289 426 298 450 Q 304 472.2 310 487.8 Q 316 472.2 322 450 Q 331 426 325 405 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><path d="M 350 425 Q 344 446 353 470 Q 359 492.2 365 507.8 Q 371 492.2 377 470 Q 386 446 380 425 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><rect x="135" y="650" width="300" height="110" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="2.5"/><rect x="505" y="170" width="390" height="180" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="523" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Supersedure context</text><text x="523" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Often fewer and commonly on the comb</text><text x="523" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">face; queen performance and history</text><text x="523" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">matter.</text><path d="M 600 405 Q 594 426 603 450 Q 609 472.2 615 487.8 Q 621 472.2 627 450 Q 636 426 630 405 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><path d="M 655 425 Q 649 446 658 470 Q 664 492.2 670 507.8 Q 676 492.2 682 470 Q 691 446 685 425 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><rect x="550" y="650" width="300" height="110" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="2.5"/><rect x="920" y="170" width="390" height="180" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="938" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Emergency context</text><text x="938" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Built around worker larvae after queen</text><text x="938" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">loss where suitable young larvae</text><text x="938" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">exist.</text><path d="M 1015 405 Q 1009 426 1018 450 Q 1024 472.2 1030 487.8 Q 1036 472.2 1042 450 Q 1051 426 1045 405 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><path d="M 1070 425 Q 1064 446 1073 470 Q 1079 492.2 1085 507.8 Q 1091 492.2 1097 470 Q 1106 446 1100 425 Z" fill="#C69C5D" stroke="#8D6E63" stroke-width="2.2"/><rect x="965" y="650" width="300" height="110" rx="6" fill="url(#hex)" stroke="#8D6E63" stroke-width="2.5"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Do not destroy queen cells reflexively. First determine what the colony is doing.</text></svg>