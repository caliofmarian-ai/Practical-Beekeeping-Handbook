<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 7.4 — Caste Development Comparison</title>
<desc id="desc">Queen, worker and drone development compared by fertilisation status, cell type and approximate total time to adult emergence.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 7.4 — Caste Development Comparison</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Developmental nutrition determines queen versus worker among fertilised female eggs; drones are haploid males from unfertilised eggs.</text>
<rect x="60" y="170" width="220" height="70" rx="10" fill="#F5F5F5" stroke="#757575" stroke-width="2"/>
<text x="170.0" y="212" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">Caste</text>
