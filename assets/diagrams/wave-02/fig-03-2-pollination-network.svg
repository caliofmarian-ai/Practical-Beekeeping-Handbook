<text x="760" y="244" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">managed + feral</text>
<circle cx="1040" cy="340" r="80" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
<text x="1040" y="337" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2E7D32" text-anchor="middle">Wild bees</text>
<text x="1040" y="364" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">diverse taxa</text>
<circle cx="1040" cy="590" r="80" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
<text x="1040" y="587" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1565C0" text-anchor="middle">Hoverflies</text>
<text x="1040" y="614" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">important in many systems</text>
<circle cx="760" cy="740" r="80" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/>
<text x="760" y="737" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#6A1B9A" text-anchor="middle">Butterflies / moths</text>
<text x="760" y="764" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">context-dependent</text>
