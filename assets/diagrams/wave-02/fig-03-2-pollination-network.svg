<title id="title">Figure 3.2 — Pollination Is a Network</title>
<desc id="desc">Network linking flowering crops and wild plants to honey bees and several wild-pollinator groups, showing that honey bees are important but not the only pollinators.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
