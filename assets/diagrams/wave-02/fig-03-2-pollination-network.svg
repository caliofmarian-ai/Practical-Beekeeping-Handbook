<rect x="55" y="865" width="1290" height="80" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="78" y="894" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">Managed honey bees can be valuable crop pollinators, but pollinator abundance is not the same as pollinator biodiversity. Conservation should include diverse wild pollinator groups.</text>
</svg>
