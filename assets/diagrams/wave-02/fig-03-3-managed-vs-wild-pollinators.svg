<circle cx="1120" cy="390" r="9.9" fill="#F4C542"/>
<ellipse cx="880" cy="510" rx="13.299999999999999" ry="9.45" fill="#E0A419" stroke="#5D4037" stroke-width="0.7"/>
<ellipse cx="904.5" cy="510" rx="16.099999999999998" ry="8.399999999999999" fill="#E0A419" stroke="#5D4037" stroke-width="0.7"/>
<circle cx="863.2" cy="510" r="7.699999999999999" fill="#E0A419" stroke="#5D4037" stroke-width="0.7"/>
<line x1="895.75" y1="501.6" x2="895.75" y2="518.4" stroke="#5D4037" stroke-width="1.0499999999999998"/>
<line x1="904.5" y1="501.6" x2="904.5" y2="518.4" stroke="#5D4037" stroke-width="1.0499999999999998"/>
<line x1="913.25" y1="501.6" x2="913.25" y2="518.4" stroke="#5D4037" stroke-width="1.0499999999999998"/>
<path d="M 878.25 503.7 C 885.25 485.5 902.75 487.25 896.8 504.75 Z" fill="#D9EEF7" opacity="0.8" stroke="#8AB8C8" stroke-width="0.5249999999999999"/>
<ellipse cx="1060" cy="520" rx="24" ry="14" fill="#6A8FB3"/><path d="M1035 512 Q1000 470 1018 450" fill="none" stroke="#9CCCE2" stroke-width="5"/><path d="M1085 512 Q1120 470 1102 450" fill="none" stroke="#9CCCE2" stroke-width="5"/>
<path d="M1180 500 Q1140 455 1120 500 Q1140 545 1180 500 Q1220 455 1240 500 Q1220 545 1180 500" fill="#D98CDB" stroke="#7B4A7A" stroke-width="2"/>
<text x="765" y="650" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#1F2933" text-anchor="start">• conserve nesting sites, host plants and landscape diversity</text>
<text x="765" y="677" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#1F2933" text-anchor="start">• avoid assuming one managed species replaces wild diversity</text>
<text x="765" y="704" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#1F2933" text-anchor="start">• habitat and pesticide risk operate at landscape scale</text>
<rect x="55" y="865" width="1290" height="80" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="78" y="894" font-family="Arial,Helvetica,sans-serif" font-size="17.0" font-weight="600" fill="#1F2933" text-anchor="start"><tspan x="78" dy="0">A good pollinator strategy can support both responsible managed-bee husbandry and wild-pollinator habitat without treating them as</tspan><tspan x="78" dy="20.7">interchangeable.</tspan></text>
</svg>
