<title id="title">Figure 3.3 — Managed Bees Versus Wild Pollinator Conservation</title>
<desc id="desc">Side-by-side distinction between livestock management of Apis mellifera and conservation of diverse wild bee, hoverfly and butterfly communities.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 3.3 — Managed Bees Versus Wild Pollinator Conservation</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Managed-colony health and wild-pollinator conservation are related but different objectives.</text>
<rect x="55" y="160" width="620" height="650" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="73" y="191" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">Managed honey bees — livestock management</text>
<rect x="145" y="285" width="250" height="300" rx="8" fill="#F6E3B4" stroke="#8D6E63" stroke-width="5"/>
<rect x="130" y="250" width="280" height="38" fill="#D6C6A0" stroke="#8D6E63" stroke-width="4"/>
<rect x="160" y="585" width="220" height="24" fill="#D6C6A0" stroke="#8D6E63" stroke-width="4"/>
<ellipse cx="470" cy="350" rx="22.8" ry="16.2" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/>
<ellipse cx="512.0" cy="350" rx="27.599999999999998" ry="14.399999999999999" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/>
<circle cx="441.2" cy="350" r="13.2" fill="#E0A419" stroke="#5D4037" stroke-width="1.2"/>
<line x1="497.0" y1="335.6" x2="497.0" y2="364.4" stroke="#5D4037" stroke-width="1.7999999999999998"/>
<line x1="512.0" y1="335.6" x2="512.0" y2="364.4" stroke="#5D4037" stroke-width="1.7999999999999998"/>
<line x1="527.0" y1="335.6" x2="527.0" y2="364.4" stroke="#5D4037" stroke-width="1.7999999999999998"/>
<path d="M 467.0 339.2 C 479.0 308.0 509.0 311.0 498.8 341.0 Z" fill="#D9EEF7" opacity="0.8" stroke="#8AB8C8" stroke-width="0.8999999999999999"/>
<text x="95" y="650" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#1F2933" text-anchor="start">• beekeeper controls housing, movement and treatments</text>
<text x="95" y="677" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#1F2933" text-anchor="start">• colony health, Varroa and food production are managed</text>
<text x="95" y="704" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#1F2933" text-anchor="start">• stocking density and forage competition still matter</text>
<rect x="725" y="160" width="620" height="650" rx="18" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="743" y="191" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2E7D32" text-anchor="start">Wild pollinators — biodiversity conservation</text>
