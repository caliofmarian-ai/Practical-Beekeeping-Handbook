<rect x="1020" y="210" width="300" height="510" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="1038" y="241" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">Three body regions</text>
<text x="1045" y="270" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">HEAD</text>
<text x="1045" y="293" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">sensory input + feeding structures</text>
<text x="1045" y="316" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start"></text>
<text x="1045" y="339" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">THORAX</text>
<text x="1045" y="362" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">wings + three pairs of legs</text>
<text x="1045" y="385" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start"></text>
<text x="1045" y="408" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">ABDOMEN</text>
<text x="1045" y="431" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">digestive/reproductive systems,</text>
<text x="1045" y="454" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">wax glands, sting apparatus</text>
<rect x="55" y="885" width="1290" height="80" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="78" y="914" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">External structures are linked to function: sensing and feeding at the head, locomotion at the thorax, and major digestive/reproductive/defensive systems in the abdomen.</text>
</svg>
