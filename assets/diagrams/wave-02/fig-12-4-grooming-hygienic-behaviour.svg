<text x="765" y="665" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">workers detect abnormal/dead brood</text>
<text x="765" y="692" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">cell is uncapped and brood removed</text>
<text x="765" y="719" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">trait can reduce disease/parasite reproduction</text>
<rect x="55" y="865" width="1290" height="80" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="78" y="894" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">Hygienic behaviour can reduce disease expression but does not make a colony immune or cancel monitoring/reporting obligations.</text>
