<text x="95" y="665" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">self-grooming removes particles/parasites</text>
<text x="95" y="692" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">allogrooming = workers groom nestmates</text>
<text x="95" y="719" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">effectiveness varies among stocks and context</text>
