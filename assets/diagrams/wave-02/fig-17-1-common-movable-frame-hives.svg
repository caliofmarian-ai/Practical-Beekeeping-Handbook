<title id="title">Figure 17.1 — Common Movable-Frame Hive Families</title>
<desc id="desc">Representative modular hive-family silhouettes for Langstroth, National, Dadant and another regional modular system, with proportions labelled as illustrative rather than interchangeable dimensions.</desc>
