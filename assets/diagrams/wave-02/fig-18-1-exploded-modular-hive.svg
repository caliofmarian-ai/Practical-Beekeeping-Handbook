<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 18.1 — Exploded Modular Hive</title>
<desc id="desc">Exploded modular hive showing roof, inner cover, honey supers, optional queen excluder, brood box, floor, entrance and stand.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
</defs>
<rect width="1400" height="1000" fill="#fff"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 18.1 — Exploded Modular Hive</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Component order shown for a common vertical modular concept; exact dimensions belong to the chosen hive standard.</text>
<rect x="330" y="170" width="420" height="40" rx="4" fill="#CFBE9A" stroke="#8D6E63" stroke-width="3"/>
<text x="770" y="196.0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="start">Roof</text>
<rect x="330" y="235" width="420" height="35" rx="4" fill="#EEE1C6" stroke="#8D6E63" stroke-width="3"/>
<text x="770" y="258.5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="start">Inner/crown cover</text>
<rect x="330" y="295" width="420" height="100" rx="4" fill="#D9B57C" stroke="#8D6E63" stroke-width="3"/>
<text x="770" y="351.0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="start">Honey super</text>
<rect x="330" y="420" width="420" height="100" rx="4" fill="#D9B57C" stroke="#8D6E63" stroke-width="3"/>
<text x="770" y="476.0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="start">Honey super</text>
<rect x="330" y="545" width="420" height="25" rx="4" fill="#B0BEC5" stroke="#8D6E63" stroke-width="3"/>
<text x="770" y="563.5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="start">Queen excluder — optional</text>
<rect x="330" y="595" width="420" height="170" rx="4" fill="#CFA46A" stroke="#8D6E63" stroke-width="3"/>
<text x="770" y="686.0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="start">Brood box</text>
<rect x="330" y="790" width="420" height="35" rx="4" fill="#BFA376" stroke="#8D6E63" stroke-width="3"/>
<text x="770" y="813.5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="start">Floor</text>
<rect x="330" y="850" width="420" height="55" rx="4" fill="#8D6E63" stroke="#8D6E63" stroke-width="3"/>
<text x="770" y="883.5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="start">Stand</text>
<rect x="485" y="815" width="110" height="16" fill="#3A2D24"/>
<text x="770" y="832" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#C62828" text-anchor="start">entrance</text>
<rect x="975" y="180" width="330" height="560" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="993" y="211" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">Functional layers</text>
<text x="1000" y="240" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">Weather protection</text>
<text x="1000" y="265" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">roof + cover</text>
<text x="1000" y="290" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start"></text>
<text x="1000" y="315" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">Crop space</text>
<text x="1000" y="340" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">honey supers</text>
<text x="1000" y="365" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start"></text>
<text x="1000" y="390" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">Brood nest</text>
<text x="1000" y="415" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">brood box</text>
<text x="1000" y="440" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start"></text>
<text x="1000" y="465" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">Optional control</text>
<text x="1000" y="490" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">queen excluder where used</text>
<text x="1000" y="515" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start"></text>
<text x="1000" y="540" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">Base / entrance</text>
<text x="1000" y="565" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">floor + stand</text>
<rect x="55" y="875" width="1290" height="80" rx="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="78" y="904" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">A queen excluder is a management tool, not an essential component of every hive. Do not mix component dimensions from incompatible hive standards.</text>
</svg>
