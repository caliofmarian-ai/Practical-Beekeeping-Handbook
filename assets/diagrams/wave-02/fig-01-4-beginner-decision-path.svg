<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 1.4 — Beginner Decision Path</title>
<desc id="desc">Beginner beekeeping path from learning biology through equipment, site, healthy bees, systematic inspection, health monitoring, surplus harvest and records.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 1.4 — Beginner Decision Path</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">A reliable beginner sequence puts biology and safety before honey yield.</text>
<rect x="70" y="180" width="280" height="190" rx="18" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="88" y="211" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2E7D32" text-anchor="start">1 Learn biology</text>
<text x="88" y="255" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">understand colony, brood, food and season</text>
<line x1="350" y1="275" x2="385" y2="275" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="395" y="180" width="280" height="190" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="413" y="211" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">2 Obtain safe equipment</text>
<text x="413" y="255" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">hive system, PPE, smoker/tools</text>
<line x1="675" y1="275" x2="710" y2="275" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="720" y="180" width="280" height="190" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="738" y="211" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">3 Select a site</text>
<text x="738" y="255" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">access, flight path, water, forage, safety</text>
<line x1="1000" y1="275" x2="1035" y2="275" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="1045" y="180" width="280" height="190" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="1063" y="211" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">4 Acquire healthy bees</text>
<text x="1063" y="255" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">traceable source and health baseline</text>
<line x1="1185" y1="370" x2="1185" y2="455" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="70" y="480" width="280" height="190" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="88" y="511" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">5 Inspect systematically</text>
<text x="88" y="555" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">answer defined questions, avoid over-opening</text>
<line x1="350" y1="575" x2="385" y2="575" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="395" y="480" width="280" height="190" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="413" y="511" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">6 Monitor health</text>
<text x="413" y="555" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">Varroa, disease signs, food and queen status</text>
<line x1="675" y1="575" x2="710" y2="575" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="720" y="480" width="280" height="190" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="738" y="511" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">7 Harvest only surplus</text>
<text x="738" y="555" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">ripeness + colony stores + food safety</text>
<line x1="1000" y1="575" x2="1035" y2="575" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="1045" y="480" width="280" height="190" rx="18" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="1063" y="511" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2E7D32" text-anchor="start">8 Keep records</text>
<text x="1063" y="555" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">actions, results, treatments, follow-up</text>
<rect x="55" y="835" width="1290" height="80" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="78" y="864" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">The path is iterative: records from inspections and monitoring feed back into better decisions rather than a one-way march toward harvest.</text>
</svg>
