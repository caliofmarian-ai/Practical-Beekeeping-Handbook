<rect x="870" y="430" width="170" height="140" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/>
<text x="955.0" y="505" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#1F2933" text-anchor="middle">often practical</text>
