<text x="485.0" y="675" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#1F2933" text-anchor="middle">bar-by-bar</text>
<rect x="560" y="600" width="150" height="140" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.8"/>
<text x="635.0" y="675" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#1F2933" text-anchor="middle">not typical</text>
<rect x="710" y="600" width="160" height="140" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.8"/>
<text x="790.0" y="675" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#1F2933" text-anchor="middle">often not centrifugal</text>
<rect x="870" y="600" width="170" height="140" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.8"/>
<text x="955.0" y="675" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#1F2933" text-anchor="middle">central design feature</text>
<rect x="1040" y="600" width="210" height="140" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.8"/>
<text x="1145.0" y="675" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#1F2933" text-anchor="middle">region-dependent</text>
<rect x="55" y="865" width="1290" height="80" rx="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="78" y="894" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">A 'best hive' claim is incomplete unless it states the management goal, beekeeper constraints, climate, frame standard and local supply chain.</text>
