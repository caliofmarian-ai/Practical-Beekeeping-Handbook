<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 18.2 — Frame Spacing and Bee Space</title>
<desc id="desc">Cross-section contrasting workable bee-space passage with excess spacing that invites brace/burr comb and too-narrow gaps that bees may propolise.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 18.2 — Frame Spacing and Bee Space</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Bee space is a functional gap concept; exact target dimensions depend on the hive standard and local equipment tolerances.</text>
<rect x="55" y="170" width="390" height="630" rx="18" fill="#FFEBEE" stroke="#C62828" stroke-width="2.5"/>
<text x="73" y="201" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#C62828" text-anchor="start">Too narrow</text>
<rect x="100" y="330" width="105" height="330" rx="4" fill="#D9B57C" stroke="#8D6E63" stroke-width="4"/>
<rect x="250" y="330" width="105" height="330" rx="4" fill="#D9B57C" stroke="#8D6E63" stroke-width="4"/>
<line x1="205" y1="285" x2="250" y2="285" stroke="#1565C0" stroke-width="4"/>
<text x="227.5" y="265" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1565C0" text-anchor="middle">gap</text>
<path d="M205 490 C220 460 225 520 250 490" fill="none" stroke="#7A4D31" stroke-width="12"/>
<text x="85" y="710" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">propolising / restricted passage</text>
<rect x="495" y="170" width="390" height="630" rx="18" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="513" y="201" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2E7D32" text-anchor="start">Functional bee-space range</text>
<rect x="540" y="330" width="105" height="330" rx="4" fill="#D9B57C" stroke="#8D6E63" stroke-width="4"/>
<rect x="740" y="330" width="105" height="330" rx="4" fill="#D9B57C" stroke="#8D6E63" stroke-width="4"/>
<line x1="645" y1="285" x2="740" y2="285" stroke="#1565C0" stroke-width="4"/>
<text x="692.5" y="265" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1565C0" text-anchor="middle">gap</text>
<text x="525" y="710" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">passage maintained</text>
<rect x="935" y="170" width="390" height="630" rx="18" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="953" y="201" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#EF6C00" text-anchor="start">Too wide</text>
<rect x="980" y="330" width="105" height="330" rx="4" fill="#D9B57C" stroke="#8D6E63" stroke-width="4"/>
<rect x="1250" y="330" width="105" height="330" rx="4" fill="#D9B57C" stroke="#8D6E63" stroke-width="4"/>
<line x1="1085" y1="285" x2="1250" y2="285" stroke="#1565C0" stroke-width="4"/>
<text x="1167.5" y="265" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1565C0" text-anchor="middle">gap</text>
<path d="M1085 480 Q1160 410 1250 480 Q1160 560 1085 480" fill="#F4E7A1" stroke="#8D6E63" stroke-width="3"/>
<text x="965" y="710" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">brace/burr comb likely</text>
<rect x="55" y="865" width="1290" height="80" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="78" y="894" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">Use the frame and box dimensions specified for your hive family. This figure teaches the consequence of bad spacing, not a universal millimetre value.</text>
</svg>
