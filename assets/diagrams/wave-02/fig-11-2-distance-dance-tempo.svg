<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 11.2 — Distance and Dance Tempo Concept</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">The dance encodes distance continuously; exact calibration varies with terrain, wind and experimental context.</text>
