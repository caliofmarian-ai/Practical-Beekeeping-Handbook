<text x="78" y="909" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">This cutaway is schematic. Brood, pollen and honey are organised dynamically and should not be read as fixed to these exact positions.</text>
