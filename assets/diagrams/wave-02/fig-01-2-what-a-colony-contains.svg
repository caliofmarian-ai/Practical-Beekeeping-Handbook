<text x="815" y="755" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">Colony = queen, workers, drones when present, brood and stores.</text>
<text x="815" y="777" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">Hive = the physical housing and removable equipment.</text>
