<text x="1025" y="240" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">Hypopharyngeal glands</text>
<text x="1025" y="263" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">brood food + enzymes</text>
