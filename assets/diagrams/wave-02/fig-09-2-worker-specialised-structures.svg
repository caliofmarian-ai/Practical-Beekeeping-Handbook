<text x="1025" y="447" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">Nasonov gland</text>
<text x="1025" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">orientation/aggregation signal</text>
