<rect x="785" y="155" width="250" height="700" rx="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/>
<text x="803" y="186" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#6A1B9A" text-anchor="start">House functions</text>
<text x="815" y="235" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">nectar processing</text>
<text x="815" y="269" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">nurse feeding</text>
<text x="815" y="303" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">wax secretion</text>
<text x="815" y="337" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">fanning / water use</text>
<text x="815" y="371" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">propolis placement</text>
<line x1="1035" y1="500" x2="1110" y2="500" stroke="#2E7D32" stroke-width="4" marker-end="url(#ag)"/>
<rect x="1125" y="155" width="220" height="700" rx="18" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="1143" y="186" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2E7D32" text-anchor="start">Outputs</text>
<text x="1150" y="235" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">brood growth</text>
<text x="1150" y="269" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">honey stores</text>
<text x="1150" y="303" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">bee bread</text>
<text x="1150" y="337" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">comb</text>
<text x="1150" y="371" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">nest sealing</text>
<text x="1150" y="405" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1F2933" text-anchor="start">temperature control</text>
<rect x="55" y="890" width="1290" height="80" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="78" y="919" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">Resource flow is not linear inventory handling: the same nectar/water/pollen pool is continually redistributed among adult maintenance, brood, storage and processing.</text>
</svg>
