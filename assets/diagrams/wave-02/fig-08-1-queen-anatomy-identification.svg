<text x="968" y="181" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">Identification cues</text>
<text x="980" y="220" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">• abdomen extends well beyond wing tips</text>
<text x="980" y="248" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">• thorax is relatively broad and less hairy</text>
<text x="980" y="276" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">• workers may orient around her</text>
<text x="980" y="304" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">• movement can be purposeful or rapid</text>
<text x="980" y="332" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">• paint mark is optional aid, not anatomy</text>
<text x="980" y="360" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start"></text>
<text x="980" y="388" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start"><tspan x="980" dy="0">Avoid grabbing abdomen; protect the queen</tspan><tspan x="980" dy="16.8">during inspection.</tspan></text>
<rect x="55" y="885" width="1290" height="80" rx="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="78" y="914" font-family="Arial,Helvetica,sans-serif" font-size="17.0" font-weight="600" fill="#1F2933" text-anchor="start"><tspan x="78" dy="0">Queen appearance varies with age, mating status and egg-laying state. A newly emerged virgin can be smaller and faster than a mature</tspan><tspan x="78" dy="20.7">laying queen.</tspan></text>
</svg>
