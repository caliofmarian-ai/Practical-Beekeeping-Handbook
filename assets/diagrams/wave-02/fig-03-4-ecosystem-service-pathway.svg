<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 3.4 — Ecosystem-Service Pathway</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">The pathway is conditional: some plants depend strongly on animal pollination, others only partly or not at all.</text>
