<title id="title">Figure 3.4 — Ecosystem-Service Pathway</title>
<desc id="desc">Flower visitation to pollen transfer, fruit or seed set, and food/ecological outcomes, with an explicit caveat that plant dependence on animal pollination varies.</desc>
