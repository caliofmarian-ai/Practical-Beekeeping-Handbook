<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 4.2 — Product Origin Map Inside the Hive</title>
<desc id="desc">Hive cutaway mapping honey, wax, pollen/bee bread, propolis, royal jelly and venom to their biological origin or storage site.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 4.2 — Product Origin Map Inside the Hive</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">The map separates where a product is made, collected, stored or delivered; not every product is stored in comb.</text>
<rect x="120" y="170" width="670" height="650" rx="8" fill="#F6E3B4" stroke="#8D6E63" stroke-width="5"/>
<rect x="105" y="135" width="700" height="38" fill="#D6C6A0" stroke="#8D6E63" stroke-width="4"/>
<rect x="135" y="820" width="640" height="24" fill="#D6C6A0" stroke="#8D6E63" stroke-width="4"/>
<rect x="180" y="255" width="95" height="470" rx="8" fill="#FFF9E5" stroke="#8D6E63" stroke-width="4"/>
<rect x="192" y="270" width="71" height="70" rx="5" fill="#F6CF58" stroke="#D4A017" stroke-width="1.5"/>
<rect x="315" y="255" width="95" height="470" rx="8" fill="#FFF9E5" stroke="#8D6E63" stroke-width="4"/>
<rect x="327" y="270" width="71" height="70" rx="5" fill="#F6CF58" stroke="#D4A017" stroke-width="1.5"/>
<rect x="330" y="365" width="65" height="145" rx="20" fill="#C38A57" stroke="#8A5A35" stroke-width="1.5"/>
<rect x="333" y="530" width="59" height="45" rx="6" fill="#E1A11E" stroke="#9A6515" stroke-width="1.5"/>
<rect x="450" y="255" width="95" height="470" rx="8" fill="#FFF9E5" stroke="#8D6E63" stroke-width="4"/>
<rect x="462" y="270" width="71" height="70" rx="5" fill="#F6CF58" stroke="#D4A017" stroke-width="1.5"/>
<rect x="465" y="365" width="65" height="145" rx="20" fill="#C38A57" stroke="#8A5A35" stroke-width="1.5"/>
<rect x="468" y="530" width="59" height="45" rx="6" fill="#E1A11E" stroke="#9A6515" stroke-width="1.5"/>
<rect x="585" y="255" width="95" height="470" rx="8" fill="#FFF9E5" stroke="#8D6E63" stroke-width="4"/>
<rect x="597" y="270" width="71" height="70" rx="5" fill="#F6CF58" stroke="#D4A017" stroke-width="1.5"/>
<circle cx="900" cy="210" r="8" fill="#D4A017"/>
<text x="918" y="215" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#D4A017" text-anchor="start">Honey</text>
<text x="918" y="237" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">stored in comb after nectar/honeydew processing</text>
<circle cx="1090" cy="320" r="8" fill="#8D6E63"/>
<text x="1108" y="325" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#8D6E63" text-anchor="start">Wax</text>
<text x="1108" y="347" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">worker wax glands → comb construction</text>
<circle cx="950" cy="450" r="8" fill="#D98C10"/>
<text x="968" y="455" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#D98C10" text-anchor="start">Pollen / bee bread</text>
<text x="968" y="477" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">forager pollen loads → stored/processed cells</text>
<circle cx="1080" cy="590" r="8" fill="#7A4D31"/>
<text x="1098" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#7A4D31" text-anchor="start">Propolis</text>
<text x="1098" y="617" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">plant resin → cracks and nest surfaces</text>
<circle cx="870" cy="700" r="8" fill="#6A1B9A"/>
<text x="888" y="705" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#6A1B9A" text-anchor="start">Royal jelly</text>
<text x="888" y="727" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">nurse glands → fed to larvae/queen</text>
<circle cx="1130" cy="760" r="8" fill="#C62828"/>
<text x="1148" y="765" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#C62828" text-anchor="start">Venom</text>
<text x="1148" y="787" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">venom gland + sting apparatus, not comb storage</text>
<line x1="790" y1="300" x2="890" y2="210" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<line x1="620" y1="550" x2="1060" y2="590" stroke="#EF6C00" stroke-width="4" marker-end="url(#ao)"/>
<line x1="670" y1="680" x2="850" y2="700" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="55" y="875" width="1290" height="80" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="78" y="904" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">The diagram is functional, not anatomical scale. It prevents a common misunderstanding: propolis, royal jelly and venom are not simply 'stored hive products' like honey.</text>
</svg>
