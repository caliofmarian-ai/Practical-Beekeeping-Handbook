<text x="78" y="914" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">The crop temporarily carries nectar/water; digestion and absorption occur mainly in the midgut. Tracheae deliver gases directly to tissues rather than using blood to transport oxygen.</text>
