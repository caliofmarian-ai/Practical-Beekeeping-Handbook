<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 4.4 — From Colony to Market</title>
<desc id="desc">Hive-product chain from harvest through hygiene or preservation, traceability, testing where required, and compliant packaging and claims.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 4.4 — From Colony to Market</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Different products need different controls, but every commercial chain must preserve identity, safety and truthful claims.</text>
<rect x="75" y="190" width="390" height="235" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="93" y="221" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">1 Harvest</text>
<text x="95" y="275" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">appropriate colony/product method</text>
<line x1="465" y1="310" x2="505" y2="310" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="515" y="190" width="390" height="235" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="533" y="221" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">2 Preserve / handle hygienically</text>
<text x="535" y="275" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">drying, cooling, clean equipment as product requires</text>
<line x1="905" y1="310" x2="945" y2="310" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="955" y="190" width="390" height="235" rx="18" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="973" y="221" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2E7D32" text-anchor="start">3 Traceability</text>
<text x="975" y="275" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">apiary, date, lot, process, inputs</text>
<line x1="1150" y1="425" x2="1150" y2="495" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="75" y="520" width="390" height="235" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="93" y="551" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">4 Test where required</text>
<text x="95" y="605" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">moisture, residues, microbiology, identity, quality</text>
<line x1="465" y1="640" x2="505" y2="640" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="515" y="520" width="390" height="235" rx="18" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="533" y="551" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2E7D32" text-anchor="start">5 Pack correctly</text>
<text x="535" y="605" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">food/contact suitability, net quantity, storage</text>
<line x1="905" y1="640" x2="945" y2="640" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<rect x="955" y="520" width="390" height="235" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="973" y="551" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">6 Claims and sale</text>
<text x="975" y="605" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#1F2933" text-anchor="start">origin/product claims supported and legally permitted</text>
<rect x="55" y="870" width="1290" height="80" rx="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="78" y="899" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">Testing is risk- and product-dependent. No amount of processing or marketing can legitimately 'fix' an unidentified or contaminated lot.</text>
</svg>
