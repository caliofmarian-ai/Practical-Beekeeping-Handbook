<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 15.2 — Good and Poor Flight Paths</title>
<desc id="desc">Apiary entrance orientation away from public routes compared with a poor placement directing bee traffic toward doors, paths or livestock.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 15.2 — Good and Poor Flight Paths</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Flight-path planning is a public-safety control, not just a convenience for the beekeeper.</text>
<rect x="55" y="160" width="620" height="650" rx="18" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="73" y="191" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2E7D32" text-anchor="start">Better placement</text>
<rect x="150" y="430" width="250" height="300" rx="8" fill="#F6E3B4" stroke="#8D6E63" stroke-width="4"/>
<rect x="140" y="405" width="270" height="30" rx="4" fill="#D6C6A0" stroke="#8D6E63" stroke-width="3"/>
<rect x="175" y="730" width="200" height="20" rx="4" fill="#D6C6A0" stroke="#8D6E63" stroke-width="3"/>
<rect x="230" y="712" width="110" height="18" fill="#3D2E24"/>
<rect x="470" y="390" width="22" height="220" rx="10" fill="#6FAE62"/>
<rect x="498" y="390" width="22" height="220" rx="10" fill="#6FAE62"/>
<rect x="526" y="390" width="22" height="220" rx="10" fill="#6FAE62"/>
<rect x="554" y="390" width="22" height="220" rx="10" fill="#6FAE62"/>
<rect x="582" y="390" width="22" height="220" rx="10" fill="#6FAE62"/>
<rect x="610" y="390" width="22" height="220" rx="10" fill="#6FAE62"/>
<path d="M390 470 C520 440 650 340 680 240" fill="none" stroke="#2E7D32" stroke-width="3" marker-end="url(#ag)"/>
<path d="M390 500 C520 470 650 370 680 270" fill="none" stroke="#2E7D32" stroke-width="3" marker-end="url(#ag)"/>
<path d="M390 530 C520 500 650 400 680 300" fill="none" stroke="#2E7D32" stroke-width="3" marker-end="url(#ag)"/>
<text x="340" y="745" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#2E7D32" text-anchor="middle">entrance faces away from public movement; barrier encourages flight to rise</text>
<rect x="725" y="160" width="620" height="650" rx="18" fill="#FFEBEE" stroke="#C62828" stroke-width="2.5"/>
<text x="743" y="191" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#C62828" text-anchor="start">Poor placement</text>
<rect x="800" y="430" width="250" height="300" rx="8" fill="#F6E3B4" stroke="#8D6E63" stroke-width="4"/>
<rect x="790" y="405" width="270" height="30" rx="4" fill="#D6C6A0" stroke="#8D6E63" stroke-width="3"/>
<rect x="825" y="730" width="200" height="20" rx="4" fill="#D6C6A0" stroke="#8D6E63" stroke-width="3"/>
<rect x="880" y="712" width="110" height="18" fill="#3D2E24"/>
<rect x="1120" y="350" width="130" height="280" rx="4" fill="#ECEFF1" stroke="#607D8B" stroke-width="3"/>
<text x="1185" y="495" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#757575" text-anchor="middle">door</text>
<line x1="1060" y1="610" x2="1300" y2="610" stroke="#9E9E9E" stroke-width="14"/>
<line x1="1040" y1="470" x2="1160" y2="450" stroke="#C62828" stroke-width="3"/>
<line x1="1040" y1="510" x2="1160" y2="490" stroke="#C62828" stroke-width="3"/>
<line x1="1040" y1="550" x2="1160" y2="530" stroke="#C62828" stroke-width="3"/>
<text x="1035" y="745" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#C62828" text-anchor="middle">flight crosses doorway / path: repeated conflict risk</text>
<rect x="55" y="875" width="1290" height="80" rx="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="78" y="904" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">Also consider legal permission, neighbours, livestock, vehicle access and future changes at the site. A good flight path today may become poor after site use changes.</text>
</svg>
