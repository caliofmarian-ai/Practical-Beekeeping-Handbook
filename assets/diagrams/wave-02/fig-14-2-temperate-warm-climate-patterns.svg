<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 14.2 — Temperate Versus Warm-Climate Patterns</title>
<desc id="desc">Conceptual comparison showing why seasonal colony management cannot be copied by calendar month between temperate and warm climates.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 14.2 — Temperate Versus Warm-Climate Patterns</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Both panels are examples, not prescriptions; local rainfall, forage and temperature determine real patterns.</text>
<rect x="55" y="160" width="620" height="650" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="73" y="191" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">Temperate example</text>
<rect x="100" y="643.0" width="120" height="57.0" rx="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="3"/>
<text x="160" y="735" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#52606D" text-anchor="middle">cold / low brood</text>
<rect x="240" y="491.0" width="120" height="209.00000000000003" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3"/>
<text x="300" y="735" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#52606D" text-anchor="middle">spring build-up</text>
<rect x="380" y="358.0" width="120" height="342.0" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="3"/>
<text x="440" y="735" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#52606D" text-anchor="middle">peak / flow</text>
<rect x="520" y="517.6" width="120" height="182.4" rx="8" fill="#FFFFFF" stroke="#EF6C00" stroke-width="3"/>
<text x="580" y="735" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#52606D" text-anchor="middle">decline / prepare</text>
<rect x="725" y="160" width="620" height="650" rx="18" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="743" y="191" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2E7D32" text-anchor="start">Warm-climate example</text>
<rect x="770" y="586.0" width="120" height="114.0" rx="8" fill="#FFFFFF" stroke="#EF6C00" stroke-width="3"/>
<text x="830" y="735" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#52606D" text-anchor="middle">dry dearth</text>
<rect x="910" y="415.0" width="120" height="285.0" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3"/>
<text x="970" y="735" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#52606D" text-anchor="middle">rain/forage build</text>
<rect x="1050" y="365.6" width="120" height="334.4" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="3"/>
<text x="1110" y="735" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#52606D" text-anchor="middle">flow / brood peak</text>
<rect x="1190" y="529.0" width="120" height="171.0" rx="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="3"/>
<text x="1250" y="735" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#52606D" text-anchor="middle">short dearth / reset</text>
<rect x="55" y="875" width="1290" height="80" rx="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="78" y="904" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">A 'January task' in one region may be biologically wrong elsewhere. Base management on brood state, forage, weather and colony condition.</text>
</svg>
