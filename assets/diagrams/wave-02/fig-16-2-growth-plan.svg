<text x="78" y="894" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">Growth constraints often appear first in time, storage, transport, disease control and records—not hive availability. Expand only when the operating system can scale.</text>
