<text x="78" y="904" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">Natural mite fall and screened floors are supporting tools. Quantitative Varroa monitoring and effective control remain necessary.</text>
