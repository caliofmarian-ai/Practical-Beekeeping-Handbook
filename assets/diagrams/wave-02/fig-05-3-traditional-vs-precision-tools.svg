<title id="title">Figure 5.3 — Traditional Tools and Precision Tools</title>
<desc id="desc">Hive tool, smoker and direct frame inspection shown alongside scales, sensors and digital records; technology augments rather than replaces biological inspection.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 5.3 — Traditional Tools and Precision Tools</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Precision tools increase observation frequency, but sensors do not diagnose a colony by themselves.</text>
<rect x="55" y="160" width="620" height="650" rx="18" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.5"/>
<text x="73" y="191" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#8D6E63" text-anchor="start">Direct / traditional tools</text>
