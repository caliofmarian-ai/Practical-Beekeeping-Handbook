<text x="300" y="395" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#757575" text-anchor="middle">hive tool</text>
<rect x="180" y="470" width="110" height="160" rx="22" fill="#B0BEC5" stroke="#546E7A" stroke-width="4"/><path d="M235 470 L260 410 L310 390" fill="none" stroke="#546E7A" stroke-width="16"/>
<text x="235" y="675" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#757575" text-anchor="middle">smoker</text>
<rect x="440" y="455" width="120" height="220" rx="8" fill="#FFF9E5" stroke="#8D6E63" stroke-width="4"/>
<rect x="452" y="470" width="96" height="70" rx="5" fill="#F6CF58" stroke="#D4A017" stroke-width="1.5"/>
<rect x="455" y="565" width="90" height="145" rx="20" fill="#C38A57" stroke="#8A5A35" stroke-width="1.5"/>
<rect x="458" y="730" width="84" height="45" rx="6" fill="#E1A11E" stroke="#9A6515" stroke-width="1.5"/>
<text x="500" y="705" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#8D6E63" text-anchor="middle">frame inspection</text>
<rect x="725" y="160" width="620" height="650" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="743" y="191" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">Precision / digital tools</text>
