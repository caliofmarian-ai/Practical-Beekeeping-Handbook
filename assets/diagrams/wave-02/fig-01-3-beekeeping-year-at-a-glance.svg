<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 1.3 — The Beekeeping Year at a Glance</title>
<desc id="desc">Season-neutral circular sequence of colony build-up, reproduction/swarming pressure, surplus collection, preparation and winter/dearth survival.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 1.3 — The Beekeeping Year at a Glance</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">The sequence is biological rather than tied to fixed calendar months or one hemisphere.</text>
<rect x="570.0" y="140.0" width="260" height="140" rx="22" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
<text x="700.0" y="195.0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2E7D32" text-anchor="middle">Build-up</text>
<text x="700.0" y="225.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="middle">brood and workforce increase</text>
<rect x="870.0" y="430.0" width="260" height="140" rx="22" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/>
<text x="1000.0" y="485.0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#EF6C00" text-anchor="middle">Reproduction pressure</text>
<text x="1000.0" y="515.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="middle">swarming risk can rise</text>
<rect x="672.6060429977007" y="702.5108600279134" width="260" height="140" rx="22" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/>
<text x="802.6060429977007" y="757.5108600279134" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#D4A017" text-anchor="middle">Surplus collection</text>
<text x="802.6060429977007" y="787.5108600279134" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="middle">nectar storage and honey crop</text>
<rect x="324.25438671330244" y="596.3371665418033" width="260" height="140" rx="22" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
<text x="454.25438671330244" y="651.3371665418033" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1565C0" text-anchor="middle">Preparation</text>
<text x="454.25438671330244" y="681.3371665418033" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="middle">stores, health and colony structure</text>
<rect x="324.25438671330244" y="263.6628334581966" width="260" height="140" rx="22" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/>
<text x="454.25438671330244" y="318.6628334581966" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#6A1B9A" text-anchor="middle">Winter / dearth survival</text>
<text x="454.25438671330244" y="348.6628334581966" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="middle">conserve heat/resources; conditions vary</text>
<line x1="700.0" y1="210.0" x2="1000.0" y2="500.0" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/>
<line x1="1000.0" y1="500.0" x2="802.6060429977007" y2="772.5108600279134" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/>
<line x1="802.6060429977007" y1="772.5108600279134" x2="454.25438671330244" y2="666.3371665418033" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/>
<line x1="454.25438671330244" y1="666.3371665418033" x2="454.25438671330244" y2="333.6628334581966" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/>
<line x1="454.25438671330244" y1="333.6628334581966" x2="700.0" y2="210.0" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/>
<circle cx="700" cy="500" r="110" fill="#F5F5F5" stroke="#757575" stroke-width="3"/>
<text x="700" y="497" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#757575" text-anchor="middle">COLONY CYCLE</text>
<text x="700" y="524" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">climate + forage + health</text>
<rect x="55" y="880" width="1290" height="80" rx="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="78" y="909" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1F2933" text-anchor="start">Warm climates may not have a broodless winter. Use local phenology and colony observations rather than fixed seasonal dates.</text>
</svg>
