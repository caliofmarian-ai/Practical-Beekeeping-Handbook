<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 61.7 — Buy / Rent / Share / Outsource Decision</title><desc id="desc">Buy / Rent / Share / Outsource Decision decision or process flow.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#fff"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 61.7 — Buy / Rent / Share / Outsource Decision</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Equipment ownership should follow utilisation, cash flow, scheduling, hygiene and volume — not ownership</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">preference.</text>
<rect x="220" y="165" width="960" height="85" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="238" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">1. Annual utilisation high enough?</text><text x="238" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Estimate realistic hours/days used, not theoretical capacity.</text><line x1="700" y1="250" x2="700" y2="272" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="275" width="960" height="85" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="238" y="308" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">2. Cash available without starving working capital?</text><text x="238" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Protect feed, packaging, wages, repairs and operating cash.</text><line x1="700" y1="360" x2="700" y2="382" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="385" width="960" height="85" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="238" y="418" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">3. Scheduling risk if rented/shared?</text><text x="238" y="447" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Peak harvest or queen-rearing windows may make availability critical.</text><line x1="700" y1="470" x2="700" y2="492" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="495" width="960" height="85" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="238" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">4. Hygiene / disease / traceability controllable?</text><text x="238" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Shared/live-bee equipment can add biosecurity or cleaning constraints.</text><line x1="700" y1="580" x2="700" y2="602" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="605" width="960" height="85" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="238" y="638" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">5. Expected volume stable?</text><text x="238" y="667" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Avoid buying capacity based on one exceptional season.</text><line x1="700" y1="690" x2="700" y2="712" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="715" width="960" height="85" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="238" y="748" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">6. Choose: buy / rent / share / outsource</text><text x="238" y="777" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Select the option with the lowest practical total cost at acceptable risk.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Recalculate when volume, labour cost, finance cost or market access changes. A formerly correct choice can become uneconomic.</text></svg>