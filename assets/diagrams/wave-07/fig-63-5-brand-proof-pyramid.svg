<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 63.5 — Brand Proof Pyramid</title><desc id="desc">Brand promise supported by increasingly concrete operational and legal evidence.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 63.5 — Brand Proof Pyramid</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">A brand promise is strongest when the visible marketing layer rests on traceable product, service and compliance</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">evidence.</text>
<rect x="210" y="180" width="980" height="110" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><text x="700" y="218" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#2E7D32" text-anchor="middle">Customer promise</text><text x="700" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="middle">What buyers are told to expect.</text><rect x="275" y="305" width="850" height="110" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="700" y="343" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#1565C0" text-anchor="middle">Service + product standards</text><text x="700" y="372" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="middle">Repeatable fulfilment, specifications and customer experience.</text><rect x="340" y="430" width="720" height="110" rx="14" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/><text x="700" y="468" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#6A1B9A" text-anchor="middle">Traceability + apiary/harvest records</text><text x="700" y="497" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="middle">Operational evidence connecting the story to real lots and activity.</text><rect x="405" y="555" width="590" height="110" rx="14" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/><text x="700" y="593" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#6A1B9A" text-anchor="middle">Certification / laboratory evidence</text><text x="700" y="622" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="middle">Independent or analytical proof where the claim requires it.</text><rect x="470" y="680" width="460" height="110" rx="14" fill="#F5F5F5" stroke="#757575" stroke-width="2.5"/><text x="700" y="718" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#757575" text-anchor="middle">Legal / source documents</text><text x="700" y="747" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="middle">Current rules, scopes, supplier records and retained evidence.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">A logo, rustic design or sustainability language does not substitute for evidence. Keep proof records current for every claim the brand uses.</text></svg>