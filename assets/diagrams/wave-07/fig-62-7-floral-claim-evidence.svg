<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 62.7 — Floral Claim Evidence</title><desc id="desc">Evidence chain from flowering observations to a defensible floral-origin claim.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#fff"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 62.7 — Floral Claim Evidence</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Botanical-origin marketing should be built from converging evidence rather than location alone.</text>
<rect x="80" y="280" width="230" height="240" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="98" y="313" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">1. Landscape + flowering record</text><text x="98" y="342" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Observe candidate floral</text><text x="98" y="362" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">sources, timing and bee</text><text x="98" y="382" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">visitation.</text><line x1="310" y1="400" x2="335" y2="400" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="335" y="280" width="230" height="240" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="353" y="313" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">2. Sensory evidence</text><text x="353" y="342" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Flavour, aroma, colour</text><text x="353" y="362" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and other organoleptic</text><text x="353" y="382" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">characteristics.</text><line x1="565" y1="400" x2="590" y2="400" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="590" y="280" width="230" height="240" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="608" y="313" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">3. Physicochemical evidence</text><text x="608" y="342" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Relevant</text><text x="608" y="362" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">composition/quality</text><text x="608" y="382" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">measurements where</text><text x="608" y="402" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">needed.</text><line x1="820" y1="400" x2="845" y2="400" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="845" y="280" width="230" height="240" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="863" y="313" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">4. Microscopic / pollen evidence</text><text x="863" y="342" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use suitable analytical</text><text x="863" y="362" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">evidence when</text><text x="863" y="382" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">botanical-origin claims</text><text x="863" y="402" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">require it.</text><line x1="1075" y1="400" x2="1100" y2="400" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="1100" y="280" width="230" height="240" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="1118" y="313" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">5. Defensible floral claim</text><text x="1118" y="342" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Claim only what the</text><text x="1118" y="362" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">combined evidence and</text><text x="1118" y="382" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">applicable rules support.</text><rect x="280" y="620" width="840" height="120" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="298" y="653" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">NOT PROOF: 'flowers near the hive'</text><text x="298" y="682" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Foraging range, competing blooms, weather and colony behaviour mean nearby flowers alone</text><text x="298" y="702" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">do not establish that a harvested honey is predominantly from that floral source.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">The exact evidentiary and naming requirements are jurisdiction-specific. Use current market law, recognised methods and competent laboratory</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">support where appropriate.</text></svg>