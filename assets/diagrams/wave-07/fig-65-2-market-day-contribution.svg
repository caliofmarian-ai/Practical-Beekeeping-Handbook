<title id="title">Figure 65.2 — Market-Day Contribution</title><desc id="desc">Illustrative waterfall from gross sales to event contribution after direct market-day costs.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 65.2 — Market-Day Contribution</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Gross sales are not profit. Contribution should account for product cost, pitch, transport, payment fees,</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">sampling/breakage and labour.</text>
<rect x="90" y="240" width="135" height="520" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><text x="157.5" y="228" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle">Gross revenue</text><text x="157.5" y="275" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#2E7D32" text-anchor="middle">€ 100</text><line x1="225" y1="715" x2="245" y2="715" stroke="#757575" stroke-width="2" marker-end="url(#ab)"/><rect x="250" y="486" width="135" height="274" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/><text x="317.5" y="474" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#EF6C00" text-anchor="middle">Product cost</text><text x="317.5" y="521" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#EF6C00" text-anchor="middle">− 18</text><line x1="385" y1="715" x2="405" y2="715" stroke="#757575" stroke-width="2" marker-end="url(#ab)"/><rect x="410" y="510" width="135" height="250" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/><text x="477.5" y="498" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#EF6C00" text-anchor="middle">Pitch fee</text><text x="477.5" y="545" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#EF6C00" text-anchor="middle">− 10</text><line x1="545" y1="715" x2="565" y2="715" stroke="#757575" stroke-width="2" marker-end="url(#ab)"/><rect x="570" y="516" width="135" height="244" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/><text x="637.5" y="504" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#EF6C00" text-anchor="middle">Transport</text><text x="637.5" y="551" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#EF6C00" text-anchor="middle">− 8</text><line x1="705" y1="715" x2="725" y2="715" stroke="#757575" stroke-width="2" marker-end="url(#ab)"/><rect x="730" y="531" width="135" height="229" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/><text x="797.5" y="519" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#EF6C00" text-anchor="middle">Card fees</text><text x="797.5" y="566" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#EF6C00" text-anchor="middle">− 3</text><line x1="865" y1="715" x2="885" y2="715" stroke="#757575" stroke-width="2" marker-end="url(#ab)"/><rect x="890" y="525" width="135" height="235" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/><text x="957.5" y="513" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#EF6C00" text-anchor="middle">Sampling / breakage</text><text x="957.5" y="560" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#EF6C00" text-anchor="middle">− 5</text><line x1="1025" y1="715" x2="1045" y2="715" stroke="#757575" stroke-width="2" marker-end="url(#ab)"/><rect x="1050" y="480" width="135" height="280" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/><text x="1117.5" y="468" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#EF6C00" text-anchor="middle">Labour</text><text x="1117.5" y="515" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#EF6C00" text-anchor="middle">− 20</text><line x1="1185" y1="715" x2="1205" y2="715" stroke="#757575" stroke-width="2" marker-end="url(#ab)"/><rect x="1210" y="432" width="135" height="328" rx="8" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/><text x="1277.5" y="420" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#6A1B9A" text-anchor="middle">Event contribution</text><text x="1277.5" y="467" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#6A1B9A" text-anchor="middle">= 36</text><rect x="360" y="160" width="680" height="95" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="378" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Illustrative waterfall, not a price model</text><text x="378" y="222" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use current local costs and include owner labour if the purpose is to judge</text><text x="378" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">true event economics.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">The values shown are illustrative proportions, not recommended prices or universal costs. Replace them with actual event data.</text></svg>