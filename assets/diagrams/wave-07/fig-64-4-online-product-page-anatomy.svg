<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 64.4 — Online Product Page Anatomy</title><desc id="desc">Annotated product page showing information needed for accurate online food sales.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 64.4 — Online Product Page Anatomy</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">The product page is part of the food-information and traceability system, not merely a marketing screen.</text>
<rect x="170" y="155" width="1060" height="690" rx="14" fill="#FFFFFF" stroke="#1565C0" stroke-width="3"/><rect x="170" y="155" width="1060" height="70" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="0"/><text x="210" y="200" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#1565C0" text-anchor="start">ONLINE PRODUCT PAGE</text><rect x="220" y="270" width="380" height="330" rx="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.5"/><text x="410" y="440" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#8D6E63" text-anchor="middle">PRODUCT IMAGE</text><text x="410" y="475" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#52606D" text-anchor="middle">accurate, current, no misleading scale</text><text x="650" y="290" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1F2933" text-anchor="start">Legal product name</text><text x="840" y="290" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">What the product legally/accurately</text><text x="840" y="310" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">is.</text><line x1="640" y1="317" x2="1170" y2="317" stroke="#757575" stroke-width="1"/><text x="650" y="364" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1F2933" text-anchor="start">Origin / provenance</text><text x="840" y="364" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">Required or voluntary origin</text><text x="840" y="384" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">information supported by evidence.</text><line x1="640" y1="391" x2="1170" y2="391" stroke="#757575" stroke-width="1"/><text x="650" y="438" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1F2933" text-anchor="start">Net quantity</text><text x="840" y="438" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">Clear pack quantity.</text><line x1="640" y1="465" x2="1170" y2="465" stroke="#757575" stroke-width="1"/><text x="650" y="512" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1F2933" text-anchor="start">Ingredients / allergens</text><text x="840" y="512" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">Where relevant for the product.</text><line x1="640" y1="539" x2="1170" y2="539" stroke="#757575" stroke-width="1"/><text x="650" y="586" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1F2933" text-anchor="start">Storage</text><text x="840" y="586" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">Conditions required to maintain</text><text x="840" y="606" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">product quality/safety.</text><line x1="640" y1="613" x2="1170" y2="613" stroke="#757575" stroke-width="1"/><text x="650" y="660" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1F2933" text-anchor="start">Price + delivery</text><text x="840" y="660" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">Total price information and delivery</text><text x="840" y="680" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">terms before purchase.</text><line x1="640" y1="687" x2="1170" y2="687" stroke="#757575" stroke-width="1"/><text x="650" y="734" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1F2933" text-anchor="start">Claims</text><text x="840" y="734" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">Only wording supported and legally</text><text x="840" y="754" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">permissible.</text><rect x="300" y="730" width="800" height="80" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="318" y="763" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Distance selling principle</text><text x="318" y="792" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Mandatory pre-purchase information and the exact legal fields vary by jurisdiction; design</text><text x="318" y="812" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">the page around compliance before decoration.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Check current distance-selling and consumer rules for the target market. Do not hide mandatory product information behind marketing copy.</text></svg>