<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 60.9 — Compliance Map</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">A commercial apiary sits inside several overlapping legal and operational systems; no single licence covers</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">everything.</text>
<rect x="70" y="170" width="400" height="275" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Food business / product rules</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Registration or notification, hygiene</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">system, food information and</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">product-specific requirements.</text><rect x="500" y="170" width="400" height="275" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Traceability + recall</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Lot identity, supplier/customer records</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">where required, complaint and recall</text><text x="518" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">readiness.</text><rect x="930" y="170" width="400" height="275" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="948" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Labelling + claims</text><text x="948" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Mandatory particulars, origin/product</text><text x="948" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">naming and evidence for voluntary claims.</text><rect x="70" y="475" width="400" height="275" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="508" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Tax + business admin</text><text x="88" y="537" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Entity, tax, invoicing and accounting</text><text x="88" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">obligations.</text><rect x="500" y="475" width="400" height="275" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="518" y="508" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Land / access / movement</text><text x="518" y="537" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Apiary permission, landowner terms,</text><text x="518" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">transport and movement rules where</text><text x="518" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">applicable.</text><rect x="930" y="475" width="400" height="275" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="948" y="508" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Insurance + worker safety</text><text x="948" y="537" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Public/product liability, vehicles,</text><text x="948" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">staff/contractors, equipment and workplace</text><text x="948" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">controls.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Always check current local rules and competent-authority guidance. Requirements vary by jurisdiction, business model and product.</text></svg>