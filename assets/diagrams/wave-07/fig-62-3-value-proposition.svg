<title id="title">Figure 62.3 — Value Proposition</title><desc id="desc">Evidence-backed product attributes feeding a clear customer benefit.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 62.3 — Value Proposition</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">A strong value proposition connects evidence to a customer benefit. Marketing language should not outrun the</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">facts that can be proved.</text>
<rect x="490" y="380" width="420" height="180" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="508" y="413" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">CLEAR CUSTOMER BENEFIT</text><text x="508" y="442" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">What problem is solved, what experience is</text><text x="508" y="462" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">offered, and why the buyer should choose this</text><text x="508" y="482" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">product.</text><rect x="585" y="125" width="230" height="130" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="603" y="158" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Origin evidence</text><text x="603" y="187" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">traceable place /</text><text x="603" y="207" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">producer</text><line x1="700" y1="255" x2="700" y2="380" stroke="#6A1B9A" stroke-width="2.5" marker-end="url(#ab)"/><rect x="993.9543020069159" y="318.4752415750147" width="230" height="130" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="1011.9543020069159" y="351.4752415750147" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Flavour + format</text><text x="1011.9543020069159" y="380.4752415750147" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">sensory and convenience</text><text x="1011.9543020069159" y="400.4752415750147" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">value</text><line x1="1108.954302006916" y1="448.4752415750147" x2="700" y2="380" stroke="#8D6E63" stroke-width="2.5" marker-end="url(#ab)"/><rect x="837.7476584857634" y="631.5247584249853" width="230" height="130" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="855.7476584857634" y="664.5247584249853" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Service</text><text x="855.7476584857634" y="693.5247584249853" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">availability,</text><text x="855.7476584857634" y="713.5247584249853" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">fulfilment, advice</text><line x1="952.7476584857634" y1="631.5247584249853" x2="700" y2="560" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/><rect x="332.2523415142366" y="631.5247584249853" width="230" height="130" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="350.2523415142366" y="664.5247584249853" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Certification / standard</text><text x="350.2523415142366" y="693.5247584249853" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">only when valid and in</text><text x="350.2523415142366" y="713.5247584249853" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">scope</text><line x1="447.2523415142366" y1="631.5247584249853" x2="700" y2="560" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#ab)"/><rect x="176.04569799308393" y="318.47524157501476" width="230" height="130" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="194.04569799308393" y="351.47524157501476" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Traceability</text><text x="194.04569799308393" y="380.47524157501476" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">lot, harvest and</text><text x="194.04569799308393" y="400.47524157501476" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">handling evidence</text><line x1="291.04569799308393" y1="448.47524157501476" x2="700" y2="380" stroke="#6A1B9A" stroke-width="2.5" marker-end="url(#ab)"/><rect x="430" y="780" width="540" height="80" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="448" y="813" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Blocked messaging</text><text x="448" y="842" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Vague 'premium', miracle-health or unsupported</text><text x="448" y="862" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">sustainability/origin claims do not become true through</text><text x="448" y="882" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">branding.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Health, origin, organic and environmental claims require the evidence and legal basis applicable to the market where the product is sold.</text></svg>