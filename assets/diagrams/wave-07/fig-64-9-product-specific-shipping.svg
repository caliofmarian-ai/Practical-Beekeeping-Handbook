<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 64.9 — Product-Specific Shipping</title><desc id="desc">Four hive-product shipping systems with different physical and temperature controls.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 64.9 — Product-Specific Shipping</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Shipping design follows the product. Glass, fragile comb and perishable chilled/frozen products should not share</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">one generic fulfilment assumption.</text>
<rect x="70" y="170" width="600" height="285" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Honey jar</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Protect glass, seal against leakage, cushion impact and</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">keep lot identity visible.</text><rect x="290" y="320" width="160" height="85" rx="8" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.2"/><text x="370" y="370" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#8D6E63" text-anchor="middle">PROTECT</text><rect x="730" y="170" width="600" height="285" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="748" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Comb honey</text><text x="748" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Protect delicate wax from crush, heat and movement;</text><text x="748" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">maintain clean food-grade packaging.</text><rect x="950" y="320" width="160" height="85" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.2"/><text x="1030" y="370" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#EF6C00" text-anchor="middle">PROTECT</text><rect x="70" y="510" width="600" height="285" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="543" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Frozen pollen</text><text x="88" y="572" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Validated frozen chain, insulated pack, time/temperature</text><text x="88" y="592" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">control and clear receiving conditions.</text><rect x="290" y="660" width="160" height="85" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.2"/><text x="370" y="710" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1565C0" text-anchor="middle">TEMPERATURE</text><rect x="730" y="510" width="600" height="285" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="748" y="543" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Royal jelly</text><text x="748" y="572" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Cold-chain or frozen conditions according to product</text><text x="748" y="592" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">specification and applicable rules; minimise warm</text><text x="748" y="612" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">exposure.</text><rect x="950" y="660" width="160" height="85" rx="8" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.2"/><text x="1030" y="710" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#6A1B9A" text-anchor="middle">TEMPERATURE</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Use validated packaging and carrier arrangements appropriate to the route, season and product specification. Jurisdictional transport rules may</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">also apply.</text></svg>