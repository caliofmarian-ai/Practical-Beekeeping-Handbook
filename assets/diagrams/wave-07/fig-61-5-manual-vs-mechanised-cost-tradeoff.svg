<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 61.5 — Manual Versus Mechanised Cost Trade-Off</title><desc id="desc">Low-capital high-labour system compared with higher-capital lower-labour mechanisation.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 61.5 — Manual Versus Mechanised Cost Trade-Off</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Mechanisation makes economic sense only when it solves a real capacity or labour bottleneck at sufficient</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">utilisation.</text>
<rect x="70" y="170" width="600" height="610" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Manual / low-capital route</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Lower initial capital; higher labour per unit; easier to</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">start small; capacity can be limited at peak season;</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">repetitive-work and consistency risks may rise with scale.</text><text x="370" y="455" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1565C0" text-anchor="middle">CAPITAL</text><rect x="220" y="480" width="300" height="35" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><rect x="220" y="480" width="90" height="35" rx="8" fill="#1565C0" stroke="#1565C0" stroke-width="0"/><text x="370" y="565" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#EF6C00" text-anchor="middle">LABOUR / UNIT</text><rect x="220" y="590" width="300" height="35" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/><rect x="220" y="590" width="240" height="35" rx="8" fill="#EF6C00" stroke="#EF6C00" stroke-width="0"/><rect x="730" y="170" width="600" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="748" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Mechanised / higher-capital route</text><text x="748" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Higher purchase and maintenance cost; lower labour per</text><text x="748" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">unit at suitable throughput; requires cleaning, guarding,</text><text x="748" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">maintenance, spare parts and enough volume to justify</text><text x="748" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">capacity.</text><text x="1030" y="455" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2E7D32" text-anchor="middle">CAPITAL</text><rect x="880" y="480" width="300" height="35" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><rect x="880" y="480" width="245" height="35" rx="8" fill="#2E7D32" stroke="#2E7D32" stroke-width="0"/><text x="1030" y="565" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1565C0" text-anchor="middle">LABOUR / UNIT</text><rect x="880" y="590" width="300" height="35" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><rect x="880" y="590" width="100" height="35" rx="8" fill="#1565C0" stroke="#1565C0" stroke-width="0"/><rect x="430" y="805" width="540" height="72" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="448" y="838" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Decision</text><text x="448" y="867" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Compare total cost of ownership, safety, maintenance,</text><text x="448" y="887" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">utilisation and bottleneck relief — not purchase price alone.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">No fixed colony count triggers mechanisation. Use current quotations, realistic throughput, maintenance, labour and financing assumptions.</text></svg>