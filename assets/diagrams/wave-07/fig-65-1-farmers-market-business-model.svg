<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 65.1 — Farmers-Market Business Model</title><desc id="desc">Market-day flow from preparation through repeat-customer follow-up.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 65.1 — Farmers-Market Business Model</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">A market stall is a temporary retail operation: food safety, product information, transaction control,</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">traceability and profitability all operate together.</text>
<rect x="80" y="160" width="390" height="275" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="98" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">1. Stock preparation</text><text x="98" y="222" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Select saleable lots, prices, labels,</text><text x="98" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">samples and traceable market stock.</text><rect x="510" y="160" width="390" height="275" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="528" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">2. Market setup</text><text x="528" y="222" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Weatherproof, safe layout with compliant</text><text x="528" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">product information and protected food.</text><rect x="940" y="160" width="390" height="275" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="958" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">3. Customer interaction</text><text x="958" y="222" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Explain products accurately; avoid</text><text x="958" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">unsupported claims; gather useful</text><text x="958" y="262" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">feedback.</text><rect x="80" y="490" width="390" height="275" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="98" y="523" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">4. Transaction</text><text x="98" y="552" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Cash/card control, receipt process and</text><text x="98" y="572" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">stock movement.</text><rect x="510" y="490" width="390" height="275" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="528" y="523" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">5. Stock + lot reconciliation</text><text x="528" y="552" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Count remaining units, breakage, samples</text><text x="528" y="572" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and sold lots.</text><rect x="940" y="490" width="390" height="275" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="958" y="523" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">6. Repeat / online follow-up</text><text x="958" y="552" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Permission-based customer retention and</text><text x="958" y="572" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">channel hand-off.</text><line x1="120" y1="800" x2="1280" y2="800" stroke="#6A1B9A" stroke-width="4" marker-end="url(#ab)"/><text x="700" y="840" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#6A1B9A" text-anchor="middle">profitability + traceability run through every stage</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Organiser rules, local trading permissions and food-business requirements differ by jurisdiction. Check them before committing stock and labour.</text></svg>