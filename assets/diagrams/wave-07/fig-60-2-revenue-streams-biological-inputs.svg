<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 60.2 — Revenue Streams and Biological Inputs</title><desc id="desc">Beekeeping revenue streams mapped against biological and operational inputs.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 60.2 — Revenue Streams and Biological Inputs</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">A beekeeping business should choose its revenue model before scaling hive count. Different products consume</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">different biological and operational resources.</text>
<rect x="520" y="355" width="360" height="210" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="538" y="388" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">BUSINESS MODEL</text><text x="538" y="417" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Choose the activity first; then match</text><text x="538" y="437" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">colonies, labour, equipment, compliance</text><text x="538" y="457" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and sales capacity.</text><rect x="55" y="170" width="350" height="210" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="73" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Retail / bulk honey</text><text x="73" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Consumes nectar-flow opportunity,</text><text x="73" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">extraction, storage, packing and</text><text x="73" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">sales capacity.</text><line x1="405" y1="275" x2="520" y2="460" stroke="#8D6E63" stroke-width="3" marker-end="url(#ab)"/><rect x="995" y="170" width="350" height="210" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="1013" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Queens / nuclei</text><text x="1013" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Consumes brood, bees, mating</text><text x="1013" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">capacity, breeding discipline and</text><text x="1013" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">seasonal windows.</text><line x1="995" y1="275" x2="880" y2="460" stroke="#6A1B9A" stroke-width="3" marker-end="url(#ab)"/><rect x="55" y="590" width="350" height="210" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="73" y="623" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Pollen / RJ / propolis / wax</text><text x="73" y="652" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Consumes colony resources plus</text><text x="73" y="672" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">specialised food/product handling</text><text x="73" y="692" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and storage.</text><line x1="405" y1="695" x2="520" y2="460" stroke="#EF6C00" stroke-width="3" marker-end="url(#ab)"/><rect x="995" y="590" width="350" height="210" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="1013" y="623" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Pollination / services</text><text x="1013" y="652" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Consumes colony strength, transport,</text><text x="1013" y="672" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">contracts, labour and risk</text><text x="1013" y="692" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">management.</text><line x1="995" y1="695" x2="880" y2="460" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="470" y="760" width="460" height="95" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="488" y="793" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Shared biological inputs</text><text x="488" y="822" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Healthy colonies · forage · queen quality · bee</text><text x="488" y="842" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">population · timing · records · labour</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Revenue streams can compete for the same colony resources. Growth should be limited by biological capacity, labour, processing, compliance and</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">sales — not hive count alone.</text></svg>