<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 63.10 — Claim Library</title><desc id="desc">Structured claim-control record linking wording to evidence, scope and review dates.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 63.10 — Claim Library</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">A claim library turns marketing language into controlled content: wording, evidence, legal basis, scope and</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">review status are linked.</text>
<rect x="110" y="170" width="1180" height="560" rx="12" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="2.5"/><text x="140" y="210" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#6A1B9A" text-anchor="start">APPROVED CLAIM RECORD</text><text x="145" y="271" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F2933" text-anchor="start">Claim wording</text><rect x="340" y="245" width="900" height="44" rx="5" fill="#FFFFFF" stroke="#757575" stroke-width="1"/><text x="360" y="273" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">Exact approved customer-facing text.</text><text x="145" y="341" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F2933" text-anchor="start">Evidence source</text><rect x="340" y="315" width="900" height="44" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="1"/><text x="360" y="343" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">Traceability record, certification, lab report or documented product fact.</text><text x="145" y="411" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F2933" text-anchor="start">Legal / certification basis</text><rect x="340" y="385" width="900" height="44" rx="5" fill="#FFFFFF" stroke="#757575" stroke-width="1"/><text x="360" y="413" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">Why the wording is permitted and within scope.</text><text x="145" y="481" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F2933" text-anchor="start">Products / channels</text><rect x="340" y="455" width="900" height="44" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="1"/><text x="360" y="483" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">Where the wording may appear.</text><text x="145" y="551" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F2933" text-anchor="start">Owner / reviewer</text><rect x="340" y="525" width="900" height="44" rx="5" fill="#FFFFFF" stroke="#757575" stroke-width="1"/><text x="360" y="553" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">Who is accountable for approval.</text><text x="145" y="621" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F2933" text-anchor="start">Review / expiry date</text><rect x="340" y="595" width="900" height="44" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="1"/><text x="360" y="623" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="start">When the claim must be checked again.</text><rect x="170" y="770" width="490" height="90" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="188" y="803" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Approved</text><text x="188" y="832" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Only evidence-backed wording with a current review</text><text x="188" y="852" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">status reaches labels, websites and promotions.</text><rect x="740" y="770" width="490" height="90" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="758" y="803" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Blocked</text><text x="758" y="832" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Unapproved health, origin, organic, environmental or</text><text x="758" y="852" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">certification claims remain unavailable for</text><text x="758" y="872" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">publication.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">This is a governance model, not a universal legal form. Each claim still requires review against the current rules of the target market.</text></svg>