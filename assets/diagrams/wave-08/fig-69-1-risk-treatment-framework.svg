<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 69.1 — Risk Treatment Framework</title><desc id="desc">Five risk-treatment options: avoid, reduce, retain, transfer by contract and insure.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#fff"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 69.1 — Risk Treatment Framework</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Insurance is a financial risk-transfer tool inside a wider risk-management system.</text>
<rect x="480" y="160" width="440" height="120" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="498" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">IDENTIFIED BUSINESS RISK</text><text x="498" y="222" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Event · cause · likelihood · severity · existing</text><text x="498" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">controls · maximum credible loss</text><line x1="700" y1="280" x2="160" y2="405" stroke="#1565C0" stroke-width="2.7" marker-end="url(#ab)"/><rect x="60" y="420" width="200" height="300" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="78" y="453" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">420</text><text x="78" y="482" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Avoid</text><line x1="700" y1="280" x2="430" y2="405" stroke="#1565C0" stroke-width="2.7" marker-end="url(#ab)"/><rect x="330" y="420" width="200" height="300" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="348" y="453" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">420</text><text x="348" y="482" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Reduce</text><line x1="700" y1="280" x2="700" y2="405" stroke="#1565C0" stroke-width="2.7" marker-end="url(#ab)"/><rect x="600" y="420" width="200" height="300" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="618" y="453" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">420</text><text x="618" y="482" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Retain</text><line x1="700" y1="280" x2="970" y2="405" stroke="#1565C0" stroke-width="2.7" marker-end="url(#ab)"/><rect x="870" y="420" width="200" height="300" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="888" y="453" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">420</text><text x="888" y="482" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Transfer by contract</text><line x1="700" y1="280" x2="1240" y2="405" stroke="#1565C0" stroke-width="2.7" marker-end="url(#ab)"/><rect x="1140" y="420" width="200" height="300" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="1158" y="453" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">420</text><text x="1158" y="482" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Insure</text><rect x="350" y="780" width="700" height="75" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="368" y="813" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Insurance is one control</text><text x="368" y="842" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Prevention, reduction, retention and contractual allocation still matter even</text><text x="368" y="862" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">when cover exists.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Policy availability and legal/contractual insurance duties vary. Base cover decisions on the actual business risk register and current</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">contractual/legal requirements.</text></svg>