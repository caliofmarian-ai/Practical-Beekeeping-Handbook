<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 69.7 — Policy Anatomy</title><desc id="desc">Insurance policy fields including insured entity, business description, limits, excess, exclusions, territory, conditions and claims basis.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 69.7 — Policy Anatomy</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">The premium does not describe the cover. Read the schedule and policy wording together, including limits,</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">sublimits, excesses, exclusions and conditions.</text>
<rect x="135" y="155" width="1130" height="700" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="2.8"/><text x="170" y="198" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#1565C0" text-anchor="start">POLICY SCHEDULE / WORDING — READ AS A CONTRACT</text><rect x="170" y="235" width="320" height="160" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="188" y="268" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Named insured</text><text x="188" y="297" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Correct legal person/entity that</text><text x="188" y="317" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">receives cover.</text><rect x="525" y="235" width="320" height="160" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="543" y="268" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Business description</text><text x="543" y="297" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Declared</text><text x="543" y="317" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">activities/products/services</text><text x="543" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">within the insured operation.</text><rect x="880" y="235" width="320" height="160" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="898" y="268" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Limit / aggregate</text><text x="898" y="297" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Maximum insurer liability per</text><text x="898" y="317" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">event/claim and/or policy period</text><text x="898" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">as defined.</text><rect x="170" y="425" width="320" height="160" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="188" y="458" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Sublimit</text><text x="188" y="487" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Lower cap that may apply to a</text><text x="188" y="507" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">specific risk or cost.</text><rect x="525" y="425" width="320" height="160" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="543" y="458" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Excess / deductible</text><text x="543" y="487" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Amount retained by the insured</text><text x="543" y="507" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">before/alongside cover.</text><rect x="880" y="425" width="320" height="160" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="898" y="458" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Exclusions</text><text x="898" y="487" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Events, products, activities or</text><text x="898" y="507" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">circumstances not covered.</text><rect x="170" y="615" width="320" height="160" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="188" y="648" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Territory / jurisdiction</text><text x="188" y="677" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Where the policy applies and which</text><text x="188" y="697" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">legal jurisdictions are</text><text x="188" y="717" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">recognised.</text><rect x="525" y="615" width="320" height="160" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="543" y="648" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Conditions / warranties</text><text x="543" y="677" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Duties that can affect cover,</text><text x="543" y="697" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">notification, security,</text><text x="543" y="717" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">maintenance or risk controls.</text><rect x="880" y="615" width="320" height="160" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="898" y="648" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Claims basis</text><text x="898" y="677" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Occurrence, claims-made or other</text><text x="898" y="697" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">wording that determines when cover</text><text x="898" y="717" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">responds.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Policy wording varies by insurer and jurisdiction. Seek competent insurance advice for material risks rather than assuming a generic policy</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">automatically covers all beekeeping activities.</text></svg>