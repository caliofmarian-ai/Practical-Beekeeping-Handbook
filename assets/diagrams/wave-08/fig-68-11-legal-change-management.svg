<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 68.11 — Legal Change Management</title><desc id="desc">Legal Change Management process.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 68.11 — Legal Change Management</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Compliance should be maintained as a living change-control process rather than a one-time checklist.</text>
<rect x="220" y="160" width="960" height="88" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="238" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">1. Monitor official sources</text><text x="238" y="222" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Track competent authorities, legislation, official guidance and product/market rules.</text><line x1="700" y1="248" x2="700" y2="270" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="274" width="960" height="88" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="238" y="307" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">2. Assess applicability</text><text x="238" y="336" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Identify which products, activities, channels, labels, procedures and records are</text><text x="238" y="356" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">affected.</text><line x1="700" y1="362" x2="700" y2="384" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="388" width="960" height="88" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="238" y="421" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">3. Update controls</text><text x="238" y="450" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Revise procedures, labels, product pages, forms, contracts or training materials as</text><text x="238" y="470" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">required.</text><line x1="700" y1="476" x2="700" y2="498" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="502" width="960" height="88" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="238" y="535" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">4. Train / communicate</text><text x="238" y="564" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Ensure staff and relevant suppliers understand the changed control before effective use.</text><line x1="700" y1="590" x2="700" y2="612" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="616" width="960" height="88" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="238" y="649" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">5. Archive evidence</text><text x="238" y="678" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Keep dated source, decision, revision and implementation evidence.</text><line x1="700" y1="704" x2="700" y2="726" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="730" width="960" height="88" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="238" y="763" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">6. Schedule review</text><text x="238" y="792" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Set the next review / renewal trigger and monitor for further change.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Use official current sources. A blog, old checklist or previous label is not sufficient evidence that a legal requirement is still current.</text></svg>