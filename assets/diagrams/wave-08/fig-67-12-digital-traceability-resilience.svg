<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 67.12 — Digital Traceability Resilience</title><desc id="desc">Digital traceability system with controlled access, backup/export, tested restore and offline fallback.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 67.12 — Digital Traceability Resilience</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Digital records improve search and scale only if they remain available during an incident. Backup without tested</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">recovery is incomplete resilience.</text>
<rect x="485" y="160" width="430" height="120" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="503" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">PRIMARY TRACEABILITY DATABASE</text><text x="503" y="222" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Lot links, stock, dispatch, suppliers,</text><text x="503" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">treatments / source records as applicable.</text><line x1="700" y1="280" x2="225" y2="380" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="90" y="390" width="270" height="245" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="108" y="423" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Access control</text><text x="108" y="452" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Named users, least privilege,</text><text x="108" y="472" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">strong authentication and</text><text x="108" y="492" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">controlled export.</text><line x1="700" y1="280" x2="540" y2="380" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="405" y="390" width="270" height="245" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="423" y="423" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Backup / export</text><text x="423" y="452" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Independent copy in a</text><text x="423" y="472" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">recoverable format; not only</text><text x="423" y="492" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">the live database.</text><line x1="700" y1="280" x2="855" y2="380" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="720" y="390" width="270" height="245" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="738" y="423" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Tested restore</text><text x="738" y="452" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Restore is exercised so</text><text x="738" y="472" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">backup success is evidence,</text><text x="738" y="492" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">not assumption.</text><line x1="700" y1="280" x2="1170" y2="380" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="1035" y="390" width="270" height="245" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="1053" y="423" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Cyber / device failure</text><text x="1053" y="452" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Plan for ransomware, lost</text><text x="1053" y="472" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">device, outage or account</text><text x="1053" y="492" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">compromise.</text><rect x="325" y="715" width="750" height="100" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="343" y="748" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">OFFLINE RECALL CAPABILITY</text><text x="343" y="777" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">A current export / paper fallback should allow critical lot and destination</text><text x="343" y="797" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">information to be recovered when the normal system is unavailable.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Security controls should match the operation and data sensitivity. Do not store the only copy of traceability evidence inside one account or</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">device.</text></svg>