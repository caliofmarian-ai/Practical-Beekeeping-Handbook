<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 66.3 — Product-Risk Comparison</title><desc id="desc">Five hive-product risk profiles compared by perishability and control needs.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#fff"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 66.3 — Product-Risk Comparison</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Hive products do not share one food-safety profile. Moisture, ingredients, processing and storage requirements</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">change the hazard picture.</text>
<rect x="55" y="165" width="410" height="295" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="73" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Mature honey</text><text x="73" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Low water activity relative to many foods;</text><text x="73" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">key risks include moisture gain, residues,</text><text x="73" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">foreign bodies, packaging and</text><text x="73" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">traceability.</text><text x="260" y="390" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#2E7D32" text-anchor="middle">comparatively stable</text><rect x="500" y="165" width="410" height="295" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="518" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Pollen</text><text x="518" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">More perishable; moisture, microbial,</text><text x="518" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">allergen and contaminant controls are more</text><text x="518" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">demanding.</text><text x="705" y="390" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#EF6C00" text-anchor="middle">product-specific controls</text><rect x="945" y="165" width="410" height="295" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="963" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Royal jelly</text><text x="963" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Highly perishable; rapid hygienic</text><text x="963" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">collection and validated cold-chain</text><text x="963" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">control are central.</text><text x="1150" y="390" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#C62828" text-anchor="middle">cold chain critical</text><rect x="55" y="505" width="410" height="295" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="73" y="538" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Propolis extract</text><text x="73" y="567" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Risk depends on extraction system,</text><text x="73" y="587" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">solvent/water content, ingredients,</text><text x="73" y="607" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">residues and intended product category.</text><text x="260" y="730" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#6A1B9A" text-anchor="middle">product-specific controls</text><rect x="500" y="505" width="410" height="295" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="518" y="538" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Flavoured honey / added ingredients</text><text x="518" y="567" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Added ingredients can change allergens,</text><text x="518" y="587" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">water activity, microbiology, formulation</text><text x="518" y="607" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">stability and legal product naming.</text><text x="705" y="730" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#EF6C00" text-anchor="middle">product-specific controls</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">This is a relative control comparison, not a legal risk ranking. Apply the specification and competent-authority requirements relevant to each</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">product.</text></svg>