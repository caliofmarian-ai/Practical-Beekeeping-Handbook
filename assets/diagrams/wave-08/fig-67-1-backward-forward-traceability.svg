<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 67.1 — Backward and Forward Traceability</title><desc id="desc">Backward jar-to-source and forward source-to-destination traceability paths.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 67.1 — Backward and Forward Traceability</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Traceability should work in both directions: from a finished lot back to its sources and from a source forward</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">to affected product and business destinations.</text>
<text x="700" y="155" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#6A1B9A" text-anchor="middle">BACKWARD TRACEABILITY</text><rect x="80" y="215" width="250" height="130" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="98" y="248" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Finished jar</text><text x="98" y="277" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Pack lot</text><line x1="330" y1="280" x2="365" y2="280" stroke="#6A1B9A" stroke-width="3" marker-end="url(#ab)"/><rect x="380" y="215" width="250" height="130" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="398" y="248" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Pack lot</text><text x="398" y="277" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Bulk tank</text><line x1="630" y1="280" x2="665" y2="280" stroke="#6A1B9A" stroke-width="3" marker-end="url(#ab)"/><rect x="680" y="215" width="250" height="130" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="698" y="248" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Tank</text><text x="698" y="277" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Extraction / harvest</text><line x1="930" y1="280" x2="965" y2="280" stroke="#6A1B9A" stroke-width="3" marker-end="url(#ab)"/><rect x="980" y="215" width="250" height="130" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="998" y="248" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Harvest</text><text x="998" y="277" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Apiary / source</text><text x="700" y="465" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#2E7D32" text-anchor="middle">FORWARD TRACEABILITY</text><rect x="80" y="525" width="250" height="130" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="98" y="558" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Apiary / source</text><text x="98" y="587" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Harvest</text><line x1="330" y1="590" x2="365" y2="590" stroke="#2E7D32" stroke-width="3" marker-end="url(#ag)"/><rect x="380" y="525" width="250" height="130" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="398" y="558" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Harvest</text><text x="398" y="587" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Tank / process</text><line x1="630" y1="590" x2="665" y2="590" stroke="#2E7D32" stroke-width="3" marker-end="url(#ag)"/><rect x="680" y="525" width="250" height="130" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="698" y="558" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Packed lot</text><text x="698" y="587" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Inventory</text><line x1="930" y1="590" x2="965" y2="590" stroke="#2E7D32" stroke-width="3" marker-end="url(#ag)"/><rect x="980" y="525" width="250" height="130" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="998" y="558" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Business customers / channels</text><text x="998" y="587" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Dispatch record</text><rect x="360" y="735" width="680" height="105" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="378" y="768" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Internal links make external traceability useful</text><text x="378" y="797" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Strong records connect ingredients/materials, process lots, stock and</text><text x="378" y="817" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">destinations so incidents can be scoped quickly.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">External legal duties vary by jurisdiction; internal traceability should be designed strongly enough to support investigation, withdrawal and</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">recall.</text></svg>