<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 68.4 — Primary Production Versus Processing/Packing</title><desc id="desc">Conceptual distinction between primary production and later processing or packing activities.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 68.4 — Primary Production Versus Processing/Packing</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Food-law duties follow the activity being carried out. Primary production and later processing/packing may be</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">subject to different hygiene provisions and registration arrangements.</text>
<rect x="70" y="170" width="600" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Primary production + associated operations</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Apiary production and associated handling/storage at the</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">place of production are commonly treated under</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">primary-production hygiene frameworks where the product is</text><text x="88" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">not substantially altered.</text><text x="370" y="455" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#2E7D32" text-anchor="middle">APIARY</text><line x1="280" y1="500" x2="460" y2="500" stroke="#2E7D32" stroke-width="5" marker-end="url(#ag)"/><text x="370" y="545" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2E7D32" text-anchor="middle">harvest / on-site handling</text><rect x="730" y="170" width="600" height="610" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="748" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Processing / packing / later food-business activities</text><text x="748" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Extraction, processing, packing, retail or other</text><text x="748" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">activities can trigger additional establishment, hygiene,</text><text x="748" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">HACCP-based, labelling and authority requirements</text><text x="748" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">depending on jurisdiction.</text><text x="1030" y="455" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#6A1B9A" text-anchor="middle">PROCESS / PACK</text><line x1="940" y1="500" x2="1120" y2="500" stroke="#6A1B9A" stroke-width="5" marker-end="url(#ab)"/><text x="1030" y="545" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#6A1B9A" text-anchor="middle">premises + process controls</text><rect x="440" y="810" width="520" height="72" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="458" y="843" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">JURISDICTION CHECKPOINT</text><text x="458" y="872" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">The boundary is a legal classification question; confirm</text><text x="458" y="892" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">current competent-authority rules for the activity and</text><text x="458" y="912" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">premises.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Do not copy this diagram as a universal registration rule. Check the current authority and legal classification in the country where the business</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">operates.</text></svg>