<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 66.1 — Hive-to-Consumer Food-Safety Chain</title><desc id="desc">Food-safety checkpoints from apiary inputs through consumer dispatch.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#fff"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 66.1 — Hive-to-Consumer Food-Safety Chain</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Food safety begins in the apiary and continues through handling, processing, storage, packing and distribution.</text>
<rect x="55" y="255" width="200" height="330" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="73" y="288" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">1. Apiary inputs</text><text x="73" y="317" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Feed, medicines,</text><text x="73" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">equipment, water and</text><text x="73" y="357" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">smoker practice can</text><text x="73" y="377" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">create or control</text><text x="73" y="397" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">hazards.</text><line x1="255" y1="420" x2="280" y2="420" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="275" y="255" width="200" height="330" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="293" y="288" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">2. Harvest</text><text x="293" y="317" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Protect food from</text><text x="293" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">brood, chemicals,</text><text x="293" y="357" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">rain, fuel, smoke and</text><text x="293" y="377" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">foreign material.</text><line x1="475" y1="420" x2="500" y2="420" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="495" y="255" width="200" height="330" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="513" y="288" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">3. Transport / receiving</text><text x="513" y="317" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Clean covered boxes,</text><text x="513" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">lot identity and</text><text x="513" y="357" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">inspection before</text><text x="513" y="377" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">processing.</text><line x1="695" y1="420" x2="720" y2="420" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="715" y="255" width="200" height="330" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="733" y="288" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">4. Extraction / processing</text><text x="733" y="317" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Clean dry food-contact</text><text x="733" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">surfaces; manage</text><text x="733" y="357" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">physical, chemical and</text><text x="733" y="377" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">biological hazards.</text><line x1="915" y1="420" x2="940" y2="420" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="935" y="255" width="200" height="330" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="953" y="288" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">5. Storage / packing</text><text x="953" y="317" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Moisture, pests,</text><text x="953" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">packaging integrity,</text><text x="953" y="357" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">lot identity and label</text><text x="953" y="377" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">controls.</text><line x1="1135" y1="420" x2="1160" y2="420" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="1155" y="255" width="200" height="330" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="1173" y="288" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">6. Dispatch / consumer</text><text x="1173" y="317" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Protect product in</text><text x="1173" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">distribution and</text><text x="1173" y="357" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">retain traceability /</text><text x="1173" y="377" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">complaint response.</text><rect x="295" y="650" width="810" height="110" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="313" y="683" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">CONTROL LOGIC</text><text x="313" y="712" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Hazard identified → preventive control → monitoring / evidence → corrective action →</text><text x="313" y="732" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">verification</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Controls must match the product and operation. Primary production, later processing and retail may sit under different hygiene requirements.</text></svg>