<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 56.3 — Bee Pollen Versus Bee Bread</title><desc id="desc">Trap-collected pollen pellets compared with pollen packed and processed in comb cells as bee bread.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 56.3 — Bee Pollen Versus Bee Bread</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Bee pollen and bee bread are related materials but not interchangeable product names or identical biological</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">states.</text>
<rect x="70" y="170" width="600" height="610" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Bee-collected pollen pellet</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Foragers pack moistened pollen loads onto the hind-leg</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">corbiculae. Trap-collected pellets are removed at the hive</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">entrance before storage in comb.</text><ellipse cx="230" cy="460" rx="22.400000000000002" ry="14.4" fill="#D98C10" stroke="#8D6E63" stroke-width="1.4"/><ellipse cx="320" cy="460" rx="22.400000000000002" ry="14.4" fill="#D98C10" stroke="#8D6E63" stroke-width="1.4"/><ellipse cx="410" cy="460" rx="22.400000000000002" ry="14.4" fill="#D98C10" stroke="#8D6E63" stroke-width="1.4"/><ellipse cx="230" cy="530" rx="22.400000000000002" ry="14.4" fill="#D98C10" stroke="#8D6E63" stroke-width="1.4"/><ellipse cx="320" cy="530" rx="22.400000000000002" ry="14.4" fill="#D98C10" stroke="#8D6E63" stroke-width="1.4"/><ellipse cx="410" cy="530" rx="22.400000000000002" ry="14.4" fill="#D98C10" stroke="#8D6E63" stroke-width="1.4"/><ellipse cx="230" cy="600" rx="22.400000000000002" ry="14.4" fill="#D98C10" stroke="#8D6E63" stroke-width="1.4"/><ellipse cx="320" cy="600" rx="22.400000000000002" ry="14.4" fill="#D98C10" stroke="#8D6E63" stroke-width="1.4"/><ellipse cx="410" cy="600" rx="22.400000000000002" ry="14.4" fill="#D98C10" stroke="#8D6E63" stroke-width="1.4"/><text x="370" y="700" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#EF6C00" text-anchor="middle">marketable hive product when hygienically collected</text><rect x="730" y="170" width="600" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="748" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Bee bread in the colony</text><text x="748" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Workers pack pollen into comb cells and add colony-derived</text><text x="748" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">materials such as nectar/honey and glandular</text><text x="748" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">contributions. Stored pollen changes during hive storage</text><text x="748" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and is not identical to a trap-collected pellet.</text><rect x="830" y="420" width="400" height="245" rx="8" fill="url(#hex)" stroke="#8D6E63" stroke-width="3"/><circle cx="885" cy="475" r="16" fill="#D98C10" stroke="#8D6E63" stroke-width="1.3"/><circle cx="885" cy="537" r="16" fill="#C06A1B" stroke="#8D6E63" stroke-width="1.3"/><circle cx="885" cy="599" r="16" fill="#9A5C22" stroke="#8D6E63" stroke-width="1.3"/><circle cx="940" cy="475" r="16" fill="#D98C10" stroke="#8D6E63" stroke-width="1.3"/><circle cx="940" cy="537" r="16" fill="#C06A1B" stroke="#8D6E63" stroke-width="1.3"/><circle cx="940" cy="599" r="16" fill="#9A5C22" stroke="#8D6E63" stroke-width="1.3"/><circle cx="995" cy="475" r="16" fill="#D98C10" stroke="#8D6E63" stroke-width="1.3"/><circle cx="995" cy="537" r="16" fill="#C06A1B" stroke="#8D6E63" stroke-width="1.3"/><circle cx="995" cy="599" r="16" fill="#9A5C22" stroke="#8D6E63" stroke-width="1.3"/><circle cx="1050" cy="475" r="16" fill="#D98C10" stroke="#8D6E63" stroke-width="1.3"/><circle cx="1050" cy="537" r="16" fill="#C06A1B" stroke="#8D6E63" stroke-width="1.3"/><circle cx="1050" cy="599" r="16" fill="#9A5C22" stroke="#8D6E63" stroke-width="1.3"/><circle cx="1105" cy="475" r="16" fill="#D98C10" stroke="#8D6E63" stroke-width="1.3"/><circle cx="1105" cy="537" r="16" fill="#C06A1B" stroke="#8D6E63" stroke-width="1.3"/><circle cx="1105" cy="599" r="16" fill="#9A5C22" stroke="#8D6E63" stroke-width="1.3"/><circle cx="1160" cy="475" r="16" fill="#D98C10" stroke="#8D6E63" stroke-width="1.3"/><circle cx="1160" cy="537" r="16" fill="#C06A1B" stroke="#8D6E63" stroke-width="1.3"/><circle cx="1160" cy="599" r="16" fill="#9A5C22" stroke="#8D6E63" stroke-width="1.3"/><text x="1030" y="700" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2E7D32" text-anchor="middle">stored comb food ≠ entrance-trap pellet</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Avoid reducing bee-bread formation to a single universal 'fermentation recipe'; botanical source, colony handling and storage conditions vary.</text>
</svg>