<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 53.10 — Rework Decision</title><desc id="desc">Decision flow separating potentially reworkable texture defects from contaminated or fermenting product.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 53.10 — Rework Decision</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Rework is a controlled quality decision, not a route for hiding unsafe, fermenting or contaminated product.</text>
<rect x="220" y="190" width="960" height="100" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="238" y="223" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">1. Product defect identified</text><text x="238" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Record lot, texture, moisture/quality data and processing history.</text><line x1="700" y1="290" x2="700" y2="315" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="320" width="960" height="100" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="238" y="353" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">2. Fermentation, contamination or safety concern?</text><text x="238" y="382" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">If yes: quarantine and evaluate; do not blend it back into ordinary table honey.</text><line x1="700" y1="420" x2="700" y2="445" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="450" width="960" height="100" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="238" y="483" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">3. Otherwise compliant but gritty / coarse?</text><text x="238" y="512" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Confirm specification and whether controlled re-liquefaction/reprocessing is technically</text><text x="238" y="532" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">justified.</text><line x1="700" y1="550" x2="700" y2="575" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="580" width="960" height="100" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="238" y="613" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">4. Reprocess under documented control</text><text x="238" y="642" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Limit unnecessary heat, preserve lot traceability and prevent new contamination.</text><line x1="700" y1="680" x2="700" y2="705" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="710" width="960" height="100" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="238" y="743" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">5. Verify finished specification</text><text x="238" y="772" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Texture, moisture, sensory condition, packaging and label must meet the intended product</text><text x="238" y="792" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">requirements.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Applicable food law, lot specifications and traceability requirements govern whether rework is permitted and how it must be documented.</text>
</svg>