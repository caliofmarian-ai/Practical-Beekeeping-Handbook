<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 57.4 — Trap Collection Versus Random Scraping</title><desc id="desc">Clean dedicated propolis trapping compared with uncontrolled scraping from hive surfaces.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 57.4 — Trap Collection Versus Random Scraping</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Product quality starts at collection. A controlled trap reduces the risk of mixing resin with construction</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">coatings, debris and unknown surface contaminants.</text>
<rect x="70" y="170" width="600" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Controlled flexible trap</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">A clean dedicated trap encourages resin deposition on a</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">known product-contact material and keeps collection</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">separated from paint, timber fibres and old hive debris.</text><rect x="170" y="430" width="400" height="220" rx="8" fill="#F5F5F5" stroke="#1F2933" stroke-width="3"/><rect x="210" y="470" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="210" y="512" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="210" y="554" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="210" y="596" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="255" y="470" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="255" y="512" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="255" y="554" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="255" y="596" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="300" y="470" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="300" y="512" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="300" y="554" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="300" y="596" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="345" y="470" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="345" y="512" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="345" y="554" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="345" y="596" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="390" y="470" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="390" y="512" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="390" y="554" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="390" y="596" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="435" y="470" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="435" y="512" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="435" y="554" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="435" y="596" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="480" y="470" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="480" y="512" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="480" y="554" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="480" y="596" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="525" y="470" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="525" y="512" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="525" y="554" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><rect x="525" y="596" width="28" height="20" rx="3" fill="#8A5A2B" stroke="#8D6E63" stroke-width="1.2"/><path d="M 557.4 650 L 571 664.4 L 597.4 634" fill="none" stroke="#2E7D32" stroke-width="5"/><rect x="730" y="170" width="600" height="610" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="748" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Random hive scraping</text><text x="748" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Scraping painted, treated, dirty or unknown surfaces can</text><text x="748" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">mix propolis with wax, wood fibres, paint, dead insects,</text><text x="748" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">dust and treatment residues.</text><rect x="830" y="430" width="400" height="220" rx="8" fill="#D9C3A5" stroke="#8D6E63" stroke-width="3"/><path d="M 850 500 L 1210 570" fill="none" stroke="#4E342E" stroke-width="8"/><path d="M 900 470 L 1130 620" fill="none" stroke="#607D8B" stroke-width="7"/><circle cx="1050" cy="530" r="32" fill="#8A5A2B" stroke="#8D6E63" stroke-width="2"/><line x1="1215.6" y1="635.6" x2="1244.4" y2="664.4" stroke="#C62828" stroke-width="5"/><line x1="1244.4" y1="635.6" x2="1215.6" y2="664.4" stroke="#C62828" stroke-width="5"/>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Trap material itself must be suitable for the intended product system. Colour alone cannot prove propolis identity, purity or grade.</text>
</svg>