<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 56.2 — Pollen in Colony Nutrition</title><desc id="desc">Pollen and carbohydrate pathways converging on nurse-bee and brood-rearing functions.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 56.2 — Pollen in Colony Nutrition</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Pollen is the colony's principal protein-rich forage; nectar/honey provides carbohydrate energy. Both resource</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">streams matter but fulfil different nutritional roles.</text>
<rect x="70" y="175" width="420" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="88" y="208" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Pollen / bee-bread pathway</text><text x="88" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Pollen provides major protein, lipid,</text><text x="88" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">sterol, vitamin and mineral resources</text><text x="88" y="277" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">used in worker development and</text><text x="88" y="297" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">brood-food production.</text><ellipse cx="280" cy="405" rx="35" ry="22.5" fill="#D98C10" stroke="#8D6E63" stroke-width="1.4"/><line x1="280" y1="435" x2="280" y2="520" stroke="#2E7D32" stroke-width="4" marker-end="url(#ag)"/><rect x="145" y="540" width="270" height="150" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="163" y="573" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Nurse-bee nutrition</text><text x="163" y="602" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Supports hypopharyngeal-gland</text><text x="163" y="622" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">function, fat-body condition and</text><text x="163" y="642" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">brood-rearing capacity.</text><rect x="910" y="175" width="420" height="610" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="928" y="208" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Nectar / honey pathway</text><text x="928" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Carbohydrate-rich forage and stores</text><text x="928" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">provide much of the colony's readily</text><text x="928" y="277" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">available energy for flight,</text><text x="928" y="297" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">thermoregulation and work.</text><circle cx="1120" cy="420" r="55" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><text x="1120" y="428" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8D6E63" text-anchor="middle">ENERGY</text><line x1="1120" y1="480" x2="1120" y2="560" stroke="#8D6E63" stroke-width="4" marker-end="url(#ab)"/><rect x="985" y="580" width="270" height="110" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="1003" y="613" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Energy availability</text><text x="1003" y="642" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Protein-rich pollen and</text><text x="1003" y="662" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">carbohydrate energy are</text><text x="1003" y="682" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">complementary, not</text><text x="1003" y="702" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">interchangeable.</text><rect x="535" y="280" width="330" height="380" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="553" y="313" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">BROOD-REARING SYSTEM</text><text x="553" y="342" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Adult nurse bees integrate dietary</text><text x="553" y="362" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">resources into brood care. Pollen</text><text x="553" y="382" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">shortage can constrain brood support</text><text x="553" y="402" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">even when carbohydrate stores are</text><text x="553" y="422" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">adequate.</text><line x1="490" y1="465" x2="535" y2="465" stroke="#2E7D32" stroke-width="3" marker-end="url(#ab)"/><line x1="910" y1="465" x2="865" y2="465" stroke="#8D6E63" stroke-width="3" marker-end="url(#ab)"/>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Pollen composition varies greatly by plant source. The figure shows functional roles, not a universal nutrient recipe or a human-health claim.</text>
</svg>