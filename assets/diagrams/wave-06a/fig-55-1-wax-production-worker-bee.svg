<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 55.1 — Wax Production by a Worker Bee</title><desc id="desc">Ventral worker-bee schematic and abdominal inset locating paired wax mirrors on sternites IV to VII.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 55.1 — Wax Production by a Worker Bee</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Wax production is an abdominal worker-bee function. The route shown connects the wax-mirror region, external wax</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">scales, leg transfer and mandibular manipulation.</text>
<rect x="55" y="165" width="560" height="670" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="73" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Worker underside — anatomical route</text><text x="73" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Wax glands are associated with the ventral abdominal</text><text x="73" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">sternites IV–VII. Each bears a paired wax-mirror</text><text x="73" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">area where secreted wax forms scales; workers remove</text><text x="73" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">scales with the legs and manipulate wax at the</text><text x="73" y="307" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">mandibles.</text><circle cx="270" cy="360" r="70" fill="#E0A419" stroke="#5D4037" stroke-width="3"/><ellipse cx="390" cy="400" rx="105" ry="80" fill="#E0A419" stroke="#5D4037" stroke-width="3"/><ellipse cx="405" cy="350" rx="80" ry="45" fill="#D9EEF7" stroke="#5D4037" stroke-width="1.5"/><ellipse cx="570" cy="440" rx="150" ry="110" fill="#E0A419" stroke="#5D4037" stroke-width="3"/><line x1="500" y1="350" x2="500" y2="525" stroke="#5D4037" stroke-width="2"/><line x1="545" y1="350" x2="545" y2="525" stroke="#5D4037" stroke-width="2"/><line x1="590" y1="350" x2="590" y2="525" stroke="#5D4037" stroke-width="2"/><line x1="635" y1="350" x2="635" y2="525" stroke="#5D4037" stroke-width="2"/><line x1="330" y1="430" x2="230" y2="610" stroke="#5D4037" stroke-width="5"/><line x1="430" y1="465" x2="350" y2="665" stroke="#5D4037" stroke-width="5"/><line x1="500" y1="490" x2="500" y2="700" stroke="#5D4037" stroke-width="5"/><line x1="560" y1="480" x2="665" y2="675" stroke="#5D4037" stroke-width="5"/><line x1="445" y1="470" x2="390" y2="650" stroke="#5D4037" stroke-width="5"/><line x1="340" y1="440" x2="285" y2="615" stroke="#5D4037" stroke-width="5"/><line x1="540" y1="515" x2="505" y2="650" stroke="#6A1B9A" stroke-width="4" marker-end="url(#ab)"/><line x1="505" y1="650" x2="310" y2="470" stroke="#6A1B9A" stroke-width="4" marker-end="url(#ab)"/><line x1="310" y1="470" x2="250" y2="385" stroke="#6A1B9A" stroke-width="4" marker-end="url(#ab)"/><text x="315" y="740" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#6A1B9A" text-anchor="middle">wax scale → leg transfer → mandibles</text><rect x="655" y="165" width="690" height="670" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="673" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Abdominal wax-mirror inset</text><text x="673" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Four posterior normal worker sternites (IV–VII) carry four</text><text x="673" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">paired wax-mirror regions: eight mirrors in total. Wax</text><text x="673" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">fractions pass through the gland/mirror complex and harden</text><text x="673" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">externally as thin scales.</text><rect x="800" y="365" width="400" height="75" rx="12" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.5"/><text x="755" y="410" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1F2933" text-anchor="middle">IV</text><ellipse cx="900" cy="403" rx="55" ry="22" fill="#FFFDF3" stroke="#6A1B9A" stroke-width="2"/><ellipse cx="1100" cy="403" rx="55" ry="22" fill="#FFFDF3" stroke="#6A1B9A" stroke-width="2"/><text x="1000" y="408" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#6A1B9A" text-anchor="middle">paired wax mirrors</text><path d="M 930 431 Q 1000 455 1070 431" fill="none" stroke="#D4A017" stroke-width="3"/><rect x="800" y="460" width="400" height="75" rx="12" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.5"/><text x="755" y="505" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1F2933" text-anchor="middle">V</text><ellipse cx="900" cy="498" rx="55" ry="22" fill="#FFFDF3" stroke="#6A1B9A" stroke-width="2"/><ellipse cx="1100" cy="498" rx="55" ry="22" fill="#FFFDF3" stroke="#6A1B9A" stroke-width="2"/><text x="1000" y="503" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#6A1B9A" text-anchor="middle">paired wax mirrors</text><path d="M 930 526 Q 1000 550 1070 526" fill="none" stroke="#D4A017" stroke-width="3"/><rect x="800" y="555" width="400" height="75" rx="12" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.5"/><text x="755" y="600" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1F2933" text-anchor="middle">VI</text><ellipse cx="900" cy="593" rx="55" ry="22" fill="#FFFDF3" stroke="#6A1B9A" stroke-width="2"/><ellipse cx="1100" cy="593" rx="55" ry="22" fill="#FFFDF3" stroke="#6A1B9A" stroke-width="2"/><text x="1000" y="598" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#6A1B9A" text-anchor="middle">paired wax mirrors</text><path d="M 930 621 Q 1000 645 1070 621" fill="none" stroke="#D4A017" stroke-width="3"/><rect x="800" y="650" width="400" height="75" rx="12" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.5"/><text x="755" y="695" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1F2933" text-anchor="middle">VII</text><ellipse cx="900" cy="688" rx="55" ry="22" fill="#FFFDF3" stroke="#6A1B9A" stroke-width="2"/><ellipse cx="1100" cy="688" rx="55" ry="22" fill="#FFFDF3" stroke="#6A1B9A" stroke-width="2"/><text x="1000" y="693" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#6A1B9A" text-anchor="middle">paired wax mirrors</text><text x="1000" y="780" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#52606D" text-anchor="middle">schematic ventral view; not to scale</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Anatomical placement follows current standard beeswax references; the drawing is a labelled technical schematic, not a scale reconstruction of</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">gland histology.</text>
</svg>