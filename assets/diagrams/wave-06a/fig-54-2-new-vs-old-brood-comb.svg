<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">The cross-section is conceptual. Source history and analytical evidence matter more than colour alone when deciding wax quality or end use.</text>
