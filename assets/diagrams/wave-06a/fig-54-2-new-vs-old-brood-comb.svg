/><circle cx="490" cy="480" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="490" cy="540" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="490" cy="600" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="548" cy="480" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="548" cy="540" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><circle cx="548" cy="600" r="18" fill="#FFF4C8" stroke="#D4C27A" stroke-width="2"/><rect x="730" y="170" width="600" height="610" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="748" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Repeatedly used brood comb</text><text x="748" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Cocoon layers, propolis, pollen/larval residues and debris</text><text x="748" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">progressively occupy cell walls. A heavy dark frame is not</text><text x="748" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">equivalent to the same mass of recoverable beeswax.</text><rect x="810" y="430" width="440" height="250" rx="8" fill="#D7B58A" stroke="#8D6E63" stroke-width="3"/><circle cx="860" cy="480" r="22" fill="#A46E3A" stroke="#8D6E63" stroke-width="2"/><circle cx="860" cy="480" r="15" fill="#D2A77C" stroke="#8A5A2B" stroke-width="2"/><circle cx="860" cy="480" r="9" fill="#E5C9A9" stroke="#A46E3A" stroke-width="1"/><circle cx="860" cy="540" r="22" fill="#A46E3A" stroke="#8D6E63" stroke-width="2"/><circle cx="860" cy="540" r="15" fill="#D2A77C" stroke="#8A5A2B" stroke-width="2"/><circle cx="860" cy="540" r="9" fill="#E5C9A9" stroke="#A46E3A" stroke-width="1"/><circle cx="860" cy="600" r="22" fill="#A46E3A" 