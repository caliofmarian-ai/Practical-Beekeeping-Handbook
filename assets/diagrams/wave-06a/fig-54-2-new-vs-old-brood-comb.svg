<title id="title">Figure 54.2 — New Comb Versus Old Brood Comb</title><desc id="desc">Fresh/light comb compared with repeatedly used brood comb containing accumulated non-wax material.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
