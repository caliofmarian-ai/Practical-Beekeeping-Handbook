<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 54.1 — Wax Source Streams</title><desc id="desc">Separated wax-bearing source streams and destination controls.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 54.1 — Wax Source Streams</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Cappings, light super wax, brood comb, mixed scrapings and suspect material should remain separate until their</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">intended use is justified.</text>
<text x="700" y="165" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#1F2933" text-anchor="middle">SOURCE MATERIAL MUST STAY SEPARATED UNTIL ITS DESTINATION IS JUSTIFIED</text><rect x="100" y="205" width="520" height="95" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="118" y="238" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Clean cappings wax</text><text x="118" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Usually pale, low in brood debris; keep</text><text x="118" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">traceability to harvest/treatment history.</text><line x1="635" y1="252" x2="830" y2="252" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="850" y="205" width="450" height="95" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="868" y="238" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">higher-value / controlled stream</text><text x="868" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Destination depends on source history,</text><text x="868" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">quality evidence and intended end use.</text><rect x="100" y="330" width="520" height="95" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="118" y="363" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Light honey-super comb</text><text x="118" y="392" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Useful wax stream when brood history is</text><text x="118" y="412" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">absent/controlled.</text><line x1="635" y1="377" x2="830" y2="377" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="850" y="330" width="450" height="95" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="868" y="363" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">higher-value / controlled stream</text><text x="868" y="392" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Destination depends on source history,</text><text x="868" y="412" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">quality evidence and intended end use.</text><rect x="100" y="455" width="520" height="95" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="118" y="488" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Old brood comb</text><text x="118" y="517" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Contains cocoon layers, propolis and brood debris;</text><text x="118" y="537" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">may have longer chemical-exposure history.</text><line x1="635" y1="502" x2="830" y2="502" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="850" y="455" width="450" height="95" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="868" y="488" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">separate lower-grade stream</text><text x="868" y="517" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Destination depends on source history,</text><text x="868" y="537" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">quality evidence and intended end use.</text><rect x="100" y="580" width="520" height="95" rx="16" fill="#F5F5F5" stroke="#757575" stroke-width="2.3"/><text x="118" y="613" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#757575" text-anchor="start">Propolis-rich scrapings</text><text x="118" y="642" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Mixed material; separate from clean wax streams</text><text x="118" y="662" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">rather than degrading higher-value lots.</text><line x1="635" y1="627" x2="830" y2="627" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="850" y="580" width="450" height="95" rx="16" fill="#F5F5F5" stroke="#757575" stroke-width="2.3"/><text x="868" y="613" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#757575" text-anchor="start">separate mixed stream</text><text x="868" y="642" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Destination depends on source history,</text><text x="868" y="662" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">quality evidence and intended end use.</text><rect x="100" y="705" width="520" height="95" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="118" y="738" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Disease / chemical-suspect material</text><text x="118" y="767" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">HOLD. Do not assume melting or filtering makes it</text><text x="118" y="787" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">suitable for reuse or sale.</text><line x1="635" y1="752" x2="830" y2="752" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="850" y="705" width="450" height="95" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="868" y="738" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">quarantine / competent decision</text><text x="868" y="767" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Destination depends on source history,</text><text x="868" y="787" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">quality evidence and intended end use.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Melting and filtering remove physical material but do not automatically eliminate wax-soluble residues or establish disease/grade suitability.</text>
</svg>