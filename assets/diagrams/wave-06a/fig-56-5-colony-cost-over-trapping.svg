<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 56.5 — Colony Cost of Over-Trapping</title><desc id="desc">Balanced pollen collection compared with excessive removal and reduced colony pollen reserves.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 56.5 — Colony Cost of Over-Trapping</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Commercial pollen harvest competes directly with colony nutrition; trap operation must respond to actual colony</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">and forage conditions.</text>
<rect x="70" y="170" width="600" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Balanced collection</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Trap use is adjusted to colony strength, pollen inflow,</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">brood demand and stored reserves. Adequate pollen</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">continues into the brood nest.</text><rect x="180" y="450" width="380" height="160" rx="8" fill="url(#hex)" stroke="#8D6E63" stroke-width="3"/><circle cx="220" cy="500" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="262" cy="500" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="304" cy="500" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="346" cy="500" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="388" cy="500" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="430" cy="500" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="472" cy="500" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="514" cy="500" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="220" cy="555" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="262" cy="555" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="304" cy="555" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="346" cy="555" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="388" cy="555" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="430" cy="555" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="472" cy="555" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="514" cy="555" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><path d="M 553.5 560 L 566.25 573.5 L 591 545" fill="none" stroke="#2E7D32" stroke-width="5"/><text x="370" y="690" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2E7D32" text-anchor="middle">stores + brood support maintained</text><rect x="730" y="170" width="600" height="610" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="748" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Excessive removal</text><text x="748" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Chronic over-trapping can divert too much incoming pollen</text><text x="748" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">away from colony nutrition. Reduced stores increase</text><text x="748" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">pressure on nurse-bee and brood-rearing capacity.</text><rect x="840" y="450" width="380" height="160" rx="8" fill="url(#hex)" stroke="#8D6E63" stroke-width="3"/><circle cx="900" cy="525" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="970" cy="525" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="1040" cy="525" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><circle cx="1110" cy="525" r="13" fill="#D98C10" stroke="#8D6E63" stroke-width="1"/><line x1="1216.5" y1="546.5" x2="1243.5" y2="573.5" stroke="#C62828" stroke-width="5"/><line x1="1243.5" y1="546.5" x2="1216.5" y2="573.5" stroke="#C62828" stroke-width="5"/><text x="1030" y="690" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#C62828" text-anchor="middle">reduced pollen reserve</text><rect x="440" y="805" width="520" height="72" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="458" y="838" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">No universal trapping percentage</text><text x="458" y="867" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Reduce or stop trapping when colony condition, stores or</text><text x="458" y="887" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">forage no longer support commercial removal.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">The figure intentionally omits a universal trap-on schedule or percentage. Monitor colony strength, brood, intake and stores.</text>
</svg>