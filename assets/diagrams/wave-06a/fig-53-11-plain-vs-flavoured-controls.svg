<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 53.11 — Plain Versus Flavoured Product Controls</title><desc id="desc">Comparison of plain creamed honey controls with additional controls introduced by added ingredients.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 53.11 — Plain Versus Flavoured Product Controls</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Ingredient-added products are not just a flavour variation; formulation, allergens, stability, traceability and</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">legal naming may change.</text>
<rect x="70" y="170" width="600" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Plain creamed honey</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Honey lot identity, moisture/quality control,</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">crystallisation process, packaging and ordinary honey</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">labelling remain the core controls.</text><rect x="250" y="470" width="240" height="180" rx="22" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><text x="370" y="555" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#8D6E63" text-anchor="middle">CREAMED</text><text x="370" y="585" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#8D6E63" text-anchor="middle">HONEY</text><rect x="730" y="170" width="600" height="610" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="748" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Ingredient-added / flavoured product</text><text x="748" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Adding other ingredients changes the control system:</text><text x="748" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">ingredient traceability, allergen review,</text><text x="748" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">moisture/water-activity effects, formulation stability and</text><text x="748" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">potentially a different legal product name/label.</text><rect x="900" y="470" width="240" height="180" rx="22" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><circle cx="1120" cy="500" r="28" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/><text x="1120" y="507" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#EF6C00" text-anchor="middle">+</text><rect x="430" y="810" width="540" height="72" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="448" y="843" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Key boundary</text><text x="448" y="872" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Do not market an ingredient-added product as plain honey where</text><text x="448" y="892" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">applicable law reserves that name for honey alone.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Product definitions and allergen/labelling rules are jurisdiction-specific. Use current market law and approved ingredient specifications.</text>
</svg>