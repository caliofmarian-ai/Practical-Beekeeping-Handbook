<title id="title">Figure 53.1 — Controlled Versus Uncontrolled Crystallisation</title><desc id="desc">Side-by-side conceptual microstructure of coarse and controlled fine honey crystallisation.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
