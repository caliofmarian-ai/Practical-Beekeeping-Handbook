"2"/><text x="1030" y="760" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#2E7D32" text-anchor="middle">many fine crystals</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Crystal size and behaviour depend on honey composition, seed quality and process history. The microstructure is conceptual, not microscope scale.</text>
