<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 53.1 — Controlled Versus Uncontrolled Crystallisation</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Creamed honey is controlled crystallisation, not added cream and not a foam structure.</text>
<rect x="70" y="170" width="600" height="600" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Uncontrolled coarse crystallisation</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Few nuclei allow some glucose crystals to grow large.</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">The result can feel gritty and may separate unevenly.</text><circle cx="370" cy="520" r="190" fill="#FFFDF4" stroke="#EF6C00" stroke-width="4"/><polygon points="300,395 347.6313972081441,422.5 347.6313972081441,477.5 300,505 252.3686027918559,477.5 252.3686027918559,422.5" fill="#F2F6FF" stroke="#1565C0" stroke-width="2"/><polygon points="420,395 480.6217782649107,430 480.6217782649107,500 420,535 359.3782217350893,500 359.3782217350893,430" fill="#F2F6FF" stroke="#1565C0" stroke-width="2"/><polygon points="345,520 401.29165124598853,552.5 401.29165124598853,617.5 345,650 288.70834875401147,617.5 288.70834875401147,552.5" fill="#F2F6FF" stroke="#1565C0" stroke-width="2"/><polygon points="470,528 506.3730669589464,549 506.3730669589464,591 470,612 433.6269330410536,591 433.6269330410536,549" fill="#F2F6FF" stroke="#1565C0" stroke-width="2"/><polygon points="260,555 290.3108891324554,572.5 290.3108891324554,607.5 260,625 229.68911086754466,607.5 229.68911086754466,572.5" fill="#F2F6FF" stroke="#1565C0" stroke-width="2"/><text x="370" y="760" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#EF6C00" text-anchor="middle">few large crystals</text><rect x="730" y="170" width="600" height="600" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="748" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Controlled fine crystallisation</text><text x="748" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Many fine seed crystals divide growth among numerous</text><text x="748" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">nuclei, producing a smooth spreadable texture when the</text><text x="748" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">process remains stable.</text><circle cx="1030" cy="520" r="190" fill="#FFFDF4" stroke="#2E7D32" stroke-width="4"/><polygon points="890,411 897.7942286340599,415.5 897.7942286340599,424.5 890,429 882.2057713659401,424.5 882.2057713659401,415.5" fill="#F2F6FF" stroke="#1565C0" stroke-width="2"/><polygon points="890,443 897.7942286340599,447.5 897.7942286340599,456.5 890,461 882.2057713659401,456.5 882.2057713659401,447.5" fill="#F2F6FF" stroke="#1565C0" stroke-width="2"/><polygon points="890,475 897.7942286340599,479.5 897.7942286340599,488.5 890,493 882.2057713659401,488.5 882.2057713659401,479.5" fill="#F2F6FF" stroke="#1565C0" stroke-width="2"/><polygon points="890,507 897.7942286340599,511.5 897.7942286340599,520.5 890,525 882.2057713659401,520.5 882.2057713659401,511.5" fill="#F2F6FF" stroke="#1565C0" stroke-width="2"/><polygon points="890,539 897.7942286340599,543.5 897.7942286340599,552.5 890,557 882.2057713659401,552.5 882.2057713659401,543.5" fill="#F2F6FF" stroke="#1565C0" stroke-width="2"/><polygon points="890,571 897.7942286340599,575.5 897.7942286340599,584.5 890,589 882.2057713659401,584.5 882.2057713659401,575.5" fill="#F2F6FF" stroke="#1565C0" stroke-width="2"/><polygon points="890,603 897.7942286340599,607.5 897.7942286340599,616.5 890,621 882.2057713659401,616.5 882.2057713659401,607.5" fill="#F2F6FF" stroke="#1565C0" stroke-width="2"/><polygon points="925,411 932.7942286340599,415.