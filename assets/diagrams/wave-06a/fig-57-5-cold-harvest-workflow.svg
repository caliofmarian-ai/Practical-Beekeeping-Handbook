<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-master-family="CLEAN_ZONE_SYSTEM" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 57.5 — Cold Harvest Workflow</title><desc id="desc">Cold propolis-harvest workflow from filled trap to identified raw material.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 57.5 — Cold Harvest Workflow</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Cold handling improves mechanical release and sorting while preserving lot identity; condensation control</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">matters when cold material meets warmer humid air.</text>
<rect x="220" y="165" width="960" height="92" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="238" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">1. Filled propolis trap</text><text x="238" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Remove a dedicated trap with source identity retained.</text><line x1="700" y1="257" x2="700" y2="279" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="283" width="960" height="92" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="238" y="316" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">2. Chill / freeze</text><text x="238" y="345" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Cooling makes propolis brittle enough for cleaner mechanical release.</text><line x1="700" y1="375" x2="700" y2="397" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="401" width="960" height="92" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="238" y="434" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">3. Brittle release</text><text x="238" y="463" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Flex or process the trap using the designed method; avoid dirty collection surfaces.</text><line x1="700" y1="493" x2="700" y2="515" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="519" width="960" height="92" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="238" y="552" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">4. Cold sorting</text><text x="238" y="581" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Remove visible foreign material while avoiding unnecessary warming/softening.</text><line x1="700" y1="611" x2="700" y2="633" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="637" width="960" height="92" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="238" y="670" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">5. Condensation control</text><text x="238" y="699" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Prevent moisture condensing onto cold propolis during transition to storage.</text><line x1="700" y1="729" x2="700" y2="751" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="755" width="960" height="92" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="238" y="788" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">6. Labelled raw-propolis container</text><text x="238" y="817" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Close, identify lot/source/date and store under the validated product plan.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">No single temperature is prescribed because trap design and validated handling systems differ. Prevent contamination and maintain traceability</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">throughout.</text>
</svg>