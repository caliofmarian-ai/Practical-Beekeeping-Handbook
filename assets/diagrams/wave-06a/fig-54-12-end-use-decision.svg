<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 54.12 — End-Use Decision</title><desc id="desc">Traceable wax lot branching to foundation, crafts, cosmetic and food-specification destinations.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 54.12 — End-Use Decision</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Rendered wax must be matched to an intended use using source history and the evidence required for that use.</text>
<rect x="485" y="170" width="430" height="120" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="503" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">TRACEABLE WAX LOT</text><text x="503" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Source stream + disease/treatment history +</text><text x="503" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">rendering record + quality evidence</text><line x1="700" y1="290" x2="205" y2="410" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="70" y="430" width="270" height="300" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="463" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">430</text><text x="88" y="492" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Foundation / hive reuse</text><line x1="700" y1="290" x2="525" y2="410" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="390" y="430" width="270" height="300" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="408" y="463" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">430</text><text x="408" y="492" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Candles / crafts</text><line x1="700" y1="290" x2="845" y2="410" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="710" y="430" width="270" height="300" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="728" y="463" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">430</text><text x="728" y="492" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Cosmetics</text><line x1="700" y1="290" x2="1165" y2="410" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="1030" y="430" width="270" height="300" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="1048" y="463" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">430</text><text x="1048" y="492" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Food-additive /</text><text x="1048" y="512" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">specification-controlled use</text><rect x="450" y="795" width="500" height="70" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="468" y="828" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">One lot ≠ every grade</text><text x="468" y="857" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Destination follows evidence and specification, not colour</text><text x="468" y="877" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">alone.</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Legal and specification requirements differ by market. Melting, filtering or pale colour do not by themselves establish cosmetic, food-additive</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">or foundation suitability.</text>
</svg>