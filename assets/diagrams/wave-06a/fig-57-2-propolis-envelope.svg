<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 57.2 — Propolis Envelope</title><desc id="desc">Natural cavity cross-section showing resin coating, crack sealing, entrance modification and object encapsulation.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<pattern id="hex" width="34" height="29.4" patternUnits="userSpaceOnUse"><path d="M8.5,1 L25.5,1 L33,14.7 L25.5,28.4 L8.5,28.4 L1,14.7 Z" fill="#FFF4C8" stroke="#D4C27A" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 57.2 — Propolis Envelope</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Propolis is a bee-processed plant-resin material used structurally and as part of the nest environment.</text>
<rect x="70" y="165" width="1260" height="115" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="88" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Natural nest resin use</text><text x="88" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Bees can apply propolis as a thin internal surface coating, seal narrow cracks, modify unwanted openings and</text><text x="88" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">encapsulate material too large to remove.</text><rect x="210" y="330" width="980" height="470" rx="80" fill="#EFE7D8" stroke="#8D6E63" stroke-width="14"/><rect x="275" y="390" width="850" height="350" rx="55" fill="#FFFDF4" stroke="#8A5A2B" stroke-width="8"/><path d="M 300 420 Q 420 385 540 420 T 780 420 T 1050 420" fill="none" stroke="#8A5A2B" stroke-width="7"/><text x="675" y="455" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#8A5A2B" text-anchor="middle">thin resin-rich internal coating</text><line x1="275" y1="560" x2="240" y2="530" stroke="#8D6E63" stroke-width="7"/><line x1="240" y1="530" x2="270" y2="505" stroke="#8A5A2B" stroke-width="10"/><text x="165" y="500" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#8A5A2B" text-anchor="start">sealed crack</text><rect x="560" y="710" width="230" height="30" rx="4" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/><rect x="560" y="710" width="75" height="30" rx="3" fill="#8A5A2B" stroke="#8A5A2B" stroke-width="1"/><rect x="715" y="710" width="75" height="30" rx="3" fill="#8A5A2B" stroke="#8A5A2B" stroke-width="1"/><text x="675" y="770" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#8A5A2B" text-anchor="middle">entrance modification</text><circle cx="975" cy="610" r="42" fill="#F5F5F5" stroke="#757575" stroke-width="3"/><circle cx="975" cy="610" r="56" fill="none" stroke="#8A5A2B" stroke-width="9"/><text x="975" y="690" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#8A5A2B" text-anchor="middle">encapsulation</text>
<rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
<text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Extent of propolis use varies among colonies, genetics and nesting conditions. This figure illustrates functions without implying one universal</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">envelope thickness or composition.</text>
</svg>