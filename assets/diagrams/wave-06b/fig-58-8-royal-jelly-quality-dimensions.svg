<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 58.8 — Royal Jelly Quality Dimensions</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Royal-jelly quality is multicomponent. Chemical markers, proteins, sensory condition, microbiology and</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">traceability answer different questions.</text>
<circle cx="700" cy="510" r="155" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="4"/><text x="700" y="490" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#6A1B9A" text-anchor="middle">ROYAL JELLY</text><text x="700" y="520" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#6A1B9A" text-anchor="middle">QUALITY</text><text x="700" y="552" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">MULTIPLE EVIDENCE</text><circle cx="700" cy="195" r="84" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="700" y="180" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1565C0" text-anchor="middle">Sensory</text><text x="700" y="213" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">appearance, odour,</text><text x="700" y="227" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">texture</text><line x1="700" y1="360" x2="700" y2="277" stroke="#1565C0" stroke-width="2.3"/><circle cx="946.8698059628387" cy="255.15964677189154" r="84" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="946.8698059628387" y="240.15964677189154" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1565C0" text-anchor="middle">Moisture</text><text x="946.8698059628387" y="273.1596467718915" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">water content /</text><text x="946.8698059628387" y="287.1596467718915" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">stability context</text><line x1="788.167787843871" y1="388.6474508437579" x2="898.6714152748559" y2="321.49904031063727" stroke="#1565C0" stroke-width="2.3"/><circle cx="1099.4437368439644" cy="412.6596467718916" r="84" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/><text x="1099.4437368439644" y="397.6596467718916" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#6A1B9A" text-anchor="middle">Protein / MRJP</text><text x="1099.4437368439644" y="414.6596467718916" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#6A1B9A" text-anchor="middle">profile</text><text x="1099.4437368439644" y="430.6596467718916" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">identity +</text><text x="1099.4437368439644" y="444.6596467718916" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">deterioration</text><text x="1099.4437368439644" y="458.6596467718916" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">evidence</text><line x1="842.658477444273" y1="463.6474508437579" x2="1021.4571025077619" y2="437.99904031063727" stroke="#6A1B9A" stroke-width="2.3"/><circle cx="1099.4437368439644" cy="607.3403532281084" r="84" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><text x="1099.4437368439644" y="592.3403532281084" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#8D6E63" text-anchor="middle">Sugars</text><text x="1099.4437368439644" y="625.3403532281084" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">composition</text><text x="1099.4437368439644" y="639.3403532281084" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">profile</text><line x1="842.658477444273" y1="556.3525491562422" x2="1021.4571025077619" y2="582.0009596893627" stroke="#8D6E63" stroke-width="2.3"/><circle cx="946.8698059628387" cy="764.8403532281085" r="84" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/><text x="946.8698059628387" y="749.8403532281085" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#6A1B9A" text-anchor="middle">10-HDA</text><text x="946.8698059628387" y="782.8403532281085" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">useful</text><text x="946.8698059628387" y="796.8403532281085" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">identity/quality</text><text x="946.8698059628387" y="810.8403532281085" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">marker, not</text><text x="946.8698059628387" y="824.8403532281085" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">complete freshness</text><text x="946.8698059628387" y="838.8403532281085" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">proxy</text><line x1="788.167787843871" y1="631.3525491562422" x2="898.6714152748559" y2="698.5009596893628" stroke="#6A1B9A" stroke-width="2.3"/><circle cx="700" cy="825" r="84" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="700" y="810" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1565C0" text-anchor="middle">Acidity</text><text x="700" y="843" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">product character</text><text x="700" y="857" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">/ control</text><line x1="700" y1="660" x2="700" y2="743" stroke="#1565C0" stroke-width="2.3"/><circle cx="453.13019403716135" cy="764.8403532281085" r="84" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="453.13019403716135" y="749.8403532281085" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#EF6C00" text-anchor="middle">Volatiles</text><text x="453.13019403716135" y="782.8403532281085" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">aroma + storage</text><text x="453.13019403716135" y="796.8403532281085" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">change evidence</text><line x1="611.832212156129" y1="631.3525491562422" x2="501.32858472514414" y2="698.5009596893628" stroke="#EF6C00" stroke-width="2.3"/><circle cx="300.5562631560355" cy="607.3403532281085" r="84" fill="#FFEBEE" stroke="#C62828" stroke-width="3"/><text x="300.5562631560355" y="592.3403532281085" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#C62828" text-anchor="middle">Microbiology</text><text x="300.5562631560355" y="625.3403532281085" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">hygiene / spoilage</text><text x="300.5562631560355" y="639.3403532281085" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">evidence</text><line x1="557.341522555727" y1="556.3525491562422" x2="378.5428974922381" y2="582.0009596893628" stroke="#C62828" stroke-width="2.3"/><circle cx="300.55626315603547" cy="412.65964677189163" r="84" fill="#FFEBEE" stroke="#C62828" stroke-width="3"/><text x="300.55626315603547" y="397.65964677189163" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#C62828" text-anchor="middle">Residues</text><text x="300.55626315603547" y="430.65964677189163" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">veterinary,</text><text x="300.55626315603547" y="444.65964677189163" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">pesticide or other</text><text x="300.55626315603547" y="458.65964677189163" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">contaminants</text><line x1="557.3415225557269" y1="463.6474508437579" x2="378.54289749223807" y2="437.9990403106373" stroke="#C62828" stroke-width="2.3"/><circle cx="453.13019403716123" cy="255.1596467718916" r="84" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="453.13019403716123" y="240.1596467718916" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#2E7D32" text-anchor="middle">Traceability</text><text x="453.13019403716123" y="273.15964677189163" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">source, harvest,</text><text x="453.13019403716123" y="287.15964677189163" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">handling, cold</text><text x="453.13019403716123" y="301.15964677189163" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1F2933" text-anchor="middle">chain</text><line x1="611.832212156129" y1="388.6474508437579" x2="501.328584725144" y2="321.49904031063727" stroke="#2E7D32" stroke-width="2.3"/><rect x="475" y="820" width="450" height="65" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="493" y="853" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">No single-marker shortcut</text><text x="493" y="882" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">10-HDA can support identity/quality control, but it</text><text x="493" y="902" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">does not by itself establish freshness, authenticity</text><text x="493" y="922" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">or overall safety.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Use the current specification and validated methods relevant to the market. Do not convert one laboratory marker into a universal freshness or</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">health claim.</text></svg>