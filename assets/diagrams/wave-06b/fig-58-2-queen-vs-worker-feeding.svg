<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 58.2 — Queen Versus Worker Feeding</title><desc id="desc">Parallel feeding concept comparing queen-destined and worker-destined larvae.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#fff"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 58.2 — Queen Versus Worker Feeding</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">All very young larvae receive glandular brood food. Queen-destined larvae are provisioned continuously and</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">abundantly with royal jelly, while worker feeding changes during development.</text>
<text x="350" y="165" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#2E7D32" text-anchor="middle">QUEEN-DESTINED</text><text x="1050" y="165" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#1565C0" text-anchor="middle">WORKER-DESTINED</text><rect x="100" y="205" width="500" height="570" rx="18" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><path d="M 230.75 300 C 246.5 279.75,271.25 279.75,289.25 297.75 C 271.25 318,248.75 318.9,230.75 300 Z" fill="#F8F2E6" stroke="#8D6E63" stroke-width="2"/><rect x="360" y="270" width="150" height="60" rx="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2"/><text x="435" y="305" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#8D6E63" text-anchor="middle">abundant RJ</text><line x1="260" y1="340" x2="260" y2="370" stroke="#2E7D32" stroke-width="3" marker-end="url(#ag)"/><path d="M 230.75 405 C 246.5 384.75,271.25 384.75,289.25 402.75 C 271.25 423,248.75 423.9,230.75 405 Z" fill="#F8F2E6" stroke="#8D6E63" stroke-width="2"/><rect x="360" y="375" width="150" height="60" rx="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2"/><text x="435" y="410" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#8D6E63" text-anchor="middle">abundant RJ</text><line x1="260" y1="445" x2="260" y2="475" stroke="#2E7D32" stroke-width="3" marker-end="url(#ag)"/><path d="M 230.75 510 C 246.5 489.75,271.25 489.75,289.25 507.75 C 271.25 528,248.75 528.9,230.75 510 Z" fill="#F8F2E6" stroke="#8D6E63" stroke-width="2"/><rect x="360" y="480" width="150" height="60" rx="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2"/><text x="435" y="515" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#8D6E63" text-anchor="middle">abundant RJ</text><line x1="260" y1="550" x2="260" y2="580" stroke="#2E7D32" stroke-width="3" marker-end="url(#ag)"/><path d="M 230.75 615 C 246.5 594.75,271.25 594.75,289.25 612.75 C 271.25 633,248.75 633.9,230.75 615 Z" fill="#F8F2E6" stroke="#8D6E63" stroke-width="2"/><rect x="360" y="585" width="150" height="60" rx="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2"/><text x="435" y="620" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#8D6E63" text-anchor="middle">abundant RJ</text><text x="350" y="735" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2E7D32" text-anchor="middle">continuous royal-jelly provisioning</text><rect x="800" y="205" width="500" height="570" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><path d="M 930.75 300 C 946.5 279.75,971.25 279.75,989.25 297.75 C 971.25 318,948.75 318.9,930.75 300 Z" fill="#F8F2E6" stroke="#8D6E63" stroke-width="2"/><rect x="1060" y="270" width="150" height="60" rx="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2"/><text x="1135" y="305" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#8D6E63" text-anchor="middle">glandular brood food</text><line x1="960" y1="340" x2="960" y2="370" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><path d="M 930.75 405 C 946.5 384.75,971.25 384.75,989.25 402.75 C 971.25 423,948.75 423.9,930.75 405 Z" fill="#F8F2E6" stroke="#8D6E63" stroke-width="2"/><rect x="1060" y="375" width="150" height="60" rx="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2"/><text x="1135" y="410" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#8D6E63" text-anchor="middle">glandular brood food</text><line x1="960" y1="445" x2="960" y2="475" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><path d="M 930.75 510 C 946.5 489.75,971.25 489.75,989.25 507.75 C 971.25 528,948.75 528.9,930.75 510 Z" fill="#F8F2E6" stroke="#8D6E63" stroke-width="2"/><rect x="1060" y="480" width="150" height="60" rx="10" fill="#F5F5F5" stroke="#757575" stroke-width="2"/><text x="1135" y="515" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#757575" text-anchor="middle">diet transitions</text><line x1="960" y1="550" x2="960" y2="580" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><path d="M 930.75 615 C 946.5 594.75,971.25 594.75,989.25 612.75 C 971.25 633,948.75 633.9,930.75 615 Z" fill="#F8F2E6" stroke="#8D6E63" stroke-width="2"/><rect x="1060" y="585" width="150" height="60" rx="10" fill="#F5F5F5" stroke="#757575" stroke-width="2"/><text x="1135" y="620" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#757575" text-anchor="middle">worker-brood diet</text><text x="1050" y="735" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1565C0" text-anchor="middle">feeding changes during larval development</text><rect x="470" y="810" width="460" height="70" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="488" y="843" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Developmental outcome is multifactorial</text><text x="488" y="872" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Royal-jelly provisioning is central to queen</text><text x="488" y="892" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">development, but the figure does not treat royal jelly</text><text x="488" y="912" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">as a single 'queen hormone'.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">This is a feeding-pattern concept, not a fixed recipe or exact volume schedule. Larval age, colony condition and nurse-bee physiology matter.</text></svg>