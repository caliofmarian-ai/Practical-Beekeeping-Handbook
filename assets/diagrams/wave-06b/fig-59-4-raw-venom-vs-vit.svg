<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 59.4 — Raw Venom Versus Venom Immunotherapy</title><desc id="desc">Strong comparison between raw hive-collected venom and specialist medicinal venom immunotherapy.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#fff"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 59.4 — Raw Venom Versus Venom Immunotherapy</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Raw bee venom and venom immunotherapy are not interchangeable categories. VIT is a regulated specialist medical</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">treatment for appropriately diagnosed venom allergy.</text>
<rect x="70" y="170" width="600" height="610" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">RAW HIVE VENOM / APITOXIN</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Collected biological raw material. Composition varies by</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">source, colony, season, collection and storage. It is a</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">potent allergen and is not automatically a medicinal</text><text x="88" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">product.</text><rect x="250" y="470" width="240" height="150" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="3"/><text x="370" y="535" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#C62828" text-anchor="middle">RAW VENOM</text><text x="370" y="570" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#C62828" text-anchor="middle">LOT</text><rect x="730" y="170" width="600" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="748" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">VENOM IMMUNOTHERAPY (VIT)</text><text x="748" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Evidence-based allergy treatment using standardised</text><text x="748" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">medicinal venom/allergen preparations within a</text><text x="748" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">specialist medical programme for appropriately diagnosed</text><text x="748" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">patients.</text><rect x="900" y="470" width="240" height="150" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="1020" y="525" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#2E7D32" text-anchor="middle">STANDARDISED</text><text x="1020" y="555" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#2E7D32" text-anchor="middle">MEDICINAL</text><text x="1020" y="585" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#2E7D32" text-anchor="middle">PREPARATION</text><line x1="645" y1="470" x2="755" y2="470" stroke="#C62828" stroke-width="7" stroke-dasharray="10 8"/><text x="700" y="445" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#C62828" text-anchor="middle">NOT INTERCHANGEABLE</text><rect x="430" y="810" width="540" height="72" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="448" y="843" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Boundary</text><text x="448" y="872" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Deliberate self-stinging, raw-venom injection or</text><text x="448" y="892" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">unregulated 'desensitisation' is not a substitute for VIT.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Do not attempt self-desensitisation. A history of systemic sting reaction warrants medical assessment; emergency care should follow the person's</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">prescribed plan and local emergency guidance.</text></svg>