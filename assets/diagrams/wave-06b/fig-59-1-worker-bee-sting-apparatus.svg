<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-master-family="STING_VENOM_ANATOMY_MASTER" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 59.1 — Worker Bee Sting Apparatus</title><desc id="desc">Lateral worker sting apparatus showing venom gland, reservoir, bulb, stylet, paired lancets and delivery path, plus a queen comparison.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 59.1 — Worker Bee Sting Apparatus</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">The honey-bee worker sting is a complex autonomous delivery apparatus. This plate separates venom storage from</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">the piercing components and identifies the paired lancets around the stylet.</text>
<rect x="55" y="165" width="820" height="675" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="73" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Worker sting apparatus — lateral technical schematic</text><text x="73" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">The apparatus includes a venom gland/reservoir system, bulb/supporting</text><text x="73" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">structures and a piercing assembly formed by a stylet associated with two</text><text x="73" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">sliding lancets. Lancet barbs contribute to retention in elastic vertebrate</text><text x="73" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">skin.</text><ellipse cx="360" cy="480" rx="210" ry="170" fill="#FFF8E1" stroke="#5D4037" stroke-width="4"/><ellipse cx="370" cy="430" rx="75" ry="105" fill="#FFEBEE" stroke="#C62828" stroke-width="3"/><text x="370" y="435" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#C62828" text-anchor="middle">venom</text><text x="370" y="455" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#C62828" text-anchor="middle">reservoir</text><path d="M 300 340 Q 240 300 210 365 Q 250 390 295 405" fill="none" stroke="#C62828" stroke-width="4"/><text x="175" y="290" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#C62828" text-anchor="start">venom gland</text><line x1="430" y1="485" x2="560" y2="540" stroke="#C62828" stroke-width="4" marker-end="url(#ar)"/><circle cx="575" cy="545" r="26" fill="#FFEBEE" stroke="#C62828" stroke-width="3"/><text x="575" y="600" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#C62828" text-anchor="middle">bulb region</text><line x1="600" y1="545" x2="800" y2="650" stroke="#1F2933" stroke-width="8"/><line x1="610" y1="535" x2="810" y2="640" stroke="#C62828" stroke-width="2.8"/><line x1="610" y1="555" x2="800" y2="665" stroke="#6A1B9A" stroke-width="3"/><line x1="610" y1="565" x2="790" y2="680" stroke="#6A1B9A" stroke-width="3"/><text x="750" y="590" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1F2933" text-anchor="middle">stylet + two lancets</text><line x1="690" y1="610" x2="672" y2="628" stroke="#1F2933" stroke-width="2"/><line x1="710" y1="621" x2="692" y2="639" stroke="#1F2933" stroke-width="2"/><line x1="730" y1="632" x2="712" y2="650" stroke="#1F2933" stroke-width="2"/><line x1="750" y1="643" x2="732" y2="661" stroke="#1F2933" stroke-width="2"/><line x1="770" y1="654" x2="752" y2="672" stroke="#1F2933" stroke-width="2"/><line x1="790" y1="665" x2="772" y2="683" stroke="#1F2933" stroke-width="2"/><text x="755" y="720" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#C62828" text-anchor="middle">rearward-facing lancet barbs</text><line x1="430" y1="485" x2="595" y2="545" stroke="#C62828" stroke-width="3" marker-end="url(#ar)"/><text x="500" y="450" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#C62828" text-anchor="middle">venom delivery path</text><rect x="920" y="165" width="425" height="675" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="938" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Queen sting comparison</text><text x="938" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Queens also possess a sting apparatus, but</text><text x="938" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">queen stings are less strongly barbed and</text><text x="938" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">are used mainly in queen-to-queen</text><text x="938" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">conflict. Commercial venom collection is</text><text x="938" y="307" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">based on workers.</text><line x1="1010" y1="520" x2="1250" y2="650" stroke="#1F2933" stroke-width="7"/><line x1="1020" y1="510" x2="1260" y2="640" stroke="#C62828" stroke-width="2.5"/><line x1="1170" y1="595" x2="1158" y2="606" stroke="#1F2933" stroke-width="1.8"/><line x1="1195" y1="609" x2="1183" y2="620" stroke="#1F2933" stroke-width="1.8"/><line x1="1220" y1="623" x2="1208" y2="634" stroke="#1F2933" stroke-width="1.8"/><text x="1130" y="730" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#EF6C00" text-anchor="middle">less strongly barbed</text><text x="1130" y="765" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#52606D" text-anchor="middle">not a commercial collection route</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Based on current functional-anatomy literature including 3D/micro-CT work. Spatial relationships are simplified for teaching; the image is not a</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">dissection scale drawing.</text></svg>