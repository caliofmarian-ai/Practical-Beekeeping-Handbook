<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-master-family="NURSE_GLAND_ROYAL_JELLY_MASTER" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 58.1 — Nurse-Bee Glands and Royal Jelly Production</title><desc id="desc">Worker head schematic showing paired hypopharyngeal and mandibular glands and brood-food delivery to larvae.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 58.1 — Nurse-Bee Glands and Royal Jelly Production</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Royal jelly is not a secretion of one single gland. Nurse-bee hypopharyngeal and mandibular gland systems both</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">contribute to brood-food production.</text>
<rect x="60" y="165" width="780" height="680" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="78" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Worker head — secretion anatomy</text><text x="78" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Paired hypopharyngeal glands consist of many acini connected to ducts</text><text x="78" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">within the worker head. Mandibular glands lie near the mandibles. Both</text><text x="78" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">contribute to brood-food / royal-jelly secretion; this schematic</text><text x="78" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">emphasises spatial relationships rather than scale.</text><ellipse cx="440" cy="500" rx="260" ry="300" fill="#FFF8E1" stroke="#5D4037" stroke-width="4"/><ellipse cx="245" cy="470" rx="80" ry="135" fill="#4B4B4B" stroke="#1F2933" stroke-width="2"/><ellipse cx="635" cy="470" rx="80" ry="135" fill="#4B4B4B" stroke="#1F2933" stroke-width="2"/><circle cx="440" cy="410" r="85" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="440" y="417" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1565C0" text-anchor="middle">brain</text><circle cx="315" cy="300" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><circle cx="297" cy="348" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><circle cx="315" cy="396" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><circle cx="297" cy="444" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><circle cx="315" cy="492" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><circle cx="297" cy="540" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><circle cx="315" cy="588" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><path d="M 315 315 C 290 420,295 570,435 650" fill="none" stroke="#6A1B9A" stroke-width="4"/><circle cx="565" cy="300" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><circle cx="583" cy="348" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><circle cx="565" cy="396" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><circle cx="583" cy="444" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><circle cx="565" cy="492" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><circle cx="583" cy="540" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><circle cx="565" cy="588" r="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/><path d="M 565 315 C 590 420,585 570,505 650" fill="none" stroke="#6A1B9A" stroke-width="4"/><text x="440" y="250" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#6A1B9A" text-anchor="middle">hypopharyngeal gland acini</text><ellipse cx="350" cy="640" rx="58" ry="35" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/><ellipse cx="530" cy="640" rx="58" ry="35" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/><text x="440" y="705" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#EF6C00" text-anchor="middle">mandibular glands</text><path d="M 390 705 Q 440 760 490 705" fill="none" stroke="#5D4037" stroke-width="7"/><text x="440" y="790" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1F2933" text-anchor="middle">mouthparts / brood-food delivery</text><line x1="475" y1="650" x2="445" y2="740" stroke="#6A1B9A" stroke-width="3" marker-end="url(#ap)"/><line x1="400" y1="650" x2="435" y2="740" stroke="#EF6C00" stroke-width="3" marker-end="url(#ab)"/><rect x="880" y="165" width="450" height="300" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="898" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Queen-destined larva</text><text x="898" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Continuously receives abundant royal-jelly</text><text x="898" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">provisioning through larval development.</text><path d="M 1053 375 C 1081 339,1125 339,1157 371 C 1125 407,1085 408.6,1053 375 Z" fill="#F8F2E6" stroke="#8D6E63" stroke-width="2"/><rect x="880" y="500" width="450" height="300" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="898" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Worker-destined larva</text><text x="898" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Very young worker larvae also receive</text><text x="898" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">glandular brood food, but later provisioning</text><text x="898" y="602" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">changes in quantity and composition.</text><path d="M 1053 710 C 1081 674,1125 674,1157 706 C 1125 742,1085 743.6,1053 710 Z" fill="#F8F2E6" stroke="#8D6E63" stroke-width="2"/><line x1="805" y1="655" x2="880" y2="350" stroke="#6A1B9A" stroke-width="3" marker-end="url(#ap)"/><line x1="805" y1="655" x2="880" y2="685" stroke="#6A1B9A" stroke-width="3" marker-end="url(#ap)"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Anatomy follows current honey-bee gland literature. The drawing is intentionally schematic; acini and ducts are not shown to scale.</text></svg>