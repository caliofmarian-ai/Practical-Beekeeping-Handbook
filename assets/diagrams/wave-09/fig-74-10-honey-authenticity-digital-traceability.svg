<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 74.10 — Honey Authenticity and Digital Traceability</title><desc id="desc">Authenticity chain linking source lots, analytical evidence, mass balance, digital records and recall traceability.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
</defs><rect width="1400" height="1000" fill="#fff"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 74.10 — Honey Authenticity and Digital Traceability</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Digital traceability can connect provenance and analytical evidence, but technology cannot make false source</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">data true.</text>
<rect x="210" y="155" width="980" height="84" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="228" y="188" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">1. Apiary / source lot</text><text x="228" y="217" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Document source, harvest window and relevant production records.</text><line x1="700" y1="239" x2="700" y2="257" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="210" y="259" width="980" height="84" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="228" y="292" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">2. Extraction batch</text><text x="228" y="321" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Preserve internal lot links; do not lose provenance during pooling.</text><line x1="700" y1="343" x2="700" y2="361" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="210" y="363" width="980" height="84" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="228" y="396" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">3. Analytical fingerprint</text><text x="228" y="425" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use validated authenticity/origin methods appropriate to the question.</text><line x1="700" y1="447" x2="700" y2="465" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="210" y="467" width="980" height="84" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="228" y="500" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">4. Digital lot record</text><text x="228" y="529" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Store source, process, laboratory and mass-balance evidence in a recoverable system.</text><line x1="700" y1="551" x2="700" y2="569" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="210" y="571" width="980" height="84" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="228" y="604" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">5. Blend mass balance</text><text x="228" y="633" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Record source proportions at blending time when origin percentages/claims require them.</text><line x1="700" y1="655" x2="700" y2="673" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="210" y="675" width="980" height="84" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="228" y="708" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">6. Pack lot</text><text x="228" y="737" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Link finished containers to the actual bulk/blend record.</text><line x1="700" y1="759" x2="700" y2="777" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="210" y="779" width="980" height="84" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="228" y="812" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">7. Customer / recall traceability</text><text x="228" y="841" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Know affected stock and business destinations; support complaint/recall investigation.</text><rect x="370" y="835" width="660" height="65" rx="16" fill="#F5F5F5" stroke="#757575" stroke-width="2.3"/><text x="388" y="868" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#757575" text-anchor="start">Advanced ledger / blockchain: optional</text><text x="388" y="897" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Tamper-evident ledgers can be used, but trustworthy source data, laboratory</text><text x="388" y="917" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">validity, mass balance and governance remain the foundation.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Use validated analytical methods and current origin/labelling law. Blockchain or other advanced ledgers are optional infrastructure, not a</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">prerequisite for credible traceability.</text></svg>