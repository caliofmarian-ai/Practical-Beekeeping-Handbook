<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 73.8 — Confusion Matrix for Disease Detection</title><desc id="desc">Confusion matrix showing true/false positives and negatives and limits of accuracy.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
</defs><rect width="1400" height="1000" fill="#fff"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 73.8 — Confusion Matrix for Disease Detection</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Disease-detection AI and diagnostics should be evaluated with error types and deployment prevalence, not one</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">accuracy percentage.</text>
<text x="435" y="175" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#6A1B9A" text-anchor="middle">REFERENCE / TRUE STATUS</text><text x="920" y="175" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#6A1B9A" text-anchor="middle">REFERENCE / TRUE STATUS</text><text x="260" y="245" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="middle">Disease +</text><text x="610" y="245" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="middle">Disease −</text><text x="95" y="365" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="middle">Test +</text><text x="95" y="615" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="middle">Test −</text><rect x="130" y="280" width="300" height="220" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="280" y="365" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#2E7D32" text-anchor="middle">TRUE POSITIVE</text><text x="280" y="405" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle">Disease present and</text><text x="280" y="425" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle">model/test flags it.</text><rect x="480" y="280" width="300" height="220" rx="10" fill="#FFEBEE" stroke="#C62828" stroke-width="3"/><text x="630" y="365" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#C62828" text-anchor="middle">FALSE POSITIVE</text><text x="630" y="405" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle">Disease absent but flagged</text><text x="630" y="425" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle">positive.</text><rect x="130" y="530" width="300" height="220" rx="10" fill="#FFEBEE" stroke="#C62828" stroke-width="3"/><text x="280" y="615" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#C62828" text-anchor="middle">FALSE NEGATIVE</text><text x="280" y="655" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle">Disease present but missed.</text><rect x="480" y="530" width="300" height="220" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="630" y="615" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#2E7D32" text-anchor="middle">TRUE NEGATIVE</text><text x="630" y="655" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle">Disease absent and correctly</text><text x="630" y="675" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle">negative.</text><rect x="850" y="280" width="450" height="220" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="868" y="313" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Why accuracy can mislead</text><text x="868" y="342" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">If disease prevalence is low, predicting</text><text x="868" y="362" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">'negative' almost every time can produce high</text><text x="868" y="382" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">overall accuracy while sensitivity is poor.</text><rect x="850" y="530" width="450" height="220" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="868" y="563" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Report more than accuracy</text><text x="868" y="592" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Sensitivity / recall · specificity · precision</text><text x="868" y="612" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">/ PPV · NPV · confidence intervals · external</text><text x="868" y="632" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">validation · prevalence/context</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Performance estimated on training/internal data can be optimistic. External validation on independent colonies, locations and conditions is</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">essential before practical reliance.</text></svg>