<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 71.10 — Biodiversity Monitoring Toolkit</title><desc id="desc">Toolkit combining habitat mapping, transects, photographs, nesting resources, citizen science and optional molecular methods.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 71.10 — Biodiversity Monitoring Toolkit</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Biodiversity monitoring is strongest when habitat and pollinator observations are repeated using a consistent</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">method.</text>
<rect x="55" y="165" width="295" height="275" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="73" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Habitat map</text><text x="73" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Map flower-rich patches,</text><text x="73" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">nesting substrates, water,</text><text x="73" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">shelter and connectivity.</text><path d="M 125 370 Q 205 305 285 385" fill="none" stroke="#2E7D32" stroke-width="4"/><rect x="380" y="165" width="295" height="275" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="398" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Flower transect</text><text x="398" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Repeatable route recording</text><text x="398" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">floral abundance/diversity</text><text x="398" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">through the season.</text><line x1="445" y1="395" x2="610" y2="395" stroke="#D4A017" stroke-width="5"/><rect x="705" y="165" width="295" height="275" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="723" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Pollinator transect</text><text x="723" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Standardised repeat</text><text x="723" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">observations of pollinator</text><text x="723" y="267" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">groups or species.</text><ellipse cx="850" cy="375" rx="18.700000000000003" ry="12.100000000000001" fill="#F9A825" stroke="#8D6E63" stroke-width="2"/><circle cx="829.1" cy="375" r="7.15" fill="#F9A825" stroke="#8D6E63" stroke-width="2"/><ellipse cx="847.25" cy="362.9" rx="12.100000000000001" ry="7.700000000000001" fill="#D9EEF7" stroke="#7EAFC3" stroke-width="1.2"/><line x1="841.2" y1="365.1" x2="841.2" y2="384.9" stroke="#8D6E63" stroke-width="1.5"/><line x1="850" y1="365.1" x2="850" y2="384.9" stroke="#8D6E63" stroke-width="1.5"/><line x1="858.8" y1="365.1" x2="858.8" y2="384.9" stroke="#8D6E63" stroke-width="1.5"/><rect x="1030" y="165" width="295" height="275" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="1048" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Fixed photographs</text><text x="1048" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Same viewpoint over time to</text><text x="1048" y="247" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">document habitat change.</text><rect x="55" y="495" width="295" height="275" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="73" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Nesting-resource count</text><text x="73" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Bare ground, stems, burrows,</text><text x="73" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">dead wood and other nesting</text><text x="73" y="597" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">features.</text><rect x="380" y="495" width="295" height="275" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="398" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Citizen-science record</text><text x="398" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Validated schemes can extend</text><text x="398" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">spatial/temporal coverage.</text><rect x="705" y="495" width="295" height="275" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="723" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Optional molecular tools</text><text x="723" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">eDNA/metabarcoding or other</text><text x="723" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">methods where expertise and</text><text x="723" y="597" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">purpose justify them.</text><rect x="365" y="790" width="670" height="70" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="383" y="823" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Monitoring principle</text><text x="383" y="852" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Repeat the same method at comparable times and locations so change can be</text><text x="383" y="872" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">interpreted rather than guessed.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Choose methods that match the conservation objective and identification skill available. More complex technology does not automatically produce</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">better ecological inference.</text></svg>