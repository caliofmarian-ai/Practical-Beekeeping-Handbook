<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 70.5 — Organic Feeding Decision</title><desc id="desc">Organic beekeeping feeding decision based on reserves, climatic threat to survival and documented permitted feed.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 70.5 — Organic Feeding Decision</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Organic feeding is an exception governed by the applicable standard, not a routine production shortcut.</text>
<rect x="220" y="190" width="960" height="110" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="238" y="223" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">1. Adequate reserves?</text><text x="238" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Leave sufficient honey and pollen; do not feed automatically when survival is not</text><text x="238" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">endangered.</text><line x1="700" y1="300" x2="700" y2="328" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="335" width="960" height="110" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="238" y="368" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">2. Survival endangered by climatic conditions?</text><text x="238" y="397" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">If no, continue monitoring rather than routine supplementation for convenience.</text><line x1="700" y1="445" x2="700" y2="473" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="480" width="960" height="110" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="238" y="513" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">3. If yes: permitted organic feed</text><text x="238" y="542" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use organic honey, organic pollen, organic sugar syrup or organic sugar as allowed by</text><text x="238" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">the governing organic rules.</text><line x1="700" y1="590" x2="700" y2="618" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="625" width="960" height="110" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="238" y="658" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">4. Record intervention</text><text x="238" y="687" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Document reason, feed, date, colony and certification evidence.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">EU example: current Regulation (EU) 2018/848 permits feeding only where colony survival is endangered by climatic conditions, using specified</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">organic feeds. Other markets may differ.</text></svg>