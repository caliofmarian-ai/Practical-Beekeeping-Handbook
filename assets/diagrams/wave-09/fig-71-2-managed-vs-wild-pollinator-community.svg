<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 71.2 — Managed Honey Bee Versus Wild Pollinator Community</title><desc id="desc">Managed Apis mellifera contrasted with a diverse wild-pollinator community.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 71.2 — Managed Honey Bee Versus Wild Pollinator Community</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Managed honey bees are important pollinators and livestock, but they are one species within a much broader</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">pollinator community.</text>
<rect x="70" y="170" width="600" height="610" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Managed honey-bee colony</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">One managed livestock species, often present at high local</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">density, with beekeeper-provided nesting, movement,</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">feeding, breeding and disease management.</text><ellipse cx="250" cy="470" rx="40.8" ry="26.4" fill="#E0A419" stroke="#8D6E63" stroke-width="2"/><circle cx="204.4" cy="470" r="15.6" fill="#E0A419" stroke="#8D6E63" stroke-width="2"/><ellipse cx="244" cy="443.6" rx="26.4" ry="16.8" fill="#D9EEF7" stroke="#7EAFC3" stroke-width="1.2"/><line x1="230.8" y1="448.4" x2="230.8" y2="491.6" stroke="#8D6E63" stroke-width="1.5"/><line x1="250" y1="448.4" x2="250" y2="491.6" stroke="#8D6E63" stroke-width="1.5"/><line x1="269.2" y1="448.4" x2="269.2" y2="491.6" stroke="#8D6E63" stroke-width="1.5"/><ellipse cx="360" cy="530" rx="27.200000000000003" ry="17.6" fill="#E0A419" stroke="#8D6E63" stroke-width="2"/><circle cx="329.6" cy="530" r="10.4" fill="#E0A419" stroke="#8D6E63" stroke-width="2"/><ellipse cx="356" cy="512.4" rx="17.6" ry="11.200000000000001" fill="#D9EEF7" stroke="#7EAFC3" stroke-width="1.2"/><line x1="347.2" y1="515.6" x2="347.2" y2="544.4" stroke="#8D6E63" stroke-width="1.5"/><line x1="360" y1="515.6" x2="360" y2="544.4" stroke="#8D6E63" stroke-width="1.5"/><line x1="372.8" y1="515.6" x2="372.8" y2="544.4" stroke="#8D6E63" stroke-width="1.5"/><ellipse cx="470" cy="455" rx="23.799999999999997" ry="15.399999999999999" fill="#E0A419" stroke="#8D6E63" stroke-width="2"/><circle cx="443.4" cy="455" r="9.1" fill="#E0A419" stroke="#8D6E63" stroke-width="2"/><ellipse cx="466.5" cy="439.6" rx="15.399999999999999" ry="9.799999999999999" fill="#D9EEF7" stroke="#7EAFC3" stroke-width="1.2"/><line x1="458.8" y1="442.4" x2="458.8" y2="467.6" stroke="#8D6E63" stroke-width="1.5"/><line x1="470" y1="442.4" x2="470" y2="467.6" stroke="#8D6E63" stroke-width="1.5"/><line x1="481.2" y1="442.4" x2="481.2" y2="467.6" stroke="#8D6E63" stroke-width="1.5"/><text x="370" y="700" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8D6E63" text-anchor="middle">managed Apis mellifera abundance</text><rect x="730" y="170" width="600" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="748" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Wild pollinator community</text><text x="748" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Many species with different body sizes, nesting</text><text x="748" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">substrates, phenology and forage ranges: bumble bees,</text><text x="748" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">solitary bees, hoverflies, butterflies/moths and others.</text><ellipse cx="870" cy="450" rx="37.400000000000006" ry="24.200000000000003" fill="#F9A825" stroke="#8D6E63" stroke-width="2"/><circle cx="828.2" cy="450" r="14.3" fill="#F9A825" stroke="#8D6E63" stroke-width="2"/><ellipse cx="864.5" cy="425.8" rx="24.200000000000003" ry="15.400000000000002" fill="#D9EEF7" stroke="#7EAFC3" stroke-width="1.2"/><line x1="852.4" y1="430.2" x2="852.4" y2="469.8" stroke="#8D6E63" stroke-width="1.5"/><line x1="870" y1="430.2" x2="870" y2="469.8" stroke="#8D6E63" stroke-width="1.5"/><line x1="887.6" y1="430.2" x2="887.6" y2="469.8" stroke="#8D6E63" stroke-width="1.5"/><ellipse cx="995" cy="520" rx="27.200000000000003" ry="17.6" fill="#90A4AE" stroke="#8D6E63" stroke-width="2"/><circle cx="964.6" cy="520" r="10.4" fill="#90A4AE" stroke="#8D6E63" stroke-width="2"/><ellipse cx="991" cy="502.4" rx="17.6" ry="11.200000000000001" fill="#D9EEF7" stroke="#7EAFC3" stroke-width="1.2"/><line x1="982.2" y1="505.6" x2="982.2" y2="534.4" stroke="#8D6E63" stroke-width="1.5"/><line x1="995" y1="505.6" x2="995" y2="534.4" stroke="#8D6E63" stroke-width="1.5"/><line x1="1007.8" y1="505.6" x2="1007.8" y2="534.4" stroke="#8D6E63" stroke-width="1.5"/><circle cx="1120" cy="460" r="25" fill="#E0F2F1" stroke="#00897B" stroke-width="2"/><path d="M 1100 455 Q 1120 430 1140 455 Q 1120 480 1100 455" fill="none" stroke="#00897B" stroke-width="3"/><ellipse cx="1220" cy="522" rx="12" ry="18" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><ellipse cx="1237.1190172933127" cy="534.4376941012509" rx="12" ry="18" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><ellipse cx="1230.5801345412644" cy="554.5623058987491" rx="12" ry="18" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><ellipse cx="1209.4198654587356" cy="554.5623058987491" rx="12" ry="18" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><ellipse cx="1202.8809827066873" cy="534.4376941012509" rx="12" ry="18" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><circle cx="1220" cy="540" r="7.5" fill="#FFF8E1" stroke="#D4A017" stroke-width="1.2"/><line x1="1220" y1="558.75" x2="1220" y2="596.25" stroke="#2E7D32" stroke-width="3"/><text x="1030" y="700" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2E7D32" text-anchor="middle">species richness + abundance + habitat</text><rect x="430" y="810" width="540" height="72" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="448" y="843" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Key message</text><text x="448" y="872" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Honey-bee abundance is not a biodiversity index. Conservation</text><text x="448" y="892" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">measures should measure the wider pollinator community and</text><text x="448" y="912" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">habitat.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">This comparison does not imply that managed honey bees are always harmful or always beneficial to wild pollinators; effects depend on landscape,</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">density, resources and disease context.</text></svg>