<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 72.9 — Managed Hive Stocking Near Sensitive Habitat</title><desc id="desc">Precautionary decision framework before adding managed honey-bee density near sensitive habitat.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 72.9 — Managed Hive Stocking Near Sensitive Habitat</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Managed hive placement near high-value habitat should begin with ecological objectives, baseline evidence and a</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">reversible management plan.</text>
<rect x="220" y="155" width="960" height="88" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="238" y="188" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">1. Is the site ecologically sensitive?</text><text x="238" y="217" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Rare pollinators, protected habitat, scarce floral resources or existing conservation</text><text x="238" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">objectives increase the need for caution.</text><line x1="700" y1="243" x2="700" y2="265" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="269" width="960" height="88" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="238" y="302" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">2. What is already present?</text><text x="238" y="331" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Map habitat, wild-pollinator use, managed hive density and seasonal forage before adding</text><text x="238" y="351" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">colonies.</text><line x1="700" y1="357" x2="700" y2="379" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="383" width="960" height="88" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="238" y="416" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">3. Could additional hives change competition or disease pressure?</text><text x="238" y="445" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Consider resource overlap, colony numbers, season and pathogen management rather than</text><text x="238" y="465" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">assuming zero impact.</text><line x1="700" y1="471" x2="700" y2="493" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="497" width="960" height="88" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="238" y="530" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">4. Is stocking justified by a defined objective?</text><text x="238" y="559" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Pollination need, research or production should be explicit; 'more bees = more</text><text x="238" y="579" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">conservation' is not sufficient.</text><line x1="700" y1="585" x2="700" y2="607" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="611" width="960" height="88" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="238" y="644" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">5. Choose scale + safeguards</text><text x="238" y="673" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use conservative, reviewable stocking with health/biosecurity controls and an</text><text x="238" y="693" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">exit/reduction plan.</text><line x1="700" y1="699" x2="700" y2="721" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="725" width="960" height="88" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="238" y="758" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">6. Monitor and adapt</text><text x="238" y="787" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Compare before/after habitat and pollinator metrics; reduce/remove pressure if</text><text x="238" y="807" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">objectives are not met.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">No universal hive-density threshold is shown because carrying capacity and competition risk vary with habitat, season, floral resources, colony</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">strength and local conservation priorities.</text></svg>