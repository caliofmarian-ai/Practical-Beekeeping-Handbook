<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 72.11 — Monitoring Before and After</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Before/after monitoring is useful only when the methods are comparable enough to separate real change from</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">different observation effort.</text>
<rect x="70" y="170" width="520" height="610" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">BEFORE — baseline</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Habitat map, floral transect, pollinator</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">observations, nesting resources and existing</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">managed-hive context collected before the</text><text x="88" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">intervention.</text><path d="M 150 560 Q 260 430 400 510 T 530 470" fill="none" stroke="#2E7D32" stroke-width="5"/><ellipse cx="250" cy="465.6" rx="9.6" ry="14.399999999999999" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><ellipse cx="263.6952138346502" cy="475.55015528100074" rx="9.6" ry="14.399999999999999" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><ellipse cx="258.4641076330116" cy="491.64984471899925" rx="9.6" ry="14.399999999999999" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><ellipse cx="241.53589236698838" cy="491.64984471899925" rx="9.6" ry="14.399999999999999" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><ellipse cx="236.30478616534978" cy="475.55015528100074" rx="9.6" ry="14.399999999999999" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><circle cx="250" cy="480" r="6" fill="#FFF8E1" stroke="#D4A017" stroke-width="1.2"/><line x1="250" y1="495" x2="250" y2="525" stroke="#2E7D32" stroke-width="3"/><ellipse cx="420" cy="520" rx="18.700000000000003" ry="12.100000000000001" fill="#F9A825" stroke="#8D6E63" stroke-width="2"/><circle cx="399.1" cy="520" r="7.15" fill="#F9A825" stroke="#8D6E63" stroke-width="2"/><ellipse cx="417.25" cy="507.9" rx="12.100000000000001" ry="7.700000000000001" fill="#D9EEF7" stroke="#7EAFC3" stroke-width="1.2"/><line x1="411.2" y1="510.1" x2="411.2" y2="529.9" stroke="#8D6E63" stroke-width="1.5"/><line x1="420" y1="510.1" x2="420" y2="529.9" stroke="#8D6E63" stroke-width="1.5"/><line x1="428.8" y1="510.1" x2="428.8" y2="529.9" stroke="#8D6E63" stroke-width="1.5"/><rect x="810" y="170" width="520" height="610" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="828" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">AFTER — repeat survey</text><text x="828" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Repeat the same routes, timing logic, observation</text><text x="828" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">effort and habitat measurements after the</text><text x="828" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">intervention so differences are interpretable.</text><path d="M 890 545 Q 1000 430 1140 500 T 1270 450" fill="none" stroke="#2E7D32" stroke-width="5"/><ellipse cx="990" cy="447" rx="12" ry="18" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><ellipse cx="1007.1190172933127" cy="459.43769410125094" rx="12" ry="18" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><ellipse cx="1000.5801345412646" cy="479.56230589874906" rx="12" ry="18" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><ellipse cx="979.4198654587354" cy="479.56230589874906" rx="12" ry="18" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><ellipse cx="972.8809827066873" cy="459.43769410125094" rx="12" ry="18" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.2"/><circle cx="990" cy="465" r="7.5" fill="#FFF8E1" stroke="#D4A017" stroke-width="1.2"/><line x1="990" y1="483.75" x2="990" y2="521.25" stroke="#2E7D32" stroke-width="3"/><ellipse cx="1160" cy="500" rx="20.4" ry="13.2" fill="#F9A825" stroke="#8D6E63" stroke-width="2"/><circle cx="1137.2" cy="500" r="7.8" fill="#F9A825" stroke="#8D6E63" stroke-width="2"/><ellipse cx="1157" cy="486.8" rx="13.2" ry="8.4" fill="#D9EEF7" stroke="#7EAFC3" stroke-width="1.2"/><line x1="1150.4" y1="489.2" x2="1150.4" y2="510.8" stroke="#8D6E63" stroke-width="1.5"/><line x1="1160" y1="489.2" x2="1160" y2="510.8" stroke="#8D6E63" stroke-width="1.5"/><line x1="1169.6" y1="489.2" x2="1169.6" y2="510.8" stroke="#8D6E63" stroke-width="1.5"/><line x1="610" y1="475" x2="790" y2="475" stroke="#6A1B9A" stroke-width="5" marker-end="url(#ap)"/><rect x="515" y="370" width="370" height="180" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="533" y="403" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">INTERVENTION</text><text x="533" y="432" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Habitat protection / management /</text><text x="533" y="452" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">restoration or a managed-hive stocking</text><text x="533" y="472" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">decision.</text><rect x="440" y="810" width="520" height="72" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="458" y="843" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Adaptive management</text><text x="458" y="872" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Compare outcome with objective → retain, modify, expand,</text><text x="458" y="892" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">reduce or stop the intervention.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Where possible, add reference/control sites and repeated seasons; a simple before/after comparison alone cannot rule out weather or wider</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">landscape confounding.</text></svg>