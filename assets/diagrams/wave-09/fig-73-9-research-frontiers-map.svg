,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">causation,</text><text x="979.6126102136446" y="287.865778201927" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">transmission,</text><text x="979.6126102136446" y="300.865778201927" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">colony-level outcomes</text><line x1="783.5623892592502" y1="400.4142223945329" x2="924.3328757806023" y2="320.74560031015915" stroke="#6A1B9A" stroke-width="2"/><circle cx="1128.3913725603106" cy="444.43258314658226" r="86" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="1128.3913725603106" y="429.43258314658226" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#2E7D32" text-anchor="middle">Breeding + genomics</text><text x="1128.3913725603106" y="464.43258314658226" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">resistance, local</text><text x="1128.3913725603106" y="477.43258314658226" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">adaptation, genotype ×</text><text x="1128.3913725603106" y="490.43258314658226" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">environment</text><line x1="828.025007891587" y1="477.425736903299" x2="1043.6979058012607" y2="459.36632642593827" stroke="#2E7D32" stroke-width="2"/><circle cx="1076.7210506462309" cy="660" r="86" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="1076.7210506462309" y="645" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1565C0" text-anchor="middle">Precision</text><text x="1076.7210506462309" y="661" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1565C0" text-anchor="middle">apiculture + AI</text><text x="1076.7210506462309" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">sensors, decision</text><text x="1076.7210506462309" y="693" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">support, validation,</text><text x="1076.7210506462309" y="706" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">data quality</text><line x1="812.5833024919771" y1="565" x2="1002.2428659207692" y2="617" stroke="#1565C0" stroke-width="2"/><circle cx="848.7787623466659" cy="800.7016386514906" r="86" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><text x="848.7787623466659" y="785.7016386514906" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#8D6E63" text-anchor="middle">Nutrition</text><text x="848.7787623466659" y="820.7016386514906" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">forage diversity,</text><text x="848.7787623466659" y="833.7016386514906" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">pollen quality,</text><text x="848.7787623466659" y="846.7016386514906" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">dearth,</text><text x="848.7787623466659" y="859.7016386514906" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">supplementation</text><line x1="744.4626186323369" y1="622.1600407021681" x2="819.3650300206583" y2="719.8880732639025" stroke="#8D6E63" stroke-width="2"/><circle cx="551.2212376533341" cy="800.7016386514907" r="86" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/><text x="551.2212376533341" y="785.7016386514907" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#6A1B9A" text-anchor="middle">Diagnostics</text><text x="551.2212376533341" y="820.7016386514907" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">field tests, molecular</text><text x="551.2212376533341" y="833.7016386514907" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">tools, surveillance</text><text x="551.2212376533341" y="846.7016386514907" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">design</text><line x1="655.5373813676631" y1="622.1600407021681" x2="580.6349699793417" y2="719.8880732639026" stroke="#6A1B9A" stroke-width="2"/><circle cx="323.27894935376924" cy="660.0000000000001" r="86" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="323.27894935376924" y="645.0000000000001" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#EF6C00" text-anchor="middle">Climate</text><text x="323.27894935376924" y="680.0000000000001" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">phenology, drought,</text><text x="323.27894935376924" y="693.0000000000001" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">heat, range shifts,</text><text x="323.27894935376924" y="706.0000000000001" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">extreme events</text><line x1="587.4166975080229" y1="565" x2="397.7571340792309" y2="617.0000000000001" stroke="#EF6C00" stroke-width="2"/><circle cx="271.6086274396895" cy="444.4325831465824" r="86" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="271.6086274396895" y="429.4325831465824" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#2E7D32" text-anchor="middle">Conservation</text><text x="271.6086274396895" y="464.4325831465824" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">wild pollinators,</text><text x="271.6086274396895" y="477.4325831465824" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">habitat, managed-stock</text><text x="271.6086274396895" y="490.4325831465824" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">interactions</text><line x1="571.974992108413" y1="477.4257369032991" x2="356.3020941987394" y2="459.3663264259384" stroke="#2E7D32" stroke-width="2"/><circle cx="420.38738978635536" cy="254.86577820192707" r="86" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="420.38738978635536" y="239.86577820192707" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1565C0" text-anchor="middle">Honey authenticity</text><text x="420.38738978635536" y="274.86577820192707" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">origin, adulteration,</text><text x="420.38738978635536" y="287.86577820192707" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">spectroscopy, omics,</text><text x="420.38738978635536" y="300.86577820192707" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" fill="#1F2933" text-anchor="middle">traceability</text><line x1="616.4376107407498" y1="400.4142223945329" x2="475.66712421939775" y2="320.74560031015915" stroke="#1565C0" stroke-width="2"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Separate established findings from emerging capability and speculative application. Replication, independent validation and practical effect size</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">remain critical.</text></svg>