<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 70.7 — Organic Varroa IPM</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Organic certification does not mean 'treatment-free'. Varroa control still requires evidence, animal welfare,</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">legal product use and certification compliance.</text>
<circle cx="700" cy="210" r="92" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="700" y="188" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1565C0" text-anchor="middle">Monitor</text><text x="700" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">Measure mite pressure</text><text x="700" y="244" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">and colony condition; do</text><text x="700" y="258" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">not rely on symptoms</text><text x="700" y="272" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">alone.</text><line x1="750" y1="210" x2="994.4486372867091" y2="380" stroke="#1565C0" stroke-width="2.4" marker-end="url(#ab)"/><circle cx="1037.749907475931" cy="355" r="92" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="1037.749907475931" y="333" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#2E7D32" text-anchor="middle">Prevention / stock</text><text x="1037.749907475931" y="375" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">Use suitable genetics,</text><text x="1037.749907475931" y="389" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">colony health, comb</text><text x="1037.749907475931" y="403" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">management and husbandry</text><text x="1037.749907475931" y="417" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">within the organic</text><text x="1037.749907475931" y="431" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">system.</text><line x1="1062.749907475931" y1="398.30127018922195" x2="994.4486372867093" y2="620" stroke="#1565C0" stroke-width="2.4" marker-end="url(#ab)"/><circle cx="1037.7499074759312" cy="645" r="92" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="1037.7499074759312" y="623" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#2E7D32" text-anchor="middle">Biotechnical</text><text x="1037.7499074759312" y="641" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#2E7D32" text-anchor="middle">options</text><text x="1037.7499074759312" y="665" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">Brood</text><text x="1037.7499074759312" y="679" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">interruption/manipulation</text><text x="1037.7499074759312" y="693" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">or other permitted</text><text x="1037.7499074759312" y="707" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">methods where</text><text x="1037.7499074759312" y="721" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">appropriate.</text><line x1="1012.7499074759312" y1="688.3012701892219" x2="700" y2="740" stroke="#1565C0" stroke-width="2.4" marker-end="url(#ab)"/><circle cx="700" cy="790" r="92" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/><text x="700" y="768" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#6A1B9A" text-anchor="middle">Permitted actives</text><text x="700" y="786" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#6A1B9A" text-anchor="middle">under standard</text><text x="700" y="810" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">Organic framework may</text><text x="700" y="824" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">permit specified acids /</text><text x="700" y="838" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">essential-oil</text><text x="700" y="852" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">constituents, but</text><text x="700" y="866" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">product authorisation</text><text x="700" y="880" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">and label law still</text><text x="700" y="894" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">apply.</text><line x1="650" y1="790" x2="405.5513627132909" y2="620.0000000000001" stroke="#1565C0" stroke-width="2.4" marker-end="url(#ab)"/><circle cx="362.250092524069" cy="645.0000000000001" r="92" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="362.250092524069" y="623.0000000000001" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1565C0" text-anchor="middle">Verify efficacy</text><text x="362.250092524069" y="665.0000000000001" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">Re-monitor after</text><text x="362.250092524069" y="679.0000000000001" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">intervention; record</text><text x="362.250092524069" y="693.0000000000001" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">result and reinvasion</text><text x="362.250092524069" y="707.0000000000001" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">risk.</text><line x1="337.250092524069" y1="601.6987298107782" x2="405.5513627132909" y2="380" stroke="#1565C0" stroke-width="2.4" marker-end="url(#ab)"/><circle cx="362.250092524069" cy="355" r="92" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="362.250092524069" y="333" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#EF6C00" text-anchor="middle">Escalate legally</text><text x="362.250092524069" y="351" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#EF6C00" text-anchor="middle">when needed</text><text x="362.250092524069" y="375" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">Animal welfare and legal</text><text x="362.250092524069" y="389" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">treatment obligations</text><text x="362.250092524069" y="403" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">take priority over</text><text x="362.250092524069" y="417" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">ideology; follow</text><text x="362.250092524069" y="431" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">certifier and veterinary</text><text x="362.250092524069" y="445" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1F2933" text-anchor="middle">rules.</text><line x1="387.250092524069" y1="311.69872981077805" x2="699.9999999999999" y2="260" stroke="#1565C0" stroke-width="2.4" marker-end="url(#ab)"/><rect x="520" y="405" width="360" height="190" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="538" y="438" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">ORGANIC IPM</text><text x="538" y="467" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Monitoring → prevention → permitted</text><text x="538" y="487" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">controls → verification → records</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">No dose or universal treatment threshold is shown. Permitted substances under an organic standard are not automatically authorised veterinary</text><text x="75" y="970" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">products in every jurisdiction.</text></svg>