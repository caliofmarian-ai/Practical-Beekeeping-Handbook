<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 74.2 — Technology-Adoption Framework</title><desc id="desc">Evidence and economics framework for adopting beekeeping technology.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
</defs><rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 74.2 — Technology-Adoption Framework</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Technology should solve a real beekeeping problem and survive local validation, economic review,</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">interoperability and failure-mode analysis.</text>
<rect x="215" y="145" width="970" height="86" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="233" y="178" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">1. Real problem</text><text x="233" y="207" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Define the decision or bottleneck the technology is supposed to improve.</text><line x1="700" y1="231" x2="700" y2="251" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="215" y="253" width="970" height="86" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="233" y="286" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">2. Evidence of benefit</text><text x="233" y="315" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Look for independent evidence and effect size, not vendor claims alone.</text><line x1="700" y1="339" x2="700" y2="359" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="215" y="361" width="970" height="86" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="233" y="394" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">3. Local validation</text><text x="233" y="423" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Test in your colonies, climate, network and workflow before scaling.</text><line x1="700" y1="447" x2="700" y2="467" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="215" y="469" width="970" height="86" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="233" y="502" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">4. Total cost of ownership</text><text x="233" y="531" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Hardware, subscription, connectivity, maintenance, calibration, labour and replacement.</text><line x1="700" y1="555" x2="700" y2="575" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="215" y="577" width="970" height="86" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="233" y="610" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">5. Interoperability + data ownership</text><text x="233" y="639" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Can data be exported? Who owns it? What happens if the vendor disappears?</text><line x1="700" y1="663" x2="700" y2="683" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="215" y="685" width="970" height="86" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="233" y="718" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">6. Failure mode + human override</text><text x="233" y="747" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">How can it fail, what harm follows, and can the beekeeper safely override it?</text><line x1="700" y1="771" x2="700" y2="791" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="215" y="793" width="970" height="86" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="233" y="826" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">7. Adopt / reject / retest</text><text x="233" y="855" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Deploy with monitoring, reject, or revisit when evidence/economics improve.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">A useful tool can still be the wrong purchase at one scale or location. Keep human override and exportable records for safety-critical decisions.</text></svg>