<title id="title">Figure 42.1 — Nosema Life Cycle in an Adult Bee</title>
<desc id="desc">Nosema microsporidian cycle: spore ingestion, germination and polar-tube extrusion, infection of a midgut epithelial cell, intracellular merogony/sporogony, new spores and faecal-oral transmission.</desc>
