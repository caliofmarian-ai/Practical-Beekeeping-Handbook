<text x="78" y="930" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1F2933" text-anchor="start">Microscopy can detect Nosema-like spores, but routine light microscopy does not reliably distinguish N. apis from N. ceranae. Molecular testing is used when species-level information is required.</text>
