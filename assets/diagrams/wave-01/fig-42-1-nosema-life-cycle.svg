<text x="55" y="62" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 42.1 — Nosema Life Cycle in an Adult Bee</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">The infective environmental stage is the spore; multiplication occurs inside midgut epithelial cells.</text>
