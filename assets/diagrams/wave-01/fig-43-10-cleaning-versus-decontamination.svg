<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="portrait-field" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<!-- semantic-color-pass:v1 -->
<title id="title">Figure 43.10 — Cleaning Versus Decontamination</title>
<desc id="desc">Two-stage concept showing physical removal of wax, propolis and debris before an approved AFB spore-targeting decontamination or disposition process.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker></defs>
<style>
.bg{fill:#FFFFFF}.title{font:700 38px Arial,Helvetica,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#52606D}
.box{fill:#F3E5F5;stroke:#4A148C;stroke-width:3}.box2{fill:#E3F2FD;stroke:#4A148C;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,Helvetica,sans-serif;fill:#1F2933}.body{font:400 21px Arial,Helvetica,sans-serif;fill:#1F2933}.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52606D}
.arrow{stroke:#6A1B9A;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#4A148C;stroke:#4A148C;stroke-width:3}.hubtext{font:700 22px Arial,Helvetica,sans-serif;fill:#FFFFFF;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 43.10 — Cleaning Versus Decontamination</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Cleaning removes material. Decontamination/control addresses the biological hazard under an</text>
<text class="subtitle" x="60" y="136" text-anchor="start">approved programme.</text>
<rect class="box2" x="90" y="260" width="450" height="620" rx="22" ry="22"/>
<text class="label" x="114" y="298" text-anchor="start">Stage 1 — Physical cleaning</text>
<text class="body" x="114" y="337" text-anchor="start">Remove wax, propolis and visible</text>
<text class="body" x="114" y="364" text-anchor="start">organic debris from equipment that</text>
<text class="body" x="114" y="391" text-anchor="start">the competent programme allows to be</text>
<text class="body" x="114" y="418" text-anchor="start">processed. Cleaning reduces soil and</text>
<text class="body" x="114" y="445" text-anchor="start">improves access of a later approved</text>
<text class="body" x="114" y="472" text-anchor="start">control process.</text>
<rect class="legal" x="660" y="260" width="450" height="620" rx="22" ry="22"/>
<text class="label" x="684" y="298" text-anchor="start">Stage 2 — Approved</text>
<text class="label" x="684" y="327" text-anchor="start">decontamination / disposition</text>
<text class="body" x="684" y="366" text-anchor="start">Use the current competent-authority</text>
<text class="body" x="684" y="393" text-anchor="start">method for the material and</text>
<text class="body" x="684" y="420" text-anchor="start">jurisdiction. Some items may require</text>
<text class="body" x="684" y="447" text-anchor="start">disposal rather than attempted</text>
<text class="body" x="684" y="474" text-anchor="start">decontamination.</text>
<path class="arrow" d="M540,570 L660,570"/>
<rect class="stop" x="250" y="980" width="700" height="240" rx="22" ry="22"/>
<text class="label" x="274" y="1018" text-anchor="start">Do not improvise chemical or heat recipes</text>
<text class="body" x="274" y="1057" text-anchor="start">AFB spores are highly persistent. A visibly clean surface</text>
<text class="body" x="274" y="1084" text-anchor="start">is not proof of spore elimination, and an unvalidated home</text>
<text class="body" x="274" y="1111" text-anchor="start">treatment can spread contamination or create chemical/fire</text>
<text class="body" x="274" y="1138" text-anchor="start">hazards.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">Keep suspect material segregated until the official/validated control path is clear.</text>
<text class="small" x="85" y="1535" text-anchor="start">Requirements differ by jurisdiction and equipment material.</text>
</svg>
