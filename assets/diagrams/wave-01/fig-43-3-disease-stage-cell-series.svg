<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
<title id="title">Figure 43.3 — American Foulbrood Disease-Stage Cell Series</title>
<desc id="desc">Cell cross-sections show a normal larva, discoloured decomposed remains, possible ropey stage and dry adherent scale; not every case shows every stage.</desc>
<rect width="1400" height="1050" fill="#FFFFFF"/>
<text x="55" y="62" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 43.3 — American Foulbrood Disease-Stage Cell Series</text>
<text x="55" y="102" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#52606D" text-anchor="start">Cell appearance changes with stage and worker removal; not every case shows every stage clearly.</text>
<rect x="45" y="160" width="275" height="690" rx="20" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="65" y="194" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#2E7D32" text-anchor="start">A — Normal larva</text>
<path d="M90 310 L182 275 L275 310 L255 660 L110 660 Z" fill="#F6E7B0" stroke="#8D6E63" stroke-width="4"/>
<path d="M 151.4 492.0 C 174.8 457.8, 219.8 477.6, 212.6 515.4 C 207.2 546.0, 164.0 551.4, 151.4 524.4" fill="none" stroke="#E9E4D6" stroke-width="25.2" stroke-linecap="round" transform="rotate(0 182 510)"/>
<path d="M 151.4 492.0 C 174.8 457.8, 219.8 477.6, 212.6 515.4 C 207.2 546.0, 164.0 551.4, 151.4 524.4" fill="none" stroke="#FFFDF4" stroke-width="18.0" stroke-linecap="round" transform="rotate(0 182 510)"/>
<text x="73" y="705" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#52606D" text-anchor="start">Pearly white, plump,</text>
<text x="73" y="728" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#52606D" text-anchor="start">glistening normal larva.</text>
<rect x="390" y="160" width="275" height="690" rx="20" fill="#FFEBEE" stroke="#C62828" stroke-width="2.5"/>
<text x="410" y="194" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#C62828" text-anchor="start">B — Discoloured remains</text>
<path d="M435 310 L527 275 L620 310 L600 660 L455 660 Z" fill="#F6E7B0" stroke="#8D6E63" stroke-width="4"/>
<path d="M470 535 C502 485 562 480 588 530 C571 572 502 580 472 552 Z" fill="#8C4A2F"/>
<text x="414" y="705" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#52606D" text-anchor="start">Brown decomposed material;</text>
<text x="414" y="728" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#52606D" text-anchor="start">consistency varies by stage.</text>
<rect x="735" y="160" width="275" height="690" rx="20" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="755" y="194" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#EF6C00" text-anchor="start">C — Possible ropey stage</text>
<path d="M780 310 L872 275 L965 310 L945 660 L800 660 Z" fill="#F6E7B0" stroke="#8D6E63" stroke-width="4"/>
<path d="M815 535 C847 500 910 500 930 535" fill="none" stroke="#7A3F20" stroke-width="20" stroke-linecap="round"/>
<line x1="925" y1="520" x2="980" y2="420" stroke="#1F2933" stroke-width="6"/>
<path d="M923 523 C940 493 953 466 967 445" fill="none" stroke="#7A3F20" stroke-width="8" stroke-linecap="round"/>
<text x="755" y="705" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#52606D" text-anchor="start">Ropey material can occur</text>
<text x="755" y="728" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#52606D" text-anchor="start">at a suitable stage only.</text>
<rect x="1080" y="160" width="275" height="690" rx="20" fill="#FFEBEE" stroke="#C62828" stroke-width="2.5"/>
<text x="1100" y="194" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#C62828" text-anchor="start">D — Dry adherent scale</text>
<path d="M1125 310 L1217 275 L1310 310 L1290 660 L1145 660 Z" fill="#F6E7B0" stroke="#8D6E63" stroke-width="4"/>
<path d="M1153 624 C1190 600 1255 600 1284 624 L1281 653 L1152 653 Z" fill="#4E3024"/>
<text x="1096" y="705" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#52606D" text-anchor="start">Dry dark scale remains</text>
<text x="1096" y="728" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#52606D" text-anchor="start">adherent to lower cell wall.</text>
<rect x="55" y="900" width="1290" height="90" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="78" y="930" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1F2933" text-anchor="start">Use this series to recognise suspicious stages, not as a stand-alone diagnosis. Suspected AFB requires current local notification/confirmation procedures.</text>
</svg>
