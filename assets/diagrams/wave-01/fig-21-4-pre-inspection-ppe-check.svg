<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="portrait-field" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<!-- semantic-color-pass:v1 -->
<title id="title">Figure 21.4 — Pre-Inspection PPE Check</title>
<desc id="desc">Six-point pre-inspection protective-clothing check.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs>
<style>
.bg{fill:#FFFFFF}.title{font:700 34px Arial,Helvetica,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#52606D}
.box{fill:#E3F2FD;stroke:#0D47A1;stroke-width:3}.box2{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,Helvetica,sans-serif;fill:#1F2933}.body{font:400 21px Arial,Helvetica,sans-serif;fill:#1F2933}.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52606D}
.arrow{stroke:#1565C0;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#0D47A1;stroke:#0D47A1;stroke-width:3}.hubtext{font:700 22px Arial,Helvetica,sans-serif;fill:#FFFFFF;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 21.4 — Pre-Inspection PPE Check</text>
<text class="subtitle" x="60" y="108" text-anchor="start">A 30-second PPE check prevents avoidable gaps before the colony is opened.</text>
<rect class="box" x="210" y="210" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="248" text-anchor="start">Veil structure clear of face?</text>
<text class="body" x="234" y="287" text-anchor="start">Mesh/frame/hat holds veil away from skin and gives adequate</text>
<text class="body" x="234" y="314" text-anchor="start">visibility.</text>
<path class="arrow" d="M600,335 L600,380"/>
<rect class="box" x="210" y="390" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="428" text-anchor="start">Zips and neck closures secured?</text>
<text class="body" x="234" y="467" text-anchor="start">Check every closure including flap/zip overlap.</text>
<path class="arrow" d="M600,515 L600,560"/>
<rect class="box" x="210" y="570" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="608" text-anchor="start">Wrists and ankles protected?</text>
<text class="body" x="234" y="647" text-anchor="start">Cuff/glove and trouser/boot interfaces do not leave obvious</text>
<text class="body" x="234" y="674" text-anchor="start">openings.</text>
<path class="arrow" d="M600,695 L600,740"/>
<rect class="stop" x="210" y="750" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="788" text-anchor="start">Holes, tears or failed elastic?</text>
<text class="body" x="234" y="827" text-anchor="start">Repair/replace before work; do not rely on tape for a critical</text>
<text class="body" x="234" y="854" text-anchor="start">failed closure unless genuinely secure.</text>
<path class="arrow" d="M600,875 L600,920"/>
<rect class="box" x="210" y="930" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="968" text-anchor="start">Footwear and mobility suitable?</text>
<text class="body" x="234" y="1007" text-anchor="start">Stable footing, no trip hazard, adequate traction for site.</text>
<path class="arrow" d="M600,1055 L600,1100"/>
<rect class="box2" x="210" y="1110" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="1148" text-anchor="start">Heat / hydration plan ready?</text>
<text class="body" x="234" y="1187" text-anchor="start">PPE increases thermal load; water, shade and breaks must be</text>
<text class="body" x="234" y="1214" text-anchor="start">available.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">If the protective system is not secure or heat conditions are unsafe, correct the problem</text>
<text class="small" x="85" y="1535" text-anchor="start">before opening the hive.</text>
</svg>
