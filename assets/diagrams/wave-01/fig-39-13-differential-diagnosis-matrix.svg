<title id="title">Figure 39.13 — Differential Diagnosis Matrix</title>
<desc id="desc">Matrix showing that common colony signs can have several possible cause categories and therefore require history, examination and confirmation rather than image-only diagnosis.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker></defs>
