<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 45.10 — Pooled Versus Individual Sampling</title>
<desc id="desc">Comparison of pooled virus surveillance samples with individual phenotype-targeted sampling.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 45.10 — Pooled Versus Individual Sampling</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Pooling is efficient for surveillance but can answer a different question from testing a</text>
<text class="subtitle" x="60" y="136" text-anchor="start">selected symptomatic individual.</text>
<rect class="box2" x="70" y="190" width="500" height="95" rx="22" ry="22"/>
<text class="label" x="94" y="228" text-anchor="start">Pooled sample</text>
<rect class="box" x="630" y="190" width="500" height="95" rx="22" ry="22"/>
<text class="label" x="654" y="228" text-anchor="start">Individual / phenotype-targeted</text>
<text class="label" x="654" y="257" text-anchor="start">sample</text>
<rect class="box" x="70" y="330" width="500" height="145" rx="22" ry="22"/>
<text class="label" x="94" y="368" text-anchor="start">What it asks</text>
<text class="body" x="94" y="407" text-anchor="start">Is the target detectable in a combined</text>
<text class="body" x="94" y="434" text-anchor="start">group / what is group-level signal?</text>
<rect class="box" x="630" y="330" width="500" height="145" rx="22" ry="22"/>
<text class="label" x="654" y="368" text-anchor="start">What it asks</text>
<text class="body" x="654" y="407" text-anchor="start">What is present in this selected bee or</text>
<text class="body" x="654" y="434" text-anchor="start">defined individual?</text>
<rect class="box" x="70" y="510" width="500" height="145" rx="22" ry="22"/>
<text class="label" x="94" y="548" text-anchor="start">Strength</text>
<text class="body" x="94" y="587" text-anchor="start">Efficient for surveillance or group</text>
<text class="body" x="94" y="614" text-anchor="start">comparisons.</text>
<rect class="box" x="630" y="510" width="500" height="145" rx="22" ry="22"/>
<text class="label" x="654" y="548" text-anchor="start">Strength</text>
<text class="body" x="654" y="587" text-anchor="start">Links laboratory result more closely to a</text>
<text class="body" x="654" y="614" text-anchor="start">specific phenotype/sample.</text>
<rect class="box" x="70" y="690" width="500" height="145" rx="22" ry="22"/>
<text class="label" x="94" y="728" text-anchor="start">Limitation</text>
<text class="body" x="94" y="767" text-anchor="start">One strongly infected bee can be diluted;</text>
<text class="body" x="94" y="794" text-anchor="start">the pool hides individual distribution.</text>
<rect class="box" x="630" y="690" width="500" height="145" rx="22" ry="22"/>
<text class="label" x="654" y="728" text-anchor="start">Limitation</text>
<text class="body" x="654" y="767" text-anchor="start">Selected moribund bee may not represent</text>
<text class="body" x="654" y="794" text-anchor="start">colony prevalence.</text>
<rect class="box" x="70" y="870" width="500" height="145" rx="22" ry="22"/>
<text class="label" x="94" y="908" text-anchor="start">Interpretation</text>
<text class="body" x="94" y="947" text-anchor="start">Do not assign the pooled result to every</text>
<text class="body" x="94" y="974" text-anchor="start">individual bee.</text>
<rect class="box" x="630" y="870" width="500" height="145" rx="22" ry="22"/>
<text class="label" x="654" y="908" text-anchor="start">Interpretation</text>
<text class="body" x="654" y="947" text-anchor="start">Still does not prove causation without</text>
<text class="body" x="654" y="974" text-anchor="start">broader context.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">Choose pooling or individual testing according to the biological question before collecting</text>
<text class="small" x="85" y="1535" text-anchor="start">the sample.</text>
</svg>
