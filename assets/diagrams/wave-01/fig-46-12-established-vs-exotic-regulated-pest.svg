<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="portrait-field" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<!-- semantic-color-pass:v1 -->
<title id="title">Figure 46.12 — Established Pest Versus Exotic Regulated Pest</title>
<desc id="desc">Two-column pathway comparing routine Varroa monitoring and IPM management with evidence preservation, movement restraint and authority notification for suspected exotic regulated pests.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs>
<style>
.bg{fill:#FFFFFF}.title{font:700 38px Arial,Helvetica,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#52606D}
.box{fill:#E3F2FD;stroke:#0D47A1;stroke-width:3}.box2{fill:#E8F5E9;stroke:#0D47A1;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,Helvetica,sans-serif;fill:#1F2933}.body{font:400 21px Arial,Helvetica,sans-serif;fill:#1F2933}.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52606D}
.arrow{stroke:#1565C0;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#0D47A1;stroke:#0D47A1;stroke-width:3}.hubtext{font:700 22px Arial,Helvetica,sans-serif;fill:#FFFFFF;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 46.12 — Established Pest Versus Exotic Regulated Pest</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Different biological and legal questions require different response pathways.</text>
<rect class="box2" x="80" y="180" width="500" height="100" rx="22" ry="22"/>
<text class="label" x="104" y="218" text-anchor="start">Established Varroa / routine</text>
<text class="label" x="104" y="247" text-anchor="start">threat</text>
<rect class="legal" x="620" y="180" width="500" height="100" rx="22" ry="22"/>
<text class="label" x="644" y="218" text-anchor="start">Suspected exotic / regulated pest</text>
<rect class="box" x="80" y="340" width="500" height="125" rx="22" ry="22"/>
<text class="label" x="104" y="378" text-anchor="start">Quantitative monitoring</text>
<path class="arrow" d="M330,465 L330,505"/>
<rect class="box" x="80" y="520" width="500" height="125" rx="22" ry="22"/>
<text class="label" x="104" y="558" text-anchor="start">Interpret result in local context</text>
<path class="arrow" d="M330,645 L330,685"/>
<rect class="box" x="80" y="700" width="500" height="125" rx="22" ry="22"/>
<text class="label" x="104" y="738" text-anchor="start">Choose authorised IPM control</text>
<text class="label" x="104" y="767" text-anchor="start">when needed</text>
<path class="arrow" d="M330,825 L330,865"/>
<rect class="box" x="80" y="880" width="500" height="125" rx="22" ry="22"/>
<text class="label" x="104" y="918" text-anchor="start">Verify outcome and retest</text>
<rect class="legal" x="620" y="340" width="500" height="125" rx="22" ry="22"/>
<text class="label" x="644" y="378" text-anchor="start">Preserve specimen/evidence</text>
<path class="arrow" d="M870,465 L870,505"/>
<rect class="legal" x="620" y="520" width="500" height="125" rx="22" ry="22"/>
<text class="label" x="644" y="558" text-anchor="start">Restrict unnecessary movement</text>
<path class="arrow" d="M870,645 L870,685"/>
<rect class="legal" x="620" y="700" width="500" height="125" rx="22" ry="22"/>
<text class="label" x="644" y="738" text-anchor="start">Contact competent authority</text>
<text class="label" x="644" y="767" text-anchor="start">promptly</text>
<path class="arrow" d="M870,825 L870,865"/>
<rect class="legal" x="620" y="880" width="500" height="125" rx="22" ry="22"/>
<text class="label" x="644" y="918" text-anchor="start">Follow official</text>
<text class="label" x="644" y="947" text-anchor="start">identification/control</text>
<text class="label" x="644" y="976" text-anchor="start">instructions</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">Do not apply ordinary Varroa threshold logic to a suspected exotic or notifiable organism.</text>
</svg>
