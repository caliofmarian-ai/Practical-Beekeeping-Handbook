<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 44.8 — EFB Sampling and Diagnostic Pathway</title>
<desc id="desc">EFB diagnostic pathway from representative larva and labelled sample to validated test, integrated interpretation, legal management decision and follow-up.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 44.8 — EFB Sampling and Diagnostic Pathway</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Clinical appearance guides sample selection; diagnosis integrates validated testing, signs</text>
<text class="subtitle" x="60" y="136" text-anchor="start">and legal context.</text>
<rect class="box" x="210" y="210" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="248" text-anchor="start">Representative abnormal larva</text>
<text class="body" x="234" y="287" text-anchor="start">Choose material that reflects the current lesion pattern; avoid</text>
<text class="body" x="234" y="314" text-anchor="start">sampling only dried or unrelated debris.</text>
<path class="arrow" d="M600,335 L600,380"/>
<rect class="box" x="210" y="390" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="428" text-anchor="start">Labelled sample and chain of identity</text>
<text class="body" x="234" y="467" text-anchor="start">Record colony/apiary, date, material, collector and relevant</text>
<text class="body" x="234" y="494" text-anchor="start">clinical observations.</text>
<path class="arrow" d="M600,515 L600,560"/>
<rect class="box2" x="210" y="570" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="608" text-anchor="start">Validated field or laboratory test</text>
<text class="body" x="234" y="647" text-anchor="start">Use the method accepted for the intended decision; methods and</text>
<text class="body" x="234" y="674" text-anchor="start">authority requirements vary by jurisdiction.</text>
<path class="arrow" d="M600,695 L600,740"/>
<rect class="box" x="210" y="750" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="788" text-anchor="start">Interpret with clinical signs</text>
<text class="body" x="234" y="827" text-anchor="start">Consider larval age/position, brood pattern, colony stress and</text>
<text class="body" x="234" y="854" text-anchor="start">differential diagnoses; poor nutrition modifies expression but is</text>
<text class="body" x="234" y="881" text-anchor="start">not the infectious cause.</text>
<path class="arrow" d="M600,875 L600,920"/>
<rect class="legal" x="210" y="930" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="968" text-anchor="start">Apply legal / management decision</text>
<text class="body" x="234" y="1007" text-anchor="start">Follow competent-authority and veterinary requirements where</text>
<text class="body" x="234" y="1034" text-anchor="start">applicable; do not treat one visual sign as proof.</text>
<path class="arrow" d="M600,1055 L600,1100"/>
<rect class="box2" x="210" y="1110" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="1148" text-anchor="start">Reinspect and monitor recurrence</text>
<text class="body" x="234" y="1187" text-anchor="start">Clinical improvement does not remove the need for follow-up where</text>
<text class="body" x="234" y="1214" text-anchor="start">the programme requires it.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">EFB does not form AFB-like durable bacterial endospores. Treatment and shook-swarm decisions</text>
<text class="small" x="85" y="1535" text-anchor="start">are jurisdiction-dependent.</text>
</svg>
