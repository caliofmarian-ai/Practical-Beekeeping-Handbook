<text class="label" x="654" y="327" text-anchor="start">next</text>
<text class="label" x="654" y="356" text-anchor="start">generation</text>
<text class="body" x="654" y="395" text-anchor="start">Survivors</text>
<text class="body" x="654" y="422" text-anchor="start">contribute</text>
<text class="body" x="654" y="449" text-anchor="start">disproportionately</text>
<text class="body" x="654" y="476" text-anchor="start">to future</text>
<text class="body" x="654" y="503" text-anchor="start">population.</text>
