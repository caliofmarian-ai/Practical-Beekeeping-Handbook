<circle cx="1080" cy="590" r="8" fill="#777"/>
<text class="label" x="110" y="780" text-anchor="start">● susceptible example    ◇ resistant example</text>
<rect class="box2" x="130" y="880" width="940" height="270" rx="22" ry="22"/>
<text class="label" x="154" y="918" text-anchor="start">Key management lesson</text>
<text class="body" x="154" y="957" text-anchor="start">Changing product brand names is not necessarily changing the relevant mode of</text>
<text class="body" x="154" y="984" text-anchor="start">action. Resistance management still requires monitoring, authorised choices,</text>
<text class="body" x="154" y="1011" text-anchor="start">correct application and verification.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">This conceptual figure does not predict resistance speed for a specific product or</text>
<text class="small" x="85" y="1535" text-anchor="start">population and does not authorise unlabelled rotation/combination schemes.</text>
</svg>
