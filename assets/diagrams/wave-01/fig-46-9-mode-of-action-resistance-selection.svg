<rect class="box" x="350" y="260" width="220" height="420" rx="22" ry="22"/>
<text class="label" x="374" y="298" text-anchor="start">After one</text>
<text class="label" x="374" y="327" text-anchor="start">control</text>
<text class="body" x="374" y="366" text-anchor="start">Many susceptible</text>
<text class="body" x="374" y="393" text-anchor="start">mites removed;</text>
<text class="body" x="374" y="420" text-anchor="start">resistant</text>
<text class="body" x="374" y="447" text-anchor="start">survivors are</text>
<text class="body" x="374" y="474" text-anchor="start">over-represented.</text>
