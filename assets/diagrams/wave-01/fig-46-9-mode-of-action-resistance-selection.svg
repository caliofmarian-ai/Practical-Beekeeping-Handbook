<rect class="box" x="910" y="260" width="220" height="420" rx="22" ry="22"/>
<text class="label" x="934" y="298" text-anchor="start">Repeated same</text>
<text class="label" x="934" y="327" text-anchor="start">mode of action</text>
<text class="body" x="934" y="366" text-anchor="start">Resistance</text>
<text class="body" x="934" y="393" text-anchor="start">frequency can rise</text>
<text class="body" x="934" y="420" text-anchor="start">further if</text>
<text class="body" x="934" y="447" text-anchor="start">selection</text>
<text class="body" x="934" y="474" text-anchor="start">continues without</text>
<text class="body" x="934" y="501" text-anchor="start">effective</text>
<text class="body" x="934" y="528" text-anchor="start">rotation/strategy.</text>
<rect x="937" y="492" width="16" height="16" transform="rotate(45 945 500)" fill="#fff" stroke="#111" stroke-width="3"/>
