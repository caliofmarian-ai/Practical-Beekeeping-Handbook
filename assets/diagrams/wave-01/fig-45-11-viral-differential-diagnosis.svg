<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 45.11 — Viral Differential Diagnosis</title>
<desc id="desc">Differential matrix for deformed wings, trembling/crawling adults, shiny adults, mortality and dead brood across viral and non-viral causes.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 45.11 — Viral Differential Diagnosis</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Adult and brood signs overlap among viruses and non-viral problems; testing is selected</text>
<text class="subtitle" x="60" y="136" text-anchor="start">according to the syndrome and decision.</text>
<rect class="box2" x="55" y="225" width="250" height="95" rx="22" ry="22"/>
<text class="label" x="79" y="263" text-anchor="start">Observed sign</text>
<rect class="box2" x="305" y="225" width="420" height="95" rx="22" ry="22"/>
<text class="label" x="329" y="263" text-anchor="start">Viral possibilities</text>
<rect class="box2" x="725" y="225" width="420" height="95" rx="22" ry="22"/>
<text class="label" x="749" y="263" text-anchor="start">Non-viral / competing</text>
<text class="label" x="749" y="292" text-anchor="start">possibilities</text>
<rect class="box2" x="55" y="340" width="250" height="185" rx="22" ry="22"/>
<text class="label" x="79" y="378" text-anchor="start">Deformed wings</text>
<rect class="box" x="305" y="340" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="329" y="378" text-anchor="start">DWV-associated disease often</text>
<text class="label" x="329" y="407" text-anchor="start">linked to Varroa pressure</text>
<rect class="box" x="725" y="340" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="749" y="378" text-anchor="start">Developmental injury/other</text>
<text class="label" x="749" y="407" text-anchor="start">causes; phenotype alone does</text>
<text class="label" x="749" y="436" text-anchor="start">not quantify mites</text>
<rect class="box2" x="55" y="535" width="250" height="185" rx="22" ry="22"/>
<text class="label" x="79" y="573" text-anchor="start">Trembling /</text>
<text class="label" x="79" y="602" text-anchor="start">crawling adults</text>
<rect class="box" x="305" y="535" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="329" y="573" text-anchor="start">CBPV or</text>
<text class="label" x="329" y="602" text-anchor="start">acute-paralysis-virus group</text>
<text class="label" x="329" y="631" text-anchor="start">possible</text>
<rect class="box" x="725" y="535" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="749" y="573" text-anchor="start">Toxic exposure, temperature</text>
<text class="label" x="749" y="602" text-anchor="start">stress, starvation, other</text>
<text class="label" x="749" y="631" text-anchor="start">adult disease</text>
<rect class="box2" x="55" y="730" width="250" height="185" rx="22" ry="22"/>
<text class="label" x="79" y="768" text-anchor="start">Hairless shiny</text>
<text class="label" x="79" y="797" text-anchor="start">adults</text>
<rect class="box" x="305" y="730" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="329" y="768" text-anchor="start">CBPV-compatible syndrome can</text>
<text class="label" x="329" y="797" text-anchor="start">occur</text>
<rect class="box" x="725" y="730" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="749" y="768" text-anchor="start">Abrasion/robbing or other</text>
<text class="label" x="749" y="797" text-anchor="start">causes can mimic part of</text>
<text class="label" x="749" y="826" text-anchor="start">appearance</text>
<rect class="box2" x="55" y="925" width="250" height="185" rx="22" ry="22"/>
<text class="label" x="79" y="963" text-anchor="start">Adult mortality</text>
<rect class="box" x="305" y="925" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="329" y="963" text-anchor="start">Several viruses may</text>
<text class="label" x="329" y="992" text-anchor="start">contribute depending on</text>
<text class="label" x="329" y="1021" text-anchor="start">context</text>
<rect class="box" x="725" y="925" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="749" y="963" text-anchor="start">Pesticide/toxic exposure,</text>
<text class="label" x="749" y="992" text-anchor="start">starvation, weather,</text>
<text class="label" x="749" y="1021" text-anchor="start">queen/colony collapse</text>
<rect class="box2" x="55" y="1120" width="250" height="185" rx="22" ry="22"/>
<text class="label" x="79" y="1158" text-anchor="start">Dead brood</text>
<rect class="box" x="305" y="1120" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="329" y="1158" text-anchor="start">Sacbrood/other viral</text>
<text class="label" x="329" y="1187" text-anchor="start">involvement possible</text>
<rect class="box" x="725" y="1120" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="749" y="1158" text-anchor="start">AFB/EFB, chilling,</text>
<text class="label" x="749" y="1187" text-anchor="start">Varroa-associated removal,</text>
<text class="label" x="749" y="1216" text-anchor="start">nutrition</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">A positive PCR result shows target RNA detection under the assay conditions; it does not by</text>
<text class="small" x="85" y="1535" text-anchor="start">itself prove that the virus caused the observed syndrome.</text>
</svg>
