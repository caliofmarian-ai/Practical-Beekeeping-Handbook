<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 43.6 — AFB Differential Diagnosis</title>
<desc id="desc">Differential diagnosis matrix for AFB, EFB, sacbrood, chilled brood and Varroa-associated brood removal.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 43.6 — AFB Differential Diagnosis</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Brood abnormalities overlap; compare developmental stage and remains, then use appropriate</text>
<text class="subtitle" x="60" y="136" text-anchor="start">confirmation rather than visual certainty.</text>
<rect class="box2" x="55" y="225" width="250" height="95" rx="22" ry="22"/>
<text class="label" x="79" y="263" text-anchor="start">Condition</text>
<rect class="box2" x="305" y="225" width="420" height="95" rx="22" ry="22"/>
<text class="label" x="329" y="263" text-anchor="start">Pattern/signs that may raise</text>
<text class="label" x="329" y="292" text-anchor="start">suspicion</text>
<rect class="box2" x="725" y="225" width="420" height="95" rx="22" ry="22"/>
<text class="label" x="749" y="263" text-anchor="start">Key limitation / next step</text>
<rect class="box2" x="55" y="340" width="250" height="185" rx="22" ry="22"/>
<text class="label" x="79" y="378" text-anchor="start">AFB</text>
<rect class="box" x="305" y="340" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="329" y="378" text-anchor="start">Irregular sealed brood,</text>
<text class="label" x="329" y="407" text-anchor="start">suspicious cappings,</text>
<text class="label" x="329" y="436" text-anchor="start">decomposed remains/adherent</text>
<text class="label" x="329" y="465" text-anchor="start">scale may occur</text>
<rect class="box" x="725" y="340" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="749" y="378" text-anchor="start">Field signs support</text>
<text class="label" x="749" y="407" text-anchor="start">investigation; confirm</text>
<text class="label" x="749" y="436" text-anchor="start">through current</text>
<text class="label" x="749" y="465" text-anchor="start">validated/official pathway</text>
<rect class="box2" x="55" y="535" width="250" height="185" rx="22" ry="22"/>
<text class="label" x="79" y="573" text-anchor="start">EFB</text>
<rect class="box" x="305" y="535" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="329" y="573" text-anchor="start">Often abnormal open larvae;</text>
<text class="label" x="329" y="602" text-anchor="start">twisted/discoloured larvae</text>
<text class="label" x="329" y="631" text-anchor="start">may occur</text>
<rect class="box" x="725" y="535" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="749" y="573" text-anchor="start">Can overlap; representative</text>
<text class="label" x="749" y="602" text-anchor="start">larvae and accepted testing</text>
<text class="label" x="749" y="631" text-anchor="start">are needed</text>
<rect class="box2" x="55" y="730" width="250" height="185" rx="22" ry="22"/>
<text class="label" x="79" y="768" text-anchor="start">Sacbrood</text>
<rect class="box" x="305" y="730" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="329" y="768" text-anchor="start">Larval skin/sac-like remains</text>
<text class="label" x="329" y="797" text-anchor="start">and raised head can occur</text>
<rect class="box" x="725" y="730" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="749" y="768" text-anchor="start">Virus-associated syndrome;</text>
<text class="label" x="749" y="797" text-anchor="start">appearance still requires</text>
<text class="label" x="749" y="826" text-anchor="start">context</text>
<rect class="box2" x="55" y="925" width="250" height="185" rx="22" ry="22"/>
<text class="label" x="79" y="963" text-anchor="start">Chilled brood</text>
<rect class="box" x="305" y="925" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="329" y="963" text-anchor="start">Brood death follows</text>
<text class="label" x="329" y="992" text-anchor="start">temperature/exposure pattern</text>
<rect class="box" x="725" y="925" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="749" y="963" text-anchor="start">History and distribution</text>
<text class="label" x="749" y="992" text-anchor="start">matter; do not call</text>
<text class="label" x="749" y="1021" text-anchor="start">bacterial disease from dead</text>
<text class="label" x="749" y="1050" text-anchor="start">brood alone</text>
<rect class="box2" x="55" y="1120" width="250" height="185" rx="22" ry="22"/>
<text class="label" x="79" y="1158" text-anchor="start">Varroa-associated</text>
<text class="label" x="79" y="1187" text-anchor="start">brood removal</text>
<rect class="box" x="305" y="1120" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="329" y="1158" text-anchor="start">Patchy brood/removed pupae</text>
<text class="label" x="329" y="1187" text-anchor="start">may accompany high</text>
<text class="label" x="329" y="1216" text-anchor="start">mite/virus pressure</text>
<rect class="box" x="725" y="1120" width="420" height="185" rx="22" ry="22"/>
<text class="label" x="749" y="1158" text-anchor="start">Quantify Varroa and assess</text>
<text class="label" x="749" y="1187" text-anchor="start">colony/virus context</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">Disease appearance varies with stage and colony condition. Notifiable-disease suspicion</text>
<text class="small" x="85" y="1535" text-anchor="start">requires current competent-authority procedures.</text>
</svg>
