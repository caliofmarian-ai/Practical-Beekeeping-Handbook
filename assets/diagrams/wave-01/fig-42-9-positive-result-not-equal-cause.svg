<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="portrait-field" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<!-- semantic-color-pass:v1 -->
<title id="title">Figure 42.9 — A Positive Result Does Not Equal Cause</title>
<desc id="desc">Decision flow interpreting a positive Nosema/Vairimorpha test without equating detection with cause.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker></defs>
<style>
.bg{fill:#FFFFFF}.title{font:700 38px Arial,Helvetica,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#52606D}
.box{fill:#F3E5F5;stroke:#4A148C;stroke-width:3}.box2{fill:#E3F2FD;stroke:#4A148C;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,Helvetica,sans-serif;fill:#1F2933}.body{font:400 21px Arial,Helvetica,sans-serif;fill:#1F2933}.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52606D}
.arrow{stroke:#6A1B9A;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#4A148C;stroke:#4A148C;stroke-width:3}.hubtext{font:700 22px Arial,Helvetica,sans-serif;fill:#FFFFFF;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 42.9 — A Positive Result Does Not Equal Cause</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Pathogen detection must be linked to sample quality, species/assay, colony signs and</text>
<text class="subtitle" x="60" y="136" text-anchor="start">competing explanations.</text>
<rect class="box2" x="210" y="210" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="248" text-anchor="start">Positive result</text>
<text class="body" x="234" y="287" text-anchor="start">A compatible spore/molecular target was detected in the tested</text>
<text class="body" x="234" y="314" text-anchor="start">sample.</text>
<path class="arrow" d="M600,335 L600,380"/>
<rect class="box" x="210" y="390" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="428" text-anchor="start">Was sampling representative?</text>
<text class="body" x="234" y="467" text-anchor="start">Review bee age/location, sample size, timing, colony ID and</text>
<text class="body" x="234" y="494" text-anchor="start">processing quality.</text>
<path class="arrow" d="M600,515 L600,560"/>
<rect class="box" x="210" y="570" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="608" text-anchor="start">What exactly was detected?</text>
<text class="body" x="234" y="647" text-anchor="start">Microscopy: compatible spores; molecular assay: defined</text>
<text class="body" x="234" y="674" text-anchor="start">target/species depending on method.</text>
<path class="arrow" d="M600,695 L600,740"/>
<rect class="box" x="210" y="750" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="788" text-anchor="start">Does colony condition fit clinical significance?</text>
<text class="body" x="234" y="827" text-anchor="start">Strength, brood, queen function, food, season and trajectory</text>
<text class="body" x="234" y="854" text-anchor="start">matter.</text>
<path class="arrow" d="M600,875 L600,920"/>
<rect class="box" x="210" y="930" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="968" text-anchor="start">Competing stressors?</text>
<text class="body" x="234" y="1007" text-anchor="start">Varroa/viruses, queen failure, nutrition, pesticide/toxic</text>
<text class="body" x="234" y="1034" text-anchor="start">exposure, other disease, weather or management.</text>
<path class="arrow" d="M600,1055 L600,1100"/>
<rect class="legal" x="210" y="1110" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="1148" text-anchor="start">Management significance</text>
<text class="body" x="234" y="1187" text-anchor="start">Act on the integrated evidence and current legal/product options,</text>
<text class="body" x="234" y="1214" text-anchor="start">not the word &#x27;positive&#x27; alone.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">The diagram separates pathogen detection from proof that the detected organism caused the</text>
<text class="small" x="85" y="1535" text-anchor="start">observed colony problem.</text>
</svg>
