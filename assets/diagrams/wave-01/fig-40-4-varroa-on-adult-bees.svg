<text x="950" y="650" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#1F2933" text-anchor="start">Modern evidence supports major feeding</text>
<text x="950" y="675" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#1F2933" text-anchor="start">on fat-body tissue, which is important</text>
