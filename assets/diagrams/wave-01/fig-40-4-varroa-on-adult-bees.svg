<text x="78" y="915" font-family="Arial,Helvetica,sans-serif" font-size="18.0" font-weight="600" fill="#1F2933" text-anchor="start"><tspan x="78" dy="0">Varroa often shelters between abdominal sclerites or body regions. Absence of visible mites during a quick inspection does not</tspan><tspan x="78" dy="22.0">establish a mite-free colony.</tspan></text>
