<text x="845" y="650" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#1F2933" text-anchor="start">Fat body supports nutrient storage,</text>
<text x="845" y="675" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#1F2933" text-anchor="start">metabolism, immunity and detoxification.</text>
<text x="845" y="700" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#1F2933" text-anchor="start">Feeding damage therefore has broad effects.</text>
