<text x="78" y="925" font-family="Arial,Helvetica,sans-serif" font-size="18.0" font-weight="600" fill="#1F2933" text-anchor="start"><tspan x="78" dy="0">Diagram is a teaching cutaway, not a literal histological section. The key concept is that Varroa feeds while protected between body</tspan><tspan x="78" dy="22.0">plates and targets fat-body-rich abdominal tissues.</tspan></text>
