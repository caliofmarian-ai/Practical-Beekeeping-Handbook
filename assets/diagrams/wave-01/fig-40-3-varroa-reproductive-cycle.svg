<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
<title id="title">Figure 40.3 — Varroa Reproductive Cycle</title>
<desc id="desc">Worker-brood sequence showing foundress entry before capping, feeding site, male-first egg sequence, daughter development, mating and emergence.</desc>
