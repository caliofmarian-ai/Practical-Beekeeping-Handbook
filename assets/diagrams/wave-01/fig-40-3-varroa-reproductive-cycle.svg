<text x="78" y="915" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1F2933" text-anchor="start">Varroa reproduces inside capped brood. Worker brood commonly yields fewer mature daughters than longer-capped drone brood; do not infer colony mite level from one opened cell.</text>
