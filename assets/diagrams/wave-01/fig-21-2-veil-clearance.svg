<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="portrait-field" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<!-- semantic-color-pass:v1 -->
<title id="title">Figure 21.2 — Veil Clearance</title>
<desc id="desc">Comparison of safe veil clearance from the face versus mesh pressed against skin where stings can penetrate more readily.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs>
<style>
.bg{fill:#FFFFFF}.title{font:700 38px Arial,Helvetica,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#52606D}
.box{fill:#E3F2FD;stroke:#0D47A1;stroke-width:3}.box2{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,Helvetica,sans-serif;fill:#1F2933}.body{font:400 21px Arial,Helvetica,sans-serif;fill:#1F2933}.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52606D}
.arrow{stroke:#1565C0;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#0D47A1;stroke:#0D47A1;stroke-width:3}.hubtext{font:700 22px Arial,Helvetica,sans-serif;fill:#FFFFFF;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 21.2 — Veil Clearance</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Veils reduce sting exposure only when mesh is held away from skin and closures remain</text>
<text class="subtitle" x="60" y="136" text-anchor="start">secure.</text>
<rect class="box" x="70" y="190" width="500" height="1120" rx="22" ry="22"/>
<text class="label" x="94" y="228" text-anchor="start">Correct clearance</text>
<text class="body" x="94" y="267" text-anchor="start">Mesh remains visibly separated from the</text>
<text class="body" x="94" y="294" text-anchor="start">face; veil frame/hat structure maintains</text>
<text class="body" x="94" y="321" text-anchor="start">space; neck/zip closure is secure.</text>
<circle cx="320" cy="610" r="105" fill="#E3F2FD" stroke="#1F2933" stroke-width="3"/>
<path d="M235,470 Q320,375 405,470 L450,760 Q320,830 190,760 Z" fill="none" stroke="#1F2933" stroke-width="6" stroke-dasharray="10 8"/>
<path d="M320,505 Q385,520 405,575 Q385,625 320,635" fill="none" stroke="#52606D" stroke-width="4"/>
<line x1="405" y1="575" x2="445" y2="575" stroke="#1F2933" stroke-width="3" marker-end="url(#arrow)"/>
<text class="label" x="205" y="880" text-anchor="start">Visible air gap between face</text>
<text class="label" x="205" y="910" text-anchor="start">and mesh</text>
<text class="body" x="205" y="980" text-anchor="start">Clearance plus closed zips/cuffs</text>
<text class="body" x="205" y="1007" text-anchor="start">improves protection; it does not</text>
<text class="body" x="205" y="1034" text-anchor="start">guarantee zero stings.</text>
<rect class="stop" x="630" y="190" width="500" height="1120" rx="22" ry="22"/>
<text class="label" x="654" y="228" text-anchor="start">Unsafe contact / poor fit</text>
<text class="body" x="654" y="267" text-anchor="start">Mesh pressed against skin, collapsed veil</text>
<text class="body" x="654" y="294" text-anchor="start">geometry or open closure allows easier</text>
<text class="body" x="654" y="321" text-anchor="start">sting access and bee entry.</text>
<circle cx="880" cy="610" r="105" fill="#E3F2FD" stroke="#1F2933" stroke-width="3"/>
<path d="M795,505 Q865,500 925,525 Q955,575 925,640 Q865,675 795,650" fill="none" stroke="#1F2933" stroke-width="6" stroke-dasharray="10 8"/>
<path d="M880,505 Q945,520 965,575 Q945,625 880,635" fill="none" stroke="#52606D" stroke-width="4"/>
<line x1="930" y1="560" x2="880" y2="560" stroke="#1F2933" stroke-width="4" marker-end="url(#arrow)"/>
<text class="label" x="760" y="880" text-anchor="start">Mesh contacts cheek/nose/neck</text>
<text class="body" x="760" y="980" text-anchor="start">Stop and refit before working a</text>
<text class="body" x="760" y="1007" text-anchor="start">colony; heat stress and visibility</text>
<text class="body" x="760" y="1034" text-anchor="start">still need separate control.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">Protective clothing is one control layer. Calm handling, colony temperament, weather and</text>
<text class="small" x="85" y="1535" text-anchor="start">task planning remain important.</text>
</svg>
