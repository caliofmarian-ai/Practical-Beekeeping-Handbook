<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 45.12 — Practical Virus-Management Framework</title>
<desc id="desc">Hub diagram of practical honey-bee virus risk management through Varroa control, nutrition, stock, robbing/drifting reduction, movement biosecurity, exposure investigation and testing.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 45.12 — Practical Virus-Management Framework</text>
<text class="subtitle" x="60" y="108" text-anchor="start">There is no generic direct antiviral treatment panel; management reduces vectors, stress and</text>
<text class="subtitle" x="60" y="136" text-anchor="start">transmission while improving evidence quality.</text>
<circle class="hub" cx="600" cy="790" r="145"/>
<text class="hubtext" x="600" y="780" text-anchor="middle">Virus-risk</text>
<text class="hubtext" x="600" y="810" text-anchor="middle">management</text>
<rect class="box" x="465" y="195" width="270" height="150" rx="22" ry="22"/>
<text class="label" x="489" y="233" text-anchor="start">Varroa management</text>
<text class="body" x="489" y="272" text-anchor="start">Quantitative</text>
<text class="body" x="489" y="299" text-anchor="start">monitoring and</text>
<text class="body" x="489" y="326" text-anchor="start">effective authorised</text>
<text class="body" x="489" y="353" text-anchor="start">IPM control.</text>
<path class="arrow" d="M600,270 L600,790"/>
<rect class="box" x="830" y="395" width="270" height="150" rx="22" ry="22"/>
<text class="label" x="854" y="433" text-anchor="start">Nutrition</text>
<text class="body" x="854" y="472" text-anchor="start">Adequate forage/stores</text>
<text class="body" x="854" y="499" text-anchor="start">and avoidance of</text>
<text class="body" x="854" y="526" text-anchor="start">chronic nutritional</text>
<text class="body" x="854" y="553" text-anchor="start">stress.</text>
<path class="arrow" d="M965,470 L600,790"/>
<rect class="box" x="875" y="805" width="270" height="150" rx="22" ry="22"/>
<text class="label" x="899" y="843" text-anchor="start">Resistant /</text>
<text class="label" x="899" y="872" text-anchor="start">adapted stock</text>
<text class="body" x="899" y="911" text-anchor="start">Use breeding evidence</text>
<text class="body" x="899" y="938" text-anchor="start">without overclaiming</text>
<text class="body" x="899" y="965" text-anchor="start">immunity.</text>
<path class="arrow" d="M1010,880 L600,790"/>
<rect class="box" x="655" y="1115" width="270" height="150" rx="22" ry="22"/>
<text class="label" x="679" y="1153" text-anchor="start">Robbing / drifting</text>
<text class="label" x="679" y="1182" text-anchor="start">control</text>
<text class="body" x="679" y="1221" text-anchor="start">Reduce avoidable</text>
<text class="body" x="679" y="1248" text-anchor="start">colony-to-colony</text>
<text class="body" x="679" y="1275" text-anchor="start">transfer.</text>
<path class="arrow" d="M790,1190 L600,790"/>
<rect class="box" x="275" y="1115" width="270" height="150" rx="22" ry="22"/>
<text class="label" x="299" y="1153" text-anchor="start">Movement</text>
<text class="label" x="299" y="1182" text-anchor="start">biosecurity</text>
<text class="body" x="299" y="1221" text-anchor="start">Trace introductions</text>
<text class="body" x="299" y="1248" text-anchor="start">and avoid moving</text>
<text class="body" x="299" y="1275" text-anchor="start">collapsing/suspect</text>
<text class="body" x="299" y="1302" text-anchor="start">colonies without</text>
<text class="body" x="299" y="1329" text-anchor="start">assessment.</text>
<path class="arrow" d="M410,1190 L600,790"/>
<rect class="box" x="55" y="805" width="270" height="150" rx="22" ry="22"/>
<text class="label" x="79" y="843" text-anchor="start">Exposure</text>
<text class="label" x="79" y="872" text-anchor="start">investigation</text>
<text class="body" x="79" y="911" text-anchor="start">Consider pesticides,</text>
<text class="body" x="79" y="938" text-anchor="start">weather and other</text>
<text class="body" x="79" y="965" text-anchor="start">stressors in</text>
<text class="body" x="79" y="992" text-anchor="start">differential</text>
<text class="body" x="79" y="1019" text-anchor="start">diagnosis.</text>
<path class="arrow" d="M190,880 L600,790"/>
<rect class="box" x="100" y="395" width="270" height="150" rx="22" ry="22"/>
<text class="label" x="124" y="433" text-anchor="start">Laboratory testing</text>
<text class="body" x="124" y="472" text-anchor="start">Use evidence-based</text>
<text class="body" x="124" y="499" text-anchor="start">testing when it</text>
<text class="body" x="124" y="526" text-anchor="start">changes a decision.</text>
<path class="arrow" d="M235,470 L600,790"/>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">A positive virus test is not a licence to use unapproved pharmaceuticals. Management remains</text>
<text class="small" x="85" y="1535" text-anchor="start">integrated and evidence-based.</text>
</svg>
