<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 22.1 — Smoker Anatomy</title>
<desc id="desc">Labelled technical schematic of a bee smoker showing lid and nozzle, fire chamber, internal grate, heat shield, bellows, air inlet and hanging hook.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 22.1 — Smoker Anatomy</text>
<text class="subtitle" x="60" y="108" text-anchor="start">A smoker is a controlled airflow/combustion tool; maintenance prevents hot smoke, flame and</text>
<text class="subtitle" x="60" y="136" text-anchor="start">spark hazards.</text>
<rect x="440" y="380" width="260" height="570" rx="30" fill="#eee" stroke="#222" stroke-width="5"/>
<rect x="410" y="380" width="320" height="570" rx="35" fill="none" stroke="#555" stroke-width="4"/>
<path d="M455,380 Q570,260 685,380" fill="#f7f7f7" stroke="#222" stroke-width="5"/>
<path d="M600,300 L805,225 L840,280 L670,395" fill="#f7f7f7" stroke="#222" stroke-width="5"/>
<line x1="465" y1="870" x2="680" y2="870" stroke="#222" stroke-width="8"/>
<rect x="180" y="475" width="180" height="410" rx="35" fill="#f7f7f7" stroke="#222" stroke-width="5"/>
<line x1="360" y1="670" x2="440" y2="670" stroke="#222" stroke-width="10"/>
<circle cx="245" cy="845" r="18" fill="#fff" stroke="#222" stroke-width="4"/>
<path d="M710,500 Q825,470 825,580" fill="none" stroke="#222" stroke-width="7"/>
<text class="label" x="875" y="230" text-anchor="start">Nozzle</text>
<path class="arrow" d="M865,222 L805,250"/>
<text class="label" x="850" y="380" text-anchor="start">Lid</text>
<path class="arrow" d="M840,372 L680,350"/>
<text class="label" x="790" y="600" text-anchor="start">Fire chamber</text>
<path class="arrow" d="M780,592 L700,600"/>
<text class="label" x="790" y="880" text-anchor="start">Internal grate</text>
<path class="arrow" d="M780,872 L675,870"/>
<text class="label" x="760" y="1030" text-anchor="start">Heat shield</text>
<path class="arrow" d="M750,1022 L705,920"/>
<text class="label" x="70" y="520" text-anchor="start">Bellows</text>
<path class="arrow" d="M220,512 L180,560"/>
<text class="label" x="60" y="860" text-anchor="start">Air inlet</text>
<path class="arrow" d="M210,852 L230,845"/>
<text class="label" x="85" y="690" text-anchor="start">Air path to chamber</text>
<path class="arrow" d="M235,682 L400,670"/>
<text class="label" x="860" y="510" text-anchor="start">Hanging hook</text>
<path class="arrow" d="M850,502 L825,520"/>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">The heat shield reduces accidental contact but does not make the chamber safe to place on</text>
<text class="small" x="85" y="1535" text-anchor="start">dry vegetation, clothing or vehicle interiors.</text>
</svg>
