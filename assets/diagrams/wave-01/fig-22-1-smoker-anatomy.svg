.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 22.1 — Smoker Anatomy</text>
<text class="subtitle" x="60" y="108" text-anchor="start">A smoker is a controlled airflow/combustion tool; maintenance prevents hot smoke, flame and</text>
<text class="subtitle" x="60" y="136" text-anchor="start">spark hazards.</text>
