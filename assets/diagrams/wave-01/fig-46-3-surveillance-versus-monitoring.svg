<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 46.3 — Surveillance Versus Monitoring</title>
<desc id="desc">Two-column comparison of exotic-pest surveillance and repeated monitoring of an established threat such as Varroa.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 46.3 — Surveillance Versus Monitoring</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Surveillance asks whether a threat is present; monitoring repeatedly measures a known or</text>
<text class="subtitle" x="60" y="136" text-anchor="start">established threat.</text>
<rect class="box" x="70" y="190" width="500" height="100" rx="22" ry="22"/>
<text class="label" x="94" y="228" text-anchor="start">Surveillance</text>
<rect class="legal" x="630" y="190" width="500" height="100" rx="22" ry="22"/>
<text class="label" x="654" y="228" text-anchor="start">Monitoring</text>
<rect class="box" x="70" y="340" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="94" y="378" text-anchor="start">Question</text>
<text class="body" x="94" y="417" text-anchor="start">Is an exotic/notifiable organism present?</text>
<rect class="legal" x="630" y="340" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="654" y="378" text-anchor="start">Question</text>
<text class="body" x="654" y="417" text-anchor="start">How much established pest pressure is</text>
<text class="body" x="654" y="444" text-anchor="start">present now?</text>
<rect class="box" x="70" y="485" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="94" y="523" text-anchor="start">Design</text>
<text class="body" x="94" y="562" text-anchor="start">Presence/absence detection, targeted</text>
<text class="body" x="94" y="589" text-anchor="start">high-risk sampling, competent</text>
<text class="body" x="94" y="616" text-anchor="start">identification.</text>
<rect class="legal" x="630" y="485" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="654" y="523" text-anchor="start">Design</text>
<text class="body" x="654" y="562" text-anchor="start">Repeated quantitative method with</text>
<text class="body" x="654" y="589" text-anchor="start">consistent denominator and timing.</text>
<rect class="box" x="70" y="630" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="94" y="668" text-anchor="start">Trigger</text>
<text class="body" x="94" y="707" text-anchor="start">Suspicion can require evidence</text>
<text class="body" x="94" y="734" text-anchor="start">preservation, movement restraint and</text>
<text class="body" x="94" y="761" text-anchor="start">authority contact.</text>
<rect class="legal" x="630" y="630" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="654" y="668" text-anchor="start">Trigger</text>
<text class="body" x="654" y="707" text-anchor="start">Interpret measured level with season,</text>
<text class="body" x="654" y="734" text-anchor="start">brood, colony condition and local</text>
<text class="body" x="654" y="761" text-anchor="start">guidance.</text>
<rect class="box" x="70" y="775" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="94" y="813" text-anchor="start">Example</text>
<text class="body" x="94" y="852" text-anchor="start">Tropilaelaps surveillance in a region</text>
<text class="body" x="94" y="879" text-anchor="start">where it is exotic/regulatory concern.</text>
<rect class="legal" x="630" y="775" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="654" y="813" text-anchor="start">Example</text>
<text class="body" x="654" y="852" text-anchor="start">Varroa adult-bee sampling repeated</text>
<text class="body" x="654" y="879" text-anchor="start">through the season.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">Do not substitute ordinary Varroa threshold logic for exotic-pest surveillance or statutory</text>
<text class="small" x="85" y="1535" text-anchor="start">disease response.</text>
</svg>
