<text class="label" x="889" y="1187" text-anchor="start">PPE contamination</text>
<text class="label" x="889" y="1216" text-anchor="start">from food area</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">No clothing configuration guarantees zero stings. Choose PPE together with behavioural, site</text>
<text class="small" x="85" y="1535" text-anchor="start">and task controls.</text>
