<text class="label" x="889" y="1021" text-anchor="start">for heat symptoms</text>
<rect class="box2" x="55" y="1120" width="250" height="185" rx="22" ry="22"/>
<text class="label" x="79" y="1158" text-anchor="start">Honey-room work</text>
<rect class="box" x="305" y="1120" width="280" height="185" rx="22" ry="22"/>
<text class="label" x="329" y="1158" text-anchor="start">Food-hygiene</text>
<text class="label" x="329" y="1187" text-anchor="start">clothing; bees may</text>
<text class="label" x="329" y="1216" text-anchor="start">be absent</text>
<rect class="box" x="585" y="1120" width="280" height="185" rx="22" ry="22"/>
<text class="label" x="609" y="1158" text-anchor="start">Clean</text>
<text class="label" x="609" y="1187" text-anchor="start">food-handling</text>
<text class="label" x="609" y="1216" text-anchor="start">gloves where task</text>
<text class="label" x="609" y="1245" text-anchor="start">requires</text>
