<title id="title">Figure 21.3 — Clothing Selection by Task</title>
<desc id="desc">Matrix matching protective clothing considerations to routine inspections, defensive colonies, swarm collection, hot weather and honey-room work.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs>
<style>
