<rect class="box" x="585" y="925" width="280" height="185" rx="22" ry="22"/>
<text class="label" x="609" y="963" text-anchor="start">Balance</text>
<text class="label" x="609" y="992" text-anchor="start">dexterity/sting</text>
<text class="label" x="609" y="1021" text-anchor="start">risk</text>
<rect class="box" x="865" y="925" width="280" height="185" rx="22" ry="22"/>
<text class="label" x="889" y="963" text-anchor="start">Hydration, shade,</text>
