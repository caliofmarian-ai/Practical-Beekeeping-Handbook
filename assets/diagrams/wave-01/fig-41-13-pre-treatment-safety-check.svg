<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 41.13 — Honey-Super and Temperature Decision Check</title>
<desc id="desc">Pre-treatment checklist covering authorisation, honey-super status, brood, weather, PPE, resistance history and follow-up monitoring.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 41.13 — Honey-Super and Temperature Decision Check</text>
<text class="subtitle" x="60" y="108" text-anchor="start">A pre-treatment safety and compliance check happens before any product is applied.</text>
<rect class="legal" x="210" y="210" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="248" text-anchor="start">Authorised product and intended use?</text>
<text class="body" x="234" y="287" text-anchor="start">Check current jurisdiction, species/pest indication and label</text>
<text class="body" x="234" y="314" text-anchor="start">directions.</text>
<path class="arrow" d="M600,335 L600,380"/>
<rect class="legal" x="210" y="390" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="428" text-anchor="start">Honey-super / harvest status compatible?</text>
<text class="body" x="234" y="467" text-anchor="start">Respect all honey-super, withdrawal, residue and harvest</text>
<text class="body" x="234" y="494" text-anchor="start">restrictions.</text>
<path class="arrow" d="M600,515 L600,560"/>
<rect class="box" x="210" y="570" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="608" text-anchor="start">Brood and colony condition understood?</text>
<text class="body" x="234" y="647" text-anchor="start">Treatment performance and bee safety can depend on brood</text>
<text class="body" x="234" y="674" text-anchor="start">availability, strength and colony state.</text>
<path class="arrow" d="M600,695 L600,740"/>
<rect class="box" x="210" y="750" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="788" text-anchor="start">Forecast temperature / weather within label limits?</text>
<text class="body" x="234" y="827" text-anchor="start">Use the product only inside its specified environmental</text>
<text class="body" x="234" y="854" text-anchor="start">conditions.</text>
<path class="arrow" d="M600,875 L600,920"/>
<rect class="box" x="210" y="930" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="968" text-anchor="start">PPE, storage and disposal ready?</text>
<text class="body" x="234" y="1007" text-anchor="start">Protect operator and food; prepare spill/handling controls before</text>
<text class="body" x="234" y="1034" text-anchor="start">opening the product.</text>
<path class="arrow" d="M600,1055 L600,1100"/>
<rect class="box" x="210" y="1110" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="1148" text-anchor="start">Prior active ingredient / resistance history</text>
<text class="label" x="234" y="1177" text-anchor="start">reviewed?</text>
<text class="body" x="234" y="1216" text-anchor="start">Plan rotation by relevant mode of action rather than brand name</text>
<text class="body" x="234" y="1243" text-anchor="start">alone.</text>
<path class="arrow" d="M600,1235 L600,1280"/>
<rect class="box2" x="210" y="1290" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="1328" text-anchor="start">Follow-up monitoring scheduled?</text>
<text class="body" x="234" y="1367" text-anchor="start">Verification is part of treatment, not an optional extra.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">This is a pre-use decision checklist, not a dosing recipe. Never alter label dose or combine</text>
<text class="small" x="85" y="1535" text-anchor="start">products unless specifically authorised.</text>
</svg>
