<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 25.1 — Inspection Depth Ladder</title>
<desc id="desc">Five-level ladder from external observation to emergency inspection, with information need and colony disturbance increasing together.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 25.1 — Inspection Depth Ladder</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Use the least intrusive inspection depth that can answer the current management question.</text>
<rect class="box2" x="340" y="250" width="520" height="170" rx="22" ry="22"/>
<text class="label" x="364" y="288" text-anchor="start">External observation</text>
<text class="body" x="364" y="327" text-anchor="start">Entrance, flight, pollen return, mortality,</text>
<text class="body" x="364" y="354" text-anchor="start">robbing, equipment/weather. Disturbance:</text>
<text class="body" x="364" y="381" text-anchor="start">Lowest disturbance.</text>
<rect class="box" x="275" y="460" width="650" height="170" rx="22" ry="22"/>
<text class="label" x="299" y="498" text-anchor="start">Limited check</text>
<text class="body" x="299" y="537" text-anchor="start">Cover/feeder/upper stores or a very small number of</text>
<text class="body" x="299" y="564" text-anchor="start">frames for a narrow question. Disturbance: Low.</text>
<rect class="box" x="210" y="670" width="780" height="170" rx="22" ry="22"/>
<text class="label" x="234" y="708" text-anchor="start">Targeted inspection</text>
<text class="body" x="234" y="747" text-anchor="start">Defined brood/queen/space/health question in a specific part of</text>
<text class="body" x="234" y="774" text-anchor="start">the colony. Disturbance: Moderate.</text>
<rect class="box" x="145" y="880" width="910" height="170" rx="22" ry="22"/>
<text class="label" x="169" y="918" text-anchor="start">Full inspection</text>
<text class="body" x="169" y="957" text-anchor="start">Systematic broader assessment when the management need justifies it.</text>
<text class="body" x="169" y="984" text-anchor="start">Disturbance: Higher.</text>
<rect class="stop" x="80" y="1090" width="1040" height="170" rx="22" ry="22"/>
<text class="label" x="104" y="1128" text-anchor="start">Emergency inspection</text>
<text class="body" x="104" y="1167" text-anchor="start">Only as deep/fast as needed to stabilise an urgent problem; safety first. Disturbance:</text>
<text class="body" x="104" y="1194" text-anchor="start">Purpose-driven.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">Inspection frequency and depth depend on objective, season, weather and previous findings;</text>
<text class="small" x="85" y="1535" text-anchor="start">this figure deliberately contains no universal calendar interval.</text>
</svg>
