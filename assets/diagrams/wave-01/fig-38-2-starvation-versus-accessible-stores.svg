<title id="title">Figure 38.2 — Starvation Versus Accessible Stores</title>
<desc id="desc">Hive cutaway comparison of a winter cluster touching stores versus a small cold cluster separated from remaining stores, with an emergency-feed placement zone adjacent to the cluster.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker></defs>
<style>
.bg{fill:#FFFFFF}.title{font:700 38px Arial,Helvetica,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#52606D}
.box{fill:#FFF3E0;stroke:#E65100;stroke-width:3}.box2{fill:#E3F2FD;stroke:#E65100;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,Helvetica,sans-serif;fill:#1F2933}.body{font:400 21px Arial,Helvetica,sans-serif;fill:#1F2933}.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52606D}
.arrow{stroke:#EF6C00;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#E65100;stroke:#E65100;stroke-width:3}.hubtext{font:700 22px Arial,Helvetica,sans-serif;fill:#FFFFFF;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 38.2 — Starvation Versus Accessible Stores</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Food can remain in the hive yet be biologically inaccessible to a small cold cluster.</text>
<rect class="box" x="70" y="200" width="500" height="1070" rx="22" ry="22"/>
<text class="label" x="94" y="238" text-anchor="start">Cluster in contact with stores</text>
<rect x="150" y="430" width="340" height="610" fill="#FFFFFF" stroke="#1F2933" stroke-width="5"/>
<rect x="175" y="470" width="45" height="500" fill="#FFF3E0" stroke="#757575" stroke-width="2"/>
<rect x="240" y="470" width="45" height="500" fill="#FFF3E0" stroke="#757575" stroke-width="2"/>
<rect x="305" y="470" width="45" height="500" fill="#FFF3E0" stroke="#757575" stroke-width="2"/>
<rect x="370" y="470" width="45" height="500" fill="#FFF3E0" stroke="#757575" stroke-width="2"/>
<rect x="435" y="470" width="45" height="500" fill="#FFF3E0" stroke="#757575" stroke-width="2"/>
<rect x="315" y="495" width="155" height="190" fill="#F5F5F5" stroke="#1F2933" stroke-width="3"/>
<ellipse cx="350" cy="760" rx="105" ry="135" fill="#52606D"/>
<text class="body" x="190" y="1110" text-anchor="start">Cluster touches or can reach remaining stores.</text>
<rect class="stop" x="630" y="200" width="500" height="1070" rx="22" ry="22"/>
<text class="label" x="654" y="238" text-anchor="start">Stores present but separated</text>
<rect x="710" y="430" width="340" height="610" fill="#FFFFFF" stroke="#1F2933" stroke-width="5"/>
<rect x="735" y="470" width="45" height="500" fill="#FFF3E0" stroke="#757575" stroke-width="2"/>
<rect x="800" y="470" width="45" height="500" fill="#FFF3E0" stroke="#757575" stroke-width="2"/>
<rect x="865" y="470" width="45" height="500" fill="#FFF3E0" stroke="#757575" stroke-width="2"/>
<rect x="930" y="470" width="45" height="500" fill="#FFF3E0" stroke="#757575" stroke-width="2"/>
<rect x="995" y="470" width="45" height="500" fill="#FFF3E0" stroke="#757575" stroke-width="2"/>
<rect x="890" y="495" width="140" height="190" fill="#F5F5F5" stroke="#1F2933" stroke-width="3"/>
<ellipse cx="790" cy="810" rx="80" ry="110" fill="#52606D"/>
<rect x="755" y="650" width="110" height="45" fill="none" stroke="#1F2933" stroke-width="4" stroke-dasharray="8 6"/>
<text class="body" x="730" y="1080" text-anchor="start">Emergency feed, when justified, belongs where</text>
<text class="body" x="730" y="1107" text-anchor="start">the cluster can reach it without crossing a</text>
<text class="body" x="730" y="1134" text-anchor="start">cold gap.</text>
<text class="label" x="230" y="350" text-anchor="start">remaining stores</text>
<text class="label" x="790" y="350" text-anchor="start">remaining stores</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">This is a winter-access concept, not a fixed feeding recipe. Assess colony condition,</text>
<text class="small" x="85" y="1535" text-anchor="start">temperature, food type and local guidance before intervention.</text>
</svg>
