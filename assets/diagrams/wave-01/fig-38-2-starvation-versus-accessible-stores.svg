<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 38.2 — Starvation Versus Accessible Stores</title>
<desc id="desc">Hive cutaway comparison of a winter cluster touching stores versus a small cold cluster separated from remaining stores, with an emergency-feed placement zone adjacent to the cluster.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 38.2 — Starvation Versus Accessible Stores</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Food can remain in the hive yet be biologically inaccessible to a small cold cluster.</text>
<rect class="box" x="70" y="200" width="500" height="1070" rx="22" ry="22"/>
<text class="label" x="94" y="238" text-anchor="start">Cluster in contact with stores</text>
<rect x="150" y="430" width="340" height="610" fill="#fff" stroke="#222" stroke-width="5"/>
<rect x="175" y="470" width="45" height="500" fill="#f7f7f7" stroke="#777" stroke-width="2"/>
<rect x="240" y="470" width="45" height="500" fill="#f7f7f7" stroke="#777" stroke-width="2"/>
<rect x="305" y="470" width="45" height="500" fill="#f7f7f7" stroke="#777" stroke-width="2"/>
<rect x="370" y="470" width="45" height="500" fill="#f7f7f7" stroke="#777" stroke-width="2"/>
<rect x="435" y="470" width="45" height="500" fill="#f7f7f7" stroke="#777" stroke-width="2"/>
<rect x="315" y="495" width="155" height="190" fill="#ddd" stroke="#111" stroke-width="3"/>
<ellipse cx="350" cy="760" rx="105" ry="135" fill="#555"/>
<text class="body" x="190" y="1110" text-anchor="start">Cluster touches or can reach remaining stores.</text>
<rect class="stop" x="630" y="200" width="500" height="1070" rx="22" ry="22"/>
<text class="label" x="654" y="238" text-anchor="start">Stores present but separated</text>
<rect x="710" y="430" width="340" height="610" fill="#fff" stroke="#222" stroke-width="5"/>
<rect x="735" y="470" width="45" height="500" fill="#f7f7f7" stroke="#777" stroke-width="2"/>
<rect x="800" y="470" width="45" height="500" fill="#f7f7f7" stroke="#777" stroke-width="2"/>
<rect x="865" y="470" width="45" height="500" fill="#f7f7f7" stroke="#777" stroke-width="2"/>
<rect x="930" y="470" width="45" height="500" fill="#f7f7f7" stroke="#777" stroke-width="2"/>
<rect x="995" y="470" width="45" height="500" fill="#f7f7f7" stroke="#777" stroke-width="2"/>
<rect x="890" y="495" width="140" height="190" fill="#ddd" stroke="#111" stroke-width="3"/>
<ellipse cx="790" cy="810" rx="80" ry="110" fill="#555"/>
<rect x="755" y="650" width="110" height="45" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="8 6"/>
<text class="body" x="730" y="1080" text-anchor="start">Emergency feed, when justified, belongs where</text>
<text class="body" x="730" y="1107" text-anchor="start">the cluster can reach it without crossing a</text>
<text class="body" x="730" y="1134" text-anchor="start">cold gap.</text>
<text class="label" x="230" y="350" text-anchor="start">remaining stores</text>
<text class="label" x="790" y="350" text-anchor="start">remaining stores</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">This is a winter-access concept, not a fixed feeding recipe. Assess colony condition,</text>
<text class="small" x="85" y="1535" text-anchor="start">temperature, food type and local guidance before intervention.</text>
</svg>
