<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 25.5 — Queenright Evidence Without Finding the Queen</title>
<desc id="desc">Three-panel decision aid showing eggs and young larvae as evidence of recent queen function and discouraging unnecessary queen searching.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 25.5 — Queenright Evidence Without Finding the Queen</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Recent brood evidence can answer many queen-status questions without disrupting the colony</text>
<text class="subtitle" x="60" y="136" text-anchor="start">to find the queen.</text>
<rect class="box" x="55" y="230" width="330" height="1030" rx="22" ry="22"/>
<text class="label" x="79" y="268" text-anchor="start">Eggs</text>
<text class="body" x="79" y="307" text-anchor="start">Correctly placed recent</text>
<text class="body" x="79" y="334" text-anchor="start">eggs support very recent</text>
<text class="body" x="79" y="361" text-anchor="start">laying activity; interpret</text>
<text class="body" x="79" y="388" text-anchor="start">with cell context and</text>
<text class="body" x="79" y="415" text-anchor="start">colony history.</text>
<rect class="box" x="415" y="230" width="330" height="1030" rx="22" ry="22"/>
<text class="label" x="439" y="268" text-anchor="start">Very young larvae</text>
<text class="body" x="439" y="307" text-anchor="start">Coherent young larvae</text>
<text class="body" x="439" y="334" text-anchor="start">support recent queen</text>
<text class="body" x="439" y="361" text-anchor="start">function and brood</text>
<text class="body" x="439" y="388" text-anchor="start">progression.</text>
<rect class="stop" x="775" y="230" width="330" height="1030" rx="22" ry="22"/>
<text class="label" x="799" y="268" text-anchor="start">Do not search</text>
<text class="label" x="799" y="297" text-anchor="start">endlessly for the</text>
<text class="label" x="799" y="326" text-anchor="start">queen</text>
<text class="body" x="799" y="365" text-anchor="start">If the management question</text>
<text class="body" x="799" y="392" text-anchor="start">is already answered,</text>
<text class="body" x="799" y="419" text-anchor="start">prolonged frame handling</text>
<text class="body" x="799" y="446" text-anchor="start">adds disturbance and</text>
<text class="body" x="799" y="473" text-anchor="start">queen-crushing risk.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">Eggs/young larvae support recent queen function but do not guarantee future queen quality.</text>
<text class="small" x="85" y="1535" text-anchor="start">Drone-laying workers or abnormal laying patterns require separate interpretation.</text>
</svg>
