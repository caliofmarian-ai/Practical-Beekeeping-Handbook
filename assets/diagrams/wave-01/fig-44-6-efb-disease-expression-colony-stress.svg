<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<!-- semantic-color-pass:v1 -->
<title id="title">Figure 44.6 — Disease Expression and Colony Stress</title>
<desc id="desc">Conceptual network separating Melissococcus plutonius infection as the infectious cause from nutritional, weather, workforce and concurrent-stress modifiers.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,sans-serif;fill:#52606D}
.box{fill:#F3E5F5;stroke:#4A148C;stroke-width:3}.box2{fill:#E3F2FD;stroke:#4A148C;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#1F2933}.body{font:400 21px Arial,sans-serif;fill:#1F2933}.small{font:400 18px Arial,sans-serif;fill:#52606D}
.arrow{stroke:#6A1B9A;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#4A148C;stroke:#4A148C;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 44.6 — Disease Expression and Colony Stress</text>
<text class="subtitle" x="60" y="108" text-anchor="start">M. plutonius infection is the infectious cause; colony stressors modify whether and how</text>
<text class="subtitle" x="60" y="136" text-anchor="start">strongly disease is expressed.</text>
<circle class="hub" cx="600" cy="780" r="145"/>
<text class="hubtext" x="600" y="770" text-anchor="middle">EFB clinical</text>
<text class="hubtext" x="600" y="800" text-anchor="middle">expression</text>
<rect class="box" x="465" y="190" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="489" y="228" text-anchor="start">M. plutonius</text>
<text class="label" x="489" y="257" text-anchor="start">infection</text>
<text class="body" x="489" y="296" text-anchor="start">Infectious cause;</text>
<text class="body" x="489" y="323" text-anchor="start">central prerequisite</text>
<path class="arrow" d="M600,260 L600,780"/>
<rect class="box" x="795" y="320" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="819" y="358" text-anchor="start">Nurse-bee capacity</text>
<text class="body" x="819" y="397" text-anchor="start">Worker population</text>
<text class="body" x="819" y="424" text-anchor="start">affects larval</text>
<text class="body" x="819" y="451" text-anchor="start">care/removal</text>
<path class="arrow" d="M930,390 L600,780"/>
<rect class="box" x="875" y="640" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="899" y="678" text-anchor="start">Forage</text>
<text class="label" x="899" y="707" text-anchor="start">interruption</text>
<text class="body" x="899" y="746" text-anchor="start">Can reduce food</text>
<text class="body" x="899" y="773" text-anchor="start">availability and</text>
<text class="body" x="899" y="800" text-anchor="start">colony resilience</text>
<path class="arrow" d="M1010,710 L600,780"/>
<rect class="box" x="790" y="980" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="814" y="1018" text-anchor="start">Nutrition</text>
<text class="body" x="814" y="1057" text-anchor="start">Modifies larval/colony</text>
<text class="body" x="814" y="1084" text-anchor="start">condition; not the</text>
<text class="body" x="814" y="1111" text-anchor="start">infectious cause</text>
<path class="arrow" d="M925,1050 L600,780"/>
<rect class="box" x="465" y="1130" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="489" y="1168" text-anchor="start">Weather / chilling</text>
<text class="label" x="489" y="1197" text-anchor="start">stress</text>
<text class="body" x="489" y="1236" text-anchor="start">Can alter brood</text>
<text class="body" x="489" y="1263" text-anchor="start">condition and</text>
<text class="body" x="489" y="1290" text-anchor="start">expression</text>
<path class="arrow" d="M600,1200 L600,780"/>
<rect class="box" x="140" y="980" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="164" y="1018" text-anchor="start">Queen / brood</text>
<text class="label" x="164" y="1047" text-anchor="start">demand</text>
<text class="body" x="164" y="1086" text-anchor="start">Brood amount and</text>
<text class="body" x="164" y="1113" text-anchor="start">pattern influence</text>
<text class="body" x="164" y="1140" text-anchor="start">colony workload</text>
<path class="arrow" d="M275,1050 L600,780"/>
<rect class="box" x="55" y="640" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="79" y="678" text-anchor="start">Other disease /</text>
<text class="label" x="79" y="707" text-anchor="start">parasites</text>
<text class="body" x="79" y="746" text-anchor="start">Concurrent stress</text>
<text class="body" x="79" y="773" text-anchor="start">changes colony</text>
<text class="body" x="79" y="800" text-anchor="start">resilience</text>
<path class="arrow" d="M190,710 L600,780"/>
<rect class="box" x="135" y="320" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="159" y="358" text-anchor="start">Management /</text>
<text class="label" x="159" y="387" text-anchor="start">movement</text>
<text class="body" x="159" y="426" text-anchor="start">Can alter stress and</text>
<text class="body" x="159" y="453" text-anchor="start">transmission</text>
<text class="body" x="159" y="480" text-anchor="start">opportunities</text>
<path class="arrow" d="M270,390 L600,780"/>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">The modifier arrows do not mean these stressors “cause EFB”. They influence expression in an</text>
<text class="small" x="85" y="1535" text-anchor="start">already infected biological system.</text>
</svg>
