<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="portrait-field" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<!-- semantic-color-pass:v1 -->
<title id="title">Figure 44.11 — Apiary Contact Map</title>
<desc id="desc">Apiary contact map around an EFB index case including frame transfers, shared equipment, robbing, drifting, introductions and movements.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker></defs>
<style>
.bg{fill:#FFFFFF}.title{font:700 34px Arial,Helvetica,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#52606D}
.box{fill:#F3E5F5;stroke:#4A148C;stroke-width:3}.box2{fill:#E3F2FD;stroke:#4A148C;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,Helvetica,sans-serif;fill:#1F2933}.body{font:400 21px Arial,Helvetica,sans-serif;fill:#1F2933}.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52606D}
.arrow{stroke:#6A1B9A;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#4A148C;stroke:#4A148C;stroke-width:3}.hubtext{font:700 22px Arial,Helvetica,sans-serif;fill:#FFFFFF;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 44.11 — Apiary Contact Map</text>
<text class="subtitle" x="60" y="108" text-anchor="start"><tspan x="60" dy="0">Map operational connections around an index EFB case so exposed colonies can be</tspan><tspan x="60" dy="26.8">prioritised</tspan></text>
<text class="subtitle" x="60" y="136" text-anchor="start">for inspection.</text>
<circle class="hub" cx="600" cy="780" r="145"/>
<text class="hubtext" x="600" y="770" text-anchor="middle">Index EFB case</text>
<rect class="box" x="465" y="190" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="489" y="228" text-anchor="start">Brood-frame</text>
<text class="label" x="489" y="257" text-anchor="start">transfer</text>
<text class="body" x="489" y="296" text-anchor="start">Donor / recipient</text>
<text class="body" x="489" y="323" text-anchor="start">colonies</text>
<path class="arrow" d="M600,260 L600,780"/>
<rect class="box" x="795" y="320" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="819" y="358" text-anchor="start">Food-frame</text>
<text class="label" x="819" y="387" text-anchor="start">transfer</text>
<text class="body" x="819" y="426" text-anchor="start">Shared food comb</text>
<text class="body" x="819" y="453" text-anchor="start">history</text>
<path class="arrow" d="M930,390 L600,780"/>
<rect class="box" x="875" y="640" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="899" y="678" text-anchor="start">Shared equipment</text>
<text class="body" x="899" y="717" text-anchor="start">Tools, boxes, feeders</text>
<path class="arrow" d="M1010,710 L600,780"/>
<rect class="box" x="790" y="980" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="814" y="1018" text-anchor="start">Robbing</text>
<text class="body" x="814" y="1057" text-anchor="start">Weak/dead colony</text>
<text class="body" x="814" y="1084" text-anchor="start">exposure</text>
<path class="arrow" d="M925,1050 L600,780"/>
<rect class="box" x="465" y="1130" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="489" y="1168" text-anchor="start">Drifting</text>
<text class="body" x="489" y="1207" text-anchor="start">Neighbouring colonies</text>
<text class="body" x="489" y="1234" text-anchor="start">/ layout</text>
<path class="arrow" d="M600,1200 L600,780"/>
<rect class="box" x="140" y="980" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="164" y="1018" text-anchor="start">Introduced</text>
<text class="label" x="164" y="1047" text-anchor="start">colonies</text>
<text class="body" x="164" y="1086" text-anchor="start">Recent purchases or</text>
<text class="body" x="164" y="1113" text-anchor="start">moves</text>
<path class="arrow" d="M275,1050 L600,780"/>
<rect class="box" x="55" y="640" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="79" y="678" text-anchor="start">Apiary movement</text>
<text class="body" x="79" y="717" text-anchor="start">Recent site changes</text>
<path class="arrow" d="M190,710 L600,780"/>
<rect class="box" x="135" y="320" width="270" height="140" rx="22" ry="22"/>
<text class="label" x="159" y="358" text-anchor="start">Shared feeder /</text>
<text class="label" x="159" y="387" text-anchor="start">resource</text>
<text class="body" x="159" y="426" text-anchor="start">Where relevant to</text>
<text class="body" x="159" y="453" text-anchor="start">operation</text>
<path class="arrow" d="M270,390 L600,780"/>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">A contact is an exposure opportunity, not proof of transmission. Use the map to organise</text>
<text class="small" x="85" y="1535" text-anchor="start">investigation and records.</text>
</svg>
