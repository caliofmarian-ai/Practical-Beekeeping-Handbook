<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="portrait-field" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<!-- semantic-color-pass:v1 -->
<title id="title">Figure 43.13 — AFB Response Decision Flow</title>
<desc id="desc">AFB decision flow from suspicious signs to movement stop, evidence preservation, authority contact, validated confirmation, official control, contact-colony inspection and follow-up.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker></defs>
<style>
.bg{fill:#FFFFFF}.title{font:700 34px Arial,Helvetica,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#52606D}
.box{fill:#F3E5F5;stroke:#4A148C;stroke-width:3}.box2{fill:#E3F2FD;stroke:#4A148C;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,Helvetica,sans-serif;fill:#1F2933}.body{font:400 21px Arial,Helvetica,sans-serif;fill:#1F2933}.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52606D}
.arrow{stroke:#6A1B9A;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#4A148C;stroke:#4A148C;stroke-width:3}.hubtext{font:700 22px Arial,Helvetica,sans-serif;fill:#FFFFFF;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 43.13 — AFB Response Decision Flow</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Suspicion is a containment and confirmation problem before it is a treatment problem.</text>
<rect class="box" x="210" y="210" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="248" text-anchor="start">Suspicious brood signs</text>
<text class="body" x="234" y="287" text-anchor="start">Irregular cappings, suspicious remains or other compatible signs</text>
<text class="body" x="234" y="314" text-anchor="start">raise suspicion but do not prove AFB.</text>
<path class="arrow" d="M600,335 L600,380"/>
<rect class="stop" x="210" y="390" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="428" text-anchor="start">Stop movement</text>
<text class="body" x="234" y="467" text-anchor="start">Do not move brood, honey frames, bees, tools or suspect equipment</text>
<text class="body" x="234" y="494" text-anchor="start">out of the affected unit/apiary unnecessarily.</text>
<path class="arrow" d="M600,515 L600,560"/>
<rect class="box" x="210" y="570" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="608" text-anchor="start">Record and preserve evidence</text>
<text class="body" x="234" y="647" text-anchor="start">Photograph objectively; label sample/colony; retain purchase,</text>
<text class="body" x="234" y="674" text-anchor="start">movement and equipment-sharing records.</text>
<path class="arrow" d="M600,695 L600,740"/>
<rect class="legal" x="210" y="750" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="788" text-anchor="start">Contact competent authority where required</text>
<text class="body" x="234" y="827" text-anchor="start">AFB control and notification requirements vary by jurisdiction</text>
<text class="body" x="234" y="854" text-anchor="start">and can override ordinary management.</text>
<path class="arrow" d="M600,875 L600,920"/>
<rect class="box2" x="210" y="930" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="968" text-anchor="start">Approved confirmation</text>
<text class="body" x="234" y="1007" text-anchor="start">Use the current official/validated diagnostic pathway. Field</text>
<text class="body" x="234" y="1034" text-anchor="start">signs or rope test alone are not universal definitive</text>
<text class="body" x="234" y="1061" text-anchor="start">confirmation.</text>
<path class="arrow" d="M600,1055 L600,1100"/>
<rect class="legal" x="210" y="1110" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="1148" text-anchor="start">Official control / decontamination</text>
<text class="body" x="234" y="1187" text-anchor="start">Follow the legally required disposition and approved</text>
<text class="body" x="234" y="1214" text-anchor="start">decontamination programme; do not improvise recipes.</text>
<path class="arrow" d="M600,1235 L600,1280"/>
<rect class="box" x="210" y="1290" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="1328" text-anchor="start">Inspect contact colonies</text>
<text class="body" x="234" y="1367" text-anchor="start">Trace robbing, drifting, frame transfer, equipment sharing,</text>
<text class="body" x="234" y="1394" text-anchor="start">purchases, sales and apiary movement.</text>
<path class="arrow" d="M600,1415 L600,1460"/>
<rect class="box2" x="210" y="1470" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="1508" text-anchor="start">Follow-up surveillance</text>
<text class="body" x="234" y="1547" text-anchor="start">Verify that control actions worked and continue monitoring</text>
<text class="body" x="234" y="1574" text-anchor="start">according to authority guidance.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">AFB spores are persistent. Antibiotic suppression of vegetative bacteria does not mean</text>
<text class="small" x="85" y="1535" text-anchor="start">spores have been eradicated from comb/equipment.</text>
</svg>
