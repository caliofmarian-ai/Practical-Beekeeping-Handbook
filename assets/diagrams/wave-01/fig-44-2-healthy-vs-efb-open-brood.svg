<text x="78" y="930" font-family="Arial,Helvetica,sans-serif" font-size="18.0" font-weight="600" fill="#1F2933" text-anchor="start"><tspan x="78" dy="0">EFB is not diagnosed by colour, odour or one larval posture alone. Chilling, sacbrood, nutrition, queen problems and other brood</tspan><tspan x="78" dy="22.0">disease remain important differentials.</tspan></text>
