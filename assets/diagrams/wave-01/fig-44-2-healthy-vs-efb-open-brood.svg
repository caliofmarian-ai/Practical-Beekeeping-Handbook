<title id="title">Figure 44.2 — Healthy Versus EFB-Affected Open Brood</title>
<desc id="desc">Comparison of pearly healthy C-shaped larvae with representative EFB-compatible larvae that are creamy, yellow-brown, twisted or collapsed.</desc>
