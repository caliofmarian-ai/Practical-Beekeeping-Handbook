<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="portrait-field" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<!-- semantic-color-pass:v1 -->
<title id="title">Figure 22.3 — Suitable Versus Unsuitable Smoker Fuels</title>
<desc id="desc">Two-column comparison of clean dry plant-based smoker fuels with painted, treated, plastic, oily, chemically contaminated or unknown waste material.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs>
<style>
.bg{fill:#FFFFFF}.title{font:700 38px Arial,Helvetica,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#52606D}
.box{fill:#E3F2FD;stroke:#0D47A1;stroke-width:3}.box2{fill:#E8F5E9;stroke:#0D47A1;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,Helvetica,sans-serif;fill:#1F2933}.body{font:400 21px Arial,Helvetica,sans-serif;fill:#1F2933}.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52606D}
.arrow{stroke:#1565C0;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#0D47A1;stroke:#0D47A1;stroke-width:3}.hubtext{font:700 22px Arial,Helvetica,sans-serif;fill:#FFFFFF;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 22.3 — Suitable Versus Unsuitable Smoker Fuels</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Fuel choice is a contamination and fire-safety decision, not merely a question of whether</text>
<text class="subtitle" x="60" y="136" text-anchor="start">material will burn.</text>
<rect class="box" x="70" y="190" width="500" height="100" rx="22" ry="22"/>
<text class="label" x="94" y="228" text-anchor="start">Suitable categories</text>
<rect class="stop" x="630" y="190" width="500" height="100" rx="22" ry="22"/>
<text class="label" x="654" y="228" text-anchor="start">Unsuitable / reject</text>
<rect class="box" x="70" y="340" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="94" y="378" text-anchor="start">Clean dry plant material</text>
<text class="body" x="94" y="417" text-anchor="start">Examples depend on local practice and</text>
<text class="body" x="94" y="444" text-anchor="start">availability; produce cool smoke when</text>
<text class="body" x="94" y="471" text-anchor="start">used correctly.</text>
<rect class="stop" x="630" y="340" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="654" y="378" text-anchor="start">Painted or treated wood</text>
<text class="body" x="654" y="417" text-anchor="start">May release contaminants and residues.</text>
<rect class="box" x="70" y="485" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="94" y="523" text-anchor="start">Known untreated material</text>
<text class="body" x="94" y="562" text-anchor="start">Dry, uncontaminated, non-oily material</text>
<text class="body" x="94" y="589" text-anchor="start">suitable for smoker use.</text>
<rect class="stop" x="630" y="485" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="654" y="523" text-anchor="start">Plastic / synthetic material</text>
<text class="body" x="654" y="562" text-anchor="start">Can produce harmful combustion products.</text>
<rect class="box" x="70" y="630" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="94" y="668" text-anchor="start">Preparation</text>
<text class="body" x="94" y="707" text-anchor="start">Keep fuel dry, separate from chemicals</text>
<text class="body" x="94" y="734" text-anchor="start">and inspect for foreign material.</text>
<rect class="stop" x="630" y="630" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="654" y="668" text-anchor="start">Oily or chemically contaminated</text>
<text class="label" x="654" y="697" text-anchor="start">material</text>
<text class="body" x="654" y="736" text-anchor="start">Contamination and flare risk; do not use.</text>
<rect class="stop" x="630" y="775" width="500" height="110" rx="22" ry="22"/>
<text class="label" x="654" y="813" text-anchor="start">Unknown waste material</text>
<text class="body" x="654" y="852" text-anchor="start">If history is uncertain, reject it rather</text>
<text class="body" x="654" y="879" text-anchor="start">than burn it around bees/food.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">Smoke must be cool and used in the minimum effective amount; the smoker is not an</text>
<text class="small" x="85" y="1535" text-anchor="start">anaesthetic device.</text>
</svg>
