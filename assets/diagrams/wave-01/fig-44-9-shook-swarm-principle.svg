<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="portrait-field" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<!-- semantic-color-pass:v1 -->
<title id="title">Figure 44.9 — Shook-Swarm Principle</title>
<desc id="desc">High-level shook-swarm principle for EFB control, explicitly subject to competent-authority requirements.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker></defs>
<style>
.bg{fill:#FFFFFF}.title{font:700 38px Arial,Helvetica,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#52606D}
.box{fill:#F3E5F5;stroke:#4A148C;stroke-width:3}.box2{fill:#E3F2FD;stroke:#4A148C;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,Helvetica,sans-serif;fill:#1F2933}.body{font:400 21px Arial,Helvetica,sans-serif;fill:#1F2933}.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52606D}
.arrow{stroke:#6A1B9A;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#4A148C;stroke:#4A148C;stroke-width:3}.hubtext{font:700 22px Arial,Helvetica,sans-serif;fill:#FFFFFF;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 44.9 — Shook-Swarm Principle</text>
<text class="subtitle" x="60" y="108" text-anchor="start">High-level official-control concept only; exact use and procedure depend on</text>
<text class="subtitle" x="60" y="136" text-anchor="start">competent-authority requirements.</text>
<rect class="legal" x="210" y="210" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="248" text-anchor="start">Confirmed / officially managed EFB context</text>
<text class="body" x="234" y="287" text-anchor="start">Do not use this figure as a self-authorising treatment</text>
<text class="body" x="234" y="314" text-anchor="start">instruction.</text>
<path class="arrow" d="M600,335 L600,380"/>
<rect class="box" x="210" y="390" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="428" text-anchor="start">Adult bees separated from contaminated brood comb</text>
<text class="body" x="234" y="467" text-anchor="start">Principle: break contact with heavily contaminated brood-comb</text>
<text class="body" x="234" y="494" text-anchor="start">material under an approved programme.</text>
<path class="arrow" d="M600,515 L600,560"/>
<rect class="box2" x="210" y="570" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="608" text-anchor="start">Adults installed on clean approved equipment</text>
<text class="body" x="234" y="647" text-anchor="start">Clean equipment/foundation and food support are managed according</text>
<text class="body" x="234" y="674" text-anchor="start">to the programme.</text>
<path class="arrow" d="M600,695 L600,740"/>
<rect class="legal" x="210" y="750" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="788" text-anchor="start">Old brood comb managed as directed</text>
<text class="body" x="234" y="827" text-anchor="start">Disposition/decontamination is jurisdiction- and</text>
<text class="body" x="234" y="854" text-anchor="start">programme-specific.</text>
<path class="arrow" d="M600,875 L600,920"/>
<rect class="box2" x="210" y="930" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="968" text-anchor="start">Reinspection / recurrence surveillance</text>
<text class="body" x="234" y="1007" text-anchor="start">Follow colony strength and disease signs after the intervention.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">No timing, feed, antibiotic, destruction or chemical-decontamination recipe is embedded</text>
<text class="small" x="85" y="1535" text-anchor="start">here. Follow current official/veterinary instructions.</text>
</svg>
