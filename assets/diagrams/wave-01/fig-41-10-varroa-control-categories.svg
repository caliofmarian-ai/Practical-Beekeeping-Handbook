<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-scientific" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 41.10 — Varroa Control Categories</title>
<desc id="desc">Integrated non-product-specific Varroa control categories organised around monitoring, biological timing, authorised controls and verification.</desc>
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
</defs>
<rect width="1400" height="1050" fill="#FFFFFF"/>
<text x="55" y="62" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933">Figure 41.10 — Varroa Control Categories</text>
<text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">No single tool solves every colony, season, brood state or resistance situation.</text>
<circle cx="700" cy="500" r="120" fill="#E3F2FD" stroke="#1565C0" stroke-width="5"/>
<text x="700" y="470" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1565C0" text-anchor="middle">MONITOR</text>
<text x="700" y="505" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1565C0" text-anchor="middle">DECIDE</text>
<text x="700" y="540" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1565C0" text-anchor="middle">VERIFY</text>
<rect x="65" y="140" width="290" height="180" rx="20" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="83" y="171" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2E7D32" text-anchor="start">Resistant stock</text>
<text x="85" y="205" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">genetics can reduce mite reproduction / improve removal</text>
<line x1="320" y1="270" x2="580" y2="430" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="375" y="110" width="290" height="180" rx="20" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="393" y="141" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#EF6C00" text-anchor="start">Drone-brood removal</text>
<text x="395" y="175" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">removes a brood compartment before emergence</text>
<line x1="630" y1="240" x2="580" y2="430" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="735" y="110" width="290" height="180" rx="20" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="753" y="141" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#EF6C00" text-anchor="start">Brood interruption</text>
<text x="755" y="175" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">alters reproductive opportunity and treatment exposure</text>
<line x1="770" y1="240" x2="820" y2="430" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="1045" y="140" width="290" height="180" rx="20" fill="#FFEBEE" stroke="#C62828" stroke-width="2.5"/>
<text x="1063" y="171" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#C62828" text-anchor="start">Authorised synthetic acaricides</text>
<text x="1065" y="205" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">use only current labelled products and resistance-aware planning</text>
<line x1="1080" y1="270" x2="820" y2="430" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="1045" y="610" width="290" height="180" rx="20" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/>
<text x="1063" y="641" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#6A1B9A" text-anchor="start">Authorised organic-acid / botanical products</text>
<text x="1065" y="675" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">temperature, brood and label constraints matter</text>
<line x1="1080" y1="640" x2="820" y2="570" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="555" y="720" width="290" height="180" rx="20" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
<text x="573" y="751" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1565C0" text-anchor="start">Apiary practices</text>
<text x="575" y="785" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">reduce robbing, drift and reinvasion; manage colony movement</text>
<line x1="700" y1="750" x2="700" y2="570" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="65" y="610" width="290" height="180" rx="20" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="83" y="641" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2E7D32" text-anchor="start">Monitoring and post-control verification</text>
<text x="85" y="675" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">quantitative checks before and after intervention</text>
<line x1="320" y1="640" x2="580" y2="570" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="55" y="915" width="1290" height="90" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
<text x="78" y="945" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1F2933" text-anchor="start">Exact products and action thresholds vary by jurisdiction, season and colony context. The diagram is a control-category map, not a treatment recipe.</text>
</svg>
