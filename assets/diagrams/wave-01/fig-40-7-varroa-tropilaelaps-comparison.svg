<text x="78" y="915" font-family="Arial,Helvetica,sans-serif" font-size="18.0" font-weight="600" fill="#1F2933" text-anchor="start"><tspan x="78" dy="0">Relative proportions are the key field cue: Varroa is wider than long; Tropilaelaps is longer than wide. Morphology alone may be</tspan><tspan x="78" dy="22.0">insufficient for species-level Tropilaelaps identification.</tspan></text>
