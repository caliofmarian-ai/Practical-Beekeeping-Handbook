<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 25.3 — Inspection Questions Before Opening</title>
<desc id="desc">Seven-question pre-inspection decision card covering queen status, brood, food, space, warning signs, action and follow-up.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 25.3 — Inspection Questions Before Opening</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Define the questions before opening the hive so disturbance produces useful information.</text>
<rect class="box" x="210" y="210" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="248" text-anchor="start">1. Queenright?</text>
<text class="body" x="234" y="287" text-anchor="start">What evidence is needed: eggs, young larvae, brood progression or</text>
<text class="body" x="234" y="314" text-anchor="start">another queen-status check?</text>
<path class="arrow" d="M600,335 L600,380"/>
<rect class="box" x="210" y="390" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="428" text-anchor="start">2. Brood appropriate?</text>
<text class="body" x="234" y="467" text-anchor="start">Is development coherent for season, queen status and colony</text>
<text class="body" x="234" y="494" text-anchor="start">strength?</text>
<path class="arrow" d="M600,515 L600,560"/>
<rect class="box" x="210" y="570" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="608" text-anchor="start">3. Food adequate?</text>
<text class="body" x="234" y="647" text-anchor="start">Are accessible carbohydrate and pollen stores sufficient for</text>
<text class="body" x="234" y="674" text-anchor="start">current brood and weather?</text>
<path class="arrow" d="M600,695 L600,740"/>
<rect class="box" x="210" y="750" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="788" text-anchor="start">4. Enough usable space?</text>
<text class="body" x="234" y="827" text-anchor="start">Is there room for brood, stores and bee movement without</text>
<text class="body" x="234" y="854" text-anchor="start">unnecessary excess space?</text>
<path class="arrow" d="M600,875 L600,920"/>
<rect class="box" x="210" y="930" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="968" text-anchor="start">5. Warning signs?</text>
<text class="body" x="234" y="1007" text-anchor="start">Pest, disease, robbing, equipment or environmental concern that</text>
<text class="body" x="234" y="1034" text-anchor="start">changes inspection depth?</text>
<path class="arrow" d="M600,1055 L600,1100"/>
<rect class="box2" x="210" y="1110" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="1148" text-anchor="start">6. Action today?</text>
<text class="body" x="234" y="1187" text-anchor="start">Only intervene when the finding justifies it; otherwise close</text>
<text class="body" x="234" y="1214" text-anchor="start">carefully and record.</text>
<path class="arrow" d="M600,1235 L600,1280"/>
<rect class="box2" x="210" y="1290" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="1328" text-anchor="start">7. Next inspection when?</text>
<text class="body" x="234" y="1367" text-anchor="start">Set timing from the biological question and today&#x27;s findings, not</text>
<text class="body" x="234" y="1394" text-anchor="start">habit alone.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">A routine inspection is a planned information-gathering task, not simply opening every</text>
<text class="small" x="85" y="1535" text-anchor="start">colony on a fixed schedule.</text>
</svg>
