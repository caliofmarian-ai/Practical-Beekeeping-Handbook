<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="portrait-field" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<!-- semantic-color-pass:v1 -->
<title id="title">Figure 42.4 — Dysentery Is Not a Diagnosis</title>
<desc id="desc">Three-panel concept separating faecal staining from Nosema/Vairimorpha detection and clinical significance.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6A1B9A"/></marker></defs>
<style>
.bg{fill:#FFFFFF}.title{font:700 38px Arial,Helvetica,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#52606D}
.box{fill:#F3E5F5;stroke:#4A148C;stroke-width:3}.box2{fill:#E3F2FD;stroke:#4A148C;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,Helvetica,sans-serif;fill:#1F2933}.body{font:400 21px Arial,Helvetica,sans-serif;fill:#1F2933}.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52606D}
.arrow{stroke:#6A1B9A;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#4A148C;stroke:#4A148C;stroke-width:3}.hubtext{font:700 22px Arial,Helvetica,sans-serif;fill:#FFFFFF;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 42.4 — Dysentery Is Not a Diagnosis</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Faecal staining and Nosema/Vairimorpha infection can occur independently; staining is a</text>
<text class="subtitle" x="60" y="136" text-anchor="start">clue, not proof.</text>
<rect class="box" x="55" y="230" width="330" height="1030" rx="22" ry="22"/>
<text class="label" x="79" y="268" text-anchor="start">No obvious staining</text>
<text class="body" x="79" y="307" text-anchor="start">A colony can still be</text>
<text class="body" x="79" y="334" text-anchor="start">Nosema/Vairimorpha-positive</text>
<text class="body" x="79" y="361" text-anchor="start">or have other health</text>
<text class="body" x="79" y="388" text-anchor="start">problems.</text>
<rect class="stop" x="415" y="230" width="330" height="1030" rx="22" ry="22"/>
<text class="label" x="439" y="268" text-anchor="start">Faecal staining</text>
<text class="label" x="439" y="297" text-anchor="start">present</text>
<text class="body" x="439" y="336" text-anchor="start">Confinement, feed/digestive</text>
<text class="body" x="439" y="363" text-anchor="start">issues and other stressors</text>
<text class="body" x="439" y="390" text-anchor="start">can contribute; test rather</text>
<text class="body" x="439" y="417" text-anchor="start">than naming Nosema from</text>
<text class="body" x="439" y="444" text-anchor="start">staining alone.</text>
<rect class="box2" x="775" y="230" width="330" height="1030" rx="22" ry="22"/>
<text class="label" x="799" y="268" text-anchor="start">Positive</text>
<text class="label" x="799" y="297" text-anchor="start">Nosema/Vairimorpha</text>
<text class="label" x="799" y="326" text-anchor="start">test without staining</text>
<text class="body" x="799" y="365" text-anchor="start">Pathogen detection can</text>
<text class="body" x="799" y="392" text-anchor="start">occur with no visible</text>
<text class="body" x="799" y="419" text-anchor="start">dysentery; clinical</text>
<text class="body" x="799" y="446" text-anchor="start">significance still requires</text>
<text class="body" x="799" y="473" text-anchor="start">context.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">Do not diagnose Nosema from hive-front staining and do not use absence of staining to rule</text>
<text class="small" x="85" y="1535" text-anchor="start">infection out.</text>
</svg>
