<text x="78" y="930" font-family="Arial,Helvetica,sans-serif" font-size="18.0" font-weight="600" fill="#1F2933" text-anchor="start"><tspan x="78" dy="0">Deformed wings strongly suggest Varroa-associated viral damage in the right context, but phenotype alone does not quantify current</tspan><tspan x="78" dy="22.0">mite pressure or prove a single virus variant.</tspan></text>
