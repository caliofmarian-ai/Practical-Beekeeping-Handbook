<text x="755" y="674" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">yet still carry high viral burden</text>
<text x="755" y="698" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#1F2933" text-anchor="start">and reduced longevity/performance.</text>
