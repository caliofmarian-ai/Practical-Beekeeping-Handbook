<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Figure 33.14 — Post-Move Inspection</title>
<desc id="desc">Post-move inspection flow from arrival stability and orientation through targeted check and follow-up record.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>
.bg{fill:#fff}.title{font:700 38px Arial,sans-serif;fill:#111}.subtitle{font:400 22px Arial,sans-serif;fill:#333}
.box{fill:#f7f7f7;stroke:#222;stroke-width:3}.box2{fill:#e9e9e9;stroke:#222;stroke-width:3}
.stop{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:12 8}.legal{fill:#efefef;stroke:#111;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,sans-serif;fill:#111}.body{font:400 21px Arial,sans-serif;fill:#222}.small{font:400 18px Arial,sans-serif;fill:#333}
.arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#555;stroke-width:2;fill:none}.hub{fill:#222;stroke:#111;stroke-width:3}.hubtext{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.note{fill:#fafafa;stroke:#666;stroke-width:2}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 33.14 — Post-Move Inspection</text>
<text class="subtitle" x="60" y="108" text-anchor="start">After transport, verify physical stability first and colony biology later at an appropriate</text>
<text class="subtitle" x="60" y="136" text-anchor="start">interval.</text>
<rect class="box2" x="210" y="210" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="248" text-anchor="start">Arrival external check</text>
<text class="body" x="234" y="287" text-anchor="start">Hive stable/level, straps removed as planned, entrance open,</text>
<text class="body" x="234" y="314" text-anchor="start">ventilation unobstructed, leaks absent.</text>
<path class="arrow" d="M600,335 L600,380"/>
<rect class="box" x="210" y="390" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="428" text-anchor="start">Orientation / flight behaviour</text>
<text class="body" x="234" y="467" text-anchor="start">Allow bees to reorient; avoid standing in flight path or</text>
<text class="body" x="234" y="494" text-anchor="start">provoking robbing.</text>
<path class="arrow" d="M600,515 L600,560"/>
<rect class="box" x="210" y="570" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="608" text-anchor="start">Targeted internal check when justified</text>
<text class="body" x="234" y="647" text-anchor="start">Assess frame shift, comb damage, queen/brood evidence, stores and</text>
<text class="body" x="234" y="674" text-anchor="start">transport stress without unnecessary immediate deep inspection.</text>
<path class="arrow" d="M600,695 L600,740"/>
<rect class="stop" x="210" y="750" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="788" text-anchor="start">Robbing / overheating / damage warning?</text>
<text class="body" x="234" y="827" text-anchor="start">Stabilise the active hazard before continuing routine management.</text>
<path class="arrow" d="M600,875 L600,920"/>
<rect class="box2" x="210" y="930" width="780" height="125" rx="22" ry="22"/>
<text class="label" x="234" y="968" text-anchor="start">Record outcome and next check</text>
<text class="body" x="234" y="1007" text-anchor="start">Movement date/site, arrival condition, any damage, actions and</text>
<text class="body" x="234" y="1034" text-anchor="start">follow-up.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">The timing and depth of internal inspection depend on move distance, colony condition, comb</text>
<text class="small" x="85" y="1535" text-anchor="start">type, weather and observed problems.</text>
</svg>
