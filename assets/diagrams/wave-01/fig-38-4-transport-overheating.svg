<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="portrait-field" preserveAspectRatio="xMidYMid meet">
<!-- visual-system:PBH-v1 -->
<!-- semantic-color-pass:v1 -->
<title id="title">Figure 38.4 — Transport Overheating</title>
<desc id="desc">Comparison showing ventilated shaded transport versus sealed or blocked ventilation with solar heat loading and bee clustering.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker></defs>
<style>
.bg{fill:#FFFFFF}.title{font:700 38px Arial,Helvetica,sans-serif;fill:#1F2933}.subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#52606D}
.box{fill:#FFF3E0;stroke:#E65100;stroke-width:3}.box2{fill:#E3F2FD;stroke:#E65100;stroke-width:3}
.stop{fill:#FFEBEE;stroke:#C62828;stroke-width:5;stroke-dasharray:12 8}
.legal{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:4;stroke-dasharray:5 5}
.label{font:700 24px Arial,Helvetica,sans-serif;fill:#1F2933}.body{font:400 21px Arial,Helvetica,sans-serif;fill:#1F2933}.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52606D}
.arrow{stroke:#EF6C00;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#757575;stroke-width:2;fill:none}
.hub{fill:#E65100;stroke:#E65100;stroke-width:3}.hubtext{font:700 22px Arial,Helvetica,sans-serif;fill:#FFFFFF;text-anchor:middle}
.note{fill:#FFF8E1;stroke:#8D6E63;stroke-width:2}
.good{fill:#E8F5E9;stroke:#2E7D32;stroke-width:3}
.warn{fill:#FFF3E0;stroke:#EF6C00;stroke-width:3;stroke-dasharray:8 5}
.danger{fill:#FFEBEE;stroke:#C62828;stroke-width:4}
.lab{fill:#F3E5F5;stroke:#6A1B9A;stroke-width:3}
.natural{fill:#FFF8E1;stroke:#8D6E63;stroke-width:3}
</style>
<rect class="bg" x="0" y="0" width="1200" height="1600"/>
<text class="title" x="60" y="70">Figure 38.4 — Transport Overheating</text>
<text class="subtitle" x="60" y="108" text-anchor="start">Populous colonies generate heat. Transport design must preserve airflow and limit</text>
<text class="subtitle" x="60" y="136" text-anchor="start">solar/vehicle heat load.</text>
<rect class="box" x="70" y="210" width="500" height="1060" rx="22" ry="22"/>
<text class="label" x="94" y="248" text-anchor="start">Adequate ventilation</text>
<text class="body" x="94" y="287" text-anchor="start">Open airflow path,</text>
<text class="body" x="94" y="314" text-anchor="start">shaded/temperature-aware transport,</text>
<text class="body" x="94" y="341" text-anchor="start">secure straps and space around</text>
<text class="body" x="94" y="368" text-anchor="start">ventilation screens.</text>
<rect x="170" y="530" width="300" height="430" fill="#FFF3E0" stroke="#1F2933" stroke-width="5"/>
<rect x="170" y="660" width="300" height="90" fill="#FFFFFF" stroke="#555" stroke-width="3" stroke-dasharray="5 5"/>
<path d="M110,705 L160,705" class="arrow"/><path d="M480,705 L540,705" class="arrow"/>
<text class="body" x="135" y="1030" text-anchor="start">Air enters and leaves; ventilation</text>
<text class="body" x="135" y="1058" text-anchor="start">surfaces stay unobstructed; load remains</text>
<text class="body" x="135" y="1086" text-anchor="start">secure.</text>
<rect class="stop" x="630" y="210" width="500" height="1060" rx="22" ry="22"/>
<text class="label" x="654" y="248" text-anchor="start">Overheating risk</text>
<text class="body" x="654" y="287" text-anchor="start">Sealed/blocked entrance or screen, direct</text>
<text class="body" x="654" y="314" text-anchor="start">solar load, enclosed hot vehicle and</text>
<text class="body" x="654" y="341" text-anchor="start">dense clustering against ventilation.</text>
<rect x="730" y="530" width="300" height="430" fill="#FFFFFF" stroke="#1F2933" stroke-width="5"/>
<rect x="730" y="660" width="300" height="90" fill="#ddd" stroke="#1F2933" stroke-width="4"/>
<line x1="740" y1="520" x2="1020" y2="970" stroke="#1F2933" stroke-width="8"/><line x1="1020" y1="520" x2="740" y2="970" stroke="#1F2933" stroke-width="8"/>
<text class="body" x="690" y="1030" text-anchor="start">Stop and correct heat/airflow hazards. Do</text>
<text class="body" x="690" y="1058" text-anchor="start">not seal a populous colony without</text>
<text class="body" x="690" y="1086" text-anchor="start">ventilation.</text>
<rect class="note" x="60" y="1480" width="1080" height="80" rx="18"/>
<text class="small" x="85" y="1512" text-anchor="start">Transport overheating is an emergency. Stabilise ventilation and temperature before</text>
<text class="small" x="85" y="1535" text-anchor="start">diagnostic inspection or continued travel.</text>
</svg>
