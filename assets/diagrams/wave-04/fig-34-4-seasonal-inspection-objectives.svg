<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 34.4 — Seasonal Inspection Objectives</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Open colonies only for a defined objective and under conditions appropriate to the task. Winter checks can often</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">remain external.</text>
<rect x="70" y="170" width="400" height="290" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="88" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Winter external check</text><text x="88" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Entrance, weather damage, abnormal debris</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">or starvation risk; avoid unnecessary</text><text x="88" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">opening in unsuitable cold conditions.</text><rect x="315" y="325" width="105" height="100" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="307" y="309" width="121" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="335" y1="343" x2="335" y2="397" stroke="#8D6E63" stroke-width="1"/><line x1="356.6666666666667" y1="343" x2="356.6666666666667" y2="397" stroke="#8D6E63" stroke-width="1"/><line x1="378.3333333333333" y1="343" x2="378.3333333333333" y2="397" stroke="#8D6E63" stroke-width="1"/><line x1="400" y1="343" x2="400" y2="397" stroke="#8D6E63" stroke-width="1"/><rect x="350.7" y="413" width="33.6" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><line x1="120" y1="390" x2="260" y2="390" stroke="#757575" stroke-width="3" stroke-dasharray="8 6"/><rect x="500" y="170" width="400" height="290" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">First spring inspection</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Queen evidence, brood, stores, health and</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">space once weather permits a purposeful</text><text x="518" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">inspection.</text><rect x="745" y="325" width="105" height="100" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="737" y="309" width="121" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="765" y1="343" x2="765" y2="397" stroke="#8D6E63" stroke-width="1"/><line x1="786.6666666666666" y1="343" x2="786.6666666666666" y2="397" stroke="#8D6E63" stroke-width="1"/><line x1="808.3333333333334" y1="343" x2="808.3333333333334" y2="397" stroke="#8D6E63" stroke-width="1"/><line x1="830" y1="343" x2="830" y2="397" stroke="#8D6E63" stroke-width="1"/><rect x="780.7" y="413" width="33.6" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><rect x="930" y="170" width="400" height="290" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="948" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Swarm-period inspection</text><text x="948" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Queen-cell context, brood-nest</text><text x="948" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">restriction, population and usable space.</text><rect x="1175" y="325" width="105" height="100" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="1167" y="309" width="121" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="1195" y1="343" x2="1195" y2="397" stroke="#8D6E63" stroke-width="1"/><line x1="1216.6666666666667" y1="343" x2="1216.6666666666667" y2="397" stroke="#8D6E63" stroke-width="1"/><line x1="1238.3333333333333" y1="343" x2="1238.3333333333333" y2="397" stroke="#8D6E63" stroke-width="1"/><line x1="1260" y1="343" x2="1260" y2="397" stroke="#8D6E63" stroke-width="1"/><rect x="1210.7" y="413" width="33.6" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><rect x="70" y="505" width="400" height="290" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="88" y="538" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Nectar-flow assessment</text><text x="88" y="567" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Space for incoming nectar, super condition</text><text x="88" y="587" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and minimal disturbance of productive</text><text x="88" y="607" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">colonies.</text><rect x="315" y="660" width="105" height="100" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="307" y="644" width="121" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="335" y1="678" x2="335" y2="732" stroke="#8D6E63" stroke-width="1"/><line x1="356.6666666666667" y1="678" x2="356.6666666666667" y2="732" stroke="#8D6E63" stroke-width="1"/><line x1="378.3333333333333" y1="678" x2="378.3333333333333" y2="732" stroke="#8D6E63" stroke-width="1"/><line x1="400" y1="678" x2="400" y2="732" stroke="#8D6E63" stroke-width="1"/><rect x="350.7" y="748" width="33.6" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><rect x="500" y="505" width="400" height="290" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="518" y="538" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Post-flow health review</text><text x="518" y="567" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Stores, queen status, Varroa/health</text><text x="518" y="587" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">monitoring and recovery after harvest.</text><rect x="745" y="660" width="105" height="100" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="737" y="644" width="121" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="765" y1="678" x2="765" y2="732" stroke="#8D6E63" stroke-width="1"/><line x1="786.6666666666666" y1="678" x2="786.6666666666666" y2="732" stroke="#8D6E63" stroke-width="1"/><line x1="808.3333333333334" y1="678" x2="808.3333333333334" y2="732" stroke="#8D6E63" stroke-width="1"/><line x1="830" y1="678" x2="830" y2="732" stroke="#8D6E63" stroke-width="1"/><rect x="780.7" y="748" width="33.6" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><rect x="930" y="505" width="400" height="290" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="948" y="538" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Autumn readiness</text><text x="948" y="567" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Stores, viable population, queen status,</text><text x="948" y="587" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">hive configuration and winter preparation.</text><rect x="1175" y="660" width="105" height="100" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/><rect x="1167" y="644" width="121" height="19" rx="4" fill="#FFF4C8" stroke="#8D6E63" stroke-width="2"/><line x1="1195" y1="678" x2="1195" y2="732" stroke="#8D6E63" stroke-width="1"/><line x1="1216.6666666666667" y1="678" x2="1216.6666666666667" y2="732" stroke="#8D6E63" stroke-width="1"/><line x1="1238.3333333333333" y1="678" x2="1238.3333333333333" y2="732" stroke="#8D6E63" stroke-width="1"/><line x1="1260" y1="678" x2="1260" y2="732" stroke="#8D6E63" stroke-width="1"/><rect x="1210.7" y="748" width="33.6" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="1"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Protect brood from chilling, avoid prolonged exposure and keep inspection purpose matched to colony phase.</text></svg>