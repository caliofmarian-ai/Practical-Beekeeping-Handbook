<title id="title">Figure 36.6 — Honey Batch Traceability</title><desc id="desc">Farm-to-container honey traceability chain from apiary source through sale and complaint investigation.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 36.6 — Honey Batch Traceability</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Traceability links production records to batches so a problem can be investigated without treating every</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">container as anonymous.</text>
<rect x="80" y="170" width="390" height="170" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="98" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">1. Apiary</text><text x="98" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Source location / apiary code</text><line x1="470" y1="255" x2="495" y2="255" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="510" y="170" width="390" height="170" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="528" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">2. Colony / super group</text><text x="528" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Source grouping used by the operation</text><line x1="900" y1="255" x2="925" y2="255" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="940" y="170" width="390" height="170" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="958" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">3. Harvest date</text><text x="958" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">When comb left production</text><rect x="80" y="400" width="390" height="170" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="98" y="433" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">4. Extraction</text><text x="98" y="462" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Extraction lot and equipment record</text><line x1="470" y1="485" x2="495" y2="485" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="510" y="400" width="390" height="170" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="528" y="433" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">5. Processing</text><text x="528" y="462" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Any permitted processing / settling step</text><line x1="900" y1="485" x2="925" y2="485" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="940" y="400" width="390" height="170" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="958" y="433" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">6. Container</text><text x="958" y="462" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Container or batch identifier</text><rect x="80" y="630" width="390" height="170" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="98" y="663" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">7. Storage</text><text x="98" y="692" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Storage location and condition</text><line x1="470" y1="715" x2="495" y2="715" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="510" y="630" width="390" height="170" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="528" y="663" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">8. Sale</text><text x="528" y="692" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Recipient / sales reference where</text><text x="528" y="712" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">required</text><line x1="900" y1="715" x2="925" y2="715" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="940" y="630" width="390" height="170" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="958" y="663" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">9. Complaint review</text><text x="958" y="692" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Trace back and forward using the batch</text><text x="958" y="712" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">record</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">This is a legally neutral information model. Exact identifiers, retention periods and recipient records depend on jurisdiction and business type.</text></svg>