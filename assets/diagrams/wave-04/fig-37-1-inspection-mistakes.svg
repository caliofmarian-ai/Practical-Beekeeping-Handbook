<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="FINAL" data-reconciliation-status="HOLD">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 37.1 — Inspection Mistakes</title><desc id="desc">Correct frame handling compared with common avoidable inspection errors.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 37.1 — Inspection Mistakes</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Most inspection damage is preventable: prepare the task, keep exposure purposeful and close the hive carefully.</text>
<rect x="55" y="170" width="410" height="285" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="73" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Correct frame handling</text><text x="73" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Keep frames over the hive, move</text><text x="73" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">deliberately and preserve bee space.</text><rect x="300" y="285" width="110" height="125" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="4"/><rect x="318" y="303" width="74" height="89" rx="3" fill="#FFFDF2" stroke="#D4C27A" stroke-width="1.5"/><line x1="370.6" y1="390.6" x2="399.4" y2="419.4" stroke="#C62828" stroke-width="5"/><line x1="399.4" y1="390.6" x2="370.6" y2="419.4" stroke="#C62828" stroke-width="5"/><rect x="500" y="170" width="410" height="285" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Crushing bees</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Closing boxes carelessly can trap bees</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">between rims or frames.</text><rect x="745" y="285" width="110" height="125" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="4"/><rect x="763" y="303" width="74" height="89" rx="3" fill="#FFFDF2" stroke="#D4C27A" stroke-width="1.5"/><line x1="815.6" y1="390.6" x2="844.4" y2="419.4" stroke="#C62828" stroke-width="5"/><line x1="844.4" y1="390.6" x2="815.6" y2="419.4" stroke="#C62828" stroke-width="5"/><rect x="945" y="170" width="410" height="285" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="963" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Excessive smoke</text><text x="963" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use only enough cool smoke to manage the</text><text x="963" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">colony; do not saturate the brood nest.</text><rect x="1190" y="285" width="110" height="125" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="4"/><rect x="1208" y="303" width="74" height="89" rx="3" fill="#FFFDF2" stroke="#D4C27A" stroke-width="1.5"/><line x1="1260.6" y1="390.6" x2="1289.4" y2="419.4" stroke="#C62828" stroke-width="5"/><line x1="1289.4" y1="390.6" x2="1260.6" y2="419.4" stroke="#C62828" stroke-width="5"/><path d="M 1180 290 Q 1170 260 1190 240" fill="none" stroke="#757575" stroke-width="3"/><path d="M 1204 290 Q 1194 260 1214 240" fill="none" stroke="#757575" stroke-width="3"/><path d="M 1228 290 Q 1218 260 1238 240" fill="none" stroke="#757575" stroke-width="3"/><path d="M 1252 290 Q 1242 260 1262 240" fill="none" stroke="#757575" stroke-width="3"/><rect x="55" y="500" width="410" height="285" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="73" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Incorrect spacing</text><text x="73" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Restore frames to correct spacing before</text><text x="73" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">closing.</text><rect x="300" y="615" width="110" height="125" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="4"/><rect x="318" y="633" width="74" height="89" rx="3" fill="#FFFDF2" stroke="#D4C27A" stroke-width="1.5"/><line x1="370.6" y1="720.6" x2="399.4" y2="749.4" stroke="#C62828" stroke-width="5"/><line x1="399.4" y1="720.6" x2="370.6" y2="749.4" stroke="#C62828" stroke-width="5"/><rect x="500" y="500" width="410" height="285" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="518" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Brood exposed in poor weather</text><text x="518" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Avoid unnecessary prolonged exposure to</text><text x="518" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">cold, wind or rain.</text><rect x="745" y="615" width="110" height="125" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="4"/><rect x="763" y="633" width="74" height="89" rx="3" fill="#FFFDF2" stroke="#D4C27A" stroke-width="1.5"/><line x1="815.6" y1="720.6" x2="844.4" y2="749.4" stroke="#C62828" stroke-width="5"/><line x1="844.4" y1="720.6" x2="815.6" y2="749.4" stroke="#C62828" stroke-width="5"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Incorrect practices are shown only to identify and correct them; they are not instructions to imitate.</text></svg>