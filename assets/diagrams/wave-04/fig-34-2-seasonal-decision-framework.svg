<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc" data-visual-system="PBH-v1" data-canvas-profile="landscape-standard" preserveAspectRatio="xMidYMid meet" data-reconciliation-pass="02">
<!-- visual-system:PBH-v1 -->
<title id="title">Figure 34.2 — Seasonal Decision Framework</title><desc id="desc">Decision-flow cues for identifying the colony's current biological phase.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 34.2 — Seasonal Decision Framework</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Combine flight, pollen, brood, drones, queen cells, nectar storage and late-season signals rather than relying</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">on the month name.</text>
<rect x="225" y="155" width="950" height="70" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="243" y="188" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">1. Flight / confinement</text><text x="243" y="217" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Is the colony largely confined, intermittently flying or in sustained flight?</text><line x1="700" y1="225" x2="700" y2="246" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="225" y="249" width="950" height="70" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="243" y="282" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">2. Pollen + brood</text><text x="243" y="311" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Is pollen entering and is brood expanding, stable or contracting?</text><line x1="700" y1="319" x2="700" y2="340" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="225" y="343" width="950" height="70" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="243" y="376" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">3. Drone production</text><text x="243" y="405" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Drone brood/adults help indicate reproductive-season context.</text><line x1="700" y1="413" x2="700" y2="434" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="225" y="437" width="950" height="70" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="243" y="470" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">4. Queen cells</text><text x="243" y="499" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Are cups/cells developing and what is the colony context?</text><line x1="700" y1="507" x2="700" y2="528" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="225" y="531" width="950" height="70" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="243" y="564" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">5. Nectar storage</text><text x="243" y="593" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Is incoming nectar actively occupying comb and requiring space?</text><line x1="700" y1="601" x2="700" y2="622" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="225" y="625" width="950" height="70" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="243" y="658" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">6. Weight gain slowing</text><text x="243" y="687" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Has the major flow ended or been interrupted?</text><line x1="700" y1="695" x2="700" y2="716" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="225" y="719" width="950" height="70" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="243" y="752" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">7. Winter-bee preparation</text><text x="243" y="781" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Is the colony shifting resources towards late-season survival?</text><line x1="700" y1="789" x2="700" y2="810" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="225" y="813" width="950" height="70" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="243" y="846" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">8. Brood contraction</text><text x="243" y="875" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Is brood area declining as the colony approaches winter entry?</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">No single observation defines a phase. Confirm with weather, forage, inspection records and colony condition.</text></svg>