<title id="title">Figure 35.3 — One-Month-Ahead Equipment Planning</title><desc id="desc">Workflow showing preparation before seasonal biological demand.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 35.3 — One-Month-Ahead Equipment Planning</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Equipment readiness is a lead-time task: prepare before congestion, nectar flow, harvest or autumn pressure</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">creates urgency.</text>
<rect x="100" y="175" width="470" height="125" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="118" y="208" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Before swarm season</text><text x="118" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Prepare spare boxes, frames, swarm container and</text><text x="118" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">queen-management equipment.</text><line x1="590" y1="237" x2="800" y2="237" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/><rect x="830" y="175" width="470" height="125" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="848" y="208" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">orange</text><text x="848" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Ready before the biological need becomes</text><text x="848" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">urgent.</text><rect x="100" y="345" width="470" height="125" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="118" y="378" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">Before nectar flow</text><text x="118" y="407" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Repair and assemble supers/frames before</text><text x="118" y="427" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">colonies urgently need storage space.</text><line x1="590" y1="407" x2="800" y2="407" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/><rect x="830" y="345" width="470" height="125" rx="16" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.3"/><text x="848" y="378" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#8D6E63" text-anchor="start">honey</text><text x="848" y="407" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Ready before the biological need becomes</text><text x="848" y="427" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">urgent.</text><rect x="100" y="515" width="470" height="125" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="118" y="548" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Before harvest</text><text x="118" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Clean and inspect extraction, food-contact and</text><text x="118" y="597" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">storage equipment.</text><line x1="590" y1="577" x2="800" y2="577" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/><rect x="830" y="515" width="470" height="125" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="848" y="548" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">green</text><text x="848" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Ready before the biological need becomes</text><text x="848" y="597" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">urgent.</text><rect x="100" y="685" width="470" height="125" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="118" y="718" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">Before autumn</text><text x="118" y="747" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Prepare feeders, entrance-management equipment</text><text x="118" y="767" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">and weather-protection materials.</text><line x1="590" y1="747" x2="800" y2="747" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/><rect x="830" y="685" width="470" height="125" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="848" y="718" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">blue</text><text x="848" y="747" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Ready before the biological need becomes</text><text x="848" y="767" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">urgent.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">The 'one-month-ahead' concept is planning logic, not a fixed 30-day biological rule.</text></svg>