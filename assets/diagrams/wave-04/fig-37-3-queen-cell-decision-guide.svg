<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 37.3 — Queen-Cell Decision Guide</title><desc id="desc">Decision guide that prevents automatic destruction of queen cells.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 37.3 — Queen-Cell Decision Guide</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Queen cells must be interpreted with queen status, brood age, colony population, seasonal context and management</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">objectives.</text>
<rect x="220" y="165" width="960" height="78" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="238" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">1. Queen evidence present?</text><text x="238" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Look for the queen, eggs, young brood and recent colony history.</text><line x1="700" y1="243" x2="700" y2="266" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="269" width="960" height="78" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="238" y="302" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">2. Queen cell present?</text><text x="238" y="331" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Note number, age and location, but do not diagnose from position alone.</text><line x1="700" y1="347" x2="700" y2="370" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="373" width="960" height="78" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="238" y="406" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">3. Swarm context?</text><text x="238" y="435" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Congestion, population and reproductive-season evidence may support swarm</text><text x="238" y="455" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">interpretation.</text><line x1="700" y1="451" x2="700" y2="474" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="477" width="960" height="78" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.3"/><text x="238" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1565C0" text-anchor="start">4. Supersedure context?</text><text x="238" y="539" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">A present but failing queen and fewer cells may support supersedure interpretation.</text><line x1="700" y1="555" x2="700" y2="578" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="581" width="960" height="78" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="238" y="614" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">5. Emergency context?</text><text x="238" y="643" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Recent queen loss with suitable young larvae may support emergency-cell</text><text x="238" y="663" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">interpretation.</text><line x1="700" y1="659" x2="700" y2="682" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="685" width="960" height="78" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="238" y="718" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">6. Do not destroy automatically</text><text x="238" y="747" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Choose action only after colony status and management objective are sufficiently</text><text x="238" y="767" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">clear.</text><line x1="700" y1="763" x2="700" y2="786" stroke="#1565C0" stroke-width="3" marker-end="url(#ab)"/><rect x="220" y="789" width="960" height="78" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="238" y="822" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">7. Verify outcome</text><text x="238" y="851" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Record the decision and confirm queen status at follow-up.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Cell position is supportive context, not a definitive diagnosis of swarm, supersedure or emergency response.</text></svg>