<title id="title">Figure 37.6 — Harvest Mistakes</title><desc id="desc">Food-safety comparison plate for common honey-harvest handling errors.</desc><defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E7D32"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
</defs>
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1F2933" text-anchor="start">Figure 37.6 — Harvest Mistakes</text><text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">Harvest quality depends on product readiness, clean food-contact equipment, suitable containers and traceable</text><text x="55" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52606D" text-anchor="start">records.</text>
<rect x="55" y="170" width="410" height="285" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="73" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Unripe honey</text><text x="73" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Harvesting comb before honey is</text><text x="73" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">sufficiently ripened can increase</text><text x="73" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">fermentation risk.</text><rect x="200" y="320" width="120" height="95" rx="6" fill="#F5F5F5" stroke="#8D6E63" stroke-width="2.5"/><text x="260" y="375" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8D6E63" text-anchor="middle">HONEY</text><line x1="366.5" y1="391.5" x2="393.5" y2="418.5" stroke="#C62828" stroke-width="5"/><line x1="393.5" y1="391.5" x2="366.5" y2="418.5" stroke="#C62828" stroke-width="5"/><rect x="500" y="170" width="410" height="285" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="518" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Dirty equipment</text><text x="518" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Food-contact surfaces require hygienic</text><text x="518" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">cleaning and protection from</text><text x="518" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">contamination.</text><rect x="645" y="320" width="120" height="95" rx="6" fill="#F5F5F5" stroke="#8D6E63" stroke-width="2.5"/><text x="705" y="375" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8D6E63" text-anchor="middle">HONEY</text><line x1="811.5" y1="391.5" x2="838.5" y2="418.5" stroke="#C62828" stroke-width="5"/><line x1="838.5" y1="391.5" x2="811.5" y2="418.5" stroke="#C62828" stroke-width="5"/><rect x="945" y="170" width="410" height="285" rx="16" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3"/><text x="963" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#C62828" text-anchor="start">Unsuitable container</text><text x="963" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Use clean, food-suitable containers</text><text x="963" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">appropriate to the product and local</text><text x="963" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">rules.</text><rect x="1090" y="320" width="120" height="95" rx="6" fill="#F5F5F5" stroke="#8D6E63" stroke-width="2.5"/><text x="1150" y="375" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8D6E63" text-anchor="middle">HONEY</text><line x1="1256.5" y1="391.5" x2="1283.5" y2="418.5" stroke="#C62828" stroke-width="5"/><line x1="1283.5" y1="391.5" x2="1256.5" y2="418.5" stroke="#C62828" stroke-width="5"/><rect x="55" y="500" width="410" height="285" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.3"/><text x="73" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#EF6C00" text-anchor="start">Missing batch identity</text><text x="73" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Without a traceable batch code,</text><text x="73" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">investigation and recall become harder.</text><rect x="200" y="650" width="120" height="95" rx="6" fill="#F5F5F5" stroke="#8D6E63" stroke-width="2.5"/><text x="260" y="705" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8D6E63" text-anchor="middle">BATCH ?</text><line x1="366.5" y1="721.5" x2="393.5" y2="748.5" stroke="#C62828" stroke-width="5"/><line x1="393.5" y1="721.5" x2="366.5" y2="748.5" stroke="#C62828" stroke-width="5"/><rect x="500" y="500" width="410" height="285" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.3"/><text x="518" y="533" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="start">Correct hygienic handling</text><text x="518" y="562" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Dry clean equipment, protected</text><text x="518" y="582" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">food-contact surfaces, defined batch</text><text x="518" y="602" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">identity and suitable storage.</text><rect x="645" y="650" width="120" height="95" rx="6" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.5"/><text x="705" y="705" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2E7D32" text-anchor="middle">HONEY</text><path d="M 806.3 735 L 820.75 750.3 L 848.8 718" fill="none" stroke="#2E7D32" stroke-width="5"/><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Hygiene and traceability requirements vary by jurisdiction; follow applicable food law and competent-authority guidance.</text></svg>