"494.5805800797191" y1="733.7368260733631" x2="373.3991494190891" y2="560.0672101401707" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/><circle cx="329.527393370907" cy="570.0806521682049" r="78" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="329.527393370907" y="565.0806521682049" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1565C0" text-anchor="middle">Seasonal analysis</text><line x1="319.5139513428729" y1="526.2088961200228" x2="438.08645337321" y2="369.71479458178504" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/><circle cx="402.90403666214866" cy="341.65775349814203" r="78" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/><text x="402.90403666214866" y="336.65775349814203" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#6A1B9A" text-anchor="middle">Annual decision</text><line x1="430.96107774579167" y1="306.47533678708066" x2="699.9999999999999" y2="285" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/><rect x="520" y="425" width="360" height="160" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="538" y="458" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Purpose</text><text x="538" y="487" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Turn field notes into decisions, detect</text><text x="538" y="507" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">repeated problems, compare colonies and</text><text x="538" y="527" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">improve next season.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Back up records and protect access where personal, customer, veterinary or commercial information is present.</text></svg>