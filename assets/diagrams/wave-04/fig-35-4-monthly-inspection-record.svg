-anchor="start">Strength</text><rect x="165" y="432" width="460" height="45" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="180" y="462" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#52606D" text-anchor="start">________________</text><text x="705" y="420" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#52606D" text-anchor="start">Queen evidence</text><rect x="705" y="432" width="460" height="45" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="720" y="462" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#52606D" text-anchor="start">________________</text><text x="165" y="505" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#52606D" text-anchor="start">Brood</text><rect x="165" y="517" width="460" height="45" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="180" y="547" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#52606D" text-anchor="start">________________</text><text x="705" y="505" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#52606D" text-anchor="start">Stores</text><rect x="705" y="517" width="460" height="45" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="720" y="547" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#52606D" text-anchor="start">________________</text><text x="165" y="590" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#52606D" text-anchor="start">Health / monitoring</text><rect x="165" y="602" width="460" height="45" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="180" y="632" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#52606D" text-anchor="start">________________</text><text x="705" y="590" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#52606D" text-anchor="start">Action taken</text><rect x="705" y="602" width="460" height="45" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="720" y="632" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#52606D" text-anchor="start">________________</text><text x="165" y="675" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#52606D" text-anchor="start">Next trigger</text><rect x="165" y="687" width="460" height="45" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="180" y="717" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#52606D" text-anchor="start">________________</text><rect x="870" y="700" width="340" height="80" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.3"/><text x="888" y="733" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6A1B9A" text-anchor="start">Evidence, not assumptions</text><text x="888" y="762" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">Record what was observed and what</text><text x="888" y="782" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#1F2933" text-anchor="start">action was actually taken.</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">Legal retention periods and mandatory fields vary by jurisdiction; adapt this template to local requirements.</text></svg>