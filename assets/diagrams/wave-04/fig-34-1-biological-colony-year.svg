e-width="3"/><text x="700" y="753" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#8D6E63" text-anchor="middle">Principal nectar</text><text x="700" y="771" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#8D6E63" text-anchor="middle">flow</text><line x1="655" y1="760" x2="477.2613639262375" y2="654.9568901432423" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/><circle cx="445.4415587728429" cy="686.776695296637" r="70" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="445.4415587728429" y="679.776695296637" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1565C0" text-anchor="middle">Harvest /</text><text x="445.4415587728429" y="697.776695296637" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1565C0" text-anchor="middle">post-flow</text><line x1="413.6217536194482" y1="654.9568901432423" x2="385" y2="510.00000000000006" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/><circle cx="340" cy="510.00000000000006" r="70" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="340" y="503.00000000000006" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#EF6C00" text-anchor="middle">Late-season</text><text x="340" y="521" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#EF6C00" text-anchor="middle">preparation</text><line x1="340" y1="465.00000000000006" x2="477.2613639262375" y2="365.0431098567578" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/><circle cx="445.4415587728428" cy="333.22330470336317" r="70" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="445.4415587728428" y="326.22330470336317" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1565C0" text-anchor="middle">Winter entry</text><line x1="477.26136392623744" y1="301.4034995499685" x2="699.9999999999999" y2="305" stroke="#1565C0" stroke-width="2.5" marker-end="url(#ab)"/><text x="700" y="435" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1F2933" text-anchor="middle">Conceptual annual patterns</text><path d="M 485 520 C 560 390 650 360 735 430 C 820 500 870 640 920 690" fill="none" stroke="#2E7D32" stroke-width="5"/><path d="M 470 585 C 560 500 660 450 760 480 C 850 520 900 610 930 680" fill="none" stroke="#1565C0" stroke-width="5"/><path d="M 500 655 C 600 620 650 510 720 470 C 790 430 850 470 900 560" fill="none" stroke="#D4A017" stroke-width="5"/><text x="510" y="760" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2E7D32" text-anchor="start">brood expands before adult population peaks</text><text x="510" y="785" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1565C0" text-anchor="start">adult population (lagged response)</text><text x="510" y="810" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#8D6E63" text-anchor="start">forage opportunity (locally variable)</text><rect x="55" y="920" width="1290" height="55" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/><text x="75" y="950" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52606D" text-anchor="start">All curves are conceptual. Climate, latitude, forage, colony genetics and weather can shift timing substantially.</text></svg>