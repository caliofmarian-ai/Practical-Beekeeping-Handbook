name: wave01-vectors-d-once

on:
  push:
    branches:
      - publishing/visual-wave-01-vectors-d

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publishing/visual-wave-01-vectors-d
          fetch-depth: 0
      - name: Generate and validate SVG assets D
        run: python scripts/generate_wave01_vector_diagrams_d.py
      - name: Remove transient files
        run: |
          rm -f .github/workflows/wave01-vectors-d-once.yml
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit vector assets D
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate Wave 01 vector diagrams D (#100 #101)"
          git push origin HEAD:publishing/visual-wave-01-vectors-d
