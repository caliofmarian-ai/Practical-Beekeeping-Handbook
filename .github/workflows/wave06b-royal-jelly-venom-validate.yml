name: wave06b-royal-jelly-venom-validate

on:
  push:
    branches:
      - publishing/visual-wave-06b-royal-jelly-venom
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Wave 06b assets and manifests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, json, xml.etree.ElementTree as ET
          root=Path(".")
          files=sorted((root/"assets/diagrams/wave-06b").glob("*.svg"))
          assert len(files)==6, f"expected 6 Wave 06b SVGs, found {len(files)}"
          for p in files:
              text=p.read_text(encoding="utf-8")
              ET.fromstring(text)
              assert '<title id="title">' in text, p
              assert '<desc id="desc">' in text, p
              assert 'aria-labelledby="title desc"' in text, p
          meta=json.loads((root/"assets/production-briefs/wave-06b-royal-jelly-venom.json").read_text(encoding="utf-8"))
          assert meta["asset_count"]==6 and len(meta["assets"])==6
          rows=list(csv.DictReader((root/"docs/visual-index/wave-06b-manifest.csv").open(encoding="utf-8")))
          assert len(rows)==6
          assert (root/"docs/visual-index/wave-06b.md").exists()
          assert (root/"docs/reviews/VISUAL_WAVE_06B_ROYAL_JELLY_VENOM_REVIEW.md").exists()
          print("Wave 06b validation PASS: 6 SVGs + metadata + gallery + review")
          PY
