name: visual-wave-01-once
on:
  push:
    branches: ['publishing/visual-wave-01']
permissions:
  contents: write
jobs:
  build-wave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publishing/visual-wave-01
          fetch-depth: 0
      - name: Build Wave 01 production briefs
        run: python scripts/visual_wave_01_once.py
      - name: Remove one-time automation
        run: |
          rm -f scripts/visual_wave_01_once.py
          rm -f .github/workflows/visual-wave-01-once.yml
      - name: Commit Wave 01 production package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare visual production Wave 01 (#100-#101) [skip ci]"
          git push origin HEAD:publishing/visual-wave-01
