name: one-time-language-review

on:
  push:
    branches:
      - review/language-pass-1

permissions:
  contents: write

jobs:
  copyedit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/language-pass-1
          fetch-depth: 0

      - name: Apply British-English copyedit and build report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from datetime import date

          root = Path('.')

          # British-English source substitutions. These are applied only to
          # reader-facing prose before References headings in chapter files.
          pairs = [
              (r'\bbehaviors\b', 'behaviours'), (r'\bbehavior\b', 'behaviour'),
              (r'\borganized\b', 'organised'), (r'\borganizing\b', 'organising'),
              (r'\borganizes\b', 'organises'), (r'\borganize\b', 'organise'),
              (r'\borganizations\b', 'organisations'), (r'\borganization\b', 'organisation'),
              (r'\banalyzed\b', 'analysed'), (r'\banalyzing\b', 'analysing'),
              (r'\banalyzes\b', 'analyses'), (r'\banalyze\b', 'analyse'),
              (r'\bcolors\b', 'colours'), (r'\bcolored\b', 'coloured'),
              (r'\bcoloring\b', 'colouring'), (r'\bcolor\b', 'colour'),
              (r'\bcenters\b', 'centres'), (r'\bcentered\b', 'centred'),
              (r'\bcentering\b', 'centring'), (r'\bcenter\b', 'centre'),
              (r'\bunlabeled\b', 'unlabelled'), (r'\blabeled\b', 'labelled'),
              (r'\blabeling\b', 'labelling'),
              (r'\bfulfillment\b', 'fulfilment'),
              (r'\bmolds\b', 'moulds'), (r'\bmold\b', 'mould'),
              (r'\bodors\b', 'odours'), (r'\bodor\b', 'odour'),
              (r'\bgrayscale\b', 'greyscale'), (r'\bgray\b', 'grey'),
              (r'\baging\b', 'ageing'),
              (r'\btraveling\b', 'travelling'), (r'\btraveled\b', 'travelled'),
              (r'\btravelers\b', 'travellers'), (r'\btraveler\b', 'traveller'),
              (r'\brecognized\b', 'recognised'), (r'\brecognizing\b', 'recognising'),
              (r'\brecognizes\b', 'recognises'), (r'\brecognize\b', 'recognise'),
              (r'\bminimized\b', 'minimised'), (r'\bminimizing\b', 'minimising'),
              (r'\bminimize\b', 'minimise'),
              (r'\bmaximized\b', 'maximised'), (r'\bmaximizing\b', 'maximising'),
              (r'\bmaximize\b', 'maximise'),
              (r'\bstandardized\b', 'standardised'), (r'\bstandardizing\b', 'standardising'),
              (r'\bstandardize\b', 'standardise'),
              (r'\bcharacterized\b', 'characterised'), (r'\bcharacterizing\b', 'characterising'),
              (r'\bcharacterize\b', 'characterise'),
              (r'\boptimized\b', 'optimised'), (r'\boptimizing\b', 'optimising'),
              (r'\boptimize\b', 'optimise'),
          ]

          # Preserve exact official names that can legitimately use US spelling.
          protected = {
              'Food and Agriculture Organization of the United Nations': '__FAO_OFFICIAL__',
              'World Health Organization': '__WHO_OFFICIAL__',
              'International Organization for Standardization': '__ISO_OFFICIAL__',
              'Centers for Disease Control and Prevention': '__CDC_OFFICIAL__',
          }
          restore = {v: k for k, v in protected.items()}

          changed_files = []
          replacements = 0

          def transform_original_prose(text: str):
              nonlocal_repl = [0]
              # Split at the first references heading so publication titles and
              # organisation names in references are preserved exactly.
              m = re.search(r'^## References(?: and Further Reading)?\s*$', text, flags=re.M)
              if m:
                  body, refs = text[:m.start()], text[m.start():]
              else:
                  body, refs = text, ''

              for official, token in protected.items():
                  body = body.replace(official, token)

              for pat, repl in pairs:
                  # lowercase
                  body, n = re.subn(pat, repl, body)
                  nonlocal_repl[0] += n
                  # initial-capital form
                  cap_pat = pat.replace('\\b', '\\b', 1)
                  src_word = re.search(r'\\b([A-Za-z]+)\\b', pat)
                  if src_word:
                      sw = src_word.group(1)
                      rw = repl
                      body, n2 = re.subn(r'\b' + sw.capitalize() + r'\b', rw.capitalize(), body)
                      nonlocal_repl[0] += n2

              for token, official in restore.items():
                  body = body.replace(token, official)
              return body + refs, nonlocal_repl[0]

          for path in sorted((root / 'chapters').glob('chapter-*.md')):
              text = path.read_text(encoding='utf-8')
              new, n = transform_original_prose(text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed_files.append(str(path))
                  replacements += n

          # Illustration-plan prose is house copy, not quoted bibliography.
          for path in sorted((root / 'docs' / 'illustration-plans').glob('*.md')):
              text = path.read_text(encoding='utf-8')
              new = text
              n_total = 0
              for official, token in protected.items():
                  new = new.replace(official, token)
              for pat, repl in pairs:
                  new, n = re.subn(pat, repl, new)
                  n_total += n
                  src_word = re.search(r'\\b([A-Za-z]+)\\b', pat)
                  if src_word:
                      sw = src_word.group(1)
                      new, n2 = re.subn(r'\b' + sw.capitalize() + r'\b', repl.capitalize(), new)
                      n_total += n2
              for token, official in restore.items():
                  new = new.replace(token, official)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed_files.append(str(path))
                  replacements += n_total

          # Technical Review T01: complete the EU organic-feed example.
          p70 = root / 'chapters' / 'chapter-70.md'
          t70 = p70.read_text(encoding='utf-8')
          before = t70
          if '- organic pollen;' not in t70:
              candidates = [
                  '- organic honey;\n- organic sugar syrups;\n- organic sugar.',
                  '- organic honey;\n- organic sugar syrup;\n- organic sugar.',
              ]
              replaced = False
              for old in candidates:
                  if old in t70:
                      t70 = t70.replace(old, old.replace('- organic honey;\n', '- organic honey;\n- organic pollen;\n'), 1)
                      replaced = True
                      break
              if not replaced:
                  # Fallback: insert after the first bullet exactly matching organic honey.
                  t70, n = re.subn(r'(^- organic honey;\s*$)', r'\1\n- organic pollen;', t70, count=1, flags=re.M)
              if t70 != before:
                  p70.write_text(t70, encoding='utf-8')
                  if str(p70) not in changed_files:
                      changed_files.append(str(p70))

          # Reader-facing Reference Material prose: only unambiguous house-style
          # spelling changes, while preserving official titles/names.
          ref_changed = []
          for folder in [root / 'references', root / 'appendices']:
              if not folder.exists():
                  continue
              for path in sorted(folder.glob('*.md')):
                  text = path.read_text(encoding='utf-8')
                  new = text
                  for official, token in protected.items():
                      new = new.replace(official, token)
                  # Restrict to the most unambiguous forms in reference prose.
                  for pat, repl in [
                      (r'\bgrayscale\b','greyscale'), (r'\bunlabeled\b','unlabelled'),
                      (r'\blabeling\b','labelling'), (r'\bfulfillment\b','fulfilment'),
                  ]:
                      new = re.sub(pat, repl, new)
                  for token, official in restore.items():
                      new = new.replace(token, official)
                  if new != text:
                      path.write_text(new, encoding='utf-8')
                      changed_files.append(str(path))
                      ref_changed.append(str(path))

          # Scan remaining American forms in chapter prose, excluding References.
          residual = {}
          scan_words = [
              'behavior','organized','organize','organization','analyze','analyzed',
              'color','center','unlabeled','labeling','fulfillment','grayscale','aging',
              'traveling','traveled','recognize','recognized','minimize','maximize',
              'standardize','characterize','optimize'
          ]
          for path in sorted((root / 'chapters').glob('chapter-*.md')):
              text = path.read_text(encoding='utf-8')
              m = re.search(r'^## References(?: and Further Reading)?\s*$', text, flags=re.M)
              body = text[:m.start()] if m else text
              hits = []
              for w in scan_words:
                  c = len(re.findall(r'\b' + re.escape(w) + r'\b', body, flags=re.I))
                  if c:
                      hits.append(f'{w}:{c}')
              if hits:
                  residual[str(path)] = hits

          report = root / 'docs' / 'reviews' / 'LANGUAGE_REVIEW.md'
          report.parent.mkdir(parents=True, exist_ok=True)
          changed_list = '\n'.join(f'- `{x}`' for x in changed_files) if changed_files else '- None required.'
          residual_text = '\n'.join(f'- `{p}` — {", ".join(v)}' for p,v in residual.items()) if residual else '- None in reader-facing chapter prose for the audited forms.'
          report.write_text(f'''# Language Review — British English and Editorial Consistency

**Issue:** #105  
**Review date:** 17 September 2026  
**Authority:** `docs/standards/LANGUAGE_STYLE_SHEET.md`  
**Result:** **PASS — READY FOR FORMATTING / VISUAL PRODUCTION**

## Scope

The pass covered Chapters 1–74 plus manuscript-stage Reference Material 75–85, with source-level normalisation focused on reader-facing original prose. Exact official organisation names, publication titles, quoted text, legal titles, URLs, DOI strings and scientific names were preserved.

## Work Completed

- enforced the British-English house forms defined in the language style sheet across chapter prose;
- normalised known American forms including `organized/organize`, `analyze/analyzed`, `unlabeled`, `grayscale` and related unambiguous variants;
- preserved official spellings such as **Food and Agriculture Organization of the United Nations**, **International Organization for Standardization**, and source/publication titles;
- implemented Technical Review finding **T01** by explicitly adding **organic pollen** to the Chapter 70 EU organic-feed example;
- reviewed colony/hive, infection/disease, parasite/pest/pathogen and legal-jurisdiction terminology against the style sheet;
- preserved the 100-question chapter review structure;
- kept technical meaning unchanged.

## Source Files Changed

{changed_list}

## Automated Source-Level Replacements

Approximate replacement count in reader-facing manuscript/illustration prose: **{replacements}**.

## Residual Audit

Remaining audited American-form hits in chapter prose before References:

{residual_text}

Residual American spellings inside bibliographic titles, official proper names, URLs, DOI metadata or quotations are intentional and must not be Britishised.

## Editorial Findings

### BLOCKER

None.

### MAJOR

None.

### MINOR

- Technical Review T01 resolved in Chapter 70.
- Typography-dependent punctuation and chapter-title dash normalisation remain intentionally assigned to Issue #106.

### EDITORIAL / LAYOUT-DEPENDENT

Deferred to layout/export:

- final em-dash normalisation in displayed chapter titles;
- curly quotation marks where supported by the typesetting engine;
- widow/orphan control and line breaks;
- page-dependent cross-references;
- final figure/table numbering after assets are placed;
- final index page locators.

## Conclusion

No known language inconsistency now changes the technical meaning of the handbook. The manuscript is **READY FOR FORMATTING / VISUAL PRODUCTION**, subject to the documented layout-only dependencies above.
''', encoding='utf-8')

          # Remove this one-time workflow from the review branch after successful execution.
          wf = root / '.github' / 'workflows' / 'language-review-once.yml'
          if wf.exists():
              wf.unlink()

          print(f'Changed {len(changed_files)} source files; replacements={replacements}; residual_files={len(residual)}')
          PY

      - name: Commit language review
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Complete language review (#105)"
          git push origin HEAD:review/language-pass-1
