name: refresh-wave01-visual-index-once

on:
  push:
    branches:
      - publishing/visual-index-wave01-complete
    paths:
      - "scripts/refresh_wave01_visual_index.py"
      - ".github/workflows/refresh-wave01-visual-index-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publishing/visual-index-wave01-complete
          fetch-depth: 0
      - name: Refresh gallery and coverage
        run: python3 scripts/refresh_wave01_visual_index.py
      - name: Validate index and A_CORE completion
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          q=json.loads(Path("assets/production-briefs/wave-01-high-fidelity.json").read_text())
          assert q["actual_asset_ids_present"] == 68
          assert q["remaining_high_fidelity_assets"] == 0
          rows=list(csv.DictReader(Path("docs/visual-index/manifest.csv").open()))
          assert len(rows) == 94
          assert Path("docs/visual-index/wave-01.md").exists()
          print("Wave 01 visual index validated: 94 SVGs, 68/68 A_CORE")
          PY
      - name: Commit refreshed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-index.md docs/visual-index docs/reviews/VISUAL_WAVE_01_FINAL_COVERAGE.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Refresh Wave 01 visual gallery and final coverage"
            git push origin HEAD:publishing/visual-index-wave01-complete
          fi
