name: formatting-106-once
on:
  push:
    branches: ['publishing/formatting-106']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publishing/formatting-106
          fetch-depth: 0
      - name: Build publication manuscript
        run: python scripts/build_publication_manuscript.py
      - name: Validate and write formatting report
        run: python scripts/formatting_report_once.py
      - name: Remove one-time formatting automation
        run: |
          rm -f scripts/formatting_report_once.py
          rm -f .github/workflows/formatting-106-once.yml
      - name: Commit formatted publication source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete formatting assembly (#106) [skip ci]"
          git push origin HEAD:publishing/formatting-106
