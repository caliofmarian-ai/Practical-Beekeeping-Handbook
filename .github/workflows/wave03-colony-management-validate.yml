name: wave03-colony-management-validate

on:
  push:
    branches:
      - publishing/visual-wave-03-colony-management
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Wave 03 SVGs and manifests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, json, xml.etree.ElementTree as ET
          root=Path(".")
          files=sorted((root/"assets/diagrams/wave-03").glob("*.svg"))
          assert len(files)==21, f"expected 21 Wave 03 SVGs, found {len(files)}"
          for p in files:
              text=p.read_text(encoding="utf-8")
              ET.fromstring(text)
              assert '<title id="title">' in text, p
              assert '<desc id="desc">' in text, p
              assert 'aria-labelledby="title desc"' in text, p
          meta=json.loads((root/"assets/production-briefs/wave-03-colony-management-a.json").read_text(encoding="utf-8"))
          assert meta["asset_count"]==21 and len(meta["assets"])==21
          rows=list(csv.DictReader((root/"docs/visual-index/wave-03-manifest.csv").open(encoding="utf-8")))
          assert len(rows)==21
          assert (root/"docs/visual-index/wave-03.md").exists()
          assert (root/"docs/reviews/VISUAL_WAVE_03_COLONY_MANAGEMENT_A_REVIEW.md").exists()
          print("Wave 03 validation PASS: 21 SVGs + metadata + gallery + review")
          PY
