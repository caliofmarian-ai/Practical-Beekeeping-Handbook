name: Wave 02 chapters 01-05 layout PDF proof

on:
  push:
    branches:
      - 'publishing/layout-proof-wave02-01-05'
    paths:
      - 'scripts/build_layout_proof.py'
      - 'scripts/render_layout_proof_pdf.py'
      - 'scripts/publication_preflight.py'
      - 'tests/test_publication_preflight.py'
      - 'docs/layout/figure-placements-wave02-ch01-05.json'
      - '.github/workflows/layout-proof-wave02.yml'
  pull_request:
    paths:
      - 'scripts/build_layout_proof.py'
      - 'scripts/render_layout_proof_pdf.py'
      - 'docs/layout/**'
      - '.github/workflows/layout-proof-wave02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate and assemble the 15-figure placement pilot
        run: |
          python -m unittest discover -s tests -p 'test_publication_*.py' -v
          python scripts/build_layout_proof.py
          python scripts/build_layout_proof.py --check
      - name: Install reproducible proof renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'Markdown==3.9' 'weasyprint==66.0' 'PyMuPDF==1.26.3'
      - name: Render B5 PDF and selected page thumbnails
        run: python scripts/render_layout_proof_pdf.py
      - name: Verify PDF report and source image accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("exports/proofs/PBH-wave02-layout-manifest.json").read_text())
          r = json.loads(Path("exports/proofs/PBH-wave02-pdf-preflight.json").read_text())
          book = Path("exports/proofs/PBH-wave02-chapters-01-05.md").read_text(encoding="utf-8")
          assert "[Figure placeholder:" not in book
          assert m["placed_a_core_figures"] == 15
          assert r["PDF_figure_caption_count"] == 15
          assert r["pages"] >= 10
          assert len(r["preview_pngs"]) >= 5
          assert r["status"] == "GENERATED_NOT_VISUALLY_APPROVED"
          print("PASS: 15 SVG figures placed, 15 PDF captions, proof thumbnails available")
          PY
      - name: Upload unapproved proof for visual review
        uses: actions/upload-artifact@v4
        with:
          name: PBH-wave02-ch01-05-unapproved-layout-proof
          path: |
            exports/proofs/PBH-wave02-chapters-01-05.md
            exports/proofs/PBH-wave02-layout-manifest.json
            exports/proofs/PBH-wave02-chapters-01-05-PROOF.pdf
            exports/proofs/PBH-wave02-pdf-preflight.json
            exports/proofs/page-previews/*.png
          retention-days: 30
