name: wave01-high-fidelity-once

on:
  push:
    branches:
      - publishing/visual-wave-01-high-fidelity-queue

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publishing/visual-wave-01-high-fidelity-queue
          fetch-depth: 0
      - name: Build high-fidelity queue and final coverage
        run: python scripts/build_wave01_high_fidelity_queue.py
      - name: Remove transient files
        run: |
          rm -f .github/workflows/wave01-high-fidelity-once.yml
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Wave 01 high-fidelity asset queue (#100 #101 #102)"
          git push origin HEAD:publishing/visual-wave-01-high-fidelity-queue
