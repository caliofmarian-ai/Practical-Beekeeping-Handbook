name: photo-assets-fetch-batch-03

on:
  push:
    branches:
      - publishing/photo-assets-batch-03
    paths:
      - "assets/photo-download-batch-03.json"

permissions:
  contents: write

jobs:
  fetch-photo-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publishing/photo-assets-batch-03
          fetch-depth: 0
      - name: Install image validator
        run: python3 -m pip install --quiet pillow
      - name: Fetch and validate selected source candidates
        run: python3 scripts/fetch_photo_assets.py assets/photo-download-batch-03.json
      - name: Commit verified source candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/a-core/source-candidates assets/photo-source-registry.json
          if git diff --cached --quiet; then
            echo "No downloaded-source changes."
          else
            git commit -m "Fetch high-resolution replacement photo sources batch 03"
            git push origin HEAD:publishing/photo-assets-batch-03
          fi
