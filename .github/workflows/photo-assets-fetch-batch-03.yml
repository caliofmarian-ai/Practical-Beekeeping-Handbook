name: photo-assets-fetch

on:
  pull_request:
    branches:
      - main
    paths:
      - "assets/photo-download-batch-*.json"
      - "assets/photo-extract-batch-*.json"

permissions:
  contents: write
  pull-requests: read

jobs:
  fetch-photo-sources:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install image validators
        run: python3 -m pip install --quiet pillow pymupdf
      - name: Select photo batch config
        id: batch
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          mapfile -t configs < <(printf '%s\n' "$changed" | grep -E '^assets/photo-(download|extract)-batch-[0-9]+\.json$' || true)
          if [ "${#configs[@]}" -ne 1 ]; then
            printf 'Expected exactly one changed photo batch config, found %s: %s\n' "${#configs[@]}" "${configs[*]}" >&2
            exit 1
          fi
          config="${configs[0]}"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          if [[ "$config" == assets/photo-extract-batch-* ]]; then
            echo "mode=pdf" >> "$GITHUB_OUTPUT"
          else
            echo "mode=image" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch or extract and validate selected source candidates
        shell: bash
        run: |
          if [ "${{ steps.batch.outputs.mode }}" = "pdf" ]; then
            python3 scripts/extract_pdf_photo_asset.py "${{ steps.batch.outputs.config }}"
          else
            python3 scripts/fetch_photo_assets.py "${{ steps.batch.outputs.config }}"
          fi
      - name: Commit verified source candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/a-core/source-candidates assets/photo-source-registry.json
          if git diff --cached --quiet; then
            echo "No downloaded-source changes."
          else
            git commit -m "Fetch validated A_CORE photo source batch"
            git push origin HEAD:${{ github.head_ref }}
          fi
