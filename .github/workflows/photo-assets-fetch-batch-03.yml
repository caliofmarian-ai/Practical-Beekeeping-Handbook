name: photo-assets-fetch-batch-03

on:
  pull_request:
    branches:
      - main
    paths:
      - "assets/photo-download-batch-03.json"
      - "assets/photo-download-batch-04.json"

permissions:
  contents: write
  pull-requests: read

jobs:
  fetch-photo-sources:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install image validator
        run: python3 -m pip install --quiet pillow
      - name: Select photo batch config
        id: batch
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -qx "assets/photo-download-batch-04.json"; then
            echo "config=assets/photo-download-batch-04.json" >> "$GITHUB_OUTPUT"
          else
            echo "config=assets/photo-download-batch-03.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch and validate selected source candidates
        run: python3 scripts/fetch_photo_assets.py "${{ steps.batch.outputs.config }}"
      - name: Commit verified source candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/a-core/source-candidates assets/photo-source-registry.json
          if git diff --cached --quiet; then
            echo "No downloaded-source changes."
          else
            git commit -m "Fetch high-resolution replacement photo sources batch 03"
            git push origin HEAD:${{ github.head_ref }}
          fi
