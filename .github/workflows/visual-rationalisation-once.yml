name: visual-rationalisation-once
on:
  push:
    branches: ['publishing/visual-rationalisation']
permissions:
  contents: write
jobs:
  rationalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publishing/visual-rationalisation
          fetch-depth: 0
      - name: Build rationalised production queue
        run: python scripts/visual_rationalisation_once.py
      - name: Remove one-time automation
        run: |
          rm -f scripts/visual_rationalisation_once.py
          rm -f .github/workflows/visual-rationalisation-once.yml
      - name: Commit visual rationalisation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rationalise visual production queue (#100-#102) [skip ci]"
          git push origin HEAD:publishing/visual-rationalisation
