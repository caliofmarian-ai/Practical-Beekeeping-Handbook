name: wave01-high-fidelity-brood-once

on:
  push:
    branches:
      - publishing/wave01-high-fidelity-brood
    paths:
      - "scripts/generate_wave01_high_fidelity_brood.py"
      - ".github/workflows/wave01-high-fidelity-brood-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publishing/wave01-high-fidelity-brood
          fetch-depth: 0
      - name: Generate high-fidelity brood and foulbrood plates
        run: python3 scripts/generate_wave01_high_fidelity_brood.py
      - name: Validate assets
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          names=[
            "fig-25-7-brood-pattern-interpretation.svg",
            "fig-39-2-healthy-brood-reference.svg",
            "fig-39-3-patchy-brood-multiple-causes.svg",
            "fig-39-4-afb-suspicion-features.svg",
            "fig-43-2-healthy-brood-vs-early-afb.svg",
            "fig-43-3-disease-stage-cell-series.svg",
            "fig-44-2-healthy-vs-efb-open-brood.svg",
          ]
          for name in names:
              p=Path("assets/diagrams/wave-01")/name
              s=p.read_text(encoding="utf-8")
              ET.fromstring(s)
              assert "<title" in s and "<desc" in s
          print(f"Validated {len(names)} high-fidelity SVGs")
          PY
      - name: Commit generated plates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/diagrams/wave-01 assets/production-briefs/wave-01-high-fidelity.json docs/reviews/VISUAL_WAVE_01_HIGH_FIDELITY_BROOD_REVIEW.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Create high-fidelity brood and foulbrood technical plates"
            git push origin HEAD:publishing/wave01-high-fidelity-brood
          fi
