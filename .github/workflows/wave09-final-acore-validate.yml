name: wave09-final-acore-validate
on:
  push:
    branches: [publishing/visual-wave-09-organic-biodiversity-research-future]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate final A_CORE batch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,json,xml.etree.ElementTree as ET
          root=Path(".")
          files=sorted((root/"assets/diagrams/wave-09").glob("*.svg"))
          assert len(files)==10, len(files)
          for p in files:
              t=p.read_text(encoding="utf-8")
              ET.fromstring(t)
              assert '<title id="title">' in t
              assert '<desc id="desc">' in t
              assert 'aria-labelledby="title desc"' in t
          meta=json.loads((root/"assets/production-briefs/wave-09-organic-biodiversity-research-future.json").read_text())
          assert meta["asset_count"]==10 and len(meta["assets"])==10
          rows=list(csv.DictReader((root/"docs/visual-index/wave-09-manifest.csv").open()))
          assert len(rows)==10
          index=(root/"docs/visual-index.md").read_text()
          assert "**Produced A_CORE coverage:** 230 / 230" in index
          assert "**A_CORE still unproduced:** 0" in index
          print("Wave 09 PASS — 230/230 A_CORE production complete")
          PY
