name: language-review-execute
on:
  push:
    branches: ['review/language-pass-1']
permissions:
  contents: write
jobs:
  copyedit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/language-pass-1
          fetch-depth: 0
      - name: Run copyedit
        run: python scripts/language_review_once.py
      - name: Remove one-time automation files
        run: |
          rm -f scripts/language_review_once.py
          rm -f .github/workflows/language-review-once.yml
          rm -f .github/workflows/smoke2.yml
      - name: Commit reviewed manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete language review (#105) [skip ci]"
          git push origin HEAD:review/language-pass-1
