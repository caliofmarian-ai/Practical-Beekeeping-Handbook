name: wave07-business-marketing-validate
on:
  push:
    branches: [publishing/visual-wave-07-business-marketing]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Wave 07 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,json,xml.etree.ElementTree as ET
          root=Path(".")
          files=sorted((root/"assets/diagrams/wave-07").glob("*.svg"))
          assert len(files)==12, len(files)
          for p in files:
              t=p.read_text(encoding="utf-8")
              ET.fromstring(t)
              assert '<title id="title">' in t
              assert '<desc id="desc">' in t
              assert 'aria-labelledby="title desc"' in t
          meta=json.loads((root/"assets/production-briefs/wave-07-business-marketing.json").read_text())
          assert meta["asset_count"]==12 and len(meta["assets"])==12
          rows=list(csv.DictReader((root/"docs/visual-index/wave-07-manifest.csv").open()))
          assert len(rows)==12
          assert (root/"docs/standards/VISUAL_SYSTEM_RECONCILIATION_V1.md").exists()
          print("Wave 07 validation PASS")
          PY
