name: wave01-high-fidelity-mites-nosema-once

on:
  push:
    branches:
      - publishing/wave01-high-fidelity-mites-nosema
    paths:
      - "scripts/generate_wave01_high_fidelity_mites_nosema.py"
      - ".github/workflows/wave01-high-fidelity-mites-nosema-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publishing/wave01-high-fidelity-mites-nosema
          fetch-depth: 0
      - name: Generate remaining high-fidelity plates
        run: python3 scripts/generate_wave01_high_fidelity_mites_nosema.py
      - name: Validate assets and queue completion
        run: |
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          names=[
            "fig-40-3-varroa-reproductive-cycle.svg",
            "fig-40-4-varroa-on-adult-bees.svg",
            "fig-40-7-varroa-tropilaelaps-comparison.svg",
            "fig-40-8-tropilaelaps-life-cycle.svg",
            "fig-41-1-varroa-life-cycle-worker-brood.svg",
            "fig-41-3-adult-bee-feeding-site.svg",
            "fig-41-10-varroa-control-categories.svg",
            "fig-42-1-nosema-life-cycle.svg",
            "fig-42-3-healthy-vs-affected-midgut.svg",
            "fig-45-3-varroa-dwv-interaction.svg",
            "fig-46-6-drone-brood-removal-sequence.svg",
          ]
          for name in names:
              p=Path("assets/diagrams/wave-01")/name
              s=p.read_text(encoding="utf-8")
              ET.fromstring(s)
              assert "<title" in s and "<desc" in s
          q=json.loads(Path("assets/production-briefs/wave-01-high-fidelity.json").read_text())
          assert q["remaining_high_fidelity_assets"] == 0
          assert q["actual_asset_ids_present"] == 68
          print(f"Validated {len(names)} assets; Wave 01 A_CORE queue complete")
          PY
      - name: Commit generated plates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/diagrams/wave-01 assets/production-briefs/wave-01-high-fidelity.json docs/reviews/VISUAL_WAVE_01_HIGH_FIDELITY_MITES_NOSEMA_REVIEW.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Complete Wave 01 high-fidelity technical plates"
            git push origin HEAD:publishing/wave01-high-fidelity-mites-nosema
          fi
