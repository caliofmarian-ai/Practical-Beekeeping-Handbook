name: wave01-vectors-once

on:
  push:
    branches:
      - publishing/visual-wave-01-vectors

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publishing/visual-wave-01-vectors
          fetch-depth: 0

      - name: Generate and validate SVG assets
        run: python scripts/generate_wave01_vector_diagrams.py

      - name: Remove one-time workflow
        run: rm -f .github/workflows/wave01-vectors-once.yml

      - name: Commit vector assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate Wave 01 vector diagrams (#100 #101)"
          git push origin HEAD:publishing/visual-wave-01-vectors
